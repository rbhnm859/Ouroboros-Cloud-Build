name: Keltner v2 Cloud Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keltner-v2-cloud-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull pinned cTrader Console
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Extract untouched original Keltner package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Keltner-Channels-Trader-v2/original-smoke
          mkdir -p Keltner-Channels-Trader-v2/original-smoke/source Keltner-Channels-Trader-v2/original-smoke/output Keltner-Channels-Trader-v2/original-smoke/cache
          unzip -q Keltner-Channels-Trader-v2/Keltner_Channels_Trader_v2_source.zip -d Keltner-Channels-Trader-v2/original-smoke/source
          echo '=== ORIGINAL FILES ==='
          find Keltner-Channels-Trader-v2/original-smoke/source -type f -printf '%P\n' | sort
          sha256sum Keltner-Channels-Trader-v2/Keltner_Channels_Trader_v2_source.zip

      - name: Build untouched original inside cTrader Docker
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find Keltner-Channels-Trader-v2/original-smoke/source -type f -name '*.csproj' -print -quit)"
          test -n "$PROJ"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo \
            ghcr.io/spotware/ctrader-console:5.9.11 -c \
            "dotnet restore '$PROJ' && dotnet build '$PROJ' --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find Keltner-Channels-Trader-v2/original-smoke/source -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" Keltner-Channels-Trader-v2/original-smoke/KeltnerOriginal.algo
          sha256sum Keltner-Channels-Trader-v2/original-smoke/KeltnerOriginal.algo

      - name: Prepare credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 2; }
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 2; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 2; }
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > Keltner-Channels-Trader-v2/original-smoke/ctrader.pwd

      - name: Backtest untouched original source
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set +e
          START_DATE='01/08/2026 00:00'
          END_DATE='07/08/2026 00:00'
          docker run --rm \
            -v "$PWD/Keltner-Channels-Trader-v2/original-smoke:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/KeltnerOriginal.algo \
            --environment-variables --exit-on-stop \
            --symbol=EURUSD \
            --period=m15 \
            --start="$START_DATE" \
            --end="$END_DATE" \
            --balance=200 \
            --commission=35 \
            --spread=1 \
            --data-mode=m1 \
            --data-dir=/work/cache \
            --report=/work/output/original-smoke.html \
            --report-json=/work/output/original-smoke.json \
            > Keltner-Channels-Trader-v2/original-smoke/output/original.console.log 2>&1
          RC=$?
          echo "CTRADER_EXIT_CODE=$RC"
          cat Keltner-Channels-Trader-v2/original-smoke/output/original.console.log || true
          echo '=== ENGINE EVIDENCE ==='
          grep -E 'Starting cBot|Progress \| Backtesting|Message expected|InvalidOperationException|START|OPEN|CLOSE' Keltner-Channels-Trader-v2/original-smoke/output/original.console.log || true
          exit "$RC"

      - name: Remove credentials
        if: always()
        run: rm -f Keltner-Channels-Trader-v2/original-smoke/ctrader.pwd

      - name: Upload original comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keltner-v2-original-source-smoke
          path: Keltner-Channels-Trader-v2/original-smoke/output/
          if-no-files-found: warn
          retention-days: 7
