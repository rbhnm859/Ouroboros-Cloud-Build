name: Keltner v2 Cloud Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keltner-v2-cloud-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build isolated hardened Keltner baseline
        shell: bash
        run: |
          set -euo pipefail
          PROJ='Keltner-Channels-Trader-v2/source/Keltner Channels Trader v2.csproj'
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c Release --no-restore | tee /tmp/keltner-build.log
          grep -q '0 Error(s)' /tmp/keltner-build.log
          mkdir -p Keltner-Channels-Trader-v2/smoke/reports
          ALGO=$(find 'Keltner-Channels-Trader-v2/source/bin/Release' -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" Keltner-Channels-Trader-v2/smoke/KeltnerChannelsTraderV2_Baseline.algo
          sha256sum Keltner-Channels-Trader-v2/smoke/KeltnerChannelsTraderV2_Baseline.algo

      - name: Pull current official cTrader Console
        run: docker pull ghcr.io/spotware/ctrader-console:latest

      - name: Prepare credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 2; }
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 2; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 2; }
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > Keltner-Channels-Trader-v2/smoke/ctrader.pwd

      - name: Fast EURUSD engine and report plumbing test
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD/Keltner-Channels-Trader-v2/smoke:/work" \
            ghcr.io/spotware/ctrader-console:latest \
            backtest /work/KeltnerChannelsTraderV2_Baseline.algo \
            --ctid="$CTRADER_CTID" \
            --pwd-file=/work/ctrader.pwd \
            --account="$CTRADER_ACCOUNT" \
            --symbol=EURUSD \
            --period=m15 \
            --start='01/08/2026' \
            --end='31/08/2026' \
            --balance=200 \
            --commission=35 \
            --commission-type=UsdPerMillionUsdVolume \
            --spread=1 \
            --data-mode=open \
            --RiskMode=FixedLots \
            --FixedVolumeLots=0.01 \
            --MaxSpreadPips=0 \
            --LogDiagnostics=true \
            --report-json=/work/reports/eurusd-m15-smoke.json \
            > Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-smoke.console.log 2>&1
          RC=$?
          echo "CTRADER_EXIT_CODE=$RC"
          echo '=== cTrader console output ==='
          cat Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-smoke.console.log || true
          echo '=== Files produced ==='
          find Keltner-Channels-Trader-v2/smoke -type f -printf '%P\n' | sort
          if [ -s Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-smoke.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-smoke.json')
          d=json.loads(p.read_text())
          print('=== VALID REPORT JSON ===')
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
          fi
          echo '=== Native Backtesting files ==='
          find Keltner-Channels-Trader-v2/smoke -type f \( -name 'Log*' -o -name 'Events*' -o -name '*.cbotset' \) -print0 | while IFS= read -r -d '' f; do
            echo "----- $f -----"
            cat "$f" || true
          done
          exit "$RC"

      - name: Remove credentials
        if: always()
        run: rm -f Keltner-Channels-Trader-v2/smoke/ctrader.pwd

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keltner-v2-cloud-smoke-latest
          path: Keltner-Channels-Trader-v2/smoke/reports/
          if-no-files-found: warn
          retention-days: 7
