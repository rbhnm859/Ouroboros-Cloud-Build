name: Keltner v2 Cloud Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keltner-v2-cloud-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull current official cTrader Console
        run: docker pull ghcr.io/spotware/ctrader-console:latest

      - name: Build hardened Keltner inside cTrader Docker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Keltner-Channels-Trader-v2/smoke/reports Keltner-Channels-Trader-v2/smoke/cache
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo \
            ghcr.io/spotware/ctrader-console:latest -c \
            "dotnet restore 'Keltner-Channels-Trader-v2/source/Keltner Channels Trader v2.csproj' && dotnet build 'Keltner-Channels-Trader-v2/source/Keltner Channels Trader v2.csproj' --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find 'Keltner-Channels-Trader-v2/source/bin/Release' -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" Keltner-Channels-Trader-v2/smoke/KeltnerChannelsTraderV2_Baseline.algo
          sha256sum Keltner-Channels-Trader-v2/smoke/KeltnerChannelsTraderV2_Baseline.algo

      - name: Prepare credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 2; }
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 2; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 2; }
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > Keltner-Channels-Trader-v2/smoke/ctrader.pwd

      - name: Run engine without report saver
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD/Keltner-Channels-Trader-v2/smoke:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:latest \
            backtest /work/KeltnerChannelsTraderV2_Baseline.algo \
            --environment-variables \
            --symbol=EURUSD \
            --period=m15 \
            --start='01/08/2026' \
            --end='07/08/2026' \
            --balance=200 \
            --commission=35 \
            --spread=1 \
            --data-mode=open \
            --RiskMode=FixedLots \
            --FixedVolumeLots=0.01 \
            --MaxSpreadPips=0 \
            --LogDiagnostics=true \
            > Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-engine-only.console.log 2>&1
          RC=$?
          echo "CTRADER_EXIT_CODE=$RC"
          echo '=== cTrader console ==='
          cat Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-engine-only.console.log || true
          echo '=== Engine evidence ==='
          grep -E '\[START\]|\[SYMBOL\]|\[ENTRY\]|\[OPEN_OK\]|\[EXIT\]|Progress \| Backtesting' Keltner-Channels-Trader-v2/smoke/reports/eurusd-m15-engine-only.console.log || true
          echo '=== Produced files ==='
          find Keltner-Channels-Trader-v2/smoke -type f -printf '%P\n' | sort
          exit "$RC"

      - name: Remove credentials
        if: always()
        run: rm -f Keltner-Channels-Trader-v2/smoke/ctrader.pwd

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keltner-v2-engine-only-smoke
          path: Keltner-Channels-Trader-v2/smoke/reports/
          if-no-files-found: warn
          retention-days: 7
