name: Fibonacci XAUUSD 3 - v3.9 Regime Attribution Runner

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-v3-hybrid]
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-3-v39-regime-attribution.yml'

permissions:
  contents: read

concurrency:
  group: xauusd3-v39-regime-attribution
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fibonacci-xauusd-v3-hybrid

      - name: Add diagnostic-only regime telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs')
          s = p.read_text()
          assert 'v3.6.0-safety-hardening' in s

          old = '''            double m5Score = M5RulesNeeded * 5.0;\n            double finalScore = a.PreScore + m5Score;\n            Print("[M5 CONFIRM] {0} {1} pre={2:F1} rules={3}/4 M5={4:F1}/20 final={5:F1}", a.Tag, a.Direction, a.PreScore, rules, m5Score, finalScore);\n            if (finalScore < FinalScoreMin)\n                return false;\n            return TryExecute(a, finalScore, index, rules);\n'''
          new = '''            double m5Score = M5RulesNeeded * 5.0;\n            double finalScore = a.PreScore + m5Score;\n            string ruleMask = (engulfing ? "E" : "-") + (rejection ? "R" : "-") + (microBreak ? "B" : "-") + (momentum ? "M" : "-");\n            Print("[M5 CONFIRM] {0} {1} pre={2:F1} rules={3}/4 mask={4} distATR={5:F3} M5={6:F1}/20 final={7:F1}", a.Tag, a.Direction, a.PreScore, rules, ruleMask, distanceAtr, m5Score, finalScore);\n            if (finalScore < FinalScoreMin)\n                return false;\n            return TryExecute(a, finalScore, index, rules, ruleMask, distanceAtr);\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        private bool TryExecute(ArmedSetup a, double finalScore, int m5Index, int confirmRules)\n'''
          new = '''        private bool TryExecute(ArmedSetup a, double finalScore, int m5Index, int confirmRules, string ruleMask, double entryDistanceAtr)\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''                string session = SessionName(Server.Time.Hour);\n                string comment = a.Tag + "|" + finalScore.ToString("F1") + "|M5R" + confirmRules;\n'''
          new = '''                string session = SessionName(Server.Time.Hour);\n                double diagAtrRatio, diagSpreadAtr, diagSlopeAtr, diagPriceAtr;\n                GetDirectionalH1Diagnostics(a.Direction, out diagAtrRatio, out diagSpreadAtr, out diagSlopeAtr, out diagPriceAtr);\n                double impulseAtr = Math.Abs(a.Target - a.StopAnchor) / Math.Max(StopFib * a.M15Atr, Symbol.PipSize);\n                string comment = a.Tag + "|" + finalScore.ToString("F1") + "|M5R" + confirmRules + "|" + ruleMask + "|D" + entryDistanceAtr.ToString("F2")\n                    + "|A" + diagAtrRatio.ToString("F2") + "|S" + diagSpreadAtr.ToString("F2") + "|L" + diagSlopeAtr.ToString("F2")\n                    + "|P" + diagPriceAtr.ToString("F2") + "|I" + impulseAtr.ToString("F2");\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          anchor = '''        private double H1AtrExpansionRatio()\n        {\n'''
          helper = '''        private void GetDirectionalH1Diagnostics(TradeType direction, out double atrRatio, out double emaSpreadAtr, out double emaSlopeAtr, out double priceEmaAtr)\n        {\n            atrRatio = 0.0;\n            emaSpreadAtr = 0.0;\n            emaSlopeAtr = 0.0;\n            priceEmaAtr = 0.0;\n            if (_h1 == null || _h1.Count < 220) return;\n            int i = _h1.Count - 2;\n            double atr14 = Atr(_h1, i, 14);\n            double atr50 = Atr(_h1, i, 50);\n            if (atr14 <= Symbol.PipSize) return;\n            double ema50 = Ema(_h1, i, 50);\n            double ema50Prev = Ema(_h1, i - 4, 50);\n            double ema200 = Ema(_h1, i, 200);\n            double close = _h1.ClosePrices[i];\n            double sign = direction == TradeType.Buy ? 1.0 : -1.0;\n            atrRatio = atr50 > Symbol.PipSize ? atr14 / atr50 : 0.0;\n            emaSpreadAtr = sign * (ema50 - ema200) / atr14;\n            emaSlopeAtr = sign * (ema50 - ema50Prev) / atr14;\n            priceEmaAtr = sign * (close - ema50) / atr14;\n        }\n\n        private double H1AtrExpansionRatio()\n        {\n'''
          assert s.count(anchor) == 1
          s = s.replace(anchor, helper, 1)
          s = s.replace('Print("VERSION xauusd_3 v3.6.0-safety-hardening");', 'Print("VERSION xauusd_3 v3.9.0-regime-attribution-diagnostic");', 1)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'v3.9.0-regime-attribution-diagnostic' FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs
          grep -q 'GetDirectionalH1Diagnostics' FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs

      - name: Build diagnostic algo with official cTrader CLI
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_3'
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "rm -rf $ROOT/bin $ROOT/obj && dotnet restore $ROOT/FibonacciXAUUSD3.csproj && dotnet build $ROOT/FibonacciXAUUSD3.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          mkdir -p package
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO" -a -s "$ALGO"
          cp "$ALGO" package/FibonacciXAUUSD3-v3.9-RegimeDiagnostic.algo
          cp "$ROOT/src/FibonacciXAUUSD3.cs" package/FibonacciXAUUSD3-v3.9-RegimeDiagnostic.cs
          sha256sum package/FibonacciXAUUSD3-v3.9-RegimeDiagnostic.* > package/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_3-v39-regime-build
          path: package/
          retention-days: 30

  backtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: 'old-h1-standard', start: '09/09/2024', end: '09/03/2025', spread: '17.42', commission: '35' }
          - { name: 'old-h1-harsh',    start: '09/09/2024', end: '09/03/2025', spread: '30', commission: '50' }
          - { name: 'old-h2-standard', start: '09/03/2025', end: '09/09/2025', spread: '17.42', commission: '35' }
          - { name: 'old-h2-harsh',    start: '09/03/2025', end: '09/09/2025', spread: '30', commission: '50' }
          - { name: 'recent-1y-standard', start: '09/09/2025', end: '09/09/2026', spread: '17.42', commission: '35' }
          - { name: 'recent-1y-harsh',    start: '09/09/2025', end: '09/09/2026', spread: '30', commission: '50' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_3-v39-regime-build
          path: work/package

      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd

      - name: Backtest ${{ matrix.case.name }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/reports work/cache
          test -n "${CTRADER_CTID:-}" && test -n "${CTRADER_ACCOUNT:-}"
          LABEL='${{ matrix.case.name }}'
          docker run --rm -v "$PWD/work:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/package/FibonacciXAUUSD3-v3.9-RegimeDiagnostic.algo \
            --environment-variables --exit-on-stop --symbol=XAUUSD --period=m5 \
            --start='${{ matrix.case.start }}' --end='${{ matrix.case.end }}' --balance=10000 \
            --data-mode=m1 --data-dir=/work/cache \
            --commission='${{ matrix.case.commission }}' --spread='${{ matrix.case.spread }}' \
            --RiskPercent=0.50 --MaxDailyLossPercent=3 --MinimumRiskReward=1.5 \
            --PreScoreMin=42 --FinalScoreMin=60 --M5PreScoreFloor=50 --M5RulesNeeded=2 \
            --MinImpulseAtr=1.2 --MinStopAtr=0.20 --MaxAllowedRR=8 \
            --BuyH1MinScore=18 --BlockLondonEntries=true --RequireH1AtrExpansion=true --H1AtrExpansionMin=1.15 \
            --report="/work/reports/${LABEL}.html" --report-json="/work/reports/${LABEL}.json" \
            2>&1 | tee "work/reports/${LABEL}.log"
          test -s "work/reports/${LABEL}.json"
          rm -f work/ctrader.pwd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_3-v39-${{ matrix.case.name }}
          path: work/reports/
          retention-days: 30
