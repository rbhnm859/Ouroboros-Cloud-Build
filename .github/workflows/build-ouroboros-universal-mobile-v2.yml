name: Build Ouroboros Advanced Universal Mobile V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download pinned Ouroboros source
        run: |
          git clone https://github.com/floating-astronaut/ouroboros-cbot.git upstream
          cd upstream
          git checkout f5fed93990737c8bb511aaf85bf88ac6a854273b

      - name: Apply Universal Mobile V2
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip

          main_payload = """"""
          session_payload = """"""

          main_source = gzip.decompress(base64.b64decode(main_payload))
          session_source = gzip.decompress(base64.b64decode(session_payload))

          Path("upstream/Ouroboros/Ouroboros.cs").write_bytes(main_source)
          Path("upstream/Ouroboros/Strategies/SessionAnalyst.cs").write_bytes(session_source)

          p = Path("upstream/Ouroboros/Ouroboros.csproj")
          s = p.read_text()
          s = s.replace("<AssemblyName>Ouroboros</AssemblyName>",
                        "<AssemblyName>OuroborosAdvancedUniversalMobile</AssemblyName>")
          p.write_text(s)

          print("Universal V2 main source:", len(main_source), "bytes")
          print("Universal V2 SessionAnalyst:", len(session_source), "bytes")
          PYCODE

      - name: Sanity check source
        run: |
          grep -n "class OuroborosAdvancedUniversalMobile" upstream/Ouroboros/Ouroboros.cs
          grep -n "FXPRO MATCH" upstream/Ouroboros/Ouroboros.cs
          grep -n "SOLANA" upstream/Ouroboros/Ouroboros.cs
          grep -n "HYPERLIQUID" upstream/Ouroboros/Ouroboros.cs

      - name: Restore
        run: dotnet restore upstream/Ouroboros/Ouroboros.csproj

      - name: Build Universal Mobile V2 ALGO
        run: |
          dotnet build upstream/Ouroboros/Ouroboros.csproj \
            --configuration Release \
            --no-restore \
            -p:AlgoPublish=False \
            -p:IncludeSource=True

      - name: Find ALGO
        run: |
          echo "Searching for generated .algo..."
          ALGO="$(find upstream -type f -name '*.algo' -print -quit)"
          if [ -z "$ALGO" ]; then
            echo "No .algo generated"
            exit 1
          fi
          echo "Found: $ALGO"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          ALGO="$(find upstream -type f -name '*.algo' -print -quit)"
          cp "$ALGO" artifact/OuroborosAdvancedUniversalMobile.algo
          ls -lah artifact

      - name: Upload Universal Mobile V2 ALGO
        uses: actions/upload-artifact@v4
        with:
          name: Ouroboros-Advanced-Universal-Mobile-V2
          path: artifact/OuroborosAdvancedUniversalMobile.algo
          if-no-files-found: error
