name: Validate CDScalper K5 Impulse Pullback Reclaim IS

on:
  workflow_dispatch:
  push:
    branches: [cds-k5-impulse-pullback-reclaim-research]
    paths:
      - 'CumulativeDeltaScalper-EURUSD-v1/k5/**'
      - '.github/scripts/cdscalper_report_gate.py'
      - '.github/workflows/cdscalper-k5-impulse-pullback-reclaim-is.yml'

permissions:
  contents: read

env:
  SYMBOL: EURUSD
  PERIOD: m1
  BALANCE: '30'
  BASE_SPREAD: '0.43'
  COMMISSION: '35'
  IS_START: '09/09/2024 00:00'
  IS_END: '08/09/2025 23:59'
  CTRADER_IMAGE_CANDIDATE: ghcr.io/spotware/ctrader-console:latest

jobs:
  audit_build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ctrader_image: ${{ steps.cli_image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify K4 stop rule and K5 precommit ordering
        shell: bash
        run: |
          set -euo pipefail
          K4_RESULT='CumulativeDeltaScalper-EURUSD-v1/reports/K4_PRICE_FIRST_CORRECTED_IS_STOP_RESULT.md'
          K5_SPEC='CumulativeDeltaScalper-EURUSD-v1/k5/PRECOMMIT_SPEC.md'
          K5_SRC='CumulativeDeltaScalper-EURUSD-v1/k5/src/CumulativeDeltaScalper_EURUSD_K5.cs'
          test -f "$K4_RESULT"
          grep -q 'Classification: C — FAIL' "$K4_RESULT"
          test ! -f 'CumulativeDeltaScalper-EURUSD-v1/k4/FREEZE_MANIFEST.json'
          test -f "$K5_SPEC"
          test -f "$K5_SRC"
          SPEC_COMMIT="$(git log --diff-filter=A --format='%H' -- "$K5_SPEC" | tail -1)"
          SRC_COMMIT="$(git log --diff-filter=A --format='%H' -- "$K5_SRC" | tail -1)"
          test -n "$SPEC_COMMIT" && test -n "$SRC_COMMIT"
          git merge-base --is-ancestor "$SPEC_COMMIT" "$SRC_COMMIT"
          test "$SPEC_COMMIT" != "$SRC_COMMIT"
          echo "K5 precommit=$SPEC_COMMIT source=$SRC_COMMIT"

      - name: Verify K5 fixed architecture and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC='CumulativeDeltaScalper-EURUSD-v1/k5/src/CumulativeDeltaScalper_EURUSD_K5.cs'
          PROJ='CumulativeDeltaScalper-EURUSD-v1/k5/CumulativeDeltaScalper_EURUSD_K5.csproj'
          SPEC='CumulativeDeltaScalper-EURUSD-v1/k5/PRECOMMIT_SPEC.md'
          test -f "$SRC" && test -f "$PROJ" && test -f "$SPEC"
          grep -q 'AccessRights = AccessRights.None' "$SRC"
          grep -q '<TargetFramework>net6.0</TargetFramework>' "$PROJ"
          grep -q 'private const double ImpulseAtrMultiplier = 1.25;' "$SRC"
          grep -q 'private const double MinImpulseBodyFraction = 0.60;' "$SRC"
          grep -q 'private const double ImpulseCloseEdgeFraction = 0.25;' "$SRC"
          grep -q 'private const double RetraceLowFraction = 0.33;' "$SRC"
          grep -q 'private const double RetraceHighFraction = 0.66;' "$SRC"
          grep -q 'private const int SetupExpiryM1Bars = 6;' "$SRC"
          grep -q 'private const double RewardRiskMultiple = 1.80;' "$SRC"
          grep -q 'private const double MinimumMoveCostRatio = 2.50;' "$SRC"
          grep -q 'private const int MaxTradeSeconds = 90 \* 60;' "$SRC"
          grep -q 'MarketData.GetBars(TimeFrame.Minute5)' "$SRC"
          grep -q 'MarketData.GetBars(TimeFrame.Minute15)' "$SRC"
          grep -q '_m5Bars.ClosePrices.Count - 2' "$SRC"
          grep -q '_m15Bars.ClosePrices.Count - 2' "$SRC"
          grep -q 'SETUP_AUDIT ts=' "$SRC"
          grep -q 'IMPULSE_AUDIT ts=' "$SRC"
          grep -q 'ExecuteMarketOrder(type, SymbolName, volume, TradeLabel, slPips, tpPips)' "$SRC"
          grep -q 'NormalizeVolumeInUnits' "$SRC"
          grep -q 'MinStopLossDistance' "$SRC"
          grep -q 'MinTakeProfitDistance' "$SRC"
          grep -q 'Symbol.MinDistanceType' "$SRC"
          grep -q 'Account.PreciseLeverage' "$SRC"
          grep -q 'GetOpenPosition()' "$SRC"
          if grep -q 'DeltaThreshold' "$SRC"; then
            echo 'K5 unexpectedly contains DeltaThreshold.'
            exit 1
          fi
          if grep -Eiq '\b(RSI|MACD|Bollinger|Fibonacci|MachineLearning|MLModel)\b' "$SRC"; then
            echo 'Uncommitted strategy module found in K5 source.'
            exit 1
          fi
          if grep -Eiq '\b(Grid|Martingale|DCA|Recovery|Loss Averaging|Hedging|averaging down|reverse recovery)\b' "$SRC"; then
            echo 'Forbidden strategy element found in K5 source.'
            exit 1
          fi
          echo 'K5 precommitted architecture and safety invariants verified.'

      - name: Resolve and pin cTrader Console image
        id: cli_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          docker pull "$CTRADER_IMAGE_CANDIDATE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$CTRADER_IMAGE_CANDIDATE")"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DIGEST" | tee audit/ctrader-image-digest.txt
          docker run --rm "$DIGEST" --version > audit/ctrader-version.txt 2>&1 || true
          cat audit/ctrader-version.txt || true

      - name: Build exact K5 research algo
        shell: bash
        run: |
          set -euo pipefail
          dotnet build CumulativeDeltaScalper-EURUSD-v1/k5/CumulativeDeltaScalper_EURUSD_K5.csproj -c Release -p:AlgoBuild=true
          ALGO="$(find CumulativeDeltaScalper-EURUSD-v1/k5/bin/Release/net6.0 -maxdepth 1 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          mkdir -p package/k5
          cp "$ALGO" package/k5/K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo
          sha256sum package/k5/K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo | tee audit/k5-algo-sha256.txt
          git rev-parse HEAD | tee audit/tested-commit.txt
          sha256sum CumulativeDeltaScalper-EURUSD-v1/k5/PRECOMMIT_SPEC.md | tee audit/k5-precommit-sha256.txt
          sha256sum CumulativeDeltaScalper-EURUSD-v1/k5/src/CumulativeDeltaScalper_EURUSD_K5.cs | tee audit/k5-source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K5_IMPULSE_PULLBACK_RECLAIM_IS_PACKAGE
          path: |
            package/k5/K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo
            audit/*
            CumulativeDeltaScalper-EURUSD-v1/k5/PRECOMMIT_SPEC.md
            CumulativeDeltaScalper-EURUSD-v1/k5/presets/eurusd_m1_k5_impulse_pullback_reclaim_is.json
          retention-days: 30

  corrected_is:
    needs: audit_build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CTID: ${{ secrets.CTRADER_CTID }}
      ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CT_PASS: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_IMAGE: ${{ needs.audit_build.outputs.ctrader_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: CDScalper_K5_IMPULSE_PULLBACK_RECLAIM_IS_PACKAGE
          path: package

      - name: Run exact precommitted corrected IS
        shell: bash
        run: |
          set -euo pipefail
          ALGO="$(find package -type f -name 'K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo' -print -quit)"
          test -n "$ALGO"
          test -n "$CTRADER_IMAGE"
          mkdir -p backtest/reports backtest/cache/EURUSD
          cp "$ALGO" backtest/K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo
          printf '%s' "$CT_PASS" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

          LOG='backtest/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.log'
          printf '%s\n' "ctrader backtest K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo --symbol=$SYMBOL --period=$PERIOD --start=$IS_START --end=$IS_END --balance=$BALANCE --data-mode=ticks --spread=$BASE_SPREAD --commission=$COMMISSION --ExpectedLeverage=500" | tee "$LOG"

          set +e
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTID" -e "ACCOUNT=$ACCOUNT" -e "PWD-FILE=/work/ctrader.pwd" \
            "$CTRADER_IMAGE" \
            backtest /work/K5_IMPULSE_PULLBACK_RECLAIM_RESEARCH.algo \
            --environment-variables \
            --symbol="$SYMBOL" --period="$PERIOD" \
            --start="$IS_START" --end="$IS_END" --balance="$BALANCE" \
            --data-mode=ticks --data-dir=/work/cache/EURUSD \
            --spread="$BASE_SPREAD" --commission="$COMMISSION" \
            --ExpectedLeverage=500 \
            --report=/work/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.html \
            --report-json=/work/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.json \
            --exit-on-stop 2>&1 | tee -a "$LOG"
          EXIT=${PIPESTATUS[0]}
          set -e
          rm -f backtest/ctrader.pwd
          echo "$EXIT" > backtest/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.exitcode.txt
          test "$EXIT" -eq 0
          test -f backtest/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.json

      - name: Apply corrected K5 IS gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cdscalper_report_gate.py \
            backtest/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.json \
            --profile is \
            --execution-log backtest/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.log \
            --expected-spread 0.43 \
            --out backtest/reports/K5_IMPULSE_PULLBACK_RECLAIM_IS.gate.json \
            --fail-on-gate

      - name: Upload exact K5 IS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K5_IMPULSE_PULLBACK_RECLAIM_CORRECTED_IS
          path: backtest/reports/*
          if-no-files-found: warn
          retention-days: 30
