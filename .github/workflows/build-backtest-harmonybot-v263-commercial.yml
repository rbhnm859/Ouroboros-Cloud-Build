name: HarmonyBotPro v26.3 Commercial Hardening

on:
  push:
    branches: [harmonybot-v26-3-commercial-hardening]
    paths: ['.github/workflows/build-backtest-harmonybot-v263-commercial.yml']

permissions:
  contents: read
  actions: read

jobs:
  build-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Recreate and commercial-harden source
        run: |
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v263_commercial_hardening.py
          cat > cli-build/HarmonyBotPro_v261/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable>
              <AlgoName>HarmonyBotPro_v26_3_Commercial</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup>
          </Project>
          EOF

      - name: Compile mobile algo and enforce zero errors
        run: |
          dotnet restore cli-build/HarmonyBotPro_v261/HarmonyBotPro.csproj
          dotnet build cli-build/HarmonyBotPro_v261/HarmonyBotPro.csproj -c Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false | tee build.log
          ! grep -q 'error CS' build.log
          mkdir -p output reports secure
          ALGO=$(find cli-build/HarmonyBotPro_v261 -type f -name '*.algo' | head -n 1); test -n "$ALGO"
          cp "$ALGO" output/HarmonyBotPro_v26_3_Commercial_Mobile.algo
          sha256sum output/HarmonyBotPro_v26_3_Commercial_Mobile.algo | tee output/HarmonyBotPro_v26_3_Commercial_Mobile.algo.sha256

      - name: Prepare FxPro Live USD 1:500 context
        env: { CTRADER_CTID: '${{ secrets.CTRADER_CTID }}', CTRADER_PASSWORD: '${{ secrets.CTRADER_PASSWORD }}' }
        run: |
          docker pull ghcr.io/spotware/ctrader-console:latest
          printf '%s' "$CTRADER_PASSWORD" > secure/pwd; chmod 600 secure/pwd
          docker run --rm -v "$PWD/secure:/secure" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/secure/pwd' ghcr.io/spotware/ctrader-console:latest accounts --environment-variables > secure/accounts.json
          python3 - <<'PY'
          import json
          d=json.load(open('secure/accounts.json',encoding='utf-8-sig'))
          m=[x for x in d if str(x.get('Broker','')).lower()=='fxpro' and bool(x.get('Live')) and str(x.get('DepositCurrency','')).upper()=='USD' and int(x.get('Leverage',0))==500]
          if not m: raise SystemExit('No FxPro Live USD 1:500 account')
          open('secure/account','w').write(str(m[0]['Number']))
          PY
          rm -f secure/accounts.json

      - name: Create commercial validation runner
        run: |
          cat > run_v263.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          LABEL="$1"; START="$2"; END="$3"; ACCOUNT="$(cat secure/account)"
          OUT="HarmonyBotPro-v263-XAUUSD-M15-100-${LABEL}-FxPro-Live500-open"
          docker run --rm -v "$PWD/output:/work/output" -v "$PWD/reports:/work/reports" -v "$PWD/secure:/secure" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/secure/pwd' -e "ACCOUNT=$ACCOUNT" ghcr.io/spotware/ctrader-console:latest \
            backtest /work/output/HarmonyBotPro_v26_3_Commercial_Mobile.algo --environment-variables --exit-on-stop \
            --broker=FxPro --symbol=XAUUSD --period=m15 --start="$START" --end="$END" --balance=100 --data-mode=open --commission=35 --spread=17.14 \
            --SymbolName=XAUUSD --RiskPercent=1.5 --MaxDrawdown=10 --DailyLossLimitPercent=4 --WeeklyLossLimitPercent=8 \
            --MonthlyTargetPercent=12 --RiskAfterMonthlyTarget=0.5 --CloseAllOnDailyLock=false --AutoReprotectOnStart=true --EmergencySlAtrMult=2 --EmergencyTpRR=2 \
            --MaxConsecutiveLosses=3 --ConsecutiveLossCooldownMin=60 --MarginBufferPercent=20 --SmallAccountMode=true --SmallAccountThreshold=100 \
            --SmallAccountMinSLPips=25 --SmallAccountMinTPPips=50 --AllowMinVolumeFallback=true --MinVolumeRiskCapPercent=3 --MicroMinVolumeRiskCapPercent=2 \
            --CommercialRiskHardening=true --MicroStopCompression=true --MicroMaxRiskPercent=2 --MaxNotionalToEquityRatio=500 \
            --SessionStart=8 --SessionEnd=22 --MTFEnabled=true --H4FilterEnabled=false --PatternConfidence=0.72 \
            --MaxConcurrentTrades=1 --MaxSameDirectionTrades=1 --AntiHedge=true --MaxTradesPerDay=4 --CooldownMinutes=10 \
            --AtrPeriod=14 --SlAtrMult=1.2 --TpCdMult=1 --MinRR=2 --UseCostAdjustedRR=true --MaxSpreadPips=35 \
            --MinStopLossPips=100 --MinTakeProfitPips=200 --MinStopDistancePips=15 --MinAtrPrice=3 --MaxSlippagePips=30 \
            --SwingDepth=5 --SwingLookback=200 --PivotScanCount=14 --MinLegAtrRatio=0.8 \
            --EnableGartley=true --EnableBat=true --EnableButterfly=true --EnableCrab=true --EnableCypher=true --EnableRat=true \
            --EnableDeepGartley=true --EnableAltBat=false --EnableDeepCrab=true --EnableABCD=true --EnableShark=true --EnableFiveZero=false \
            --GlobalMinScore=0.55 --ConsensusBonus=1.12 --FibTolerance=0.05 --MaxEntryDeviationAtr=0.5 \
            --AdaptiveFrequencyRecovery=true --SoftMtfReversalGate=true --CounterTrendConfidenceBuffer=0.06 --AdaptiveEntryDeviationFloor=0.85 \
            --ClosedBarProvisionalD=true --ProvisionalDMinMoveAtr=0.30 --SmallAccountGridGuard=true \
            --MaxTradesPerPatternPercent=60 --AutoDisableLosing=true --AutoDisableWinRate=45 --AutoDisableMinTrades=20 \
            --SlUpdateStepPips=2 --SlUpdateCooldownSec=5 --BreakEvenTriggerPips=100 --BreakEvenOffsetPips=10 \
            --TrailingTriggerPips=150 --TrailingDistancePips=90 --EnablePartialTP=true --Tp1RR=1 --Tp1ClosePercent=60 \
            --BlockNewsWindow=true --BlockedWindowsGMT='12:25-12:45;14:25-14:45' --EnableFibGrid=false \
            --report="/work/reports/${OUT}.html" --report-json="/work/reports/${OUT}.json" > "reports/${OUT}.console.txt" 2>&1
          EOF
          chmod +x run_v263.sh

      - name: Backtest M3
        env: { CTRADER_CTID: '${{ secrets.CTRADER_CTID }}' }
        run: ./run_v263.sh M3 '12/06/2026 00:00' '11/09/2026 23:59'
      - name: Backtest M6
        env: { CTRADER_CTID: '${{ secrets.CTRADER_CTID }}' }
        run: ./run_v263.sh M6 '12/03/2026 00:00' '11/09/2026 23:59'
      - name: Backtest 1Y
        env: { CTRADER_CTID: '${{ secrets.CTRADER_CTID }}' }
        run: ./run_v263.sh 1Y '12/09/2025 00:00' '11/09/2026 23:59'
      - name: Backtest 3Y
        env: { CTRADER_CTID: '${{ secrets.CTRADER_CTID }}' }
        run: ./run_v263.sh 3Y '12/09/2023 00:00' '11/09/2026 23:59'

      - name: Commercial acceptance report
        if: always()
        run: |
          python3 - <<'PY'
          import json,glob,os
          rows=[]
          for p in sorted(glob.glob('reports/*.json')):
            d=json.load(open(p)); t=d.get('tradeStatistics',{}); e=d.get('equity',{}); n=t.get('totalTrades',{}).get('all',0); w=t.get('winningTrades',{}).get('all',0)
            rows.append((os.path.basename(p),n,(100*w/n if n else 0),t.get('netProfit',{}).get('all',0),t.get('profitFactor',{}).get('all',0),e.get('maxEquityDrawdownPercent',0)))
          open('reports/acceptance.csv','w').write('file,trades,winrate,netprofit,pf,maxdd\n'+'\n'.join(','.join(map(str,r)) for r in rows))
          print(*rows,sep='\n')
          PY
      - name: Remove private material
        if: always()
        run: rm -rf secure
      - name: Upload v26.3 commercial candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v26.3-CommercialCandidate
          path: |
            output/HarmonyBotPro_v26_3_Commercial_Mobile.algo
            output/HarmonyBotPro_v26_3_Commercial_Mobile.algo.sha256
            reports/
            build.log
          retention-days: 30
