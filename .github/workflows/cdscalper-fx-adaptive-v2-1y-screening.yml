name: CDS FX Adaptive v2 - 28 FX 1Y M1 screening

on:
  push:
    branches: [cds-fx-adaptive-v2-1y-screening]
    paths: ['.github/workflows/cdscalper-fx-adaptive-v2-1y-screening.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cds-fx-adaptive-v2-1y-screening
  cancel-in-progress: true

jobs:
  build:
    name: Build CDS FX Adaptive v2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reconstruct source and project
        run: |
          mkdir -p cds-fx-adaptive-v2 build-out
          printf '%s' '' | base64 -d | gzip -d > cds-fx-adaptive-v2/CumulativeDeltaScalper_FX_Adaptive_v2.cs
          echo 'dff5df0bcb8ba55387e9abd135f773ae0cf3601aa1b8690bde7c8f1b2ce0e2e6  cds-fx-adaptive-v2/CumulativeDeltaScalper_FX_Adaptive_v2.cs' | sha256sum -c -
          cat > cds-fx-adaptive-v2/CumulativeDeltaScalper_FX_Adaptive_v2.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <RootNamespace>cAlgo.Robots</RootNamespace>
              <AssemblyName>CumulativeDeltaScalper_FX_Adaptive_v2</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="cTrader.Automate" Version="1.0.19" />
            </ItemGroup>
          </Project>
          EOF

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Build cBot
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c 'dotnet restore cds-fx-adaptive-v2/CumulativeDeltaScalper_FX_Adaptive_v2.csproj && dotnet build cds-fx-adaptive-v2/CumulativeDeltaScalper_FX_Adaptive_v2.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          ALGO="$(find cds-fx-adaptive-v2 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" build-out/CumulativeDeltaScalper_FX_Adaptive_v2.algo
          sha256sum build-out/CumulativeDeltaScalper_FX_Adaptive_v2.algo > build-out/algo.sha256

      - name: Upload cBot
        uses: actions/upload-artifact@v4
        with:
          name: cds-fx-adaptive-v2-algo
          path: build-out/*
          retention-days: 30

  backtest:
    name: 1Y M1 ${{ matrix.symbol }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        symbol: [AUDCAD, AUDCHF, AUDJPY, AUDNZD, AUDUSD, CADCHF, CADJPY, CHFJPY, EURAUD, EURCAD, EURCHF, EURGBP, EURJPY, EURNZD, EURUSD, GBPAUD, GBPCAD, GBPCHF, GBPJPY, GBPNZD, GBPUSD, NZDCAD, NZDCHF, NZDJPY, NZDUSD, USDCAD, USDCHF, USDJPY]
    steps:
      - name: Download cBot
        uses: actions/download-artifact@v4
        with:
          name: cds-fx-adaptive-v2-algo
          path: bt

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Create credential file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          printf '%s' "$CTRADER_PASSWORD" > bt/ctrader.pwd
          chmod 600 bt/ctrader.pwd
          mkdir -p bt/cache bt/reports

      - name: Backtest ${{ matrix.symbol }} 2025-09-12 to 2026-09-12
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          docker run --rm -v "$PWD/bt:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/CumulativeDeltaScalper_FX_Adaptive_v2.algo --environment-variables --exit-on-stop --broker=FxPro --symbol=${{ matrix.symbol }} --period=m1 --start='12/09/2025' --end='12/09/2026' --balance=100 --data-mode=m1 --data-dir=/work/cache --report="/work/reports/${{ matrix.symbol }}-1Y-M1.html" --report-json="/work/reports/${{ matrix.symbol }}-1Y-M1.json" 2>&1 | tee "bt/reports/${{ matrix.symbol }}-1Y-M1.log"

      - name: Remove credentials
        if: always()
        run: rm -f bt/ctrader.pwd

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-v2-${{ matrix.symbol }}-1y-m1
          path: |
            bt/reports/${{ matrix.symbol }}-1Y-M1.html
            bt/reports/${{ matrix.symbol }}-1Y-M1.json
            bt/reports/${{ matrix.symbol }}-1Y-M1.log
          if-no-files-found: warn
          retention-days: 30
