name: HarmonyBot V74 R17 Native Tick Research Only

on:
  workflow_dispatch:
  push:
    branches: ['harmonybot/v73-opportunity-universe']
    paths:
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV74.R17TickState.cs'
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV74.R15Trajectory.cs'
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV71.V73OpportunityUniverse.cs'
      - 'HarmonyBot-V71/tools/v74_r17_*'
      - 'HarmonyBot-V71/tools/evaluate_v74_r17.py'
      - 'HarmonyBot-V71/tools/test_v74_r17.py'
      - 'HarmonyBot-V71/tools/run_r17_tick_window.sh'
      - 'HarmonyBot-V71/tools/run_backtest.sh'
      - 'HarmonyBot-V74/r17/**'
      - '.github/workflows/harmonybot-v74-r17-research.yml'

concurrency:
  group: harmonybot-v74-r17-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  r17_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
      - name: Fail-closed R17 contracts and build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 -m unittest discover -s HarmonyBot-V71/tools -p test_v74_r17.py -v
          python3 -m unittest discover -s HarmonyBot-V71/tools -p test_v74_r16.py -v
          python3 -m unittest discover -s HarmonyBot-V71/tools -p test_v74_r15.py -v
          python3 HarmonyBot-V71/tools/static_contract_audit.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 HarmonyBot-V71/tools/verify_frozen_harmonic_engine.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 -m py_compile HarmonyBot-V71/tools/v74_r17_contract.py HarmonyBot-V71/tools/v74_r17_model.py HarmonyBot-V71/tools/evaluate_v74_r17.py
          dotnet restore HarmonyBot-V71/HarmonyBotV71.csproj
          dotnet build HarmonyBot-V71/HarmonyBotV71.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V71/dist
          A=$(find HarmonyBot-V71/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo
      - uses: actions/upload-artifact@v4
        with:
          name: v74-r17-build
          path: |
            control/HarmonyBot-V71/dist
            control/V71_STATIC_CONTRACT_AUDIT.json
            control/V71_FROZEN_HARMONIC_ENGINE_GUARD.json
          retention-days: 30

  r17_tick_universe:
    needs: r17_build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        window: [Y2016, Y2017, Y2018, Y2019, Y2020]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v74-r17-build
          path: control/HarmonyBot-V71/shared
      - name: Run exact server-tick research universe
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          test -s "$A"
          cp "$A" control/HarmonyBot-V71/dist/
          chmod +x control/HarmonyBot-V71/tools/*.sh
          control/HarmonyBot-V71/tools/run_r17_tick_window.sh ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"
      - uses: actions/upload-artifact@v4
        with:
          name: v74-r17-tick-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-R17-TICK-${{ matrix.window }}
          retention-days: 45

  r17_research_gate:
    needs: r17_tick_universe
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: v74-r17-tick-*
          path: merged
          merge-multiple: true
      - name: R17 expanding OOF competing-risk hard research gate
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          python3 control/HarmonyBot-V71/tools/evaluate_v74_r17.py merged research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V74-R17-RESEARCH-VERDICT
          path: |
            research
            control/HarmonyBot-V74/r17
          retention-days: 90
