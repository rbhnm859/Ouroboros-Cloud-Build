name: HarmonyBot V28.1 Stage1 Performance Patch Gate

on:
  workflow_dispatch:
  push:
    branches: [harmonybot-v28-commercial-final-rc]
    paths: ['.github/workflows/patch-harmonybot-v281-performance-stage1.yml']

permissions:
  contents: read
  actions: read

jobs:
  performance-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Generate baseline V28.1
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          mkdir -p perf-stage1/{baseline,patched,algo,data,reports,logs}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs perf-stage1/baseline/HarmonyBotPro.cs
      - name: Preserve source for Stage1 gate
        run: |
          set -euo pipefail
          cp perf-stage1/baseline/HarmonyBotPro.cs perf-stage1/patched/HarmonyBotPro.cs
          printf '{"changes":[],"mode":"baseline-equivalence-and-routing-fix"}\n' > perf-stage1/patch-manifest.json
      - name: Feature and semantic surface integrity
        run: |
          set -euo pipefail
          cmp perf-stage1/baseline/HarmonyBotPro.cs perf-stage1/patched/HarmonyBotPro.cs
          for S in perf-stage1/baseline/HarmonyBotPro.cs perf-stage1/patched/HarmonyBotPro.cs; do
            grep -q GeometryQualityScore "$S"; grep -Eq 'FibGrid|Fibonacci' "$S"; grep -Eq 'Gartley|Butterfly|Bat' "$S"; grep -q SmallAccountMinSLPips "$S"; grep -q capitalInfeasible "$S"
          done
          printf '{"source_identical":true}\n' > perf-stage1/integrity.json
      - name: Compile V28.1 zero-error
        run: |
          set -euo pipefail
          mkdir -p perf-stage1/build
          cp perf-stage1/patched/HarmonyBotPro.cs perf-stage1/build/HarmonyBotPro.cs
          cat > perf-stage1/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v281_perf1</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore perf-stage1/build/HarmonyBotPro.csproj
          dotnet build perf-stage1/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee perf-stage1/build.log
          ! grep -q ' error CS' perf-stage1/build.log
          A=$(find perf-stage1/build -type f -name '*.algo' -print -quit); test -s "$A"; cp "$A" perf-stage1/algo/HarmonyBotPro_v281_perf1.algo; sha256sum perf-stage1/algo/*.algo > perf-stage1/algo.sha256
      - name: Resolve cTrader account
        env: {CTRADER_PASSWORD: '${{ secrets.CTRADER_PASSWORD }}', CTRADER_CTID: '${{ secrets.CTRADER_CTID }}', CTRADER_ACCOUNT: '${{ secrets.CTRADER_ACCOUNT }}'}
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > perf-stage1/ctrader.pwd; chmod 600 perf-stage1/ctrader.pwd
          docker run --rm -v "$PWD/perf-stage1:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > perf-stage1/accounts.json
          python3 - <<'PY'
          import json,os
          a=json.load(open('perf-stage1/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip(); m=next((x for x in a if str(x.get('Number','')).strip()==e or str(x.get('Id','')).strip()==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500 or abs(float(m.get('Balance',0))-100)>0.01: raise SystemExit('account mismatch')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CTRADER_ACCOUNT_NUMBER='+str(m['Number']).strip()+'\n')
          PY
      - name: XAUUSD route preflight
        env: {CTRADER_CTID: '${{ secrets.CTRADER_CTID }}'}
        run: |
          set -euo pipefail
          test -n "$CTRADER_ACCOUNT_NUMBER"
          if docker run --rm -v "$PWD/perf-stage1:/work" ghcr.io/spotware/ctrader-console:5.9.11 symbols --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" > perf-stage1/symbols.txt 2>/dev/null && grep -qi XAUUSD perf-stage1/symbols.txt; then echo 'CTRADER_BROKER_ARG=' >> "$GITHUB_ENV"; else docker run --rm -v "$PWD/perf-stage1:/work" ghcr.io/spotware/ctrader-console:5.9.11 symbols --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" --broker=fxpro > perf-stage1/symbols.txt; grep -qi XAUUSD perf-stage1/symbols.txt; echo 'CTRADER_BROKER_ARG=--broker=fxpro' >> "$GITHUB_ENV"; fi
      - name: Exact 1-day baseline equivalence performance gate
        env: {CTRADER_CTID: '${{ secrets.CTRADER_CTID }}'}
        run: |
          set -uo pipefail
          T0=$(date +%s); set +e
          timeout --signal=TERM --kill-after=30s 1200 docker run --rm -v "$PWD/perf-stage1:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/algo/HarmonyBotPro_v281_perf1.algo --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" $CTRADER_BROKER_ARG --symbol=XAUUSD --period=m1 --start='15/09/2026' --end='16/09/2026' --balance=100 --data-mode=m1 --data-dir=/work/data --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxDrawdown=10.0 --MinStopLossPips=100.0 --SmallAccountMode=true --SmallAccountMinSLPips=25.0 --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --report=/work/reports/patched-1d.html --report-json=/work/reports/patched-1d.json 2>&1 | tee perf-stage1/logs/patched-1d.log
          RC=${PIPESTATUS[0]}; set -e; DT=$(($(date +%s)-T0)); printf 'exit_code=%s\nseconds=%s\n' "$RC" "$DT" | tee perf-stage1/timing.txt
          test -s perf-stage1/reports/patched-1d.json || exit "$RC"
      - name: Equivalence and speed assessment
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          p=pathlib.Path('perf-stage1/reports/patched-1d.json'); t=pathlib.Path('perf-stage1/timing.txt').read_text() if pathlib.Path('perf-stage1/timing.txt').exists() else ''
          sec=int(re.search(r'seconds=(\d+)',t).group(1)) if re.search(r'seconds=(\d+)',t) else None
          out={'baseline_seconds':1210,'current_seconds':sec,'speed_ratio':(1210/sec if sec else None),'baseline_reference':{'trades':1,'net':4.30,'equity_dd_pct':2.0},'report_present':p.exists(),'source_identical':True}
          if p.exists():
            r=json.load(open(p,encoding='utf-8-sig')); out['report_keys']=list(r)[:30]
          json.dump(out,open('perf-stage1/assessment.json','w'),indent=2); print(json.dumps(out,indent=2))
          PY
      - name: Remove credentials
        if: always()
        run: rm -f perf-stage1/ctrader.pwd perf-stage1/accounts.json perf-stage1/symbols.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V281-STAGE1-PERFORMANCE-PATCH-GATE
          path: |
            perf-stage1/patch-manifest.json
            perf-stage1/integrity.json
            perf-stage1/build.log
            perf-stage1/algo.sha256
            perf-stage1/timing.txt
            perf-stage1/assessment.json
            perf-stage1/reports/
            perf-stage1/logs/
          retention-days: 30
