name: Patch HarmonyBotPro v19 Critical Geometry

on:
  push:
    branches: [harmonybot-v19-50pass]
    paths: ['.github/workflows/patch-harmonybot-v19-critical.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot-v19-50pass
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Apply critical harmonic fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HarmonyBot-v19/HarmonyBotPro_v19_50PASS.cs')
          s=p.read_text()
          fixes=[]
          def rep(old,new,name,count=1):
              global s
              c=s.count(old)
              if c!=count: raise SystemExit(f'{name}: expected {count}, found {c}')
              s=s.replace(old,new)
              fixes.append(name)

          rep('''                bull = (b.Price > a.Price) && (c.Price < b.Price) && (d.Price > c.Price);\n                bear = (b.Price < a.Price) && (c.Price > b.Price) && (d.Price < c.Price);''',
              '''                // ABCD is a reversal pattern: bullish completion is D-low; bearish completion is D-high.\n                bull = (b.Price < a.Price) && (c.Price > b.Price) && (d.Price < c.Price);\n                bear = (b.Price > a.Price) && (c.Price < b.Price) && (d.Price > c.Price);''',
              'ABCD reversal polarity')

          rep('''                double xd = Math.Abs(d.Price - x.Price);\n                double rAB = ab / xa;\n                double rBC = bc / ab;\n                double rCD = cd / bc;\n                double rXD = xd / xa;''',
              '''                // Standard XABCD completion ratio is AD/XA (retracement/extension from A), not |D-X|/XA.\n                double ad = Math.Abs(d.Price - a.Price);\n                double rAB = ab / xa;\n                double rBC = bc / ab;\n                double rCD = cd / bc;\n                double rAD = ad / xa;''',
              'XABCD AD-XA geometry')
          rep('if (!InFibRange(rXD, def.XDIdeal, def.XDMin, def.XDMax)) return null;',
              'if (!InFibRange(rAD, def.XDIdeal, def.XDMin, def.XDMax)) return null;',
              'XABCD completion range')
          rep('double s4 = RatioScore(rXD, def.XDIdeal);',
              'double s4 = RatioScore(rAD, def.XDIdeal);',
              'XABCD completion score')

          rep('''            if (ideal > 0)\n            {\n                double lo = Math.Max(min, ideal - _fibTolerance);\n                double hi = Math.Min(max, ideal + _fibTolerance);\n                return value >= lo && value <= hi;\n            }\n            return value >= min && value <= max;''',
              '''            // min/max already define the accepted harmonic zone. FibTolerance expands the zone slightly;\n            // v18/v19 previously shrank every zone to ideal +/- tolerance, suppressing valid patterns.\n            double lo = Math.Max(0.0, min - _fibTolerance);\n            double hi = max + _fibTolerance;\n            return value >= lo && value <= hi;''',
              'Fibonacci tolerance semantics')

          rep('''                    Candidate c = Match(bars, pivots, i, def, currentIndex, atrNow, regimeScore, buyTrend, sellTrend);\n                    if (c != null)\n                        all.Add(c);''',
              '''                    Candidate c = Match(bars, pivots, i, def, currentIndex, atrNow, regimeScore, buyTrend, sellTrend);\n                    if (c != null)\n                    {\n                        SwingPoint completion = c.Family == PatternFamily.Shark ? c.C : c.D;\n                        double liveEntry = c.IsBullish ? symbol.Ask : symbol.Bid;\n                        // Filter stale/far candidates before ranking so an old high-score candidate cannot block a valid recent one.\n                        if (completion != null && Math.Abs(liveEntry - completion.Price) <= atrNow * _maxEntryDeviationAtr)\n                            all.Add(c);\n                    }''',
              'pre-rank entry proximity')

          # Cypher needs its own XC extension + CD/XC retracement geometry.
          rep('''            else if (isAbcd)\n            {\n                double rBC = bc / ab;\n                double rCD = cd / ab;\n                if (!InRange(rBC, R_382, R_886)) return null;\n                if (!InFibRange(rCD, def.BIdeal, def.BMin, def.BMax)) return null;\n                geometry = (RatioScore(rBC, R_618) + RatioScore(rCD, def.BIdeal)) / 2.0;\n            }\n            else\n            {''',
              '''            else if (isAbcd)\n            {\n                double rBC = bc / ab;\n                double rCD = cd / ab;\n                if (!InRange(rBC, R_382 - _fibTolerance, R_886 + _fibTolerance)) return null;\n                if (!InFibRange(rCD, def.BIdeal, def.BMin, def.BMax)) return null;\n                geometry = (RatioScore(rBC, R_618) + RatioScore(rCD, def.BIdeal)) / 2.0;\n            }\n            else if (def.Name == "Cypher")\n            {\n                double xc = Math.Abs(c.Price - x.Price);\n                if (xc <= 0) return null;\n                double rAB = ab / xa;\n                double rXC = xc / xa;\n                double rCDXC = cd / xc;\n                if (!InRange(rAB, R_382 - _fibTolerance, R_618 + _fibTolerance)) return null;\n                if (!InRange(rXC, R_1272 - _fibTolerance, R_1414 + _fibTolerance)) return null;\n                if (!InRange(rCDXC, R_786 - _fibTolerance, R_786 + _fibTolerance)) return null;\n                geometry = (RatioScore(rAB, R_50) + RatioScore(rXC, R_1272) + RatioScore(rCDXC, R_786)) / 3.0;\n            }\n            else\n            {''',
              'Cypher pattern-specific geometry')

          p.write_text(s)
          Path('HarmonyBot-v19/reports/critical-fixes.txt').write_text('\n'.join(f'FIX {i+1:02d} {x}' for i,x in enumerate(fixes))+'\n')
          print('\n'.join(fixes))
          PY
      - name: Refresh 50-pass audit gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HarmonyBot-v19/tools/audit_v19_50.py')
          s=p.read_text()
          s=s.replace("ck('48 ABCD BC retracement filter','InRange(rBC, R_382, R_886)' in s)\nck('49 ABCD weight reduced','0.68, 0.60, 0.85, 0.90)' in s)\nck('50 success pattern race reset','_lastOpenedPattern = \"\";' in s)",
          "ck('48 ABCD bullish-bearish reversal polarity','bull = (b.Price < a.Price) && (c.Price > b.Price) && (d.Price < c.Price);' in s)\nck('49 XABCD AD-XA completion geometry','double rAD = ad / xa;' in s and 'rXD = xd / xa' not in s)\nck('50 valid Fib zone tolerance semantics','double lo = Math.Max(0.0, min - _fibTolerance);' in s and 'double hi = max + _fibTolerance;' in s)")
          p.write_text(s)
          PY
          python3 HarmonyBot-v19/tools/audit_v19_50.py HarmonyBot-v19/HarmonyBotPro_v19_50PASS.cs | tee HarmonyBot-v19/reports/50-pass-audit.txt
      - name: Build v19
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore HarmonyBot-v19/HarmonyBotPro_v19.csproj
          dotnet build HarmonyBot-v19/HarmonyBotPro_v19.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True 2>&1 | tee HarmonyBot-v19/reports/build.log
          ALGO=$(find HarmonyBot-v19/bin/Release -type f -name '*.algo' -print -quit)
          test -n "$ALGO"
          cp "$ALGO" HarmonyBot-v19/builds/HarmonyBotPro_v19_50PASS_Mobile.algo
          sha256sum HarmonyBot-v19/builds/HarmonyBotPro_v19_50PASS_Mobile.algo | tee HarmonyBot-v19/reports/algo.sha256
      - name: Update runtime crosscheck hash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          algo=Path('HarmonyBot-v19/builds/HarmonyBotPro_v19_50PASS_Mobile.algo')
          h=hashlib.sha256(algo.read_bytes()).hexdigest()
          p=Path('.github/workflows/backtest-harmonybot-v19-fast-open.yml')
          s=p.read_text()
          s=re.sub(r"echo '[0-9a-f]{64}  bt/v19\.algo'", f"echo '{h}  bt/v19.algo'", s, count=1)
          p.write_text(s)
          print('runtime hash',h)
          PY
      - name: Commit patched v19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HarmonyBot-v19 .github/workflows/backtest-harmonybot-v19-fast-open.yml
          git commit -m 'fix: finalize v19 harmonic geometry and 50-pass gates [skip ci]' || true
          git push origin HEAD:harmonybot-v19-50pass
      - uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v19-50PASS-CriticalFixed
          path: HarmonyBot-v19/builds/HarmonyBotPro_v19_50PASS_Mobile.algo
          retention-days: 30
