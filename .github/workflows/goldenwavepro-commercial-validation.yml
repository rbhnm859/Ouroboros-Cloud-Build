name: GoldenWavePro Commercial Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goldenwavepro-commercial-validation.yml'

permissions:
  contents: read

concurrency:
  group: goldenwavepro-commercial-validation
  cancel-in-progress: true

jobs:
  backtest:
    name: XAUUSD M15 ${{ matrix.window }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - window: 1Y
            start: '11/09/2025'
            end: '10/09/2026'
            min_trades: 40
            min_growth: 20.0
            growth_name: ROI
          - window: 3Y
            start: '11/09/2023'
            end: '10/09/2026'
            min_trades: 120
            min_growth: 15.0
            growth_name: CAGR

    steps:
      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Recreate GoldenWavePro source
        run: |
          mkdir -p src/GoldenWavePro backtest/cache backtest/reports backtest/bin
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip
          Path('src/GoldenWavePro/GoldenWavePro.cs').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('src/GoldenWavePro/GoldenWavePro.csproj').write_bytes(gzip.decompress(base64.b64decode('')))
          PYCODE

      - name: Build GoldenWavePro cBot
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo \
            ghcr.io/spotware/ctrader-console:5.9.11 -c \
            'dotnet restore src/GoldenWavePro/GoldenWavePro.csproj && dotnet build src/GoldenWavePro/GoldenWavePro.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          ALGO="$(find src/GoldenWavePro -type f -name '*.algo' -print -quit)"
          test -n "$ALGO" || { echo 'No .algo produced'; exit 1; }
          cp "$ALGO" backtest/bin/GoldenWavePro.algo

      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Backtest XAUUSD M15 ${{ matrix.window }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/bin/GoldenWavePro.algo \
            --environment-variables --exit-on-stop \
            --symbol=XAUUSD \
            --period=m15 \
            --start="${{ matrix.start }}" \
            --end="${{ matrix.end }}" \
            --balance=10000 \
            --data-mode=m1 \
            --data-dir=/work/cache \
            --report="/work/reports/XAUUSD-M15-${{ matrix.window }}.html" \
            --report-json="/work/reports/XAUUSD-M15-${{ matrix.window }}.json"

      - name: Commercial performance scorecard
        if: success()
        env:
          WINDOW: ${{ matrix.window }}
          MIN_TRADES: ${{ matrix.min_trades }}
          MIN_GROWTH: ${{ matrix.min_growth }}
          GROWTH_NAME: ${{ matrix.growth_name }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, os, re
          window = os.environ['WINDOW']
          min_trades = int(os.environ['MIN_TRADES'])
          min_growth = float(os.environ['MIN_GROWTH'])
          growth_name = os.environ['GROWTH_NAME']
          balance = 10000.0
          years = 1.0 if window == '1Y' else 3.0
          report = Path(f'backtest/reports/XAUUSD-M15-{window}.json')
          data = json.loads(report.read_text())
          flat = {}
          def flatten(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      flat.setdefault(re.sub(r'[^a-z0-9]', '', key.lower()), child)
                      flatten(child)
              elif isinstance(value, list):
                  for child in value:
                      flatten(child)
          flatten(data)
          def raw(*names):
              for name in names:
                  value = flat.get(re.sub(r'[^a-z0-9]', '', name.lower()))
                  if value not in (None, '') and not isinstance(value, (dict, list)):
                      return value
              return ''
          def number(*names, default=0.0):
              value = raw(*names)
              try:
                  return float(str(value).replace('%','').replace(',',''))
              except (TypeError, ValueError):
                  return default
          trades = int(number('TotalTrades', 'Trades', 'TotalPositions'))
          wins = int(number('WinningTrades', 'WinningPositions', 'Wins'))
          net = number('NetProfit', 'NetProfitAmount')
          pf = number('ProfitFactor')
          dd = number('MaxEquityDrawdownPercentages', 'MaxEquityDrawdownPercentage', 'MaxDrawdownPercentages', 'MaxDrawdownPercentage')
          win_rate = number('WinRate', 'WinningTradesPercentages', default=(100.0*wins/trades if trades else 0.0))
          roi = 100.0 * net / balance
          ending = balance + net
          cagr = ((ending / balance) ** (1.0 / years) - 1.0) * 100.0 if ending > 0 else -100.0
          growth = roi if growth_name == 'ROI' else cagr
          efficiency = (growth / dd) if dd > 0 else (999.0 if growth > 0 else 0.0)
          gates = {
              'positive_net_profit': net > 0,
              'profit_factor_>=_1.50': pf >= 1.50,
              'max_drawdown_<=_15%': 0 <= dd <= 15.0,
              f'{growth_name}_>=_{min_growth:.1f}%': growth >= min_growth,
              f'trades_>=_{min_trades}': trades >= min_trades,
              'return_to_drawdown_>=_1.50': efficiency >= 1.50,
          }
          passed = all(gates.values())
          lines = [
              f'# GoldenWavePro — XAUUSD M15 {window}', '',
              f'- Trades: {trades}', f'- Wins: {wins}', f'- Win rate: {win_rate:.2f}%',
              f'- Net profit: ${net:.2f}', f'- ROI: {roi:.2f}%', f'- CAGR: {cagr:.2f}%',
              f'- Profit factor: {pf:.3f}', f'- Max equity drawdown: {dd:.2f}%',
              f'- {growth_name}/MDD: {efficiency:.2f}', '', '## Internal commercial gates']
          for name, ok in gates.items():
              lines.append(f'- {"PASS" if ok else "FAIL"}: {name}')
          lines += ['', f'**PERFORMANCE OVERALL: {"PASS" if passed else "FAIL"}**']
          summary = '\n'.join(lines) + '\n'
          Path(f'backtest/reports/XAUUSD-M15-{window}-scorecard.md').write_text(summary)
          print(summary)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write(summary)
          if not passed:
              raise SystemExit(2)
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenWavePro-Commercial-${{ matrix.window }}
          path: |
            backtest/bin/GoldenWavePro.algo
            backtest/reports/XAUUSD-M15-${{ matrix.window }}.html
            backtest/reports/XAUUSD-M15-${{ matrix.window }}.json
            backtest/reports/XAUUSD-M15-${{ matrix.window }}-scorecard.md
          if-no-files-found: warn
          retention-days: 30
