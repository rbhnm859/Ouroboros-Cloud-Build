name: HarmonyBot V74 R16 First-Passage Research Only\n\non:\n  workflow_dispatch:\n  push:\n    branches: ['harmonybot/v73-opportunity-universe']\n    paths:\n      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV74.R16FirstPassage.cs'\n      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV74.R15Trajectory.cs'\n      - 'HarmonyBot-V71/tools/v74_r16_*'\n      - 'HarmonyBot-V71/tools/evaluate_v74_r16.py'\n      - 'HarmonyBot-V74/r16/**'\n      - '.github/workflows/harmonybot-v74-r16-research.yml'\nconcurrency:\n  group: harmonybot-v74-r16-research-${{ github.ref }}\n  cancel-in-progress: true\npermissions:\n  contents: read\n  actions: read\njobs:\n  r16_build:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.sha }}\n          path: control\n      - uses: actions/setup-dotnet@v4\n        with:\n          dotnet-version: '8.0.x'\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - run: python3 -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0\n      - name: Fail-closed R16 contract, static audit and build\n        shell: bash\n        run: |\n          set -euo pipefail\n          cd control\n          python3 -m unittest discover -s HarmonyBot-V71/tools -p test_v74_r16.py -v\n          python3 -m unittest discover -s HarmonyBot-V71/tools -p test_v74_r15.py -v\n          python3 HarmonyBot-V71/tools/static_contract_audit.py HarmonyBot-V71/src/HarmonyBotV71.cs\n          python3 HarmonyBot-V71/tools/verify_frozen_harmonic_engine.py HarmonyBot-V71/src/HarmonyBotV71.cs\n          python3 -m py_compile HarmonyBot-V71/tools/v74_r16_contract.py HarmonyBot-V71/tools/v74_r16_model.py HarmonyBot-V71/tools/evaluate_v74_r16.py\n          dotnet restore HarmonyBot-V71/HarmonyBotV71.csproj\n          dotnet build HarmonyBot-V71/HarmonyBotV71.csproj -c Release --no-restore --nologo\n          mkdir -p HarmonyBot-V71/dist\n          A=$(find HarmonyBot-V71/bin/Release -type f -name '*.algo' | head -1)\n          test -s "$A"\n          cp "$A" HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo\n      - uses: actions/upload-artifact@v4\n        with:\n          name: v74-r16-build\n          path: |\n            control/HarmonyBot-V71/dist\n            control/V71_STATIC_CONTRACT_AUDIT.json\n            control/V71_FROZEN_HARMONIC_ENGINE_GUARD.json\n          retention-days: 30\n\n  r16_research_universe:\n    needs: r16_build\n    runs-on: ubuntu-24.04\n    timeout-minutes: 55\n    strategy:\n      fail-fast: false\n      max-parallel: 5\n      matrix:\n        window: [Y2016, Y2017, Y2018, Y2019, Y2020]\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.sha }}\n          path: control\n      - uses: actions/download-artifact@v4\n        with:\n          name: v74-r16-build\n          path: control/HarmonyBot-V71/shared\n      - id: custody\n        name: Resolve immutable research custody\n        shell: bash\n        run: |\n          set -euo pipefail\n          W='${{ matrix.window }}'\n          [[ "$W" =~ ^Y20(16|17|18|19|20)$ ]] || exit 48\n          M=control/HarmonyBot-V73/V73_RESEARCH_CUSTODY.json\n          RUN=$(python3 - "$M" <<'PY'\n          import json,sys\n          print(json.load(open(sys.argv[1]))['source_run_id'])\n          PY\n          )\n          ART=$(python3 - "$M" "$W" <<'PY'\n          import json,sys\n          print(json.load(open(sys.argv[1]))['windows'][sys.argv[2]]['artifact'])\n          PY\n          )\n          SHA=$(python3 - "$M" "$W" <<'PY'\n          import json,sys\n          print(json.load(open(sys.argv[1]))['windows'][sys.argv[2]]['sha256'])\n          PY\n          )\n          echo "run=$RUN" >> "$GITHUB_OUTPUT"\n          echo "artifact=$ART" >> "$GITHUB_OUTPUT"\n          echo "sha=$SHA" >> "$GITHUB_OUTPUT"\n      - uses: actions/download-artifact@v4\n        with:\n          name: ${{ steps.custody.outputs.artifact }}\n          path: control/HarmonyBot-V71/data-seed\n          github-token: ${{ github.token }}\n          run-id: ${{ steps.custody.outputs.run }}\n      - name: Verify immutable bytes\n        shell: bash\n        run: |\n          set -euo pipefail\n          H=$(cd control/HarmonyBot-V71/data-seed && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)\n          test "$H" = '${{ steps.custody.outputs.sha }}' || exit 48\n      - name: Run exact R16 research telemetry universe\n        env:\n          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}\n          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}\n          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}\n          V71_DATA_SEED_DIR: ${{ github.workspace }}/control/HarmonyBot-V71/data-seed\n          V71_EXPECTED_DATA_SHA256: ${{ steps.custody.outputs.sha }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"\n          mkdir -p control/HarmonyBot-V71/dist\n          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)\n          test -s "$A"\n          cp "$A" control/HarmonyBot-V71/dist/\n          chmod +x control/HarmonyBot-V71/tools/*.sh\n          control/HarmonyBot-V71/tools/run_window.sh R_V73_OPPORTUNITY_UNIVERSE ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"\n      - uses: actions/upload-artifact@v4\n        with:\n          name: v74-r16-research-${{ matrix.window }}\n          path: control/HarmonyBot-V71/output-R_V73_OPPORTUNITY_UNIVERSE-${{ matrix.window }}\n          retention-days: 45\n\n  r16_research_gate:\n    needs: r16_research_universe\n    runs-on: ubuntu-24.04\n    timeout-minutes: 45\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.sha }}\n          path: control\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - run: python3 -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0\n      - uses: actions/download-artifact@v4\n        with:\n          pattern: v74-r16-research-*\n          path: merged\n          merge-multiple: true\n      - name: R16 nested expanding OOF and hard research pre-gate\n        env:\n          OPENBLAS_NUM_THREADS: '2'\n          OMP_NUM_THREADS: '2'\n        run: |\n          set -euo pipefail\n          python3 control/HarmonyBot-V71/tools/evaluate_v74_r16.py merged research\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: V74-R16-RESEARCH-VERDICT\n          path: |\n            research\n            control/HarmonyBot-V74/r16\n          retention-days: 90\n