name: HarmonyBot V61 Champion-Core Fibonacci Grid Commercial Rebase
on:
  push:
    branches: [harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase]
    paths: ['HarmonyBot-V61/**','.github/workflows/harmonybot-v61-champion-core-fibonacci-grid-commercial-rebase.yml']
  workflow_dispatch:
concurrency: {group: harmonybot-v61-champion-core-fibonacci-grid-commercial-rebase, cancel-in-progress: true}
permissions: {contents: read}
env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - shell: bash
        run: |
          set -euo pipefail; cd control
          python3 HarmonyBot-V61/tools/static_audit.py HarmonyBot-V61/src/HarmonyBotV61.cs
          dotnet restore HarmonyBot-V61/HarmonyBotV61.csproj
          dotnet build HarmonyBot-V61/HarmonyBotV61.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V61/dist HarmonyBot-V61/final
          A=$(find HarmonyBot-V61/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          cp "$A" HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          sha256sum HarmonyBot-V61/src/HarmonyBotV61.cs "$A" HarmonyBot-V61/MAJOR_VERSION_EXECUTION_CHARTER.md > HarmonyBot-V61/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V61/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v61-build
          path: |
            control/HarmonyBot-V61/dist
            control/HarmonyBot-V61/final
          retention-days: 30
  contracts:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - shell: bash
        run: |
          set -euo pipefail; cd control
          for f in v61_architecture_contract_test.py v61_v51_exact_control_contract_test.py v61_fibonacci_grid_contract_test.py v61_monotonic_weights_contract_test.py v61_whole_basket_risk_contract_test.py v61_regime_veto_contract_test.py v61_expansion_contract_test.py v61_runner_contract_test.py v61_no_lookahead_contract_test.py v61_evidence_integrity_contract_test.py; do python3 "HarmonyBot-V61/tools/$f"; done
  build-v51-control:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - shell: bash
        run: |
          set -euo pipefail; cd control
          test "$(git hash-object HarmonyBot-V51/src/HarmonyBotV51.cs)" = "be800fc0ff2a1ca83282af818abdfb6e945a512f"
          dotnet restore HarmonyBot-V51/HarmonyBotV51.csproj
          dotnet build HarmonyBot-V51/HarmonyBotV51.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V51/dist; A=$(find HarmonyBot-V51/bin/Release -type f -name '*.algo' | head -1); test -s "$A"; cp "$A" HarmonyBot-V51/dist/
      - uses: actions/upload-artifact@v4
        with: {name: v61-v51-control-build, path: control/HarmonyBot-V51/dist, retention-days: 30}
  v51-replay:
    needs: build-v51-control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {window: [A,B,C]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-v51-control-build, path: control/HarmonyBot-V51/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in A) S=04/01/2021; E=2021-01-11T00:00:00Z; X=30/06/2021;; B) S=01/07/2021; E=2021-07-08T00:00:00Z; X=31/12/2021;; C) S=03/01/2022; E=2022-01-10T00:00:00Z; X=30/06/2022;; esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V51/dist; A=$(find control/HarmonyBot-V51/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V51/dist/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo
          chmod +x control/HarmonyBot-V51/tools/*.sh
          control/HarmonyBot-V51/tools/run_window.sh FAMILY_NATIVE_MATH_GEOMETRY "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        with: {name: "v61-v51-replay-${{ matrix.window }}", path: "control/HarmonyBot-V51/output-FAMILY_NATIVE_MATH_GEOMETRY-${{ matrix.window }}", retention-days: 30}
  v61-replay:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {window: [A,B,C]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: control/HarmonyBot-V61/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in A) S=04/01/2021; E=2021-01-11T00:00:00Z; X=30/06/2021;; B) S=01/07/2021; E=2021-07-08T00:00:00Z; X=31/12/2021;; C) S=03/01/2022; E=2022-01-10T00:00:00Z; X=30/06/2022;; esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V61/dist; A=$(find control/HarmonyBot-V61/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          chmod +x control/HarmonyBot-V61/tools/*.sh
          control/HarmonyBot-V61/tools/run_window.sh V61_V51_EXACT_CONTROL "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        with: {name: "v61-exact-replay-${{ matrix.window }}", path: "control/HarmonyBot-V61/output-V61_V51_EXACT_CONTROL-${{ matrix.window }}-B10000-S1", retention-days: 30}
  replay-gate:
    needs: [v51-replay,v61-replay]
    runs-on: ubuntu-24.04
    outputs: {replayok: "${{ steps.g.outputs.replayok }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v61-v51-replay-*', path: replay, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v61-exact-replay-*', path: replay, merge-multiple: true}
      - id: g
        shell: bash
        run: |
          mkdir -p gate; python3 control/HarmonyBot-V61/tools/check_exact_control_replay.py replay gate
          echo "replayok=$(cat gate/replay.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: v61-exact-control-gate, path: gate, retention-days: 30}
  calibration:
    needs: [build,replay-gate]
    if: needs.replay-gate.outputs.replayok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy: {fail-fast: false, max-parallel: 12, matrix: {variant: [V61_V51_EXACT_CONTROL,V61_CHAMPION_FIB_GRID,V61_GRID_REGIME_SURVIVAL,V61_COMMERCIAL_MAX], window: [C1,C2,C3]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: control/HarmonyBot-V61/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in C1) S=04/01/2021; E=2021-01-11T00:00:00Z; X=31/12/2021;; C2) S=03/01/2022; E=2022-01-10T00:00:00Z; X=30/12/2022;; C3) S=03/01/2023; E=2023-01-10T00:00:00Z; X=29/12/2023;; esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V61/dist; A=$(find control/HarmonyBot-V61/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          chmod +x control/HarmonyBot-V61/tools/*.sh
          control/HarmonyBot-V61/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1 10000 1
      - uses: actions/upload-artifact@v4
        with: {name: "v61-cal-${{ matrix.variant }}-${{ matrix.window }}", path: "control/HarmonyBot-V61/output-${{ matrix.variant }}-${{ matrix.window }}-B10000-S1", retention-days: 30}
  calibration-freeze:
    needs: calibration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v61-cal-*', path: cal, merge-multiple: true}
      - shell: bash
        run: |
          mkdir -p manifest; python3 control/HarmonyBot-V61/tools/build_calibration_manifest.py cal manifest; python3 control/HarmonyBot-V61/tools/cluster_evidence.py cal manifest
      - uses: actions/upload-artifact@v4
        with: {name: v61-calibration-manifest, path: manifest, retention-days: 30}
  dev:
    needs: [build,calibration-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy: {fail-fast: false, max-parallel: 12, matrix: {variant: [V61_V51_EXACT_CONTROL,V61_CHAMPION_FIB_GRID,V61_GRID_REGIME_SURVIVAL,V61_COMMERCIAL_MAX], window: [A,B,C]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: control/HarmonyBot-V61/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in A) S=01/07/2024; E=2024-07-08T00:00:00Z; X=31/12/2024;; B) S=02/01/2025; E=2025-01-09T00:00:00Z; X=30/06/2025;; C) S=01/07/2025; E=2025-07-08T00:00:00Z; X=31/12/2025;; esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V61/dist; A=$(find control/HarmonyBot-V61/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          chmod +x control/HarmonyBot-V61/tools/*.sh
          control/HarmonyBot-V61/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1 10000 .5
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "v61-dev-${{ matrix.variant }}-${{ matrix.window }}", path: "control/HarmonyBot-V61/output-${{ matrix.variant }}-${{ matrix.window }}-B10000-S1", retention-days: 30, if-no-files-found: error}
  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    outputs: {candidate: "${{ steps.a.outputs.candidate }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v61-dev-*', path: dev, merge-multiple: true}
      - id: a
        shell: bash
        run: |
          mkdir -p final; python3 control/HarmonyBot-V61/tools/analyze_dev4.py dev final; python3 control/HarmonyBot-V61/tools/cluster_evidence.py dev final
          echo "candidate=$(cat final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: v61-dev-frontier, path: final, retention-days: 30}
  validation:
    needs: [build,analyze]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy: {fail-fast: false, max-parallel: 6, matrix: {quarter: [Q1,Q2], spread: [1.0,1.25,1.5]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: control/HarmonyBot-V61/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.quarter }}" in Q1) S=02/01/2026; E=2026-01-09T00:00:00Z; X=31/03/2026;; Q2) S=01/04/2026; E=2026-04-08T00:00:00Z; X=30/06/2026;; esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        env: {CANDIDATE: "${{ needs.analyze.outputs.candidate }}"}
        run: |
          mkdir -p control/HarmonyBot-V61/dist; A=$(find control/HarmonyBot-V61/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          chmod +x control/HarmonyBot-V61/tools/*.sh
          control/HarmonyBot-V61/tools/run_window.sh "$CANDIDATE" "VAL_${{ matrix.quarter }}_S${{ matrix.spread }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" "${{ matrix.spread }}" 10000 .25
      - uses: actions/upload-artifact@v4
        with: {name: "v61-validation-${{ matrix.quarter }}-${{ matrix.spread }}", path: "control/HarmonyBot-V61/output-*VAL_*", retention-days: 30}
  validation-gate:
    needs: [analyze,validation]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs: {validationok: "${{ steps.v.outputs.validationok }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v61-validation-*', path: val, merge-multiple: true}
      - id: v
        shell: bash
        run: |
          mkdir -p out
          if python3 control/HarmonyBot-V61/tools/validation_gate.py val out; then echo "validationok=true" >> "$GITHUB_OUTPUT"; else echo "validationok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with: {name: v61-validation-gate, path: out, retention-days: 30}
  capital:
    needs: [build,analyze,validation-gate]
    if: needs.validation-gate.outputs.validationok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy: {fail-fast: false, max-parallel: 6, matrix: {balance: [100,150,200,300,500,1000]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: control/HarmonyBot-V61/shared}
      - shell: bash
        env: {CANDIDATE: "${{ needs.analyze.outputs.candidate }}"}
        run: |
          mkdir -p control/HarmonyBot-V61/dist; A=$(find control/HarmonyBot-V61/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          chmod +x control/HarmonyBot-V61/tools/*.sh
          control/HarmonyBot-V61/tools/run_window.sh "$CANDIDATE" "CAPITAL_${{ matrix.balance }}" 01/07/2024 2024-07-08T00:00:00Z 31/12/2025 1 "${{ matrix.balance }}" 1.5
      - uses: actions/upload-artifact@v4
        with: {name: "v61-capital-${{ matrix.balance }}", path: "control/HarmonyBot-V61/output-*CAPITAL_*", retention-days: 30}
  capital-gate:
    needs: [analyze,capital]
    runs-on: ubuntu-24.04
    outputs: {capok: "${{ steps.c.outputs.capok }}"}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'v61-capital-*', path: capital, merge-multiple: true}
      - id: c
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for f in pathlib.Path("capital").rglob("*.json"):
            try:d=json.load(open(f))
            except:continue
            if "basket_outcomes" in d: rows.append(d)
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=len(rows)==6 and all(good(x) for x in rows)
          pathlib.Path("V61_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V61","rows":rows,"all_capital_compatible":ok},indent=2)); pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: v61-capital-gate, path: V61_CAPITAL_COMPATIBILITY.json, retention-days: 30}
  freeze:
    needs: [build,analyze,validation-gate,capital-gate]
    if: needs.validation-gate.outputs.validationok == 'true' && needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: shared}
      - shell: bash
        env: {CANDIDATE: "${{ needs.analyze.outputs.candidate }}"}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V61/src/HarmonyBotV61.cs"); algo=next(pathlib.Path("shared").rglob("*.algo"))
          pathlib.Path("V61_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V61","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: v61-freeze-manifest, path: V61_FREEZE_MANIFEST.json, retention-days: 30}
  fresh:
    needs: [build,analyze,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {include: [{kind: ALPHA, balance: 10000},{kind: SMALL, balance: 100}]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v61-champion-core-fibonacci-grid-commercial-rebase, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v61-build, path: control/HarmonyBot-V61/shared}
      - shell: bash
        env: {CANDIDATE: "${{ needs.analyze.outputs.candidate }}"}
        run: |
          mkdir -p control/HarmonyBot-V61/dist; A=$(find control/HarmonyBot-V61/shared -type f -name '*.algo' | head -1); cp "$A" control/HarmonyBot-V61/dist/HarmonyBot_V61_Champion_Core_Fibonacci_Grid_Commercial_Rebase_RC.algo
          chmod +x control/HarmonyBot-V61/tools/*.sh
          control/HarmonyBot-V61/tools/run_window.sh "$CANDIDATE" "FRESH_${{ matrix.kind }}" 02/01/2020 2020-01-09T00:00:00Z 30/06/2020 1 "${{ matrix.balance }}" .5
      - uses: actions/upload-artifact@v4
        with: {name: "v61-fresh-${{ matrix.kind }}", path: "control/HarmonyBot-V61/output-*FRESH_*", retention-days: 30}
