name: Backtest CDScalper EURUSD v1 M1 30D Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - cds-eurusd-v1
    paths:
      - '.github/workflows/cdscalper-eurusd-v1-backtest-30d-diagnostic.yml'
      - 'CumulativeDeltaScalper-EURUSD-v1/src/**'
      - 'CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
      - 'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo'

permissions:
  contents: write

env:
  START_DATE_ISO: '2026-08-10'
  END_DATE_ISO: '2026-09-09'
  START_DATE_CTRADER: '10/08/2026'
  END_DATE_CTRADER: '09/09/2026'
  STARTING_BALANCE: '100'
  SYMBOL: 'EURUSD'
  PERIOD: 'm1'
  OUT_JSON: 'CumulativeDeltaScalper-EURUSD-v1/backtests/EURUSD_M1_2026-08-10_to_2026-09-09_diagnostic.json'
  OUT_MD: 'CumulativeDeltaScalper-EURUSD-v1/reports/EURUSD_M1_30D_diagnostic_summary.md'
  BUILD_MD: 'CumulativeDeltaScalper-EURUSD-v1/reports/build_result.md'

jobs:
  build-patched-algo:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cds-eurusd-v1
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build patched .algo on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'CumulativeDeltaScalper-EURUSD-v1'
          $project = Join-Path $root 'CumulativeDeltaScalper_EURUSD_v1.csproj'
          $builds = Join-Path $root 'builds'
          New-Item -ItemType Directory -Force -Path $builds | Out-Null
          dotnet --info
          dotnet restore $project
          dotnet build $project -c Release -p:AlgoName=CumulativeDeltaScalper_EURUSD_v1 -p:AlgoBuild=true -p:AlgoPublish=false -p:IncludeSource=true

          # Only select newly generated .algo files from bin/, not the old checked-in builds/ file.
          $bin = Join-Path $root 'bin'
          $algos = Get-ChildItem -Path $bin -Recurse -Filter '*.algo' -ErrorAction SilentlyContinue
          if (-not $algos -or $algos.Count -eq 0) {
            Write-Host 'No new .algo file generated under bin/.'
            exit 1
          }
          $selected = $algos | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $target = Join-Path $builds 'CumulativeDeltaScalper_EURUSD_v1.algo'
          Copy-Item $selected.FullName $target -Force
          $hash = Get-FileHash -Algorithm SHA256 $target
          Set-Content -Path (Join-Path $builds 'CumulativeDeltaScalper_EURUSD_v1.algo.sha256') -Value "$($hash.Hash.ToLower())  CumulativeDeltaScalper_EURUSD_v1.algo" -Encoding UTF8
          Write-Host "Selected .algo: $($selected.FullName)"
          Write-Host "Generated .algo: $target"
          Write-Host "SHA256: $($hash.Hash.ToLower())"

      - name: Upload patched .algo build
        uses: actions/upload-artifact@v4
        with:
          name: patched-algo-build
          path: |
            CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
            CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256
          retention-days: 14

  fallback-diagnostic-backtest:
    runs-on: ubuntu-latest
    needs: build-patched-algo
    timeout-minutes: 60
    env:
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
    steps:
      - name: Checkout cds-eurusd-v1
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1

      - name: Download patched .algo build
        uses: actions/download-artifact@v4
        with:
          name: patched-algo-build
          path: patched-algo-build

      - name: Prepare build artifact and preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p CumulativeDeltaScalper-EURUSD-v1/builds CumulativeDeltaScalper-EURUSD-v1/backtests CumulativeDeltaScalper-EURUSD-v1/reports backtest/reports backtest/cache/EURUSD
          find patched-algo-build -type f -maxdepth 5 -print
          ALGO_FILE=$(find patched-algo-build -type f -name 'CumulativeDeltaScalper_EURUSD_v1.algo' | head -n 1)
          SHA_FILE=$(find patched-algo-build -type f -name 'CumulativeDeltaScalper_EURUSD_v1.algo.sha256' | head -n 1)
          test -n "$ALGO_FILE"
          cp "$ALGO_FILE" CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
          if [ -n "$SHA_FILE" ]; then cp "$SHA_FILE" CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256; fi
          cat > "$BUILD_MD" <<EOF
          # Build Result

          - Workflow: cdscalper-eurusd-v1-backtest-30d-diagnostic.yml
          - Build runner: windows-latest
          - Backtest runner: ubuntu-latest
          - Target framework: net6.0
          - Build method: dotnet build + cTrader.Automate NuGet
          - Status: success
          - Source patch: bar delta fallback for M1 diagnostic backtests
          - Artifact: CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
          - Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          if [ -z "${CTRADER_CTID:-}" ] || [ -z "${CTRADER_ACCOUNT:-}" ] || [ -z "${CTRADER_PASSWORD:-}" ]; then
            echo 'missing_secrets=true' >> "$GITHUB_ENV"
          else
            echo 'missing_secrets=false' >> "$GITHUB_ENV"
          fi

      - name: Write missing secrets report
        if: env.missing_secrets == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          out = {
            "schema_version": 6,
            "bot": "CumulativeDeltaScalper-EURUSD-v1",
            "run_type": "diagnostic_bar_delta_fallback",
            "symbol": "EURUSD",
            "timeframe": "M1",
            "period": {"start": "2026-08-10", "end": "2026-09-09", "timezone": "UTC", "end_inclusive": False},
            "backtest": {"status": "missing_github_secrets", "data_source": "none", "metrics": {"total_trades": None}},
            "errors": ["Missing one or more GitHub Actions secrets: CTRADER_CTID, CTRADER_ACCOUNT, CTRADER_PASSWORD."],
            "generated_by": "GitHub Actions workflow cdscalper-eurusd-v1-backtest-30d-diagnostic.yml",
            "generated_at": "2026-09-09"
          }
          Path("CumulativeDeltaScalper-EURUSD-v1/backtests/EURUSD_M1_2026-08-10_to_2026-09-09_diagnostic.json").write_text(json.dumps(out, indent=2, ensure_ascii=False))
          Path("CumulativeDeltaScalper-EURUSD-v1/reports/EURUSD_M1_30D_diagnostic_summary.md").write_text("# EURUSD M1 30D Diagnostic 回測摘要\n\nBacktest status: missing_github_secrets\n")
          PYCODE

      - name: Run cTrader console diagnostic backtest EURUSD M1 30D
        if: env.missing_secrets == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cp CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo backtest/CumulativeDeltaScalper_EURUSD_v1.algo
          printf '%s' "$CTRADER_PASSWORD" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd
          docker run --rm -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            -e "PWD-FILE=/work/ctrader.pwd" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/CumulativeDeltaScalper_EURUSD_v1.algo --environment-variables \
            --symbol="$SYMBOL" --period="$PERIOD" --start="$START_DATE_CTRADER" --end="$END_DATE_CTRADER" \
            --balance="$STARTING_BALANCE" --data-mode=m1 --data-dir="/work/cache/EURUSD" \
            --DeltaThreshold=30 --MinConfirmations=1 --UseBarDeltaFallback=true --FallbackBelowTickDelta=999 --BarDeltaPointMultiplier=3 \
            --UseSessionFilter=false --OverlapOnly=false \
            --UseHtfEmaFilter=false --EmaSlopeBars=1 --AdxThreshold=0 --MinAtr=0 --MaxAtr=0 \
            --MaxSpreadPoints=100 --SpreadAvgMultiplier=5 --MaxDailyTrades=50 \
            --MaxDailyLossPercent=100 --MaxDailyLossMoney=0 --DailyProfitTargetMoney=0 \
            --MaxConsecutiveLosses=50 --MinSecondsBetweenTrades=0 --LossCooldownMinutes=0 \
            --MaxTradeSeconds=0 --UseBreakeven=false --AdverseDeltaExit=false \
            --report="/work/reports/EURUSD-M1-30D-diagnostic.html" --report-json="/work/reports/EURUSD-M1-30D-diagnostic.json" \
            --exit-on-stop 2>&1 | tee backtest/reports/console-30d-diagnostic.log
          rm -f backtest/ctrader.pwd

      - name: Publish diagnostic result files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, math
          from pathlib import Path
          out_json = Path("CumulativeDeltaScalper-EURUSD-v1/backtests/EURUSD_M1_2026-08-10_to_2026-09-09_diagnostic.json")
          out_md = Path("CumulativeDeltaScalper-EURUSD-v1/reports/EURUSD_M1_30D_diagnostic_summary.md")
          rep = Path("backtest/reports/EURUSD-M1-30D-diagnostic.json")
          log = Path("backtest/reports/console-30d-diagnostic.log")
          status = "completed" if rep.exists() else "failed_no_report_json"
          metrics = {"initial_balance": 100.0, "final_balance": None, "net_profit": None, "return_percent": None, "profit_factor": None, "win_rate": None, "max_drawdown": None, "total_trades": None, "average_trade": None, "largest_win": None, "largest_loss": None, "gross_profit": None, "gross_loss": None}
          errors = []
          raw_report_keys = []
          if rep.exists():
            try:
              d = json.loads(rep.read_text())
              if isinstance(d, dict): raw_report_keys = sorted(d.keys())
              m = d.get("main", {}) if isinstance(d, dict) else {}
              hist = d.get("history", {}).get("items", []) if isinstance(d, dict) else []
              nets = []
              for t in hist:
                val = t.get("net", t.get("netProfit", t.get("Net", t.get("NetProfit", 0))))
                try: nets.append(float(val))
                except Exception: pass
              total = len(nets)
              wins = sum(1 for n in nets if n > 0)
              gp = sum(n for n in nets if n > 0)
              gl = -sum(n for n in nets if n < 0)
              net = m.get("netProfit", m.get("NetProfit", sum(nets) if total else 0))
              try: net = float(net)
              except Exception: net = sum(nets) if total else 0
              final_balance = 100.0 + net
              metrics.update({"final_balance": final_balance, "net_profit": net, "return_percent": ((final_balance - 100.0) / 100.0 * 100.0), "profit_factor": (gp / gl if gl > 0 else (math.inf if gp > 0 else 0.0)) if total else None, "win_rate": (wins / total * 100.0) if total else None, "max_drawdown": d.get("equity", {}).get("maxEquityDrawdownPercent") if isinstance(d, dict) else None, "total_trades": total, "average_trade": (sum(nets) / total) if total else None, "largest_win": max(nets) if nets else None, "largest_loss": min(nets) if nets else None, "gross_profit": gp if total else None, "gross_loss": gl if total else None})
            except Exception as e:
              status = "failed_parse_report_json"
              errors.append(str(e))
          else:
            errors.append("cTrader console did not produce backtest/reports/EURUSD-M1-30D-diagnostic.json")
            if log.exists():
              text = log.read_text(errors="replace")
              for marker in ["Invalid settings", "Unknown symbol name", "Unknown period", "Account cannot be found", "No historical data", "Stop out during a backtest", "Parameter", "error", "failed"]:
                if marker in text:
                  errors.append("console marker: " + marker)
          total_trades = metrics.get("total_trades")
          if status == "completed" and total_trades and total_trades > 0:
            classification = "bar_delta_fallback_trades_triggered"
            suitable = True
            diagnosis = "Bar-delta fallback produced trades. The previous zero-trade result was caused by tick-delta not accumulating enough under cTrader CLI m1 data mode and/or too-strict filters."
          elif status == "completed" and total_trades == 0:
            classification = "bar_delta_fallback_still_zero_trades"
            suitable = False
            diagnosis = "Bar-delta fallback diagnostic still produced zero trades. The next suspect is another non-filter entry gate, stop-distance/volume guard, or CLI parameter binding not applying."
          else:
            classification = "diagnostic_execution_failed"
            suitable = False
            diagnosis = "Diagnostic backtest did not complete with a usable JSON report. Inspect console markers before changing strategy logic again."
          out = {"schema_version": 6, "bot": "CumulativeDeltaScalper-EURUSD-v1", "run_type": "diagnostic_bar_delta_fallback", "symbol": "EURUSD", "timeframe": "M1", "period": {"start": "2026-08-10", "end": "2026-09-09", "timezone": "UTC", "end_inclusive": False}, "execution": {"environment": "GitHub Actions windows build + ubuntu backtest", "engine": "ghcr.io/spotware/ctrader-console:5.9.11", "starting_balance_usd": 100.0, "artifact_path": "CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo", "ctrader_date_format": "DD/MM/YYYY", "cli_start": "10/08/2026", "cli_end": "09/09/2026", "data_mode": "m1", "source_patch": "bar_delta_fallback", "target_framework": "net6.0"}, "diagnostic_parameters": {"DeltaThreshold": 30, "MinConfirmations": 1, "UseBarDeltaFallback": True, "FallbackBelowTickDelta": 999, "BarDeltaPointMultiplier": 3, "UseSessionFilter": False, "OverlapOnly": False, "UseHtfEmaFilter": False, "AdxThreshold": 0, "MinAtr": 0, "MaxAtr": 0, "MaxSpreadPoints": 100, "MaxDailyTrades": 50, "MinSecondsBetweenTrades": 0, "MaxTradeSeconds": 0, "AdverseDeltaExit": False}, "backtest": {"status": status, "data_source": "cTrader console report json" if status == "completed" else "none", "metrics": metrics, "is_suitable_for_further_optimization": suitable, "debug_classification": classification, "debug_summary": diagnosis}, "raw_report_top_level_keys": raw_report_keys, "errors": errors, "generated_by": "GitHub Actions workflow cdscalper-eurusd-v1-backtest-30d-diagnostic.yml", "generated_at": "2026-09-09"}
          out_json.write_text(json.dumps(out, indent=2, ensure_ascii=False))
          lines = ["# EURUSD M1 30D Diagnostic 回測摘要", "", "- Bot: CumulativeDeltaScalper-EURUSD-v1", "- Run type: diagnostic_bar_delta_fallback", "- Symbol: EURUSD", "- Timeframe: M1", "- Period: 2026-08-10 ~ 2026-09-09 UTC", "- cTrader CLI date args: 10/08/2026 ~ 09/09/2026 (DD/MM/YYYY)", f"- Backtest status: {status}", f"- Debug classification: {classification}", "", "## Metrics"]
          for k, v in metrics.items(): lines.append(f"- {k}: {v}")
          lines += ["", "## Debug conclusion", diagnosis]
          if errors: lines += ["", "## Errors / limitations"] + [f"- {e}" for e in errors]
          out_md.write_text("\n".join(lines) + "\n")
          PYCODE

      - name: Commit patched .algo and diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin cds-eurusd-v1 || true
          git add CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256 "$BUILD_MD" "$OUT_JSON" "$OUT_MD" || true
          git commit -m 'Build patched algo and run fallback diagnostic backtest' || echo 'No changes to commit'
          git push origin HEAD:cds-eurusd-v1 || true

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDScalper_EURUSD_M1_30D_fallback_diagnostic_reports
          path: |
            CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
            CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256
            CumulativeDeltaScalper-EURUSD-v1/backtests/EURUSD_M1_2026-08-10_to_2026-09-09_diagnostic.json
            CumulativeDeltaScalper-EURUSD-v1/reports/EURUSD_M1_30D_diagnostic_summary.md
            CumulativeDeltaScalper-EURUSD-v1/reports/build_result.md
            backtest/reports/**
          retention-days: 14
