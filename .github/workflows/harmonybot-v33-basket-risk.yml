name: HarmonyBot V33.0 Basket Risk Execution Engine

on:
  push:
    branches:
      - harmonybot/v33-fibonacci-harmonic-basket-risk-engine
    paths:
      - '.github/workflows/harmonybot-v33-basket-risk.yml'
      - 'HarmonyBot-V33/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonybot-v33-basket-risk
  cancel-in-progress: true

jobs:
  one_pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v33-fibonacci-harmonic-basket-risk-engine
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Execute V33 one-pass
        run: |
          chmod +x control/HarmonyBot-V33/tools/run_backtest.sh
          chmod +x control/HarmonyBot-V33/tools/orchestrate_onepass.sh
          control/HarmonyBot-V33/tools/orchestrate_onepass.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HARMONYBOT-V33-BASKET-RISK
          path: control/HarmonyBot-V33/output
          if-no-files-found: warn
          retention-days: 30
