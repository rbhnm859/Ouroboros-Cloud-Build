name: HarmonyBot Architecture Redesign to Commercial Freeze

on:
  push:
    branches:
      - harmonybot/architecture-redesign-freeze
    paths:
      - '.github/workflows/harmonybot-architecture-redesign-freeze.yml'
      - 'commercial-freeze/**'
      - 'tmp/harmonybot-v26-build/fix_harmonybot_architecture_redesign_freeze.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one_pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccde79d22c0389ba64d9bb26a2e54379d81c91e
          path: base
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/architecture-redesign-freeze
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Execute architecture redesign one-pass to commercial freeze
        run: |
          chmod +x control/commercial-freeze/run_backtest.sh
          chmod +x control/commercial-freeze/orchestrate_onepass.sh
          control/commercial-freeze/orchestrate_onepass.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HARMONYBOT-ARCHITECTURE-REDESIGN-COMMERCIAL-FREEZE
          path: control/commercial-freeze-output
          if-no-files-found: warn
          retention-days: 30
