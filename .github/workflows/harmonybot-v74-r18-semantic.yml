name: HarmonyBot V74 R18 Outcome Semantic Research Only

on:
  workflow_dispatch:
    inputs:
      force_rerun:
        description: 'true = ignore sealed-window cache and re-run every cTrader window'
        type: boolean
        default: false
  push:
    branches: ['harmonybot/v73-opportunity-universe']
    paths:
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV74.R18OutcomeEngine.cs'
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV74.R17TickState.cs'
      - 'HarmonyBot-V71/tools/test_v74_r17.py'
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV71.V73OpportunityUniverse.cs'
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV71.ProtectedCore.cs'
      - 'HarmonyBot-V71/src/Architecture/HarmonyBotV71.HcogResearch.cs'
      - 'HarmonyBot-V71/tools/v74_r18_*'
      - 'HarmonyBot-V71/tools/evaluate_v74_r18_semantics.py'
      - 'HarmonyBot-V71/tools/test_v74_r18.py'
      - 'HarmonyBot-V71/tools/run_r18_semantic_window.sh'
      - 'HarmonyBot-V71/tools/run_backtest.sh'
      - '.github/workflows/harmonybot-v74-r18-semantic.yml'

concurrency:
  group: harmonybot-v74-ctrader-history-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  r18_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 scipy==