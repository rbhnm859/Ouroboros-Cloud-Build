name: Build Fibonacci Harmonic Gold Pro

on:
  workflow_dispatch:
  push:
    branches:
      - harmonic-gold-pro-v1
    paths:
      - 'FibonacciHarmonicGoldPro-v1/**'
      - '.github/workflows/build-fibonacci-harmonic-gold-pro.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p FibonacciHarmonicGoldPro-v1/src
          cat FibonacciHarmonicGoldPro-v1/bootstrap/source.part1.b64 \
              FibonacciHarmonicGoldPro-v1/bootstrap/source.part2.b64 \
              FibonacciHarmonicGoldPro-v1/bootstrap/source.part3.b64 \
            | tr -d '\r\n' | base64 -d | gzip -dc \
            > FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.cs
          test -s FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.cs
          grep -q 'class FibonacciHarmonicGoldPro' FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.cs
          wc -l FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.cs

      - name: Persist reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.cs
          if ! git diff --cached --quiet; then
            git commit -m 'add reconstructed Fibonacci Harmonic Gold Pro source [skip ci]'
            git push origin HEAD:harmonic-gold-pro-v1
          fi

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore cTrader package
        run: dotnet restore FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.csproj

      - name: Build Release and .algo
        run: |
          dotnet build FibonacciHarmonicGoldPro-v1/src/FibonacciHarmonicGoldPro.csproj \
            --configuration Release \
            --no-restore \
            -p:AlgoPublish=False \
            -p:IncludeSource=True

      - name: Locate .algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ALGO="$(find FibonacciHarmonicGoldPro-v1/src -type f -name '*.algo' | head -n 1 || true)"
          if [ -z "$ALGO" ]; then
            echo 'No .algo was generated.'
            find FibonacciHarmonicGoldPro-v1/src -maxdepth 7 -type f | sort
            exit 1
          fi
          cp "$ALGO" dist/FibonacciHarmonicGoldPro-v1.0.0.algo
          ls -lh dist/FibonacciHarmonicGoldPro-v1.0.0.algo

      - name: Upload Mobile Cloud artifact
        uses: actions/upload-artifact@v4
        with:
          name: FibonacciHarmonicGoldPro-v1.0.0-MobileCloud
          path: dist/FibonacciHarmonicGoldPro-v1.0.0.algo
          if-no-files-found: error
