name: HarmonyBot V68 Workflow Graph Smoke

on:
  push:
    branches:
      - harmonybot/v68-evidence-preserving-family-alpha-reconstruction
    paths:
      - 'HarmonyBot-V68/**'
      - '.github/workflows/harmonybot-v68-evidence-preserving-family-alpha-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-evidence-preserving-family-alpha-reconstruction
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Audit and build
        shell: bash
        run: |
          cd control
          python3 HarmonyBot-V68/tools/static_contract_audit.py HarmonyBot-V68/src/HarmonyBotV68.cs
          dotnet restore HarmonyBot-V68/HarmonyBotV68.csproj
          dotnet build HarmonyBot-V68/HarmonyBotV68.csproj -c Release --no-restore --nologo

  truth_matrix_smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [A_SUPPLY_CONTROL, B_TRUTH_ONLY]
        window: [Y2021, Y2022, Y2023, H2024H2, H2025H1, H2025H2]
    steps:
      - name: Matrix smoke
        shell: bash
        run: echo "${{ matrix.variant }} ${{ matrix.window }}"
