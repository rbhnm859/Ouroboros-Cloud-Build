name: HarmonyBot V68 Evidence-Preserving Build

on:
  push:
    branches:
      - harmonybot/v68-evidence-preserving-family-alpha-reconstruction
    paths:
      - 'HarmonyBot-V68/**'
      - '.github/workflows/harmonybot-v68-evidence-preserving-family-alpha-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-evidence-preserving-family-alpha-reconstruction
          path: control
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V68/tools/static_contract_audit.py HarmonyBot-V68/src/HarmonyBotV68.cs
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          dotnet restore HarmonyBot-V68/HarmonyBotV68.csproj
          dotnet build HarmonyBot-V68/HarmonyBotV68.csproj -c Release --no-restore --nologo
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          cd control
          mkdir -p HarmonyBot-V68/dist HarmonyBot-V68/final
          A=$(find HarmonyBot-V68/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V68/dist/HarmonyBot_V68_Evidence_Preserving_Family_Alpha_Reconstruction.algo
          sha256sum HarmonyBot-V68/src/HarmonyBotV68.cs "$A" > HarmonyBot-V68/final/SHA256SUMS
          echo "$GITHUB_SHA" > HarmonyBot-V68/final/SOURCE_COMMIT.txt
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: v68-build
          path: |
            control/HarmonyBot-V68/dist
            control/HarmonyBot-V68/final
            control/V68_STATIC_CONTRACT_AUDIT.json
          retention-days: 30
