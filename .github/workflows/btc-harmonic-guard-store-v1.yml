name: BTC Harmonic Guard Store v1 Hardening

on:
  workflow_dispatch:
  push:
    branches: [ btc-store-v1-hardening-monthly-growth ]
    paths:
      - 'FibonacciHarmonicSniperUltimate/store-v1/**'
      - '.github/workflows/btc-harmonic-guard-store-v1.yml'

permissions:
  contents: read

concurrency:
  group: btc-harmonic-guard-store-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Reconstruct Champion and build Store source
        run: |
          set -euo pipefail
          mkdir -p work/r26-src work/store-src work/build work/cache work/r26-3y work/store-3y work/r26-1y work/store-1y
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,hashlib
          root=Path('FibonacciHarmonicSniperUltimate/versions/v0.17.0-btc-round18-diagnostics')
          data=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in sorted(root.glob('source_payload.part*')))))
          expected='5f2b7f31c4b8f0d60f52c4c15869aa75df4ff07d7224af971784137716bc8b93'
          actual=hashlib.sha256(data).hexdigest()
          if actual != expected: raise SystemExit(f'Round18 anchor SHA mismatch: {actual}')
          Path('work/Round18.cs').write_bytes(data)
          PYCODE
          python3 FibonacciHarmonicSniperUltimate/versions/v0.20.0-btc-round21-selective-bypass/round21_transform.py work/Round18.cs work/Round21.cs
          python3 FibonacciHarmonicSniperUltimate/versions/v0.21.0-btc-round22-capital-efficiency/round22_transform.py work/Round21.cs work/Round22.cs
          cp work/Round22.cs work/r26-src/Round22.cs
          python3 FibonacciHarmonicSniperUltimate/versions/v0.23.0-btc-round26-core-refactor/round26_transform.py work/Round22.cs work/r26-src/BTC-Harmonic-Guard-Control.cs
          cp work/r26-src/*.cs work/store-src/
          python3 FibonacciHarmonicSniperUltimate/store-v1/store_v1_transform.py work/store-src/BTC-Harmonic-Guard-Control.cs work/store-src/BTC-Harmonic-Guard.cs
          rm -f work/store-src/BTC-Harmonic-Guard-Control.cs work/Round18.cs work/Round21.cs work/Round22.cs work/r26-src/Round22.cs

          cat > work/r26-src/Control.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><RootNamespace>cAlgo.Robots</RootNamespace><AlgoName>BTC-Harmonic-Control</AlgoName></PropertyGroup>
            <ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup>
          </Project>
          EOF
          cat > work/store-src/Store.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><RootNamespace>cAlgo.Robots</RootNamespace><AlgoName>BTC-Harmonic-Guard</AlgoName></PropertyGroup>
            <ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup>
          </Project>
          EOF

      - name: Static Store hardening audit
        run: |
          set -euo pipefail
          MAIN=work/store-src/BTC-Harmonic-Guard.cs
          SAFE=work/store-src/Store.Safety.cs
          grep -q 'BTC-Harmonic-Guard-Store-v1.0' "$MAIN"
          grep -q 'DefaultValue = Round5DecisionMode.ObserveOnly' "$MAIN"
          grep -q 'R21 Bypass Min Score", DefaultValue = 93.0' "$MAIN"
          grep -q 'R21 Bypass Risk % Equity", DefaultValue = 0.10' "$MAIN"
          grep -q 'Max Open Positions", DefaultValue = 1, MinValue = 1, MaxValue = 1' "$MAIN"
          grep -q 'Debug Logging", DefaultValue = false' "$MAIN"
          grep -q 'LocalStorage.SetString' "$SAFE"
          grep -q 'History.FindAll' "$SAFE"
          grep -q 'RiskPercentEquity only' "$SAFE"
          grep -q 'StoreEmergencyClose' "$SAFE"
          grep -q 'StoreDailyLossReached' "$MAIN"
          echo 'Store hardening static audit passed.'

      - name: Build Control and Store algos
        run: |
          set -euo pipefail
          dotnet restore work/r26-src/Control.csproj
          dotnet build work/r26-src/Control.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True
          cp "$(find work/r26-src/bin/Release -type f -name '*.algo' | head -n1)" work/build/BTC-Harmonic-Control.algo
          dotnet restore work/store-src/Store.csproj
          dotnet build work/store-src/Store.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True
          cp "$(find work/store-src/bin/Release -type f -name '*.algo' | head -n1)" work/build/BTC-Harmonic-Guard-Store-v1.algo
          test $(stat -c%s work/build/BTC-Harmonic-Guard-Store-v1.algo) -gt 50000
          sha256sum work/build/*.algo > work/build/SHA256SUMS.txt

      - name: Prepare cTrader
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}"; test -n "${CTRADER_ACCOUNT:-}"; test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" | tr -d '\r\n' > work/ctrader.pwd
          chmod 600 work/ctrader.pwd

      - name: Pull cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Backtest exact-default parity
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          run_control() {
            out="$1"; start="$2"; end="$3"
            docker run --rm -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/build/BTC-Harmonic-Control.algo \
              --environment-variables --exit-on-stop --symbol=BITCOIN --period=h1 --start="$start" --end="$end" --balance=10000 --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 \
              --RiskPercent=1.0 --Round17M30RiskPercent=0.50 --Round18CandidateDiagnostics=false --Round21SelectiveHealthBypass=true --Round21BypassMinScore=93 --Round21SameDirH1MaxAgeHours=2 --Round21BypassRiskPercent=0.10 --Round21ReserveH1AtHour=true \
              --Round22H1BuyRiskPercent=1.15 --Round22H1SellRiskPercent=0.80 --Round22M30BuyRiskPercent=0.40 --Round22M30SellRiskPercent=0.50 --MaxOpenPositions=1 --MaxTradesPerDay=6 --MaxDailyLossPercent=5 \
              --EnabledPatterns='Reciprocal ABCD' --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 --MaxPatternAgeBars=16 --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --UseCandleConfirmation=true --CooldownBars=2 \
              --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
              --Round8LogExcursions=false --Round9ShadowTpContinuation=false --Round10LogFunnel=false --Round15EnableM30Engine=true --Round16H1HealthGate=true --DebugLogging=false \
              --report="/work/$out/report.html" --report-json="/work/$out/report.json" > "work/$out/report.log" 2>&1
          }
          run_store() {
            out="$1"; start="$2"; end="$3"
            docker run --rm -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/build/BTC-Harmonic-Guard-Store-v1.algo \
              --environment-variables --exit-on-stop --symbol=BITCOIN --period=h1 --start="$start" --end="$end" --balance=10000 --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 \
              --report="/work/$out/report.html" --report-json="/work/$out/report.json" > "work/$out/report.log" 2>&1
          }
          run_control r26-3y '08/09/2023 00:00' '08/09/2026 00:00'
          run_store store-3y '08/09/2023 00:00' '08/09/2026 00:00'
          run_control r26-1y '08/09/2025 00:00' '08/09/2026 00:00'
          run_store store-1y '08/09/2025 00:00' '08/09/2026 00:00'

      - name: Enforce Store exact economic parity
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          def norm(r):
              return [{'direction':x['direction'],'entryTime':x['entryTime'],'closeTime':x['closeTime'],'entryPrice':round(float(x['entryPrice']),8),'closePrice':round(float(x['closePrice']),8),'volume':round(float(x['volume']),8),'net':round(float(x['net']),8),'pips':round(float(x['pips']),8),'comment':x.get('comment','')} for x in r['history']['items']]
          def m(r): return {'trades':int(r['tradeStatistics']['totalTrades']['all']),'roi':float(r['main']['roi']),'net':float(r['main']['netProfit']),'pf':float(r['tradeStatistics']['profitFactor']['all']),'dd_equity':float(r['equity']['maxEquityDrawdownPercent']),'dd_balance':float(r['balance']['maxBalanceDrawdownPercent'])}
          summary={'version':'BTC Harmonic Guard Store v1','periods':{},'store_hardening_passed':False}
          for label in ('3y','1y'):
              a=load(f'work/r26-{label}/report.json'); b=load(f'work/store-{label}/report.json')
              na,nb=norm(a),norm(b)
              summary['periods'][label]={'control':m(a),'store':m(b),'control_hash':hashlib.sha256(json.dumps(na,sort_keys=True).encode()).hexdigest(),'store_hash':hashlib.sha256(json.dumps(nb,sort_keys=True).encode()).hexdigest(),'exact_trade_parity':na==nb}
              if na!=nb:
                  Path('work/Store-v1-Summary.json').write_text(json.dumps(summary,indent=2)); raise SystemExit(f'Store parity failed {label}')
          summary['store_hardening_passed']=True
          Path('work/Store-v1-Summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f work/ctrader.pwd

      - name: Upload Store v1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Harmonic-Guard-Store-v1
          path: |
            work/build/*
            work/store-src/*.cs
            work/store-src/*.csproj
            work/r26-3y/report.*
            work/store-3y/report.*
            work/r26-1y/report.*
            work/store-1y/report.*
            work/Store-v1-Summary.json
          retention-days: 30
