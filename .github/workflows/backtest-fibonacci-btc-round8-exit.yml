name: Fibonacci BTC Round8 breakeven exit A-B

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/backtest-fibonacci-btc-round8-exit.yml'
      - 'tools/create_fibonacci_btc_round8_exit.py'
      - 'research/fibonacci-research1/btc_round8_exit_profiles.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round8-exit
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'
  FULL12_START: '08/09/2025 00:00'
  FULL12_END: '08/09/2026 00:00'
  FULL6_START: '08/03/2026 00:00'
  FULL6_END: '08/09/2026 00:00'
  PRE6_START: '08/03/2025 00:00'
  PRE6_END: '07/09/2025 23:59'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          MATRIX=$(python3 - <<'PY'
          import json
          p=json.load(open('research/fibonacci-research1/btc_round8_exit_profiles.json'))
          print(json.dumps({'include':p},separators=(',',':')))
          PY
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round4.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round5.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round6.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round7.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round8.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round8_exit.py --repo-root "$PWD" --force
      - name: Enable trading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.10.1-btc-round8-exit/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build Round8 exit candidate
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.10.1-btc-round8-exit/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.10.1-btc-round8-exit/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p artifact
          ALGO="$(find Fibonacci-v0.10.1-btc-round8-exit -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" artifact/FibonacciHarmonicSniperUltimate-BTC-Round8-Exit.algo
          cp Fibonacci-v0.10.1-btc-round8-exit/FibonacciHarmonicSniperUltimate.cs artifact/FibonacciHarmonicSniperUltimate-BTC-Round8-Exit.cs
          sha256sum artifact/FibonacciHarmonicSniperUltimate-BTC-Round8-Exit.algo > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round8-exit-build
          path: artifact
          retention-days: 30

  backtest:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round8-exit-build
          path: work
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p work/cache work/reports
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Backtest ${{ matrix.id }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          PROFILE: ${{ matrix.id }}
          BE: ${{ matrix.be }}
          TRIGGER: ${{ matrix.trigger }}
          BE_BUY: ${{ matrix.buy }}
          BE_SELL: ${{ matrix.sell }}
        run: |
          set -euo pipefail
          for SPEC in \
            'FULL12|0|65' \
            'FULL6|0|65' \
            'FULL6HARSH|1500|100' \
            'PRE6|0|65' \
            'PRE6HARSH|1500|100'; do
            IFS='|' read -r PHASE SPREAD COMM <<< "$SPEC"
            case "$PHASE" in
              FULL12) START="$FULL12_START"; END="$FULL12_END" ;;
              FULL6|FULL6HARSH) START="$FULL6_START"; END="$FULL6_END" ;;
              PRE6|PRE6HARSH) START="$PRE6_START"; END="$PRE6_END" ;;
            esac
            timeout --signal=TERM --kill-after=30s 30m docker run --rm \
              -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
              backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round8-Exit.algo --environment-variables --exit-on-stop \
              --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
              --data-mode=m1 --data-dir=/work/cache --commission="$COMM" --spread="$SPREAD" --RiskPercent=1.0 \
              --EnabledPatterns='Reciprocal ABCD' --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 \
              --MaxPatternAgeBars=16 --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --CooldownBars=2 \
              --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
              --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
              --Round8LogExcursions=true --Round8EnableBreakeven="$BE" --Round8BreakevenTriggerR="$TRIGGER" \
              --Round8BreakevenBuy="$BE_BUY" --Round8BreakevenSell="$BE_SELL" --DebugLogging=false \
              --report="/work/reports/${PROFILE}-${PHASE}.html" --report-json="/work/reports/${PROFILE}-${PHASE}.json" \
              > "work/reports/${PROFILE}-${PHASE}.log" 2>&1
          done
      - name: Clean credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-r8-${{ matrix.id }}
          path: work/reports/${{ matrix.id }}-*
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: btc-r8-*
          path: bundle/results
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round8-exit-build
          path: bundle/build
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round8-exit-results
          path: bundle
          if-no-files-found: warn
          retention-days: 30
