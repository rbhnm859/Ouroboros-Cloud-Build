name: Fibonacci XAUUSD 1 - v11 1Y Validation v17

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-round1]
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-1-v11-1y-validation-v17.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-xauusd-1-v11-1y-validation-v17
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct proven v11 baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          mkdir -p "$ROOT/src" package
          base64 -d "$ROOT/source.gz.b64" | gzip -dc > "$ROOT/src/FibonacciXAUUSD1.cs"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FibonacciHarmonicSniperUltimate/versions/xauusd_1/src/FibonacciXAUUSD1.cs')
          s=p.read_text()
          ema='''        [Parameter("EMA Period", DefaultValue = 50, MinValue = 10, MaxValue = 300, Group = "Quality")]\n        public int EmaPeriod { get; set; }\n'''
          assert s.count(ema)==1
          s=s.replace(ema, ema+'''\n        [Parameter("Require EMA Alignment", DefaultValue = true, Group = "Quality")]\n        public bool RequireEmaAlignment { get; set; }\n''',1)
          assert s.count('Print("VERSION xauusd_1 v1.1.0-gold-v7");')==1
          s=s.replace('Print("VERSION xauusd_1 v1.1.0-gold-v7");','Print("VERSION xauusd_1 v1.8.0-gold-v17-v11-1y-validation");',1)
          gate='''            if (UseM30Confirmation && m30Score < M30ConfirmRulesNeeded)\n            {\n                Reject("m30_confirm");\n                LogDecision(selected, "REJECT", "m30_confirm");\n                return;\n            }\n'''
          assert s.count(gate)==1
          s=s.replace(gate,gate+'''\n            if (selected.Definition.Name == "ABCD" && RequireEmaAlignment && selected.EmaContextScore < 99.5)\n            {\n                Reject("ema_alignment");\n                LogDecision(selected, "REJECT", "ema_alignment");\n                return;\n            }\n''',1)
          p.write_text(s)
          PY
          cp "$ROOT/src/FibonacciXAUUSD1.cs" package/FibonacciXAUUSD1.cs
          cp "$ROOT/README.md" package/README.md
      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Compile v17 validation candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD1.csproj && dotnet build $ROOT/FibonacciXAUUSD1.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"; test -n "$ALGO"
          cp "$ALGO" package/xauusd_1-v17-v11-1y.algo
          sha256sum package/xauusd_1-v17-v11-1y.algo | tee package/algo.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-v17-v11-1y-build
          path: package/
          retention-days: 30

  backtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: standard, spread: '17.42', commission: '35' }
          - { label: harsh, spread: '30', commission: '50' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_1-v17-v11-1y-build
          path: work
      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          chmod 600 work/ctrader.pwd
      - name: Run 1Y ${{ matrix.label }} validation
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/reports work/cache
          docker run --rm -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/xauusd_1-v17-v11-1y.algo --environment-variables --exit-on-stop \
            --symbol=XAUUSD --period=h1 --start='09/09/2025' --end='09/09/2026' --balance=10000 --data-mode=m1 --data-dir=/work/cache \
            --commission='${{ matrix.commission }}' --spread='${{ matrix.spread }}' \
            --RiskPercent=0.50 --MaxDailyLossPercent=3.0 --PivotLeft=3 --PivotRight=3 \
            --EnableStandaloneABCD=true --RequireEmaAlignment=true --MinQualityScore=75 --M30ConfirmRulesNeeded=2 --MinimumRiskReward=1.5 --TargetAdFib=0.786 \
            --report='/work/reports/${{ matrix.label }}.html' --report-json='/work/reports/${{ matrix.label }}.json' 2>&1 | tee 'work/reports/${{ matrix.label }}.log'
          grep -E '\[(OPEN|CLOSE)\]' 'work/reports/${{ matrix.label }}.log' > 'work/reports/${{ matrix.label }}-trades.txt' || true
          test -s 'work/reports/${{ matrix.label }}.json'
      - if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_1-v17-v11-1y-${{ matrix.label }}
          path: work/reports/
          retention-days: 30

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_1-v17-v11-1y-build
          path: package
      - uses: actions/download-artifact@v4
        with:
          pattern: xauusd_1-v17-v11-1y-*
          path: reports
          merge-multiple: true
      - name: Aggregate 1Y validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          def val(d,s,k):
              try:
                  x=d[s][k]; return float(x.get('all',0) if isinstance(x,dict) else x or 0)
              except: return 0.0
          def dd(d):
              peak=worst=0.0
              for p in d.get('equity',{}).get('points',[]):
                  peak=max(peak,float(p.get('maxEquity',p.get('balance',0)) or 0)); low=float(p.get('minEquity',p.get('balance',0)) or 0)
                  if peak>0: worst=max(worst,(peak-low)/peak*100)
              return worst
          out=['# xauusd_1 v11 1Y Validation v17','','Period: 2025-09-09 to 2026-09-09 UTC | XAUUSD H1 | M1 data | $10,000 | risk 0.5%','',
               'No strategy relaxation: PivotRight 3, EMA aligned, Quality 75, M30 2/3, RR >=1.5, TargetAdFib 0.786.','',
               '| Cost | Trades | Wins | Losses | WR % | Net $ | ROI % | PF | Max Eq DD % |','|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for label in ('standard','harsh'):
              d=json.loads(Path(f'reports/{label}.json').read_text()); t=int(val(d,'tradeStatistics','totalTrades')); w=int(val(d,'tradeStatistics','winningTrades')); l=int(val(d,'tradeStatistics','losingTrades')); net=float(d.get('main',{}).get('netProfit',0) or 0)
              hist=d.get('history',{}).get('items',[]); gp=sum(max(0.,float(x.get('net',0) or 0)) for x in hist); gl=sum(abs(min(0.,float(x.get('net',0) or 0))) for x in hist); pf=gp/gl if gl else (999. if gp else 0.)
              out.append(f'| {label} | {t} | {w} | {l} | {(100*w/t if t else 0):.2f} | {net:.2f} | {net/10000*100:.2f} | {pf:.2f} | {dd(d):.2f} |')
          out += ['', '3M reference (v11): Standard +0.95% / 1 trade; Harsh +0.94% / 1 trade.',
                  'Use this 1Y result as the next optimization baseline; do not promote v14/v15/v16 merely for higher trade count.']
          text='\n'.join(out)+'\n'; Path('package/V17_1Y_VALIDATION_SUMMARY.md').write_text(text); print(text)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
          cp -r reports package/reports
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-v17-v11-1y-complete
          path: package/
          retention-days: 30
