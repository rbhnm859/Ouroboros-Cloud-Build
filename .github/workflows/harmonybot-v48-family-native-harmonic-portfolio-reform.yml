name: HarmonyBot V48 Family-Native Harmonic Portfolio Reform

on:
  push:
    branches:
      - harmonybot/v48-family-native-harmonic-portfolio-reform
    paths:
      - 'HarmonyBot-V48/**'
      - '.github/workflows/harmonybot-v48-family-native-harmonic-portfolio-reform.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v48-family-native-harmonic-portfolio-reform
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v48-family-native-harmonic-portfolio-reform
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: control/HarmonyBot-V48/HarmonyBotV48.csproj
      - name: Static, geometry and build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V48/tools/static_audit.py HarmonyBot-V48/src/HarmonyBotV48.cs
          python3 HarmonyBot-V48/tools/geometry_contract_test.py HarmonyBot-V48/src/HarmonyBotV48.cs
          mkdir -p HarmonyBot-V48/final HarmonyBot-V48/dist
          cp V48_ARCHITECTURE_AUDIT.json V48_GEOMETRY_CONTRACT_TEST.json HarmonyBot-V48/final/
          dotnet restore HarmonyBot-V48/HarmonyBotV48.csproj
          dotnet build HarmonyBot-V48/HarmonyBotV48.csproj -c Release --no-restore --nologo 2>&1 | tee HarmonyBot-V48/final/V48_BUILD.log
          ! grep -Eq '(^|[^0-9])error (CS|MSB|NETSDK)[0-9]+' HarmonyBot-V48/final/V48_BUILD.log
          ALGO=$(find HarmonyBot-V48/bin/Release -type f -name '*.algo' | head -1)
          test -n "$ALGO" && test -s "$ALGO"
          cp "$ALGO" HarmonyBot-V48/dist/HarmonyBot_V48_Family_Native_Harmonic_Portfolio_Reform_RC.algo
          sha256sum HarmonyBot-V48/src/HarmonyBotV48.cs "$ALGO" > HarmonyBot-V48/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V48/final/SOURCE_COMMIT.txt
      - name: Full family architecture smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V48/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V48/smoke-work"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V48/final"
          mkdir -p "$W/seal/algo"
          cp control/HarmonyBot-V48/dist/HarmonyBot_V48_Family_Native_Harmonic_Portfolio_Reform_RC.algo "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME=V48-FULL_V48_FAMILY_PORTFOLIO-SMOKE-B10000 START_DATE=04/01/2021 EVAL_DATE=2021-01-06T00:00:00Z END_DATE=15/01/2021 BALANCE=10000             PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false             FAMILYSTRUCT=true FAMILYGRID=true FAMILYROUTE=true FAMILYNATIVE=true FAMILYBARS=6 FAMILYSHADOW=true             BACKTEST_TIMEOUT_SECONDS=300 "$GITHUB_WORKSPACE/control/HarmonyBot-V48/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V48/tools/audit_report.py             --report "$W/seal/reports/V48-FULL_V48_FAMILY_PORTFOLIO-SMOKE-B10000.json"             --log "$W/seal/logs/V48-FULL_V48_FAMILY_PORTFOLIO-SMOKE-B10000.log"             --out "$O/V48_SMOKE.json" --window SMOKE --family FULL_V48_FAMILY_PORTFOLIO --years .03 --balance 10000
          python3 - "$O/V48_SMOKE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["summary_present"] and x["broker_profile_present"]
          assert x["execution_errors"]==0 and x["actual_basket_risk_violations"]==0
          assert x["margin_risk_violations"]==0 and x["unprotected_survivors"]==0
          print("[V48-SMOKE] PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v48-build-smoke
          path: |
            control/HarmonyBot-V48/dist
            control/HarmonyBot-V48/final
          retention-days: 30

  dev:
    needs: build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {family: V46_SCALE_CONTROL, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: V46_SCALE_CONTROL, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: V46_SCALE_CONTROL, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: STRUCTURAL_GEOMETRY_REPAIR, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: STRUCTURAL_GEOMETRY_REPAIR, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: STRUCTURAL_GEOMETRY_REPAIR, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: FAMILY_NATIVE_EXECUTION, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: FAMILY_NATIVE_EXECUTION, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: FAMILY_NATIVE_EXECUTION, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: FULL_V48_FAMILY_PORTFOLIO, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: FULL_V48_FAMILY_PORTFOLIO, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: FULL_V48_FAMILY_PORTFOLIO, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v48-family-native-harmonic-portfolio-reform
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v48-build-smoke
          path: control/HarmonyBot-V48/shared
      - name: Prepare immutable V48 algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V48/dist
          A=$(find control/HarmonyBot-V48/shared -type f -name 'HarmonyBot_V48_Family_Native_Harmonic_Portfolio_Reform_RC.algo' | head -1)
          test -n "$A"; cp "$A" control/HarmonyBot-V48/dist/
      - name: Restore persistent XAUUSD M1 cache
        uses: actions/cache@v4
        with:
          path: control/HarmonyBot-V48/window-${{ matrix.family }}-${{ matrix.window }}/seal/data
          key: ctrader-xauusd-m1-${{ matrix.window }}-${{ matrix.start }}-${{ matrix.end }}-v48
      - name: Run immutable V48 DEV window
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V48/tools/*.sh
          control/HarmonyBot-V48/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ matrix.start }}" "${{ matrix.eval }}" "${{ matrix.end }}"
      - name: Upload DEV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V48/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v48-family-native-harmonic-portfolio-reform
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v48-dev-*
          path: control/HarmonyBot-V48/merged
          merge-multiple: true
      - name: Family reform performance and commercial gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V48/final
          python3 control/HarmonyBot-V48/tools/analyze_parallel_dev.py control/HarmonyBot-V48/merged control/HarmonyBot-V48/final
          echo "candidate=$(cat control/HarmonyBot-V48/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V48-FAMILY-REFORM-FRONTIER
          path: control/HarmonyBot-V48/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v48-family-native-harmonic-portfolio-reform
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v48-build-smoke
          path: control/HarmonyBot-V48/shared
      - name: Run capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            STRUCTURAL_GEOMETRY_REPAIR) FS=true; FG=true; FR=false; FN=false;;
            FAMILY_NATIVE_EXECUTION) FS=true; FG=true; FR=false; FN=true;;
            FULL_V48_FAMILY_PORTFOLIO) FS=true; FG=true; FR=true; FN=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V48/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V48/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V48/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V48/shared -type f -name 'HarmonyBot_V48_Family_Native_Harmonic_Portfolio_Reform_RC.algo' | head -1)
          cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V48-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE"             PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false FAMILYSTRUCT="$FS" FAMILYGRID="$FG" FAMILYROUTE="$FR" FAMILYNATIVE="$FN" FAMILYBARS=6 FAMILYSHADOW=true             BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V48/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V48/tools/audit_report.py --report "$W/seal/reports/V48-$CANDIDATE-CAPITAL-$BALANCE.json"             --log "$W/seal/logs/V48-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json"             --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v48-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V48/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v48-capital-*
          path: capital
          merge-multiple: true
      - name: Executable capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x):
            return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V48_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V48","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"actual_100_frequency":rows["100"]["frequency"]},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v48-capital-gate
          path: V48_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze,capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v48-family-native-harmonic-portfolio-reform
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v48-build-smoke
          path: shared
      - name: Freeze immutable candidate
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V48/src/HarmonyBotV48.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V48_Family_Native_Harmonic_Portfolio_Reform_RC.algo"))
          pathlib.Path("V48_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V48","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v48-freeze-manifest
          path: V48_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v48-family-native-harmonic-portfolio-reform
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v48-build-smoke
          path: control/HarmonyBot-V48/shared
      - name: Exactly one untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            STRUCTURAL_GEOMETRY_REPAIR) FS=true; FG=true; FR=false; FN=false;;
            FAMILY_NATIVE_EXECUTION) FS=true; FG=true; FR=false; FN=true;;
            FULL_V48_FAMILY_PORTFOLIO) FS=true; FG=true; FR=true; FN=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V48/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V48/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V48/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V48/shared -type f -name 'HarmonyBot_V48_Family_Native_Harmonic_Portfolio_Reform_RC.algo' | head -1)
          cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V48-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE"             PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false FAMILYSTRUCT="$FS" FAMILYGRID="$FG" FAMILYROUTE="$FR" FAMILYNATIVE="$FN" FAMILYBARS=6 FAMILYSHADOW=true             BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V48/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V48/tools/audit_report.py --report "$W/seal/reports/V48-$CANDIDATE-FRESH-$KIND.json"             --log "$W/seal/logs/V48-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json"             --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v48-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V48/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze,fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v48-fresh-*
          path: fresh
          merge-multiple: true
      - name: Final commercial decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh")
          a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          alpha=(a["engineering_clean"] and a["baskets"]>0 and a["net"]>0 and a["expectancy"]>0 and a["pf"]>1 and a["max_dd_pct"]<=10)
          small=(m["engineering_clean"] and m["baskets"]>0 and m["net"]>0 and m["expectancy"]>0 and m["pf"]>1 and m["max_dd_pct"]<=10)
          ok=alpha and small
          pathlib.Path("V48_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V48","fresh_alpha":a,"fresh_100":m,"fresh_validation_pass":ok},indent=2))
          pathlib.Path("V48_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V48","decision":"COMMERCIAL_FREEZE_CANDIDATE_PASS" if ok else "HOLD_WITH_EVIDENCE","fresh_used":True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v48-final-decision
          path: |
            V48_FRESH_VALIDATION.json
            V48_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
