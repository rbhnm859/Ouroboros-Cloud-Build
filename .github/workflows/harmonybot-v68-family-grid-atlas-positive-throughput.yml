name: HarmonyBot V68 Harmonic Family Grid Atlas Positive Throughput

on:
  push:
    branches: [harmonybot/v68-harmonic-family-grid-atlas-positive-throughput-rebase]
    paths:
      - 'HarmonyBot-V68/**'
      - '.github/workflows/harmonybot-v68-family-grid-atlas-positive-throughput.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v68-family-grid-atlas-positive-throughput
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-harmonic-family-grid-atlas-positive-throughput-rebase
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static contracts and build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V68/tools/static_contract_audit.py HarmonyBot-V68/src/HarmonyBotV68.cs
          dotnet restore HarmonyBot-V68/HarmonyBotV68.csproj
          dotnet build HarmonyBot-V68/HarmonyBotV68.csproj -c Release --no-restore --nologo
          dotnet restore HarmonyBot-V52/HarmonyBotV52.csproj
          dotnet build HarmonyBot-V52/HarmonyBotV52.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V68/dist HarmonyBot-V68/final HarmonyBot-V52/dist
          A=$(find HarmonyBot-V68/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          B=$(find HarmonyBot-V52/bin/Release -type f -name '*.algo' | head -1); test -s "$B"
          cp "$A" HarmonyBot-V68/dist/HarmonyBot_V68_Harmonic_Family_Grid_Atlas_Positive_Throughput_Rebase.algo
          cp "$B" HarmonyBot-V52/dist/HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo
          sha256sum HarmonyBot-V68/src/HarmonyBotV68.cs "$A" HarmonyBot-V52/src/HarmonyBotV52.cs "$B" > HarmonyBot-V68/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V68/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v68-build
          path: |
            control/HarmonyBot-V68/dist
            control/HarmonyBot-V68/final
            control/HarmonyBot-V52/dist
          retention-days: 30

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-harmonic-family-grid-atlas-positive-throughput-rebase
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - uses: actions/download-artifact@v4
        with:
          name: v52-build
          path: control/HarmonyBot-V52/formal
          run-id: 35531304357
          github-token: ${{ github.token }}
      - name: Prepare immutable control algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V52/dist
          A=$(find control/HarmonyBot-V52/formal -type f -name 'HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo' | head -1)
          test -s "$A"
          test "$(sha256sum "$A" | awk '{print $1}')" = "b862716f7477f947a390fe394c113d77f0bf2ce518956a419b082b00cd8251e1"
          cp "$A" control/HarmonyBot-V52/dist/
      - name: Resolve V52 parent window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Reproduce immutable V52 twice for dataset stability
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V68/tools/*.sh
          WIN="${{ matrix.window }}"
          control/HarmonyBot-V68/tools/run_control_window.sh "$WIN" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .5
          mkdir -p "control/HarmonyBot-V68/repro-stability-$WIN"
          cp "control/HarmonyBot-V68/output-A_V52_EXACT_CONTROL-$WIN/A_V52_EXACT_CONTROL-$WIN.json" "control/HarmonyBot-V68/repro-stability-$WIN/R1.json"
          control/HarmonyBot-V68/tools/run_control_window.sh "$WIN" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .5
          cp "control/HarmonyBot-V68/output-A_V52_EXACT_CONTROL-$WIN/A_V52_EXACT_CONTROL-$WIN.json" "control/HarmonyBot-V68/repro-stability-$WIN/R2.json"
          python3 - "$WIN" <<'PY'
          import hashlib,json,pathlib,sys
          w=sys.argv[1]; p=pathlib.Path(f"control/HarmonyBot-V68/repro-stability-{w}")
          def fp(path):
              d=json.load(open(path)); rows=d.get("basket_outcomes",[])
              payload=json.dumps(sorted((json.dumps(r,sort_keys=True,separators=(",",":")) for r in rows)),separators=(",",":"))
              return hashlib.sha256(payload.encode()).hexdigest()
          a,b=fp(p/"R1.json"),fp(p/"R2.json")
          out={"window":w,"replicate_1_sha256":a,"replicate_2_sha256":b,"stable":a==b}
          (p/"DATASET_STABILITY.json").write_text(json.dumps(out,indent=2))
          if a!=b: raise SystemExit("DATASET_NONDETERMINISTIC_"+w)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v68-repro-${{ matrix.window }}
          path: |
            control/HarmonyBot-V68/output-A_V52_EXACT_CONTROL-${{ matrix.window }}
            control/HarmonyBot-V68/repro-stability-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  repro_gate:
    needs: reproduce
    runs-on: ubuntu-24.04
    outputs:
      reprook: ${{ steps.g.outputs.reprook }}
      controlok: ${{ steps.g.outputs.controlok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v68-repro-*'
          path: repro
          merge-multiple: true
      - name: Deterministic immutable V52 control gate
        id: g
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("repro"); rows=[]; ws=[]; stable=True; fps={}
          for w in "ABC":
              x=json.load(open(next(p.rglob(f"A_V52_EXACT_CONTROL-{w}.json")))); ws.append(x); rows+=x["basket_outcomes"]
              s=json.load(open(next(p.rglob(f"repro-stability-{w}/DATASET_STABILITY.json"))))
              stable=stable and bool(s["stable"]); fps[w]=s
          vals=[r["net"] for r in rows]; gp=sum(x for x in vals if x>0); gl=-sum(x for x in vals if x<0)
          z={"baskets":len(rows),"net":sum(vals),"pf":gp/gl if gl else 999,"expectancy":sum(vals)/len(vals) if vals else 0,
             "win_rate":sum(x>0 for x in vals)/len(vals) if vals else 0,"max_dd_pct":max(x["max_dd_pct"] for x in ws),
             "all_windows_positive":all(x["net"]>0 for x in ws),"engineering_clean":all(x["engineering_clean"] for x in ws),
             "dataset_stable":stable}
          historical={"baskets":200,"net":2902.27,"pf":1.3754845136750589,"expectancy":14.51135,"win_rate":.435,"max_dd_pct":9.814998648020353}
          exact=z["baskets"]==historical["baskets"] and abs(z["net"]-historical["net"])<=.25 and abs(z["pf"]-historical["pf"])<=.004 and abs(z["expectancy"]-historical["expectancy"])<=.05 and abs(z["win_rate"]-historical["win_rate"])<=.002 and abs(z["max_dd_pct"]-historical["max_dd_pct"])<=.12 and z["all_windows_positive"] and z["engineering_clean"] and stable
          # Control usability means deterministic same-run causal comparability; commercial positivity
          # remains a B/C/D candidate requirement and is never weakened here.
          control_ok=z["baskets"]>0 and z["engineering_clean"] and stable
          result={"version":"HarmonyBot V68","historical_v52_reference":historical,"current_formal_v52_control":z,
                  "dataset_fingerprints":fps,
                  "formal_v52_run_id":35531304357,"formal_v52_algo_sha256":"b862716f7477f947a390fe394c113d77f0bf2ce518956a419b082b00cd8251e1",
                  "historical_exact_reproduction_pass":exact,"data_drift_detected":not exact,
                  "dataset_stability_pass":stable,
                  "current_control_usable_for_same-run_causal_comparison":control_ok,
                  "rule":"HISTORICAL_REFERENCE_IMMUTABLE;CONTROL_USABILITY_REQUIRES_DETERMINISM_NOT_PROFITABILITY;COMMERCIAL_GATES_UNCHANGED"}
          pathlib.Path("V68_V52_EXACT_REPRODUCTION.json").write_text(json.dumps(result,indent=2))
          pathlib.Path("repro.out").write_text("true" if exact else "false")
          pathlib.Path("control.out").write_text("true" if control_ok else "false")
          PY
          echo "reprook=$(cat repro.out)" >> "$GITHUB_OUTPUT"
          echo "controlok=$(cat control.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v68-v52-exact-reproduction
          path: V68_V52_EXACT_REPRODUCTION.json
          retention-days: 30

  calibration:
    needs: repro_gate
    if: needs.repro_gate.outputs.controlok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-harmonic-family-grid-atlas-positive-throughput-rebase
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - uses: actions/download-artifact@v4
        with:
          name: v52-build
          path: control/HarmonyBot-V52/formal
          run-id: 35531304357
          github-token: ${{ github.token }}
      - name: Prepare immutable calibration algos
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V68/dist control/HarmonyBot-V52/dist
          A=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V68_Harmonic_Family_Grid_Atlas_Positive_Throughput_Rebase.algo' | head -1)
          B=$(find control/HarmonyBot-V52/formal -type f -name 'HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo' | head -1)
          test -s "$A"; test -s "$B"
          test "$(sha256sum "$B" | awk '{print $1}')" = "b862716f7477f947a390fe394c113d77f0bf2ce518956a419b082b00cd8251e1"
          cp "$A" control/HarmonyBot-V68/dist/
          cp "$B" control/HarmonyBot-V52/dist/
      - name: Resolve burned calibration window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run same-run causal suite A-B-C-D-A sentinel
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V68/tools/*.sh
          WIN="${{ matrix.window }}"; START="${{ steps.d.outputs.start }}"; EVAL="${{ steps.d.outputs.eval }}"; END="${{ steps.d.outputs.end }}"
          SENT="control/HarmonyBot-V68/dataset-sentinel-$WIN"; mkdir -p "$SENT"
          control/HarmonyBot-V68/tools/run_control_window.sh "$WIN" "$START" "$EVAL" "$END" 1.0
          cp "control/HarmonyBot-V68/output-A_V52_EXACT_CONTROL-$WIN/A_V52_EXACT_CONTROL-$WIN.json" "$SENT/A_PRE.json"
          for VAR in B_FAMILY_GRID_ATLAS C_POSITIVE_THROUGHPUT D_FAMILY_PORTFOLIO_MAX; do
            control/HarmonyBot-V68/tools/run_window.sh "$VAR" "$WIN" "$START" "$EVAL" "$END" 1.0
          done
          control/HarmonyBot-V68/tools/run_control_window.sh "$WIN" "$START" "$EVAL" "$END" 1.0
          cp "control/HarmonyBot-V68/output-A_V52_EXACT_CONTROL-$WIN/A_V52_EXACT_CONTROL-$WIN.json" "$SENT/A_POST.json"
          python3 - "$WIN" <<'PY'
          import hashlib,json,pathlib,sys
          w=sys.argv[1]; p=pathlib.Path(f"control/HarmonyBot-V68/dataset-sentinel-{w}")
          def fp(path):
              d=json.load(open(path)); rows=d.get("basket_outcomes",[])
              payload=json.dumps(sorted((json.dumps(r,sort_keys=True,separators=(",",":")) for r in rows)),separators=(",",":"))
              return hashlib.sha256(payload.encode()).hexdigest()
          a,b=fp(p/"A_PRE.json"),fp(p/"A_POST.json")
          result={"window":w,"pre_sha256":a,"post_sha256":b,"stable":a==b}
          (p/"DATASET_SENTINEL.json").write_text(json.dumps(result,indent=2))
          if a!=b: raise SystemExit("CALIBRATION_DATASET_DRIFT_"+w)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v68-cal-${{ matrix.window }}
          path: |
            control/HarmonyBot-V68/output-A_V52_EXACT_CONTROL-${{ matrix.window }}
            control/HarmonyBot-V68/output-B_FAMILY_GRID_ATLAS-${{ matrix.window }}
            control/HarmonyBot-V68/output-C_POSITIVE_THROUGHPUT-${{ matrix.window }}
            control/HarmonyBot-V68/output-D_FAMILY_PORTFOLIO_MAX-${{ matrix.window }}
            control/HarmonyBot-V68/dataset-sentinel-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze_calibration:
    needs: calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.g.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-harmonic-family-grid-atlas-positive-throughput-rebase
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v68-cal-*'
          path: control/HarmonyBot-V68/merged
          merge-multiple: true
      - name: Family positive-throughput gate
        id: g
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V68/final
          python3 control/HarmonyBot-V68/tools/analyze_calibration.py control/HarmonyBot-V68/merged control/HarmonyBot-V68/final
          echo "candidate=$(cat control/HarmonyBot-V68/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V68-CALIBRATION-FRONTIER
          path: control/HarmonyBot-V68/final
          retention-days: 30
