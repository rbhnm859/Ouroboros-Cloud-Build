name: Fibonacci XAUUSD 1 - Frequency Round A

on:
  workflow_dispatch:
  push:
    branches:
      - fibonacci-xauusd-round1
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-1-frequency-a.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-xauusd-1-frequency-a
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: control
            quality: '84'
            m30: '2'
            age: '12'
            ratio: '5'
            pivot: '3'
          - profile: q82
            quality: '82'
            m30: '2'
            age: '12'
            ratio: '5'
            pivot: '3'
          - profile: m30_1
            quality: '84'
            m30: '1'
            age: '12'
            ratio: '5'
            pivot: '3'
          - profile: age18
            quality: '84'
            m30: '2'
            age: '18'
            ratio: '5'
            pivot: '3'
          - profile: q82_m30_1_age18
            quality: '82'
            m30: '1'
            age: '18'
            ratio: '5'
            pivot: '3'
          - profile: q80_m30_1_age18
            quality: '80'
            m30: '1'
            age: '18'
            ratio: '5'
            pivot: '3'
          - profile: pivot2_q82_m30_1_age18
            quality: '82'
            m30: '1'
            age: '18'
            ratio: '5'
            pivot: '2'

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and build
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          mkdir -p "$ROOT/src" sweep/cache sweep/reports sweep/package
          base64 -d "$ROOT/source.gz.b64" | gzip -dc > "$ROOT/src/FibonacciXAUUSD1.cs"
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo \
            ghcr.io/spotware/ctrader-console:5.9.11 -c \
            "dotnet restore $ROOT/FibonacciXAUUSD1.csproj && dotnet build $ROOT/FibonacciXAUUSD1.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" sweep/xauusd_1.algo
          sha256sum "$ALGO" > sweep/package/algo.sha256
          sha256sum "$ROOT/src/FibonacciXAUUSD1.cs" > sweep/package/source.sha256

      - name: Prepare credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > sweep/ctrader.pwd
          chmod 600 sweep/ctrader.pwd

      - name: M1 backtest - ${{ matrix.profile }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          PROFILE: ${{ matrix.profile }}
          QUALITY: ${{ matrix.quality }}
          M30: ${{ matrix.m30 }}
          AGE: ${{ matrix.age }}
          RATIO: ${{ matrix.ratio }}
          PIVOT: ${{ matrix.pivot }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/sweep:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/xauusd_1.algo --environment-variables --exit-on-stop \
            --symbol=XAUUSD --period=h1 \
            --start='09/06/2026' --end='09/09/2026' \
            --balance=10000 --data-mode=m1 --data-dir=/work/cache \
            --commission=35 --spread=17.42 \
            --RiskPercent=0.50 --MaxDailyLossPercent=3.0 --DebugLogging=false \
            --MinQualityScore="$QUALITY" --M30ConfirmRulesNeeded="$M30" \
            --MaxPatternAgeBars="$AGE" --RatioTolerancePercent="$RATIO" \
            --PivotLeft="$PIVOT" --PivotRight="$PIVOT" \
            --report="/work/reports/${PROFILE}.html" \
            --report-json="/work/reports/${PROFILE}.json"
          test -s "sweep/reports/${PROFILE}.json"

      - name: Extract metrics
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(f"sweep/reports/{os.environ['PROFILE']}.json")
          d=json.loads(p.read_text())
          ts=d['tradeStatistics']; eq=d['equity']; m=d['main']
          av=lambda x: x.get('all') if isinstance(x,dict) else x
          trades=av(ts['totalTrades']); wins=av(ts['winningTrades']); losses=av(ts['losingTrades'])
          net=av(ts['netProfit']); pf=av(ts['profitFactor']); roi=m['roi']
          dd=eq['maxEquityDrawdownPercent']; end=m['endingBalance']
          wr=(100.0*wins/trades) if trades else 0.0
          text=(f"profile={os.environ['PROFILE']}\ntrades={trades}\nwins={wins}\nlosses={losses}\n"
                f"wr={wr:.2f}\nnet={net}\nroi={roi}\npf={pf}\nmax_eq_dd_pct={dd}\nending_balance={end}\n")
          Path(f"sweep/reports/{os.environ['PROFILE']}.metrics.txt").write_text(text)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as h:
              h.write('```\n'+text+'```\n')
          PY

      - name: Package
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "sweep/package/${PROFILE}"
          cp sweep/reports/${PROFILE}.* "sweep/package/${PROFILE}/" 2>/dev/null || true
          rm -f sweep/ctrader.pwd

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-frequency-a-${{ matrix.profile }}
          path: sweep/package/
          retention-days: 30
