name: HarmonyBot V46 Restored Alpha Execution Conversion

on:
  push:
    branches:
      - harmonybot/v46-restored-alpha-execution-conversion
    paths:
      - 'HarmonyBot-V46/**'
      - '.github/workflows/harmonybot-v46-restored-alpha-execution-conversion.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v46-restored-alpha-execution-conversion
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v46-restored-alpha-execution-conversion
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: control/HarmonyBot-V46/HarmonyBotV46.csproj
      - name: Static, geometry and build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V46/tools/static_audit.py HarmonyBot-V46/src/HarmonyBotV46.cs
          python3 HarmonyBot-V46/tools/geometry_contract_test.py HarmonyBot-V46/src/HarmonyBotV46.cs
          mkdir -p HarmonyBot-V46/final HarmonyBot-V46/dist
          cp V46_ARCHITECTURE_AUDIT.json V46_GEOMETRY_CONTRACT_TEST.json HarmonyBot-V46/final/
          dotnet restore HarmonyBot-V46/HarmonyBotV46.csproj
          dotnet build HarmonyBot-V46/HarmonyBotV46.csproj -c Release --no-restore --nologo 2>&1 | tee HarmonyBot-V46/final/V46_BUILD.log
          ! grep -Eq '(^|[^0-9])error (CS|MSB|NETSDK)[0-9]+' HarmonyBot-V46/final/V46_BUILD.log
          ALGO=$(find HarmonyBot-V46/bin/Release -type f -name '*.algo' | head -1)
          test -n "$ALGO" && test -s "$ALGO"
          cp "$ALGO" HarmonyBot-V46/dist/HarmonyBot_V46_Restored_Alpha_Execution_Conversion_RC.algo
          sha256sum HarmonyBot-V46/src/HarmonyBotV46.cs "$ALGO" > HarmonyBot-V46/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V46/final/SOURCE_COMMIT.txt
      - name: Ultra-short smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V46/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V46/smoke-work"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V46/final"
          mkdir -p "$W/seal/algo"
          cp control/HarmonyBot-V46/dist/HarmonyBot_V46_Restored_Alpha_Execution_Conversion_RC.algo "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME=V46-FULL_V46-SMOKE-B10000 START_DATE=04/01/2021 EVAL_DATE=2021-01-06T00:00:00Z END_DATE=15/01/2021 BALANCE=10000             SETUPID=true CANSTD=true PIVOTGRAPH=true TPROOF=true M1RESCUE=true RESCUEBARS=3 DIVERSITY=true             SCALEROUTE=true TEMPRESCUE=true ARMEDGRACE=true GRACEMIN=90 REVALIDATE=true ROUTEVETO=false             BACKTEST_TIMEOUT_SECONDS=300 "$GITHUB_WORKSPACE/control/HarmonyBot-V46/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V46/tools/audit_report.py             --report "$W/seal/reports/V46-FULL_V46-SMOKE-B10000.json" --log "$W/seal/logs/V46-FULL_V46-SMOKE-B10000.log"             --out "$O/V46_SMOKE.json" --window SMOKE --family FULL_V46 --years .03 --balance 10000
          python3 - "$O/V46_SMOKE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["summary_present"] and x["broker_profile_present"]
          assert x["execution_errors"]==0 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          print("[V46-SMOKE] PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v46-build-smoke
          path: |
            control/HarmonyBot-V46/dist
            control/HarmonyBot-V46/final
          retention-days: 30

  dev:
    needs: build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {family: V36_REPLAY, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: V36_REPLAY, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: V36_REPLAY, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: STABLE_CORE, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: STABLE_CORE, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: STABLE_CORE, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: SCALE_CONVERSION, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: SCALE_CONVERSION, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: SCALE_CONVERSION, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: FULL_V46, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: FULL_V46, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: FULL_V46, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v46-restored-alpha-execution-conversion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v46-build-smoke
          path: control/HarmonyBot-V46/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V46/dist
          A=$(find control/HarmonyBot-V46/shared -type f -name 'HarmonyBot_V46_Restored_Alpha_Execution_Conversion_RC.algo' | head -1)
          test -n "$A"; cp "$A" control/HarmonyBot-V46/dist/
      - name: Restore XAUUSD M1 cache
        uses: actions/cache@v4
        with:
          path: control/HarmonyBot-V46/window-${{ matrix.family }}-${{ matrix.window }}/seal/data
          key: ctrader-xauusd-m1-${{ matrix.window }}-${{ matrix.start }}-${{ matrix.end }}-v46
      - name: Run V46 DEV window
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V46/tools/*.sh
          control/HarmonyBot-V46/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ matrix.start }}" "${{ matrix.eval }}" "${{ matrix.end }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v46-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V46/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v46-restored-alpha-execution-conversion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v46-dev-*
          path: control/HarmonyBot-V46/merged
          merge-multiple: true
      - name: Clear historical breakthrough gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V46/final
          python3 control/HarmonyBot-V46/tools/analyze_parallel_dev.py control/HarmonyBot-V46/merged control/HarmonyBot-V46/final
          echo "candidate=$(cat control/HarmonyBot-V46/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V46-EXECUTION-CONVERSION-FRONTIER
          path: control/HarmonyBot-V46/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v46-restored-alpha-execution-conversion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v46-build-smoke
          path: control/HarmonyBot-V46/shared
      - name: Capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            SCALE_CONVERSION) PIV=true; R=false; SR=true; TR=false; AG=false; RV=false;;
            FULL_V46) PIV=true; R=true; SR=true; TR=true; AG=true; RV=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V46/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V46/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V46/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V46/shared -type f -name 'HarmonyBot_V46_Restored_Alpha_Execution_Conversion_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V46-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE"             SETUPID=true CANSTD=true PIVOTGRAPH="$PIV" TPROOF=true M1RESCUE="$R" RESCUEBARS=3 DIVERSITY=true SCALEROUTE="$SR"             TEMPRESCUE="$TR" ARMEDGRACE="$AG" GRACEMIN=90 REVALIDATE="$RV" ROUTEVETO=false BACKTEST_TIMEOUT_SECONDS=1800             "$GITHUB_WORKSPACE/control/HarmonyBot-V46/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V46/tools/audit_report.py --report "$W/seal/reports/V46-$CANDIDATE-CAPITAL-$BALANCE.json"             --log "$W/seal/logs/V46-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json"             --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v46-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V46/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v46-capital-*
          path: capital
          merge-multiple: true
      - name: Capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V46_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V46","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"])},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v46-capital-gate
          path: V46_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze,capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v46-restored-alpha-execution-conversion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v46-build-smoke
          path: shared
      - name: Freeze hashes
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V46/src/HarmonyBotV46.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V46_Restored_Alpha_Execution_Conversion_RC.algo"))
          pathlib.Path("V46_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V46","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v46-freeze-manifest
          path: V46_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v46-restored-alpha-execution-conversion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v46-build-smoke
          path: control/HarmonyBot-V46/shared
      - name: Exactly one untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            SCALE_CONVERSION) PIV=true; R=false; SR=true; TR=false; AG=false; RV=false;;
            FULL_V46) PIV=true; R=true; SR=true; TR=true; AG=true; RV=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V46/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V46/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V46/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V46/shared -type f -name 'HarmonyBot_V46_Restored_Alpha_Execution_Conversion_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V46-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE"             SETUPID=true CANSTD=true PIVOTGRAPH="$PIV" TPROOF=true M1RESCUE="$R" RESCUEBARS=3 DIVERSITY=true SCALEROUTE="$SR"             TEMPRESCUE="$TR" ARMEDGRACE="$AG" GRACEMIN=90 REVALIDATE="$RV" ROUTEVETO=false BACKTEST_TIMEOUT_SECONDS=1800             "$GITHUB_WORKSPACE/control/HarmonyBot-V46/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V46/tools/audit_report.py --report "$W/seal/reports/V46-$CANDIDATE-FRESH-$KIND.json"             --log "$W/seal/logs/V46-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json"             --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v46-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V46/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze,fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v46-fresh-*
          path: fresh
          merge-multiple: true
      - name: Commercial freeze decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          ok=(a["engineering_clean"] and a["baskets"]>0 and a["net"]>0 and a["expectancy"]>0 and a["pf"]>1 and a["max_dd_pct"]<=10 and
              m["engineering_clean"] and m["baskets"]>0 and m["net"]>0 and m["expectancy"]>0 and m["pf"]>1 and m["max_dd_pct"]<=10)
          pathlib.Path("V46_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V46","fresh_alpha":a,"fresh_100":m,"fresh_validation_pass":ok,"commercial_release_decision":"PASS_TO_COMMERCIAL_FREEZE_REVIEW" if ok else "HOLD"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v46-final-decision
          path: V46_FRESH_VALIDATION.json
          retention-days: 30
