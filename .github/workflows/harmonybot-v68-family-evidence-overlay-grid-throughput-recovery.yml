name: HarmonyBot V68 Family Evidence Overlay Grid Throughput Recovery

on:
  push:
    branches: [harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery]
    paths:
      - 'HarmonyBot-V68/**'
      - '.github/workflows/harmonybot-v68-family-evidence-overlay-grid-throughput-recovery.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static contracts and immutable build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V68/tools/static_contract_audit.py HarmonyBot-V68/src/HarmonyBotV68.cs
          dotnet restore HarmonyBot-V68/HarmonyBotV68.csproj
          dotnet build HarmonyBot-V68/HarmonyBotV68.csproj -c Release --no-restore --nologo
          dotnet restore HarmonyBot-V52/HarmonyBotV52.csproj
          dotnet build HarmonyBot-V52/HarmonyBotV52.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V68/dist HarmonyBot-V68/final
          A=$(find HarmonyBot-V68/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          V52A=$(find HarmonyBot-V52/bin/Release -type f -name '*.algo' | head -1); test -s "$V52A"
          cp "$A" HarmonyBot-V68/dist/HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo
          cp "$V52A" HarmonyBot-V68/dist/HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo
          sha256sum HarmonyBot-V68/src/HarmonyBotV68.cs "$A" HarmonyBot-V52/src/HarmonyBotV52.cs "$V52A" > HarmonyBot-V68/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V68/final/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          s=pathlib.Path("HarmonyBot-V68/src/HarmonyBotV68.cs")
          a=pathlib.Path("HarmonyBot-V68/dist/HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo")
          pathlib.Path("HarmonyBot-V68/final/V68_PREREGISTERED_FREEZE_MANIFEST.json").write_text(json.dumps({
            "version":"HarmonyBot V68","source_commit":os.environ["GITHUB_SHA"],
            "source_sha256":hashlib.sha256(s.read_bytes()).hexdigest(),
            "algo_sha256":hashlib.sha256(a.read_bytes()).hexdigest(),
            "variants":["A_V52_EXACT_CONTROL","B_FAMILY_EVIDENCE_OVERLAY","C_OVERLAY_FAMILY_GRID","D_OVERLAY_GRID_SCHEDULER"],
            "fresh_locked":True,"post_dev_alpha_tuning_allowed":False,"controlled_expansion_preregistered":False,"cli_alpha_source_write_allowed":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v68-build
          path: |
            control/HarmonyBot-V68/dist
            control/HarmonyBot-V68/final
          retention-days: 30

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        track: [V52_BASE, V68_A]
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - name: Prepare exact immutable algos
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V68/dist
          A=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo' | head -1)
          B=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo' | head -1)
          test -s "$A"; test -s "$B"
          cp "$A" "$B" control/HarmonyBot-V68/dist/
      - name: Resolve V52 reproduction window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Reproduce parent and exact-control binary
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V68/tools/*.sh
          control/HarmonyBot-V68/tools/run_reproduction_window.sh "${{ matrix.track }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v68-repro-${{ matrix.track }}-${{ matrix.window }}
          path: control/HarmonyBot-V68/repro-out-${{ matrix.track }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  repro_gate:
    needs: reproduce
    runs-on: ubuntu-24.04
    outputs:
      reprook: ${{ steps.g.outputs.reprook }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v68-repro-*'
          path: repro
          merge-multiple: true
      - name: Exact V52 control gate
        id: g
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,math,hashlib
          p=pathlib.Path("repro")
          detail={}; all_ok=True
          def row_sig(x):
              return [(str(r.get("direction","")),int(r.get("entry_time") or 0),int(r.get("close_time") or 0),round(float(r.get("net",0)),2),int(r.get("fragments",0))) for r in x.get("basket_outcomes",[])]
          for w in "ABC":
              b=json.load(open(next(p.rglob(f"V52_BASE-{w}.json"))))
              a=json.load(open(next(p.rglob(f"V68_A-{w}.json"))))
              checks={
                "broker_history_baskets":b["baskets"]==a["baskets"],
                "broker_history_fragments":b["report_history_fragments"]==a["report_history_fragments"],
                "net":abs(b["net"]-a["net"])<=.05,
                "pf":abs(b["pf"]-a["pf"])<=.0005,
                "expectancy":abs(b["expectancy"]-a["expectancy"])<=.01,
                "win_rate":abs(b["win_rate"]-a["win_rate"])<=.0001,
                "max_dd_pct":abs(b["max_dd_pct"]-a["max_dd_pct"])<=.0005,
                "pipeline":b.get("pattern_pipeline",{})==a.get("pattern_pipeline",{}),
                "pipeline_closed":b.get("pipeline_basket_closed")==a.get("pipeline_basket_closed"),
                "pipeline_executed":b.get("pipeline_executed")==a.get("pipeline_executed"),
                "sequence":row_sig(b)==row_sig(a),
                "net_reconciled":bool(b.get("net_reconciled")) and bool(a.get("net_reconciled")),
                "engineering_clean":bool(b.get("engineering_clean")) and bool(a.get("engineering_clean"))
              }
              ok=all(checks.values()); all_ok &= ok
              detail[w]={"pass":ok,"checks":checks,
                         "v52":{"baskets":b["baskets"],"fragments":b["report_history_fragments"],"net":b["net"],"pf":b["pf"],"expectancy":b["expectancy"],"win_rate":b["win_rate"],"max_dd_pct":b["max_dd_pct"],"pipeline_closed":b.get("pipeline_basket_closed")},
                         "v68a":{"baskets":a["baskets"],"fragments":a["report_history_fragments"],"net":a["net"],"pf":a["pf"],"expectancy":a["expectancy"],"win_rate":a["win_rate"],"max_dd_pct":a["max_dd_pct"],"pipeline_closed":a.get("pipeline_basket_closed")}}
          out={"version":"HarmonyBot V68","control":"V52_BASE_vs_V68_A","evidence_source":"CTRADER_REPORT_HISTORY","windows":detail,"pass":all_ok,
               "legacy_stdout_frontier_200_status":"SUPERSEDED_FOR_CONTROL_REPRODUCTION_DUE_TO_PROVEN_STDOUT_INCOMPLETENESS"}
          pathlib.Path("V68_V52_EXACT_REPRODUCTION.json").write_text(json.dumps(out,indent=2))
          pathlib.Path("repro.out").write_text("true" if all_ok else "false")
          print(json.dumps(out,indent=2))
          PY
          echo "reprook=$(cat repro.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v68-v52-exact-reproduction
          path: V68_V52_EXACT_REPRODUCTION.json
          retention-days: 30

  dev:
    needs: repro_gate
    if: needs.repro_gate.outputs.reprook == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [A_V52_EXACT_CONTROL, B_FAMILY_EVIDENCE_OVERLAY, C_OVERLAY_FAMILY_GRID, D_OVERLAY_GRID_SCHEDULER]
        window: [Y2021, Y2022, Y2023, H2024H2, H2025H1, H2025H2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V68/dist
          A=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V68/dist/
      - name: Resolve fixed DEV window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT"; echo "years=1.0" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT"; echo "years=1.0" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT"; echo "years=1.0" >> "$GITHUB_OUTPUT";;
            H2024H2) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT"; echo "years=.5" >> "$GITHUB_OUTPUT";;
            H2025H1) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT"; echo "years=.5" >> "$GITHUB_OUTPUT";;
            H2025H2) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT"; echo "years=.5" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run frozen DEV
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V68/tools/*.sh
          control/HarmonyBot-V68/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" "${{ steps.d.outputs.years }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v68-dev-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V68/output-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.g.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v68-dev-*'
          path: control/HarmonyBot-V68/merged
          merge-multiple: true
      - name: Causal attribution and commercial DEV gate
        id: g
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V68/final
          python3 control/HarmonyBot-V68/tools/analyze_v68.py control/HarmonyBot-V68/merged control/HarmonyBot-V68/final
          echo "candidate=$(cat control/HarmonyBot-V68/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V68-DEV-FRONTIER
          path: control/HarmonyBot-V68/final
          retention-days: 30

  validation:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        window: [Q2026Q1, Q2026Q2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - name: Prepare immutable candidate
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V68/dist
          A=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo' | head -1)
          cp "$A" control/HarmonyBot-V68/dist/
      - name: Resolve untouched validation window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            Q2026Q1) echo "start=02/01/2026" >> "$GITHUB_OUTPUT"; echo "eval=2026-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/03/2026" >> "$GITHUB_OUTPUT";;
            Q2026Q2) echo "start=01/04/2026" >> "$GITHUB_OUTPUT"; echo "eval=2026-04-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2026" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run Validation without tuning
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          chmod +x control/HarmonyBot-V68/tools/*.sh
          control/HarmonyBot-V68/tools/run_window.sh "$CANDIDATE" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .25
      - uses: actions/upload-artifact@v4
        with:
          name: v68-validation-${{ matrix.window }}
          path: control/HarmonyBot-V68/output-${{ needs.analyze.outputs.candidate }}-${{ matrix.window }}
          retention-days: 30

  validation_gate:
    needs: [analyze, validation]
    if: needs.validation.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      valok: ${{ steps.g.outputs.valok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v68-validation-*'
          path: validation
          merge-multiple: true
      - name: Hard validation gate
        id: g
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("validation"); c=os.environ["CANDIDATE"]; xs=[]
          for w in ["Q2026Q1","Q2026Q2"]: xs.append(json.load(open(next(p.rglob(f"{c}-{w}.json")))))
          rows=[r for x in xs for r in x["basket_outcomes"]]; v=[r["net"] for r in rows]
          gp=sum(x for x in v if x>0); gl=-sum(x for x in v if x<0); pf=gp/gl if gl else (999 if gp else 0)
          z={"candidate":c,"baskets":len(rows),"net":sum(v),"pf":pf,"expectancy":sum(v)/len(v) if v else 0,
             "win_rate":sum(x>0 for x in v)/len(v) if v else 0,"max_dd_pct":max(x["max_dd_pct"] for x in xs),
             "all_windows_positive":all(x["net"]>0 for x in xs),"engineering_clean":all(x["engineering_clean"] for x in xs),
             "risk_clean":all(x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 and x["stop_widening_violations"]==0 for x in xs)}
          ok=z["baskets"]>0 and z["net"]>0 and z["pf"]>=2.0 and z["expectancy"]>=20 and z["win_rate"]>=.50 and z["max_dd_pct"]<=6 and z["all_windows_positive"] and z["engineering_clean"] and z["risk_clean"]
          pathlib.Path("V68_VALIDATION_2026.json").write_text(json.dumps({"version":"HarmonyBot V68","fresh_used":False,"metrics":z,"pass":ok},indent=2))
          pathlib.Path("val.out").write_text("true" if ok else "false")
          PY
          echo "valok=$(cat val.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v68-validation-gate
          path: V68_VALIDATION_2026.json
          retention-days: 30

  capital:
    needs: [analyze, validation_gate]
    if: needs.validation_gate.outputs.valok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        balance: [100,150,200,300,500,1000,10000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - name: Capital compatibility after Validation
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V68/dist
          A=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo' | head -1); cp "$A" control/HarmonyBot-V68/dist/
          chmod +x control/HarmonyBot-V68/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V68/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V68/capital-out-$BALANCE"; mkdir -p "$W/seal/algo" "$O"
          cp control/HarmonyBot-V68/dist/HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo "$W/seal/algo/"
          case "$CANDIDATE" in
            A_V52_EXACT_CONTROL) FAMNATIVE=false; CONTRACTS=false; FRONTIER=false; FGRID=false; EVIDENCE=false; EXPAND=false; PQUEUE=false; HANDOFF=false; DECAY=false; REVALIDATE=false; MAXDD=10;;
            B_FAMILY_EVIDENCE_OVERLAY) FAMNATIVE=true; CONTRACTS=true; FRONTIER=false; FGRID=false; EVIDENCE=true; EXPAND=false; PQUEUE=false; HANDOFF=false; DECAY=false; REVALIDATE=false; MAXDD=6;;
            C_OVERLAY_FAMILY_GRID) FAMNATIVE=true; CONTRACTS=true; FRONTIER=false; FGRID=true; EVIDENCE=true; EXPAND=false; PQUEUE=false; HANDOFF=false; DECAY=false; REVALIDATE=false; MAXDD=6;;
            D_OVERLAY_GRID_SCHEDULER) FAMNATIVE=true; CONTRACTS=true; FRONTIER=false; FGRID=true; EVIDENCE=true; EXPAND=false; PQUEUE=true; HANDOFF=true; DECAY=true; REVALIDATE=true; MAXDD=6;;
            *) exit 31;;
          esac
          (
            cd "$W"
            RUN_NAME="V68-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=01/07/2024 EVAL_DATE=2024-07-08T00:00:00Z END_DATE=31/12/2025 BALANCE="$BALANCE" \
            FAMNATIVE="$FAMNATIVE" FAMOBS=true CANCONTRACT=true FAMCONF=true GRIDV2=true STOPV2=true JOINT=true CORRIDOR=false ANCHORFORENSICS=true IDENT=true BOUNDED=true SKIPS=2 FQUOTA=4 PRJPRZ=false DTRUTH=true \
            PQUEUE="$PQUEUE" HANDOFF="$HANDOFF" NATIVE=false DECAY="$DECAY" REVALIDATE="$REVALIDATE" V68CONTRACTS="$CONTRACTS" V68FRONTIER="$FRONTIER" V68FGRID="$FGRID" V68EVIDENCE="$EVIDENCE" V68EXPAND="$EXPAND" MAXDD="$MAXDD" \
            BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V68/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V68/tools/audit_report.py --report "$W/seal/reports/V68-$CANDIDATE-CAPITAL-$BALANCE.json" --log "$W/seal/logs/V68-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json" --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v68-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V68/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital_gate:
    needs: [analyze, capital]
    if: needs.capital.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.g.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v68-capital-*'
          path: capital
          merge-multiple: true
      - name: Fail-closed capital gate
        id: g
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital"); balances=[100,150,200,300,500,1000,10000]
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in balances}
          def safe(x): return x["baskets"]>0 and x["net"]>0 and x["engineering_clean"] and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 and x["stop_widening_violations"]==0 and x["max_dd_pct"]<=6
          ok=all(safe(x) for x in rows.values())
          pathlib.Path("V68_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V68","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":safe(rows["100"])},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v68-capital-gate
          path: V68_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  fresh:
    needs: [analyze, capital_gate]
    if: needs.capital_gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v68-v52-family-evidence-overlay-grid-throughput-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v68-build
          path: control/HarmonyBot-V68/shared
      - name: Untouched Fresh 2020H1
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          mkdir -p control/HarmonyBot-V68/dist
          A=$(find control/HarmonyBot-V68/shared -type f -name 'HarmonyBot_V68_Family_Evidence_Overlay_Grid_Throughput_Recovery.algo' | head -1); cp "$A" control/HarmonyBot-V68/dist/
          chmod +x control/HarmonyBot-V68/tools/*.sh
          control/HarmonyBot-V68/tools/run_window.sh "$CANDIDATE" FRESH2020H1 02/01/2020 2020-01-09T00:00:00Z 30/06/2020 .5
      - uses: actions/upload-artifact@v4
        with:
          name: v68-fresh-2020h1
          path: control/HarmonyBot-V68/output-${{ needs.analyze.outputs.candidate }}-FRESH2020H1
          retention-days: 30

  final_decision:
    needs: [analyze, fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v68-fresh-2020h1
          path: fresh
      - name: Final commercial freeze gate
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          x=json.load(open(next(pathlib.Path("fresh").rglob(f"{os.environ['CANDIDATE']}-FRESH2020H1.json"))))
          ok=x["baskets"]>0 and x["net"]>0 and x["pf"]>=2.0 and x["expectancy"]>=20 and x["win_rate"]>=.50 and x["max_dd_pct"]<=6 and x["engineering_clean"] and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 and x["stop_widening_violations"]==0
          d={"version":"HarmonyBot V68","candidate":os.environ["CANDIDATE"],"fresh_2020h1":x,"fresh_used":True,"decision":"COMMERCIAL_FREEZE_APPROVED" if ok else "HOLD_WITH_EVIDENCE"}
          pathlib.Path("V68_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps(d,indent=2))
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v68-final-commercial-decision
          path: V68_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
