name: Build Ouroboros Advanced Universal Mobile V2.2 SHORT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download pinned Ouroboros source
        run: |
          git clone https://github.com/floating-astronaut/ouroboros-cbot.git upstream
          cd upstream
          git checkout f5fed93990737c8bb511aaf85bf88ac6a854273b

      - name: Reuse proven Universal Mobile V2 source
        run: |
          curl -fsSL "https://raw.githubusercontent.com/rbhnm859/Ouroboros-Cloud-Build/main/.github/workflows/build-ouroboros-universal-mobile-v2.yml" -o /tmp/v2.yml
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, base64, gzip
          text = Path('/tmp/v2.yml').read_text()
          def get(name):
              m = re.search(name + r' = """([A-Za-z0-9+/=]+)"""', text)
              if not m:
                  raise SystemExit('Cannot find ' + name + ' in proven V2 workflow')
              return gzip.decompress(base64.b64decode(m.group(1)))
          main = get('main_payload')
          session = get('session_payload')
          Path('upstream/Ouroboros/Ouroboros.cs').write_bytes(main)
          Path('upstream/Ouroboros/Strategies/SessionAnalyst.cs').write_bytes(session)
          print('Loaded proven V2 main:', len(main), 'bytes')
          print('Loaded proven V2 SessionAnalyst:', len(session), 'bytes')
          PYCODE

