name: HarmonyBot V29.3 Performance Phase-3 Edge Attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v293-performance-phase3-edge-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccde79d22c0389ba64d9bb26a2e54379d81c91e
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build exact frozen V29.3
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          mkdir -p seal/{build,algo}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3-Grid-Risk-Cap-Hotfix-RC' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v293_phase3_edge</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit); test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v293_phase3_edge.algo
          sha256sum seal/build/HarmonyBotPro.cs seal/algo/*.algo > seal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: V293-PHASE3-BUILD
          path: seal
          retention-days: 30

  development:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V293-PHASE3-BUILD
          path: seal
      - name: Resolve FxPro development account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Exposed Development high-coverage backtest
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="p3-edge-${WINDOW_ID,,}-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest             /work/algo/HarmonyBotPro_v293_phase3_edge.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=10000 --data-mode=m1 --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD             --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=false --SmallAccountMinSLPips=25             --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2             --GridProfitFib=1.618 --GridStopFib=1.618             --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25             --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL_DATE"             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3             --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35             --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=false --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false             --MinAtrPrice=0.5             --report="/work/reports/PHASE3-${WINDOW_ID}.html" --report-json="/work/reports/PHASE3-${WINDOW_ID}.json" > "seal/logs/PHASE3-${WINDOW_ID}.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<6000;i+=4)); do
            if test -s "seal/reports/PHASE3-${WINDOW_ID}.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/PHASE3-${WINDOW_ID}.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 4
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          if test "$DONE" != 1; then echo '{"status":"DATA_UNAVAILABLE_OR_BACKTEST_FAILED"}' > "seal/audit/PHASE3-${WINDOW_ID}.json"; fi
      - name: Edge attribution audit
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,datetime,math
          w=os.environ['WINDOW_ID']; rp=pathlib.Path(f'seal/reports/PHASE3-{w}.json'); lp=pathlib.Path(f'seal/logs/PHASE3-{w}.log')
          ap=pathlib.Path(f'seal/audit/PHASE3-{w}.json')
          if not rp.exists():
              if not ap.exists(): ap.write_text(json.dumps({'window':w,'status':'DATA_UNAVAILABLE_OR_BACKTEST_FAILED'},indent=2))
              raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore') if lp.exists() else ''
          groups={}
          for x in h:
              key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'entryPrice':key[3],'closeTime':0,'net':0.0,'fragments':0})
              g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0)); g['fragments']+=1
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime'])
          children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
          pats=re.findall(r'\[GRID\]\s+Basket\s+#\d+\s+created\s+\|\s*([^|]+?)\s*\|',t,re.I)
          if len(pats)<len(mains):
              tp=re.findall(r'\[TRADE\]\s+(\S+)\s+(?:Buy|Sell)',t,re.I)
              if len(tp)>=len(mains): pats=tp
          baskets=[]
          for i,g in enumerate(mains):
              ts=g['entryTime']/1000 if g['entryTime']>10**11 else g['entryTime']
              dt=datetime.datetime.fromtimestamp(ts,datetime.timezone.utc) if ts>0 else None
              hr=dt.hour if dt else -1
              session='LONDON' if 8<=hr<13 else ('OVERLAP' if 13<=hr<16 else ('NEW_YORK' if 16<=hr<22 else 'OTHER'))
              baskets.append({'pattern':pats[i].strip() if i<len(pats) else 'Unknown','direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'session':session,'net':g['net'],'grid_children':0,'fragments':g['fragments']})
          for ch in children:
              cand=[b for b in baskets if b['direction']==ch['direction'] and b['entryTime']<=ch['entryTime']<=b['closeTime']]
              if not cand: cand=[b for b in baskets if b['direction']==ch['direction'] and 0<=ch['entryTime']-b['entryTime']<=4*60*60*1000]
              if cand:
                  b=max(cand,key=lambda z:z['entryTime']); b['net']+=ch['net']; b['grid_children']+=1; b['closeTime']=max(b['closeTime'],ch['closeTime'])
          for b in baskets: b['grid_status']='GRID' if b['grid_children']>0 else 'NON_GRID'

          def stats(rows):
              vals=[x['net'] for x in rows]; W=[x for x in vals if x>0]; L=[x for x in vals if x<0]
              gw=sum(W); gl=abs(sum(L)); pf=gw/gl if gl>0 else (999 if gw>0 else 0); net=sum(vals)
              aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0
              loss_abs=sorted([abs(x) for x in L],reverse=True); tot_loss=sum(loss_abs)
              srt=sorted(L)
              med_loss=srt[len(srt)//2] if srt else 0
              p95_loss=0
              if loss_abs:
                  asc=sorted(loss_abs); p95_loss=asc[min(len(asc)-1,max(0,math.ceil(.95*len(asc))-1))]
              return {
                'baskets':len(vals),'wins':len(W),'losses':len(L),'pf':pf,'net':net,
                'expectancy':net/len(vals) if vals else 0,'win_rate_pct':100*len(W)/len(vals) if vals else 0,
                'avg_winner':aw,'avg_loser':al,'realized_rr':aw/abs(al) if aw>0 and al<0 else None,
                'largest_loss':min(L) if L else 0,'median_loss':med_loss,'p95_abs_loss':p95_loss,
                'top1_loss_contribution_pct':100*sum(loss_abs[:1])/tot_loss if tot_loss else 0,
                'top3_loss_contribution_pct':100*sum(loss_abs[:3])/tot_loss if tot_loss else 0,
                'top5_loss_contribution_pct':100*sum(loss_abs[:5])/tot_loss if tot_loss else 0
              }
          def matrix(fields):
              m={}
              for b in baskets:
                  k='|'.join(str(b.get(f,'NA')) for f in fields)
                  m.setdefault(k,[]).append(b)
              return {k:stats(v) for k,v in sorted(m.items())}

          qacc={}
          for m in re.finditer(r'\[V283-QUALITY-ACCEPT\]\s+pattern=(\S+)\s+q=([\d.]+)\s+prz=([\d.]+)\s+time=([\d.]+)\s+pivot=([\d.]+)',t):
              p=m.group(1); x=qacc.setdefault(p,{'accepted':0,'q':[],'prz':[],'time':[],'pivot':[]})
              x['accepted']+=1; x['q'].append(float(m.group(2))); x['prz'].append(float(m.group(3))); x['time'].append(float(m.group(4))); x['pivot'].append(float(m.group(5)))
          qrej={}
          for m in re.finditer(r'\[V283-QUALITY-REJECT\]\s+pattern=(\S+)\s+q=([\d.]+)\s+prz=([\d.]+)\s+time=([\d.]+)\s+pivot=([\d.]+)',t):
              p=m.group(1); qrej[p]=qrej.get(p,0)+1
          quality={}
          for p in sorted(set(qacc)|set(qrej)):
              x=qacc.get(p,{'accepted':0,'q':[],'prz':[],'time':[],'pivot':[]})
              quality[p]={'accepted':x['accepted'],'rejected':qrej.get(p,0),
                          'avg_q':sum(x['q'])/len(x['q']) if x['q'] else None,
                          'avg_prz':sum(x['prz'])/len(x['prz']) if x['prz'] else None,
                          'avg_time_symmetry':sum(x['time'])/len(x['time']) if x['time'] else None,
                          'avg_pivot_quality':sum(x['pivot'])/len(x['pivot']) if x['pivot'] else None}

          vals=stats(baskets)
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          def li(n):
              m=re.findall(rf'{n}=(\d+)',t); return int(m[-1]) if m else 0
          out={
            'source_version':'V29.3-Grid-Risk-Cap-Hotfix-RC','source_changed':False,'window':w,'status':'OK',
            'telemetry_limits':{'regime':'UNVERIFIED_V29_3_PER_TRADE','htf_context':'UNVERIFIED_V29_3_PER_TRADE'},
            'overall':dict(vals,max_dd_pct=float(eq.get('maxEquityDrawdownPercent',0) or 0),execution_errors=errs),
            'funnel':{'signals':li('signals'),'orders':li('orders'),'atr_blocked':li('atrBlocked'),'mtf_blocked':li('mtfBlocked'),'geometry_blocked':li('geometryBlocked'),'volume_blocked':li('volumeBlocked'),'risk_blocked':li('riskBlocked'),'capital_infeasible':li('capitalInfeasible')},
            'pattern':matrix(['pattern']),
            'pattern_direction':matrix(['pattern','direction']),
            'pattern_grid':matrix(['pattern','grid_status']),
            'pattern_direction_grid':matrix(['pattern','direction','grid_status']),
            'pattern_direction_grid_session':matrix(['pattern','direction','grid_status','session']),
            'quality_prz':quality,
            'baskets':baskets
          }
          ap.write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE3-EDGE-${{ matrix.window.id }}
          path: seal/audit
          retention-days: 30

  attribution_gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PHASE3-EDGE-*
          path: all
          merge-multiple: true
      - name: Consolidate cross-window edge matrix
        run: |
          python3 - <<'PY'
          import json,glob,pathlib
          rows=[json.load(open(p)) for p in sorted(glob.glob('all/PHASE3-DEV-*.json')+glob.glob('all/PHASE3-*.json'))]
          uniq={x.get('window'):x for x in rows if x.get('status')=='OK'}
          rows=[uniq[k] for k in sorted(uniq)]
          dims=['pattern','pattern_direction','pattern_grid','pattern_direction_grid','pattern_direction_grid_session']
          cross={}
          positive=[]
          harmful=[]
          for dim in dims:
              keys=sorted(set().union(*(set(r.get(dim,{})) for r in rows))) if rows else []
              dm={}
              for k in keys:
                  ws={r['window']:r.get(dim,{}).get(k,{'baskets':0,'pf':0,'net':0,'expectancy':0}) for r in rows}
                  active=sum(1 for x in ws.values() if x.get('baskets',0)>0)
                  total=sum(x.get('baskets',0) for x in ws.values()); net=sum(x.get('net',0) for x in ws.values())
                  pfs=[x.get('pf',0) for x in ws.values() if x.get('baskets',0)>0]
                  pos=sum(1 for x in ws.values() if x.get('baskets',0)>0 and x.get('net',0)>0)
                  rec={'windows':ws,'active_windows':active,'total_baskets':total,'total_net':net,'positive_windows':pos,'worst_active_pf':min(pfs) if pfs else 0}
                  rec['cross_window_positive']=bool(active==3 and total>=20 and min(pfs)>1 and net>0 and pos>=2)
                  rec['consistently_harmful']=bool(active==3 and total>=20 and all(x.get('baskets',0)>0 and x.get('pf',0)<1 and x.get('net',0)<0 for x in ws.values()))
                  dm[k]=rec
                  if rec['cross_window_positive']: positive.append({'dimension':dim,'cluster':k,**rec})
                  if rec['consistently_harmful']: harmful.append({'dimension':dim,'cluster':k,**rec})
              cross[dim]=dm
          out={
            'source_version':'V29.3','source_changed':False,'engineering_freeze':'PASS',
            'data_scope':'EXPOSED_DEVELOPMENT_ONLY','val2':'UNTOUCHED_NOT_RUN','final_holdout':'UNTOUCHED_NOT_RUN',
            'telemetry_limits':{'regime':'UNVERIFIED_V29_3_PER_TRADE','htf_context':'UNVERIFIED_V29_3_PER_TRADE'},
            'windows':rows,'cross_window':cross,'positive_clusters':positive,'harmful_clusters':harmful,
            'advance_rule':'Only cross-window positive clusters may seed a Phase-3 candidate; no validation data used.'
          }
          pathlib.Path('PHASE3-EDGE-ATTRIBUTION-DECISION.json').write_text(json.dumps(out,indent=2)); print(json.dumps({'positive_clusters':positive,'harmful_clusters':harmful,'window_count':len(rows)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PHASE3-EDGE-ATTRIBUTION-DECISION
          path: PHASE3-EDGE-ATTRIBUTION-DECISION.json
          retention-days: 30
