name: Fibonacci BTC Round12 Second H1 Setup Screening

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/backtest-fibonacci-btc-round12-second-setup-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round12-second-setup-screen
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'
  DEV_START: '08/03/2026 00:00'
  DEV_END: '08/08/2026 00:00'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          patterns = [
            'ABCD','Gartley','Bat','Alt Bat','Butterfly','Crab','Deep Crab',
            'Shark 1','Shark 2','New Cypher','Nen Star','5-0','3 Drives',
            'Max Bat','Max Gartley','Max Butterfly','121','Total 1','Total 2'
          ]
          inc=[]
          for i,p in enumerate(patterns):
              slug='p%02d'%i
              inc.append({'name':slug,'pattern':p})
          print('matrix='+json.dumps({'include':inc},separators=(',',':')))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round4.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round5.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round6.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round7.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round8.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round9.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round10.py --repo-root "$PWD" --force
      - name: Enable trading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.12.0-btc-round10-funnel/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build research binary
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.12.0-btc-round10-funnel/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.12.0-btc-round10-funnel/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p artifact
          ALGO="$(find Fibonacci-v0.12.0-btc-round10-funnel -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" artifact/FibonacciHarmonicSniperUltimate-BTC-Round12.algo
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round12-build
          path: artifact
          retention-days: 30

  screen:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round12-build
          path: work
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p work/cache work/reports/${{ matrix.name }}
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Screen ${{ matrix.pattern }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          PATTERN: ${{ matrix.pattern }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PATTERN" > "work/reports/${{ matrix.name }}/pattern.txt"
          timeout --signal=TERM --kill-after=30s 30m docker run --rm \
            -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
            backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round12.algo --environment-variables --exit-on-stop \
            --symbol=BITCOIN --period=h1 --start="$DEV_START" --end="$DEV_END" --balance="$BALANCE" \
            --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 --RiskPercent=1.0 \
            --EnabledPatterns="$PATTERN" --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 \
            --MaxPatternAgeBars=16 --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --UseCandleConfirmation=true --CooldownBars=2 \
            --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
            --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
            --Round8LogExcursions=false --Round9ShadowTpContinuation=false --Round10LogFunnel=false --DebugLogging=false \
            --report="/work/reports/${{ matrix.name }}/DEV5.html" --report-json="/work/reports/${{ matrix.name }}/DEV5.json" \
            2>&1 | tee "work/reports/${{ matrix.name }}/DEV5.log"
      - name: Clean credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-r12-${{ matrix.name }}
          path: work/reports/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: screen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: btc-r12-*
          path: results
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round12-screen-results
          path: results
          retention-days: 30
