name: Fibonacci XAUUSD 1 - Standalone ABCD v9

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-round1]
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-1-abcd-v9.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-xauusd-1-abcd-v9
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          mkdir -p "$ROOT/src" package
          base64 -d "$ROOT/source.gz.b64" | gzip -dc > "$ROOT/src/FibonacciXAUUSD1.cs"
          sha256sum "$ROOT/src/FibonacciXAUUSD1.cs" | tee package/source.sha256
          cp "$ROOT/src/FibonacciXAUUSD1.cs" package/FibonacciXAUUSD1.cs
          cp "$ROOT/README.md" package/README.md
      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Build xauusd_1.algo
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD1.csproj && dotnet build $ROOT/FibonacciXAUUSD1.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" package/xauusd_1.algo
          sha256sum package/xauusd_1.algo | tee package/algo.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-abcd-build-v9
          path: package/
          retention-days: 30

  backtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: standard-m1
            start: '09/06/2026'
            end: '09/07/2026'
            spread: '17.42'
            commission: '35'
          - label: standard-m2
            start: '09/07/2026'
            end: '09/08/2026'
            spread: '17.42'
            commission: '35'
          - label: standard-m3
            start: '09/08/2026'
            end: '09/09/2026'
            spread: '17.42'
            commission: '35'
          - label: harsh-m1
            start: '09/06/2026'
            end: '09/07/2026'
            spread: '30'
            commission: '50'
          - label: harsh-m2
            start: '09/07/2026'
            end: '09/08/2026'
            spread: '30'
            commission: '50'
          - label: harsh-m3
            start: '09/08/2026'
            end: '09/09/2026'
            spread: '30'
            commission: '50'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_1-abcd-build-v9
          path: work
      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          chmod 600 work/ctrader.pwd
      - name: Run ${{ matrix.label }} Standalone ABCD backtest
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/reports work/cache
          docker run --rm -v "$PWD/work:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/xauusd_1.algo --environment-variables --exit-on-stop \
            --symbol=XAUUSD --period=h1 --start='${{ matrix.start }}' --end='${{ matrix.end }}' \
            --balance=10000 --data-mode=m1 --data-dir=/work/cache \
            --commission='${{ matrix.commission }}' --spread='${{ matrix.spread }}' \
            --RiskPercent=0.50 --MaxDailyLossPercent=3.0 \
            --PivotLeft=3 --PivotRight=3 --EnableStandaloneABCD=true \
            --MinQualityScore=75 --M30ConfirmRulesNeeded=2 \
            --report='/work/reports/${{ matrix.label }}.html' \
            --report-json='/work/reports/${{ matrix.label }}.json' \
            2>&1 | tee 'work/reports/${{ matrix.label }}.log'
          test -s 'work/reports/${{ matrix.label }}.json'
      - name: Remove credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_1-abcd-report-${{ matrix.label }}
          path: work/reports/
          retention-days: 30

  aggregate:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_1-abcd-build-v9
          path: package
      - uses: actions/download-artifact@v4
        with:
          pattern: xauusd_1-abcd-report-*
          path: reports
          merge-multiple: true
      - name: Aggregate Standalone ABCD reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def allv(d, section, key):
              try:
                  v=d[section][key]
                  return float(v.get('all',0) if isinstance(v,dict) else v or 0)
              except Exception:
                  return 0.0

          def dd_pct(d):
              peak=0.0; worst=0.0
              for p in d.get('equity',{}).get('points',[]):
                  peak=max(peak,float(p.get('maxEquity',p.get('balance',0)) or 0))
                  low=float(p.get('minEquity',p.get('balance',0)) or 0)
                  if peak>0: worst=max(worst,(peak-low)/peak*100.0)
              return worst

          out=[
              '# xauusd_1 Standalone ABCD v9','',
              'Period: 2026-06-09 to 2026-09-09 UTC | XAUUSD H1 | M1 data | $10,000 | risk 0.5%','',
              'Single strategy-factor correction: restore executable standalone AB=CD family. Pivot remains 3/3; Geometry threshold 75; M30 2-of-3; SL/TP, risk and cost models unchanged. Reciprocal ABCD remains a quality/confluence score rather than a duplicate order family.','',
              '| Cost | Reports | Trades | Wins | Losses | WR % | Net $ | ROI % | PF* | Worst monthly Eq DD % |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
          ]
          for cost in ('standard','harsh'):
              reports=[]
              for i in range(1,4):
                  p=Path(f'reports/{cost}-m{i}.json')
                  if p.exists(): reports.append(json.loads(p.read_text()))
              hist=[x for d in reports for x in d.get('history',{}).get('items',[])]
              trades=sum(int(allv(d,'tradeStatistics','totalTrades')) for d in reports)
              wins=sum(int(allv(d,'tradeStatistics','winningTrades')) for d in reports)
              losses=sum(int(allv(d,'tradeStatistics','losingTrades')) for d in reports)
              net=sum(float(d.get('main',{}).get('netProfit',0) or 0) for d in reports)
              pos=sum(max(0.0,float(x.get('net',0) or 0)) for x in hist)
              neg=sum(abs(min(0.0,float(x.get('net',0) or 0))) for x in hist)
              pf=pos/neg if neg else (999.0 if pos else 0.0)
              wr=wins/trades*100.0 if trades else 0.0
              dd=max([dd_pct(d) for d in reports] or [0.0])
              out.append(f'| {cost} | {len(reports)}/3 | {trades} | {wins} | {losses} | {wr:.2f} | {net:.2f} | {net/10000*100:.2f} | {pf:.2f} | {dd:.2f} |')
          out += [
              '',
              '*PF recomputed from closed-trade net P/L across independent monthly segments.',
              'Current named-harmonic v7: 0 trades; diagnostic logs show almost all bars rejected as no_pattern and the only visible family was Gartley.',
              'Rejected Pivot 2x2 v8: Standard 0 trades; Harsh 0 trades.',
              'Decision: retain standalone AB=CD only if it restores meaningful frequency without unacceptable PF/ROI/DD degradation.'
          ]
          text='\n'.join(out)+'\n'
          Path('package/ABCD_BACKTEST_SUMMARY.md').write_text(text)
          print(text)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(text)
          PY
          cp -r reports package/reports
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-abcd-v9-complete
          path: package/
          retention-days: 30
