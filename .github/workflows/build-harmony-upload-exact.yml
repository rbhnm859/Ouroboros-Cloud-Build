name: Build Uploaded HarmonyBotPro Exact

on:
  push:
    branches:
      - build-harmony-upload-exact-20260911
    paths:
      - '.github/workflows/build-harmony-upload-exact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Recreate exact uploaded source
        shell: bash
        run: |
          mkdir -p cli-build/HarmonyBotPro
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, hashlib
          payload = ""
          data = gzip.decompress(base64.b64decode(payload))
          expected = "0b25083be0b9a8e11d6e1b2dd844dc9d5530f16b46daac8347421a16780b73a1"
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"source hash mismatch: {actual} != {expected}")
          Path('cli-build/HarmonyBotPro/HarmonyBotPro.cs').write_bytes(data)
          print('SOURCE_SHA256=' + actual)
          PYCODE
          cat > cli-build/HarmonyBotPro/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <AlgoName>HarmonyBotPro</AlgoName>
              <AlgoBuild>true</AlgoBuild>
              <AlgoPublish>false</AlgoPublish>
              <IncludeSource>false</IncludeSource>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="cTrader.Automate" Version="1.0.19" />
            </ItemGroup>
          </Project>
          EOF

      - name: Restore
        run: dotnet restore cli-build/HarmonyBotPro/HarmonyBotPro.csproj

      - name: Build Release ALGO
        run: dotnet build cli-build/HarmonyBotPro/HarmonyBotPro.csproj -c Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false

      - name: Collect ALGO
        shell: bash
        run: |
          mkdir -p output
          ALGO=$(find cli-build/HarmonyBotPro -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" output/HarmonyBotPro.algo
          sha256sum output/HarmonyBotPro.algo | tee output/HarmonyBotPro.algo.sha256
          printf '%s\n' '0b25083be0b9a8e11d6e1b2dd844dc9d5530f16b46daac8347421a16780b73a1  HarmonyBotPro.cs' > output/HarmonyBotPro.source.sha256
          ls -lh output/HarmonyBotPro.algo

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-Mobile-Exact
          path: |
            output/HarmonyBotPro.algo
            output/HarmonyBotPro.algo.sha256
            output/HarmonyBotPro.source.sha256
          if-no-files-found: error
