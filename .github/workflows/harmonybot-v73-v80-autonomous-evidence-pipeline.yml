name: HarmonyBot V73-V80 Autonomous Evidence Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'HarmonyBot-V71/**'
      - 'HarmonyBot-V73/**'
      - '.github/workflows/harmonybot-v73-v80-autonomous-evidence-pipeline.yml'

concurrency:
  # Generation suffix intentionally rolls the concurrency lease after the pre-fix
  # evaluator cancellation left the previous group occupied. Future runs in this
  # pipeline still cancel obsolete runs within the same generation.
  group: harmonybot-v73-v80-autonomous-evidence-g2
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'harmonybot/v73-opportunity-universe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static audit, frozen detector guard, and dual build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V71/tools/static_contract_audit.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 HarmonyBot-V71/tools/verify_frozen_harmonic_engine.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 -m py_compile HarmonyBot-V71/tools/*.py
          bash -n HarmonyBot-V71/tools/*.sh
          dotnet restore HarmonyBot-V71/HarmonyBotV71.csproj
          dotnet build HarmonyBot-V71/HarmonyBotV71.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V71/dist HarmonyBot-V71/reference HarmonyBot-V71/final
          A=$(find HarmonyBot-V71/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo
          TRUSTED=1b670a0f43ba8ecaa637febfdacf605b1b146f01
          T=$(mktemp -d); mkdir -p "$T/src"
          git show "$TRUSTED:HarmonyBot-V51/HarmonyBotV51.csproj" > "$T/HarmonyBotV51.csproj"
          git show "$TRUSTED:HarmonyBot-V51/src/HarmonyBotV51.cs" > "$T/src/HarmonyBotV51.cs"
          dotnet restore "$T/HarmonyBotV51.csproj"
          dotnet build "$T/HarmonyBotV51.csproj" -c Release --no-restore --nologo
          R=$(find "$T/bin/Release" -type f -name '*.algo' | head -1)
          test -s "$R"
          cp "$R" HarmonyBot-V71/reference/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo
          sha256sum HarmonyBot-V71/dist/*.algo HarmonyBot-V71/reference/*.algo > HarmonyBot-V71/final/V73_BUILD_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v73-build
          path: |
            control/HarmonyBot-V71/dist
            control/HarmonyBot-V71/reference
            control/HarmonyBot-V71/final
            control/V71_STATIC_CONTRACT_AUDIT.json
            control/V71_FROZEN_HARMONIC_ENGINE_GUARD.json
          retention-days: 30

  research_seed:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        window: [Y2016, Y2017, Y2018, Y2019, Y2020]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - name: Resolve immutable Research-Train custody
        id: custody
        shell: bash
        run: |
          set -euo pipefail
          M=control/HarmonyBot-V73/V73_RESEARCH_CUSTODY.json
          test -s "$M"
          RUN=$(python3 -c 'import json;print(json.load(open("'$M'"))["source_run_id"])')
          SHA=$(python3 -c 'import json;print(json.load(open("'$M'"))["windows"]["${{ matrix.window }}"]["sha256"])')
          ART=$(python3 -c 'import json;print(json.load(open("'$M'"))["windows"]["${{ matrix.window }}"]["artifact"])')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.custody.outputs.artifact }}
          path: control/HarmonyBot-V71/seed
          github-token: ${{ github.token }}
          run-id: ${{ steps.custody.outputs.run }}
      - name: Verify immutable Research-Train bytes
        shell: bash
        run: |
          set -euo pipefail
          H=$(cd control/HarmonyBot-V71/seed && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$H" = "${{ steps.custody.outputs.sha }}" || {
            echo "[V73-RESEARCH-CUSTODY-FAIL] window=${{ matrix.window }} expected=${{ steps.custody.outputs.sha }} actual=$H"
            exit 48
          }
          echo "[V73-RESEARCH-CUSTODY] window=${{ matrix.window }} sha256=$H immutable=true"
      - uses: actions/upload-artifact@v4
        with:
          name: v73-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/seed
          retention-days: 30

  burned_seed:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v73-build
          path: control/HarmonyBot-V71/shared
      - name: Resolve immutable burned custody
        id: custody
        shell: bash
        run: |
          set -euo pipefail
          M=control/HarmonyBot-V71/final/V71_BURNED_CALIBRATION_CUSTODY.json
          RUN=$(python3 -c 'import json;print(json.load(open("'$M'"))["source_run_id"])')
          SHA=$(python3 -c 'import json;print(json.load(open("'$M'"))["windows"]["${{ matrix.window }}"]["sha256"])')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: v71-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/seed
          github-token: ${{ github.token }}
          run-id: ${{ steps.custody.outputs.run }}
      - name: Verify custody and replay trusted V51 reference
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          V71_DATA_SEED_DIR: ${{ github.workspace }}/control/HarmonyBot-V71/seed
          V71_EXPECTED_DATA_SHA256: ${{ steps.custody.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          H=$(cd control/HarmonyBot-V71/seed && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$H" = "$V71_EXPECTED_DATA_SHA256"
          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"
          mkdir -p control/HarmonyBot-V71/reference
          R=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1)
          cp "$R" control/HarmonyBot-V71/reference/
          chmod +x control/HarmonyBot-V71/tools/*.sh
          control/HarmonyBot-V71/tools/run_v51_reference.sh ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"
      - uses: actions/upload-artifact@v4
        with:
          name: v73-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/seed
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v73-v51-reference-${{ matrix.window }}
          path: control/HarmonyBot-V71/reference-output-${{ matrix.window }}
          retention-days: 30

  v73_universe:
    needs: [build, research_seed, burned_seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        window: [Y2016, Y2017, Y2018, Y2019, Y2020, Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v73-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: v73-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - name: Run multiscale V73 opportunity universe
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          chmod +x control/HarmonyBot-V71/tools/*.sh
          V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed" control/HarmonyBot-V71/tools/run_window.sh R_V73_OPPORTUNITY_UNIVERSE ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"
      - uses: actions/upload-artifact@v4
        with:
          name: v73-universe-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-R_V73_OPPORTUNITY_UNIVERSE-${{ matrix.window }}
          retention-days: 30

  v73_gate:
    needs: v73_universe
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.g.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: v73-universe-*
          path: merged
          merge-multiple: true
      - id: g
        name: V73 supply and custody gate
        shell: bash
        run: |
          mkdir -p gate
          python3 control/HarmonyBot-V71/tools/evaluate_v73_universe.py merged gate
          echo "pass=$(cat gate/pass.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V73-OPPORTUNITY-UNIVERSE-GATE
          path: gate
          retention-days: 30

  promote_v73:
    needs: v73_gate
    if: ${{ needs.v73_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash HarmonyBot-V71/tools/promote_version_marker.sh V73 harmonybot/v73-opportunity-universe-qualified "2016-2023 each >=400 independent causal opportunities, >=8 visible families, zero duplicate setup, valid custody."

  v74_tournament:
    needs: v73_gate
    if: ${{ needs.v73_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      pass: ${{ steps.g.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: v73-universe-*
          path: merged
          merge-multiple: true
      - id: g
        shell: bash
        run: |
          mkdir -p tournament
          python3 control/HarmonyBot-V71/tools/evaluate_v74_sequential.py merged tournament
          echo "pass=$(cat tournament/pass.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V74-ALPHA-TOURNAMENT
          path: tournament
          retention-days: 30

  promote_v74:
    needs: v74_tournament
    if: ${{ needs.v74_tournament.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - shell: bash
        run: |
          bash HarmonyBot-V71/tools/promote_version_marker.sh V74 harmonybot/v74-alpha-tournament-qualified "A preregistered Alpha Champion passed 2021/2022/2023 OOF: N>=250/year, MeanR>=0.90, PF_R>=3.30, WR>=70%, AvgRR>=2.30, LCB95>0."

  v75_policy:
    needs: v74_tournament
    if: ${{ needs.v74_tournament.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: V74-ALPHA-TOURNAMENT
          path: tournament
      - uses: actions/download-artifact@v4
        with:
          name: v73-universe-${{ matrix.window }}
          path: census
      - run: python3 control/HarmonyBot-V71/tools/apply_v74_champion.py census tournament/V74_TOURNAMENT_MANIFEST.json tournament/V74_MODELS.json ${{ matrix.window }} policy
      - uses: actions/upload-artifact@v4
        with:
          name: v75-policy-${{ matrix.window }}
          path: policy
          retention-days: 30

  v75_capital:
    needs: [build, burned_seed, v75_policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v73-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: v73-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - uses: actions/download-artifact@v4
        with:
          name: v75-policy-${{ matrix.window }}
          path: policy
      - name: Run V75 real broker economic conversion
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"
          mkdir -p control/HarmonyBot-V71/dist milestone
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1); cp "$A" control/HarmonyBot-V71/dist/
          V74_ALLOWED_HASHES="$(cat policy/allowed_hashes.txt)" V74_POLICY_UTILITY="$(cat policy/utility_map.txt)" V74_POLICY_PROTECTION="$(cat policy/protection_map.txt)"           V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed"           control/HarmonyBot-V71/tools/run_window.sh B_V75_FROZEN_POLICY_ALPHA ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"
          cp control/HarmonyBot-V71/output-B_V75_FROZEN_POLICY_ALPHA-${{ matrix.window }}/B_V75_FROZEN_POLICY_ALPHA-${{ matrix.window }}.json milestone/V75_BASELINE-${{ matrix.window }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v75-capital-${{ matrix.window }}
          path: milestone
          retention-days: 30

  v75_gate:
    needs: v75_capital
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.g.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: v75-capital-*
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v73-v51-reference-Y202*
          path: merged
          merge-multiple: true
      - id: g
        run: |
          mkdir -p gate
          python3 control/HarmonyBot-V71/tools/evaluate_v75_conversion.py merged gate
          echo "pass=$(cat gate/pass.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V75-CAPITAL-CONVERSION
          path: gate
          retention-days: 30

  promote_v75:
    needs: v75_gate
    if: ${{ needs.v75_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash HarmonyBot-V71/tools/promote_version_marker.sh V75 harmonybot/v75-economic-conversion-qualified "OOF Alpha converted to positive real cTrader economics in all burned years with Core displacement zero and zero engineering/risk violations."

  v76_slot:
    needs: [build, burned_seed, v75_policy, v75_gate]
    if: ${{ needs.v75_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v73-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: v73-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - uses: actions/download-artifact@v4
        with:
          name: v75-policy-${{ matrix.window }}
          path: policy
      - name: Run conservative edge per slot-hour scheduling
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"
          mkdir -p control/HarmonyBot-V71/dist milestone
          A=$(find control/HarmonyBot-V71/shared -type f -name '*.algo' | grep Protected | head -1); cp "$A" control/HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo
          V74_ALLOWED_HASHES="$(cat policy/allowed_hashes.txt)" V74_POLICY_UTILITY="$(cat policy/utility_map.txt)" V74_POLICY_HOLD="$(cat policy/hold_map.txt)" V74_POLICY_PROTECTION="$(cat policy/protection_map.txt)"           V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed"           control/HarmonyBot-V71/tools/run_window.sh B_V75_FROZEN_POLICY_ALPHA ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"
          cp control/HarmonyBot-V71/output-B_V75_FROZEN_POLICY_ALPHA-${{ matrix.window }}/B_V75_FROZEN_POLICY_ALPHA-${{ matrix.window }}.json milestone/V76_SLOT-${{ matrix.window }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v76-slot-${{ matrix.window }}
          path: milestone
          retention-days: 30

  v76_gate:
    needs: v76_slot
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.g.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: v75-capital-*
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v76-slot-*
          path: merged
          merge-multiple: true
      - id: g
        run: |
          mkdir -p gate
          python3 control/HarmonyBot-V71/tools/evaluate_v76_slot.py merged gate
          echo "pass=$(cat gate/pass.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V76-SLOT-EFFICIENCY
          path: gate
          retention-days: 30

  promote_v76:
    needs: v76_gate
    if: ${{ needs.v76_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash HarmonyBot-V71/tools/promote_version_marker.sh V76 harmonybot/v76-slot-efficiency-qualified ">=200 independent baskets/year in each burned year with no Net/PF/Expectancy/DD regression versus V75."

  v77_capacity:
    needs: [build, burned_seed, v75_policy, v76_gate]
    if: ${{ needs.v76_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode: [SINGLE, GRID]
        risk: [1, 2, 3, 5]
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v73-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: v73-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - uses: actions/download-artifact@v4
        with:
          name: v75-policy-${{ matrix.window }}
          path: policy
      - name: Fixed capacity and grid sweep
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(bash control/HarmonyBot-V71/tools/resolve_window.sh ${{ matrix.window }})"
          mkdir -p control/HarmonyBot-V71/dist milestone
          A=$(find control/HarmonyBot-V71/shared -type f -name '*.algo' | grep Protected | head -1); cp "$A" control/HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo
          if [[ "${{ matrix.mode }}" == "GRID" ]]; then VAR=B_V77_FROZEN_POLICY_GRID; else VAR=B_V75_FROZEN_POLICY_ALPHA; fi
          V74_RISK_PCT="${{ matrix.risk }}" V74_ALLOWED_HASHES="$(cat policy/allowed_hashes.txt)" V74_POLICY_UTILITY="$(cat policy/utility_map.txt)" V74_POLICY_HOLD="$(cat policy/hold_map.txt)"           V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed"           control/HarmonyBot-V71/tools/run_window.sh "$VAR" ${{ matrix.window }} "$START" "$EVAL" "$END" "$YEARS"
          cp control/HarmonyBot-V71/output-$VAR-${{ matrix.window }}/$VAR-${{ matrix.window }}.json milestone/V77_${{ matrix.mode }}_R${{ matrix.risk }}_${{ matrix.window }}.json
      - uses: actions/upload-artifact@v4
        with:
