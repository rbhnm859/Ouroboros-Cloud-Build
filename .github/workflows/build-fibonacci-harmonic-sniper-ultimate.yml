name: Build Fibonacci Harmonic Sniper Ultimate Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fibonacci-harmonic-sniper-ultimate.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pull official cTrader CLI 5.9.11
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Recreate Fibonacci Harmonic source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip
          source_payload = """"""
          Path('/tmp/FibonacciHarmonicSniperUltimate.cs').write_bytes(
              gzip.decompress(base64.b64decode(source_payload))
          )
          print('Source bytes:', Path('/tmp/FibonacciHarmonicSniperUltimate.cs').stat().st_size)
          PYCODE

      - name: Create official cTrader cBot project
        run: |
          mkdir -p cli-build
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo/cli-build \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            create cbot FibonacciHarmonicSniperUltimate csharp

          GEN_CSPROJ=$(find cli-build -type f -name '*.csproj' | head -n 1)
          if [ -z "$GEN_CSPROJ" ]; then
            echo 'Could not locate generated cTrader project.'
            find cli-build -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "$GEN_CSPROJ" > /tmp/fhsu-csproj.txt

          PROJECT_DIR=$(dirname "$GEN_CSPROJ")
          GEN_CS=$(find "$PROJECT_DIR" -maxdepth 1 -type f -name '*.cs' | head -n 1)
          if [ -z "$GEN_CS" ]; then
            echo 'Could not locate generated cBot source file.'
            find "$PROJECT_DIR" -maxdepth 2 -type f | sort
            exit 1
          fi
          cp /tmp/FibonacciHarmonicSniperUltimate.cs "$GEN_CS"
          echo "Project: $GEN_CSPROJ"
          echo "Source : $GEN_CS"

      - name: Build .algo with official cTrader CLI
        run: |
          GEN_CSPROJ=$(cat /tmp/fhsu-csproj.txt)
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            build "/repo/$GEN_CSPROJ"

      - name: Locate mobile .algo
        run: |
          mkdir -p dist
          ALGO=$(find cli-build -type f -name '*.algo' | head -n 1)
          if [ -z "$ALGO" ]; then
            echo 'Build completed but no .algo was found.'
            find cli-build -maxdepth 8 -type f | sort
            exit 1
          fi
          cp "$ALGO" dist/FibonacciHarmonicSniperUltimate.algo
          ls -lh dist/FibonacciHarmonicSniperUltimate.algo

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: FibonacciHarmonicSniperUltimate-Mobile
          path: dist/FibonacciHarmonicSniperUltimate.algo
          if-no-files-found: error
