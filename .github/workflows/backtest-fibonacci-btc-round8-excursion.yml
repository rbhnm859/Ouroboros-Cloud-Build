name: Fibonacci BTC Round8 MFE MAE excursion research

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/backtest-fibonacci-btc-round8-excursion.yml'
      - 'tools/create_fibonacci_btc_round8.py'
      - 'research/fibonacci-research1/analyze_round8_excursions.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round8-excursion
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'
  FULL12_START: '08/09/2025 00:00'
  FULL12_END: '08/09/2026 00:00'
  FULL6_START: '08/03/2026 00:00'
  FULL6_END: '08/09/2026 00:00'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round4.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round5.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round6.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round7.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round8.py --repo-root "$PWD" --force
      - name: Enable trading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.10.0-btc-round8-excursion/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build Round8
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.10.0-btc-round8-excursion/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.10.0-btc-round8-excursion/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p artifact
          ALGO="$(find Fibonacci-v0.10.0-btc-round8-excursion -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" artifact/FibonacciHarmonicSniperUltimate-BTC-Round8.algo
          cp Fibonacci-v0.10.0-btc-round8-excursion/FibonacciHarmonicSniperUltimate.cs artifact/FibonacciHarmonicSniperUltimate-BTC-Round8.cs
          sha256sum artifact/FibonacciHarmonicSniperUltimate-BTC-Round8.algo > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round8-build
          path: artifact
          retention-days: 30

  excursion:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round8-build
          path: work
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p work/cache work/reports
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Run unchanged Champion with excursion instrumentation
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          for PHASE in FULL12 FULL6; do
            if [ "$PHASE" = FULL12 ]; then START="$FULL12_START"; END="$FULL12_END"; else START="$FULL6_START"; END="$FULL6_END"; fi
            echo "=== ROUND8 $PHASE ==="
            timeout --signal=TERM --kill-after=30s 30m docker run --rm \
              -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
              backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round8.algo --environment-variables --exit-on-stop \
              --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
              --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 --RiskPercent=1.0 \
              --EnabledPatterns='Reciprocal ABCD' --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 \
              --MaxPatternAgeBars=16 --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --CooldownBars=2 \
              --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
              --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
              --Round8LogExcursions=true --DebugLogging=false \
              --report="/work/reports/${PHASE}.html" --report-json="/work/reports/${PHASE}.json" \
              2>&1 | tee "work/reports/${PHASE}.log"
            python3 research/fibonacci-research1/analyze_round8_excursions.py \
              --log "work/reports/${PHASE}.log" --out-prefix "work/reports/${PHASE}-excursions"
          done
      - name: Clean credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibonacci-btc-round8-excursion-results
          path: work/reports
          if-no-files-found: error
          retention-days: 30
