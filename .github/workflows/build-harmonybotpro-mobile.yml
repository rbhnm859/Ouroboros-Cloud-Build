name: Build HarmonyBotPro mobile cTrader algo

on:
  push:
    branches:
      - build/harmonybotpro-mobile-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct and verify source
        working-directory: tmp/harmonybotpro-mobile-build
        shell: bash
        run: |
          cat source7k.01 source7k.02 source7k.03 source7k.04 source7k.05 > source.b64
          base64 -d source.b64 | gzip -d > HarmonyBotPro.cs
          echo "1c2ba6cff85a43f838ae30948f08edb61abafb9bb8bed8488d9d40e743a656df  HarmonyBotPro.cs" | sha256sum -c -
          test "$(wc -l < HarmonyBotPro.cs)" -ge 3200

      - name: Restore
        working-directory: tmp/harmonybotpro-mobile-build
        run: dotnet restore HarmonyBotPro.csproj

      - name: Build cTrader algo
        working-directory: tmp/harmonybotpro-mobile-build
        run: dotnet build HarmonyBotPro.csproj -c Release --no-restore -p:AlgoPublish=false

      - name: Verify algo output
        shell: bash
        run: |
          find tmp/harmonybotpro-mobile-build -type f -name '*.algo' -print
          test -n "$(find tmp/harmonybotpro-mobile-build -type f -name '*.algo' -print -quit)"

      - name: Upload mobile algo
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-mobile-algo
          path: tmp/harmonybotpro-mobile-build/**/*.algo
          if-no-files-found: error
