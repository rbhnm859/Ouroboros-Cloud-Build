name: Validate CDScalper K6 Session Sweep Rejection IS

on:
  workflow_dispatch:
  push:
    branches: [cds-k6-session-sweep-rejection-final-research]
    paths:
      - 'CumulativeDeltaScalper-EURUSD-v1/k6/**'
      - '.github/scripts/cdscalper_report_gate.py'
      - '.github/workflows/cdscalper-k6-session-sweep-rejection-is.yml'

permissions:
  contents: read

env:
  SYMBOL: EURUSD
  PERIOD: m1
  BALANCE: '30'
  BASE_SPREAD: '0.43'
  COMMISSION: '35'
  IS_START: '09/09/2024 00:00'
  IS_END: '08/09/2025 23:59'
  CTRADER_IMAGE_CANDIDATE: ghcr.io/spotware/ctrader-console:latest

jobs:
  audit_build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ctrader_image: ${{ steps.cli_image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify campaign stop rules and K6 precommit ordering
        shell: bash
        run: |
          set -euo pipefail
          K5_RESULT='CumulativeDeltaScalper-EURUSD-v1/reports/K5_IMPULSE_PULLBACK_RECLAIM_CORRECTED_IS_STOP_RESULT.md'
          SPEC='CumulativeDeltaScalper-EURUSD-v1/k6/PRECOMMIT_SPEC.md'
          SRC='CumulativeDeltaScalper-EURUSD-v1/k6/src/CumulativeDeltaScalper_EURUSD_K6.cs'
          test -f "$K5_RESULT" && grep -q 'Classification: C — FAIL' "$K5_RESULT"
          test -f "$SPEC" && test -f "$SRC"
          test ! -f 'CumulativeDeltaScalper-EURUSD-v1/k6/FREEZE_MANIFEST.json'
          SPEC_COMMIT="$(git log --diff-filter=A --format='%H' -- "$SPEC" | tail -1)"
          SRC_COMMIT="$(git log --diff-filter=A --format='%H' -- "$SRC" | tail -1)"
          test -n "$SPEC_COMMIT" && test -n "$SRC_COMMIT"
          git merge-base --is-ancestor "$SPEC_COMMIT" "$SRC_COMMIT"
          test "$SPEC_COMMIT" != "$SRC_COMMIT"
          echo "K6 precommit=$SPEC_COMMIT source=$SRC_COMMIT"
      - name: Verify locked K6 architecture and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC='CumulativeDeltaScalper-EURUSD-v1/k6/src/CumulativeDeltaScalper_EURUSD_K6.cs'
          PROJ='CumulativeDeltaScalper-EURUSD-v1/k6/CumulativeDeltaScalper_EURUSD_K6.csproj'
          grep -q 'AccessRights = AccessRights.None' "$SRC"
          grep -q '<TargetFramework>net6.0</TargetFramework>' "$PROJ"
          grep -q 'private const double SweepDistancePips = 1.0;' "$SRC"
          grep -q 'private const double MinimumRangePips = 4.0;' "$SRC"
          grep -q 'private const double MaximumRangePips = 35.0;' "$SRC"
          grep -q 'private const double RejectionCloseFraction = 0.50;' "$SRC"
          grep -q 'private const double StructuralStopBufferPips = 0.50;' "$SRC"
          grep -q 'private const double MinimumRewardRisk = 1.20;' "$SRC"
          grep -q 'private const double MinimumRewardCost = 2.50;' "$SRC"
          grep -q 'private const int MaxTradeSeconds = 180 \* 60;' "$SRC"
          grep -q 'HasAnySymbolPosition()' "$SRC"
          grep -q 'ExecuteMarketOrder(type, SymbolName, volume, TradeLabel, slPips, tpPips)' "$SRC"
          grep -q 'NormalizeVolumeInUnits' "$SRC"
          grep -q 'MinStopLossDistance' "$SRC"
          grep -q 'MinTakeProfitDistance' "$SRC"
          grep -q 'Account.PreciseLeverage' "$SRC"
          if grep -Eiq '\b(RSI|MACD|Bollinger|Fibonacci|MachineLearning|MLModel|DeltaThreshold)\b' "$SRC"; then exit 1; fi
          if grep -Eiq '\b(Grid|Martingale|DCA|Recovery|Loss Averaging|averaging down|reverse recovery)\b' "$SRC"; then exit 1; fi
          echo 'K6 locked architecture verified.'
      - name: Resolve and pin cTrader Console image
        id: cli_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          docker pull "$CTRADER_IMAGE_CANDIDATE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$CTRADER_IMAGE_CANDIDATE")"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DIGEST" | tee audit/ctrader-image-digest.txt
          docker run --rm "$DIGEST" --version > audit/ctrader-version.txt 2>&1 || true
      - name: Build exact K6 research algo
        shell: bash
        run: |
          set -euo pipefail
          dotnet build CumulativeDeltaScalper-EURUSD-v1/k6/CumulativeDeltaScalper_EURUSD_K6.csproj -c Release -p:AlgoBuild=true
          ALGO="$(find CumulativeDeltaScalper-EURUSD-v1/k6/bin/Release/net6.0 -maxdepth 1 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          mkdir -p package/k6
          cp "$ALGO" package/k6/K6_SESSION_SWEEP_REJECTION_RESEARCH.algo
          sha256sum package/k6/K6_SESSION_SWEEP_REJECTION_RESEARCH.algo | tee audit/k6-algo-sha256.txt
          git rev-parse HEAD | tee audit/tested-commit.txt
          sha256sum CumulativeDeltaScalper-EURUSD-v1/k6/PRECOMMIT_SPEC.md | tee audit/k6-precommit-sha256.txt
          sha256sum CumulativeDeltaScalper-EURUSD-v1/k6/src/CumulativeDeltaScalper_EURUSD_K6.cs | tee audit/k6-source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K6_SESSION_SWEEP_REJECTION_IS_PACKAGE
          path: |
            package/k6/K6_SESSION_SWEEP_REJECTION_RESEARCH.algo
            audit/*
            CumulativeDeltaScalper-EURUSD-v1/k6/PRECOMMIT_SPEC.md
          retention-days: 30

  corrected_is:
    needs: audit_build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CTID: ${{ secrets.CTRADER_CTID }}
      ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CT_PASS: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_IMAGE: ${{ needs.audit_build.outputs.ctrader_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: CDScalper_K6_SESSION_SWEEP_REJECTION_IS_PACKAGE
          path: package
      - name: Run exact precommitted corrected IS
        shell: bash
        run: |
          set -euo pipefail
          ALGO="$(find package -type f -name 'K6_SESSION_SWEEP_REJECTION_RESEARCH.algo' -print -quit)"
          test -n "$ALGO" && test -n "$CTRADER_IMAGE"
          mkdir -p backtest/reports backtest/cache/EURUSD
          cp "$ALGO" backtest/K6_SESSION_SWEEP_REJECTION_RESEARCH.algo
          printf '%s' "$CT_PASS" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd
          LOG='backtest/reports/K6_SESSION_SWEEP_REJECTION_IS.log'
          printf '%s\n' "ctrader backtest K6_SESSION_SWEEP_REJECTION_RESEARCH.algo --symbol=$SYMBOL --period=$PERIOD --start=$IS_START --end=$IS_END --balance=$BALANCE --data-mode=ticks --spread=$BASE_SPREAD --commission=$COMMISSION --ExpectedLeverage=500" | tee "$LOG"
          set +e
          docker run --rm -v "$PWD/backtest:/work" -e "CTID=$CTID" -e "ACCOUNT=$ACCOUNT" -e "PWD-FILE=/work/ctrader.pwd" "$CTRADER_IMAGE" backtest /work/K6_SESSION_SWEEP_REJECTION_RESEARCH.algo --environment-variables --symbol="$SYMBOL" --period="$PERIOD" --start="$IS_START" --end="$IS_END" --balance="$BALANCE" --data-mode=ticks --data-dir=/work/cache/EURUSD --spread="$BASE_SPREAD" --commission="$COMMISSION" --ExpectedLeverage=500 --report=/work/reports/K6_SESSION_SWEEP_REJECTION_IS.html --report-json=/work/reports/K6_SESSION_SWEEP_REJECTION_IS.json --exit-on-stop 2>&1 | tee -a "$LOG"
          EXIT=${PIPESTATUS[0]}
          set -e
          rm -f backtest/ctrader.pwd
          echo "$EXIT" > backtest/reports/K6_SESSION_SWEEP_REJECTION_IS.exitcode.txt
          test "$EXIT" -eq 0
          test -f backtest/reports/K6_SESSION_SWEEP_REJECTION_IS.json
      - name: Apply corrected K6 IS gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cdscalper_report_gate.py backtest/reports/K6_SESSION_SWEEP_REJECTION_IS.json --profile is --execution-log backtest/reports/K6_SESSION_SWEEP_REJECTION_IS.log --expected-spread 0.43 --out backtest/reports/K6_SESSION_SWEEP_REJECTION_IS.gate.json --fail-on-gate
      - name: Upload exact K6 IS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K6_SESSION_SWEEP_REJECTION_CORRECTED_IS
          path: backtest/reports/*
          if-no-files-found: warn
          retention-days: 30
