name: Keltner v2 Cloud Diagnose

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Keltner-Channels-Trader-v2/**'
      - '.github/workflows/keltner-v2-cloud-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create isolated Keltner workdir and extract source
        shell: bash
        run: |
          set -euo pipefail
          SRC='Keltner-Channels-Trader-v2/Keltner_Channels_Trader_v2_source.zip'
          WORK="$RUNNER_TEMP/keltner-v2-work"
          test -f "$SRC"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$SRC" -d "$WORK"
          echo "KELTNER_WORK=$WORK" >> "$GITHUB_ENV"
          echo '=== Extracted files ==='
          find "$WORK" -maxdepth 5 -type f -printf '%P\n' | sort
          echo '=== SHA256 source package ==='
          sha256sum "$SRC"

      - name: Inspect project metadata and source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== csproj ==='
          while IFS= read -r f; do
            echo "----- $f -----"
            cat "$f"
          done < <(find "$KELTNER_WORK" -type f -name '*.csproj' | sort)
          echo '=== C# source ==='
          while IFS= read -r f; do
            echo "----- $f -----"
            cat "$f"
          done < <(find "$KELTNER_WORK" -type f -name '*.cs' | sort)

      - name: Restore and build every project
        shell: bash
        run: |
          set -o pipefail
          mapfile -t projects < <(find "$KELTNER_WORK" -type f -name '*.csproj' | sort)
          if [ ${#projects[@]} -eq 0 ]; then
            echo 'ERROR: No .csproj found in source package.'
            exit 2
          fi
          rc=0
          for p in "${projects[@]}"; do
            echo "=== RESTORE: $p ==="
            dotnet restore "$p" || rc=$?
            echo "=== BUILD: $p ==="
            dotnet build "$p" -c Release --no-restore || rc=$?
          done
          exit "$rc"

      - name: Upload diagnostic workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keltner-v2-diagnostic-workspace
          path: ${{ env.KELTNER_WORK }}
          if-no-files-found: warn
          retention-days: 7
