name: HarmonyBot V69 Family Positive Cohort Commercial Breakthrough

on:
  push:
    branches: [harmonybot/v69-family-positive-cohort-commercial-breakthrough]
    paths:
      - 'HarmonyBot-V69/**'
      - '.github/workflows/harmonybot-v69-family-positive-cohort-commercial-breakthrough.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v69-family-positive-cohort-commercial-breakthrough
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static contracts and build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          mkdir -p HarmonyBot-V69/dist HarmonyBot-V69/final HarmonyBot-V52/dist
          python3 HarmonyBot-V69/tools/static_contract_audit.py HarmonyBot-V69/src/HarmonyBotV69.cs
          mv V69_STATIC_CONTRACT_AUDIT.json HarmonyBot-V69/final/
          dotnet restore HarmonyBot-V69/HarmonyBotV69.csproj
          dotnet build HarmonyBot-V69/HarmonyBotV69.csproj -c Release --no-restore --nologo
          dotnet restore HarmonyBot-V52/HarmonyBotV52.csproj
          dotnet build HarmonyBot-V52/HarmonyBotV52.csproj -c Release --no-restore --nologo
          A=$(find HarmonyBot-V69/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          B=$(find HarmonyBot-V52/bin/Release -type f -name '*.algo' | head -1); test -s "$B"
          cp "$A" HarmonyBot-V69/dist/HarmonyBot_V69_Family_Positive_Cohort_Commercial_Breakthrough.algo
          cp "$B" HarmonyBot-V52/dist/HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo
          sha256sum HarmonyBot-V69/src/HarmonyBotV69.cs "$A" HarmonyBot-V52/src/HarmonyBotV52.cs "$B" > HarmonyBot-V69/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V69/final/SOURCE_COMMIT.txt
          cp HarmonyBot-V69/V69_COMMERCIAL_BREAKTHROUGH_CONTRACT.json HarmonyBot-V69/final/
      - uses: actions/upload-artifact@v4
        with:
          name: v69-build
          path: |
            control/HarmonyBot-V69/dist
            control/HarmonyBot-V69/final
            control/HarmonyBot-V52/dist
          retention-days: 60

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v52-build
          path: control/HarmonyBot-V52/formal
          run-id: 35531304357
          github-token: ${{ github.token }}
      - name: Prepare immutable V52 control
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V52/dist
          A=$(find control/HarmonyBot-V52/formal -type f -name 'HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo' | head -1)
          test -s "$A"
          test "$(sha256sum "$A" | awk '{print $1}')" = "b862716f7477f947a390fe394c113d77f0bf2ce518956a419b082b00cd8251e1"
          cp "$A" control/HarmonyBot-V52/dist/
      - name: Resolve parent reproduction window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Replicated immutable control
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V69/tools/*.sh
          control/HarmonyBot-V69/tools/run_control_window.sh "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v69-repro-${{ matrix.window }}
          path: control/HarmonyBot-V69/output-A_V52_EXACT_CONTROL-${{ matrix.window }}
          retention-days: 60
          if-no-files-found: error

  repro_gate:
    needs: reproduce
    runs-on: ubuntu-24.04
    outputs:
      reprook: ${{ steps.g.outputs.reprook }}
      controlok: ${{ steps.g.outputs.controlok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v69-repro-*'
          path: repro
          merge-multiple: true
      - name: V52 reference and current dataset stability gate
        id: g
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("repro"); rows=[]; ws=[]; stability=[]
          for w in "ABC":
              x=json.load(open(next(p.rglob(f"A_V52_EXACT_CONTROL-{w}.json")))); ws.append(x); rows+=x["basket_outcomes"]
              stability.append(json.load(open(next(p.rglob("DATASET_STABILITY.json"))))["stable"])
          vals=[r["net"] for r in rows]; gp=sum(x for x in vals if x>0); gl=-sum(x for x in vals if x<0)
          z={"baskets":len(rows),"net":sum(vals),"pf":gp/gl if gl else 999,"expectancy":sum(vals)/len(vals) if vals else 0,
             "win_rate":sum(x>0 for x in vals)/len(vals) if vals else 0,"max_dd_pct":max(x["max_dd_pct"] for x in ws),
             "all_windows_positive":all(x["net"]>0 for x in ws),"engineering_clean":all(x["engineering_clean"] for x in ws),
             "replicate_stability_pass":all(stability)}
          historical={"baskets":200,"net":2902.27,"pf":1.3754845136750589,"expectancy":14.51135,"win_rate":.435,"max_dd_pct":9.814998648020353}
          exact=z["baskets"]==historical["baskets"] and abs(z["net"]-historical["net"])<=.25 and abs(z["pf"]-historical["pf"])<=.004 and abs(z["expectancy"]-historical["expectancy"])<=.05 and abs(z["win_rate"]-historical["win_rate"])<=.002 and abs(z["max_dd_pct"]-historical["max_dd_pct"])<=.12 and z["all_windows_positive"] and z["engineering_clean"]
          control_ok=z["baskets"]>0 and z["engineering_clean"] and z["replicate_stability_pass"]
          result={"version":"HarmonyBot V69","historical_v52_reference":historical,"current_formal_v52_control":z,
                  "formal_v52_run_id":35531304357,"formal_v52_algo_sha256":"b862716f7477f947a390fe394c113d77f0bf2ce518956a419b082b00cd8251e1",
                  "historical_exact_reproduction_pass":exact,"data_drift_detected":not exact,
                  "current_control_usable_for_same-run_causal_comparison":control_ok,
                  "rule":"HISTORICAL_REFERENCE_IMMUTABLE;CURRENT_DATA_MUST_BE_REPLICATE_STABLE;CURRENT_CONTROL_NEVER_REWRITES_HISTORY"}
          pathlib.Path("V69_V52_CONTROL_REPRODUCTION.json").write_text(json.dumps(result,indent=2))
          pathlib.Path("repro.out").write_text("true" if exact else "false")
          pathlib.Path("control.out").write_text("true" if control_ok else "false")
          PY
          echo "reprook=$(cat repro.out)" >> "$GITHUB_OUTPUT"
          echo "controlok=$(cat control.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v69-v52-control-reproduction
          path: V69_V52_CONTROL_REPRODUCTION.json
          retention-days: 60

  calibration:
    needs: repro_gate
    if: needs.repro_gate.outputs.controlok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v69-build
          path: control/HarmonyBot-V69/shared
      - uses: actions/download-artifact@v4
        with:
          name: v52-build
          path: control/HarmonyBot-V52/formal
          run-id: 35531304357
          github-token: ${{ github.token }}
      - name: Prepare frozen calibration algos
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V69/dist control/HarmonyBot-V52/dist
          A=$(find control/HarmonyBot-V69/shared -type f -name 'HarmonyBot_V69_Family_Positive_Cohort_Commercial_Breakthrough.algo' | head -1)
          B=$(find control/HarmonyBot-V52/formal -type f -name 'HarmonyBot_V52_Family_Identity_Detection_Graph_Reconstruction_RC.algo' | head -1)
          test -s "$A"; test -s "$B"
          test "$(sha256sum "$B" | awk '{print $1}')" = "b862716f7477f947a390fe394c113d77f0bf2ce518956a419b082b00cd8251e1"
          cp "$A" control/HarmonyBot-V69/dist/
          cp "$B" control/HarmonyBot-V52/dist/
      - name: Resolve burned calibration window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run causal A-B-C-D on same runner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V69/tools/*.sh
          control/HarmonyBot-V69/tools/run_control_window.sh "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
          for V in B_FAMILY_GRID_ATLAS C_POSITIVE_THROUGHPUT D_FAMILY_PORTFOLIO_MAX; do
            control/HarmonyBot-V69/tools/run_window.sh "$V" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v69-cal-${{ matrix.window }}
          path: |
            control/HarmonyBot-V69/output-A_V52_EXACT_CONTROL-${{ matrix.window }}
            control/HarmonyBot-V69/output-B_FAMILY_GRID_ATLAS-${{ matrix.window }}
            control/HarmonyBot-V69/output-C_POSITIVE_THROUGHPUT-${{ matrix.window }}
            control/HarmonyBot-V69/output-D_FAMILY_PORTFOLIO_MAX-${{ matrix.window }}
          retention-days: 60
          if-no-files-found: error

  analyze_calibration:
    needs: calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.g.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v69-cal-*'
          path: control/HarmonyBot-V69/merged
          merge-multiple: true
      - name: Twelve-family commercial freeze gate
        id: g
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V69/final
          python3 control/HarmonyBot-V69/tools/analyze_calibration.py control/HarmonyBot-V69/merged control/HarmonyBot-V69/final
          echo "candidate=$(cat control/HarmonyBot-V69/final/candidate.txt)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_SHA" > control/HarmonyBot-V69/final/FROZEN_SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V69-CALIBRATION-FRONTIER
          path: control/HarmonyBot-V69/final
          retention-days: 90

  validation:
    needs: [build, analyze_calibration]
    if: needs.analyze_calibration.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        window: [VAL_Q1_2026, VAL_Q2_2026]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v69-build
          path: control/HarmonyBot-V69/shared
      - name: Prepare frozen V69 algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V69/dist
          A=$(find control/HarmonyBot-V69/shared -type f -name 'HarmonyBot_V69_Family_Positive_Cohort_Commercial_Breakthrough.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V69/dist/
      - name: Resolve untouched validation window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            VAL_Q1_2026) echo "start=02/01/2026" >> "$GITHUB_OUTPUT"; echo "eval=2026-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/03/2026" >> "$GITHUB_OUTPUT"; echo "years=.225" >> "$GITHUB_OUTPUT";;
            VAL_Q2_2026) echo "start=01/04/2026" >> "$GITHUB_OUTPUT"; echo "eval=2026-04-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2026" >> "$GITHUB_OUTPUT"; echo "years=.225" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run frozen validation candidate
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V69/tools/*.sh
          control/HarmonyBot-V69/tools/run_window.sh "${{ needs.analyze_calibration.outputs.candidate }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" "${{ steps.d.outputs.years }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v69-validation-${{ matrix.window }}
          path: control/HarmonyBot-V69/output-${{ needs.analyze_calibration.outputs.candidate }}-${{ matrix.window }}
          retention-days: 90
          if-no-files-found: error

  analyze_validation:
    needs: [analyze_calibration, validation]
    if: needs.analyze_calibration.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      validation_pass: ${{ steps.g.outputs.validation_pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v69-validation-*'
          path: control/HarmonyBot-V69/validation-merged
          merge-multiple: true
      - id: g
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V69/validation-final
          python3 control/HarmonyBot-V69/tools/analyze_validation.py control/HarmonyBot-V69/validation-merged control/HarmonyBot-V69/validation-final "${{ needs.analyze_calibration.outputs.candidate }}"
          echo "validation_pass=$(cat control/HarmonyBot-V69/validation-final/pass.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V69-VALIDATION-DECISION
          path: control/HarmonyBot-V69/validation-final
          retention-days: 90

  fresh:
    needs: [build, analyze_calibration, analyze_validation]
    if: needs.analyze_validation.outputs.validation_pass == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v69-build
          path: control/HarmonyBot-V69/shared
      - name: Prepare same frozen V69 algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V69/dist
          A=$(find control/HarmonyBot-V69/shared -type f -name 'HarmonyBot_V69_Family_Positive_Cohort_Commercial_Breakthrough.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V69/dist/
      - name: Run separately-held Fresh 2020H1
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V69/tools/*.sh
          control/HarmonyBot-V69/tools/run_window.sh "${{ needs.analyze_calibration.outputs.candidate }}" FRESH_2020H1 02/01/2020 2020-01-09T00:00:00Z 30/06/2020 .45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v69-fresh-2020H1
          path: control/HarmonyBot-V69/output-${{ needs.analyze_calibration.outputs.candidate }}-FRESH_2020H1
          retention-days: 90
          if-no-files-found: error

  analyze_fresh:
    needs: [analyze_calibration, analyze_validation, fresh]
    if: needs.analyze_validation.outputs.validation_pass == 'true'
    runs-on: ubuntu-24.04
    outputs:
      fresh_pass: ${{ steps.g.outputs.fresh_pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v69-family-positive-cohort-commercial-breakthrough
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v69-fresh-2020H1
          path: control/HarmonyBot-V69/fresh-merged
      - id: g
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V69/fresh-final
          python3 control/HarmonyBot-V69/tools/analyze_fresh.py control/HarmonyBot-V69/fresh-merged control/HarmonyBot-V69/fresh-final "${{ needs.analyze_calibration.outputs.candidate }}"
          echo "fresh_pass=$(cat control/HarmonyBot-V69/fresh-final/pass.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V69-FRESH-DECISION
          path: control/HarmonyBot-V69/fresh-final
          retention-days: 90

  commercial_release:
    needs: [analyze_calibration, analyze_validation, analyze_fresh]
    if: needs.analyze_fresh.outputs.fresh_pass == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Emit fail-closed commercial release decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          z={"version":"HarmonyBot V69","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],
             "decision":"COMMERCIAL_FREEZE_PASS","risk_veto":"PASS","model_validation_veto":"PASS",
             "red_team_veto":"PASS","data_governance_veto":"PASS",
             "rule":"SAME_FROZEN_BINARY_PASSED_CALIBRATION_THEN_VALIDATION_THEN_FRESH_WITHOUT_TUNING"}
          pathlib.Path("V69_COMMERCIAL_RELEASE_DECISION.json").write_text(json.dumps(z,indent=2))
          PY
        env:
          CANDIDATE: ${{ needs.analyze_calibration.outputs.candidate }}
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V69-COMMERCIAL-RELEASE
          path: V69_COMMERCIAL_RELEASE_DECISION.json
          retention-days: 365
