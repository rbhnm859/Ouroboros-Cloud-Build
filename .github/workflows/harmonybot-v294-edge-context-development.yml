          out={'candidate':os.environ['CANDIDATE_ID'],'baskets':len(vals),'gross_profit':gp,'gross_loss':gl,'pf':pf,'net':net,'expectancy':net/len(vals) if vals else 0,'win_rate_pct':100*len(W)/len(vals) if vals else 0,'realized_rr':aw/abs(al) if aw>0 and al<0 else None,'max_dd_pct':dd,'direction_distribution':dist('direction'),'pattern_distribution':dist('pattern'),'grid_distribution':dist('grid'),'execution_errors':errs}
