name: HarmonyBot V29.4 Edge Context Gate Development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v294-edge-context-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_PATCH_COMMIT: 294c73aaa9f1a133899134982ba4cd4fb54de527

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccde79d22c0389ba64d9bb26a2e54379d81c91e
          path: base
      - uses: actions/checkout@v4
        with:
          ref: 294c73aaa9f1a133899134982ba4cd4fb54de527
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build frozen V29.4 source patch
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "${SOURCE_PATCH_COMMIT}"
          cp control/tmp/harmonybot-v26-build/fix_v294_edge_context_gate.py /tmp/fix_v294_edge_context_gate.py
          cd base
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          python3 /tmp/fix_v294_edge_context_gate.py
          mkdir -p seal/{build,algo}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.4-Edge-Context-Gate-Dev' seal/build/HarmonyBotPro.cs
          grep -Fq 'V294AllowBuy' seal/build/HarmonyBotPro.cs
          grep -Fq 'V294AllowSell' seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3 GRID-RISK-CAP-HOTFIX' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v294_edge_context</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit); test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v294_edge_context.algo
          printf '%s\n' "${SOURCE_PATCH_COMMIT}" > seal/SOURCE_PATCH_COMMIT.txt
          sha256sum seal/build/HarmonyBotPro.cs seal/algo/*.algo > seal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: base/seal
          retention-days: 30

  engineering_regression:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: seal
      - name: Resolve FxPro demo 1:500 USD account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Feature-off $100 engineering regression
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-edge-reg-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest             /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start=02/09/2026 --end=16/09/2026 --balance=100 --data-mode=ticks --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=true --SmallAccountMinSLPips=25 --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2             --GridProfitFib=1.618 --GridStopFib=1.618 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25             --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-09-09T00:00:00Z             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3             --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35             --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0             --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04             --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66             --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25             --V294AllowBuy=true --V294AllowSell=true             --report=/work/reports/D7.html --report-json=/work/reports/D7.json > seal/logs/D7.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<3600;i+=3)); do
            if test -s seal/reports/D7.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/D7.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 3
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: Engineering audit
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          d=json.load(open('seal/reports/D7.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=pathlib.Path('seal/logs/D7.log').read_text(errors='ignore')
          losses=[abs(float(x.get('net',0) or 0)) for x in h if float(x.get('net',0) or 0)<0]
          errs=[x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)]
          dm=re.findall(r'directionBlocked=(\d+)',t)
          out={'source':'V29.4-Edge-Context-Gate-Dev','source_commit':'294c73aaa9f1a133899134982ba4cd4fb54de527','feature_mode':'OFF_COMPATIBILITY','trades':len(h),'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'max_single_loss_usd':max(losses,default=0),'execution_errors':len(errs),'direction_blocked':int(dm[-1]) if dm else None,'risk_cap_events':len(re.findall(r'V293-GRID-RISK-CAP',t))}
          hard=[]
          if len(h)<1: hard.append('no_trades')
          if out['max_dd_pct']>10: hard.append('dd_gt_10')
          if out['max_single_loss_usd']>1.40+1e-9: hard.append('single_loss_gt_1.40')
          if errs: hard.append('execution_integrity')
          if out['direction_blocked'] not in (0,None): hard.append('feature_off_not_compatible')
          out['pass']=not hard; out['hard_fail_reasons']=hard
          pathlib.Path('seal/audit/V294-EDGE-ENGINEERING.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if hard: raise SystemExit(','.join(hard))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; docker run --rm -v "$PWD/seal:/work" alpine:3.22 sh -c 'rm -rf /work/data' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-EDGE-ENGINEERING-REGRESSION
          path: |
            seal/audit
            seal/reports
            seal/logs
            seal/SOURCE_PATCH_COMMIT.txt
          retention-days: 30

  development:
    needs: engineering_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        preset:
          - { id: SELL_LONDON_FULLBOT, allow_buy: 'false', session_end: '13', grid: 'true', eligible: 'true', dst_aware: 'false' }
          - { id: SELL_LONDON_NOGRID, allow_buy: 'false', session_end: '13', grid: 'false', eligible: 'true', dst_aware: 'false' }
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CANDIDATE_ID: ${{ matrix.preset.id }}
      ALLOW_BUY: ${{ matrix.preset.allow_buy }}
      SESSION_END: ${{ matrix.preset.session_end }}
      GRID_ENABLED: ${{ matrix.preset.grid }}
      ELIGIBLE: ${{ matrix.preset.eligible }}
      DST_AWARE: ${{ matrix.preset.dst_aware }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: seal
      - name: Resolve FxPro account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Development counterfactual fidelity run
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          OUT="${CANDIDATE_ID}-${WINDOW_ID}"
          C="v294-${CANDIDATE_ID,,}-${WINDOW_ID,,}-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest             /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=10000 --data-mode=m1 --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=false --SessionStart=8 --SessionEnd="$SESSION_END" --DstAwareInstitutionalSession="$DST_AWARE" --MinAtrPrice=0.5             --V294AllowBuy="$ALLOW_BUY" --V294AllowSell=true --EnableFibGrid="$GRID_ENABLED"             --EnableAltBat=true --EnableFiveZero=true --MinRR=2 --GridProfitFib=1.618 --GridStopFib=1.618             --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25             --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL_DATE"             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3             --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35             --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=false --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false             --report="/work/reports/${OUT}.html" --report-json="/work/reports/${OUT}.json" > "seal/logs/${OUT}.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<6000;i+=4)); do
            if test -s "seal/reports/${OUT}.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/${OUT}.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 4
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          if test "$DONE" != 1; then echo '{"status":"BACKTEST_FAILED"}' > "seal/audit/${OUT}.json"; fi
      - name: Basket and funnel audit
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,datetime,math,collections
          c=os.environ['CANDIDATE_ID']; w=os.environ['WINDOW_ID']; outname=f'{c}-{w}'
          rp=pathlib.Path(f'seal/reports/{outname}.json'); lp=pathlib.Path(f'seal/logs/{outname}.log'); ap=pathlib.Path(f'seal/audit/{outname}.json')
          if not rp.exists():
              if not ap.exists(): ap.write_text(json.dumps({'candidate':c,'window':w,'status':'BACKTEST_FAILED'},indent=2))
              raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore')
          groups={}
          for x in h:
              key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'entryPrice':key[3],'closeTime':0,'net':0.0,'fragments':0})
              g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0)); g['fragments']+=1
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime'])
          children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
          pats=re.findall(r'\[GRID\]\s+Basket\s+#\d+\s+created\s+\|\s*([^|]+?)\s*\|',t,re.I)
          if len(pats)<len(mains):
              tp=re.findall(r'\[TRADE\]\s+(\S+)\s+(?:Buy|Sell)',t,re.I)
              if len(tp)>=len(mains): pats=tp
          baskets=[]
          for i,g in enumerate(mains):
              ts=g['entryTime']/1000 if g['entryTime']>10**11 else g['entryTime']
              dt=datetime.datetime.fromtimestamp(ts,datetime.timezone.utc) if ts>0 else None
              hr=dt.hour if dt else -1
              session='LONDON' if 8<=hr<13 else ('OVERLAP' if 13<=hr<16 else ('NEW_YORK' if 16<=hr<22 else 'OTHER'))
              baskets.append({'pattern':pats[i].strip() if i<len(pats) else 'Unknown','direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'session':session,'net':g['net'],'grid_children':0})
          for ch in children:
              cand=[b for b in baskets if b['direction']==ch['direction'] and b['entryTime']<=ch['entryTime']<=b['closeTime']]
              if not cand: cand=[b for b in baskets if b['direction']==ch['direction'] and 0<=ch['entryTime']-b['entryTime']<=4*60*60*1000]
              if cand:
                  b=max(cand,key=lambda z:z['entryTime']); b['net']+=ch['net']; b['grid_children']+=1; b['closeTime']=max(b['closeTime'],ch['closeTime'])
          for b in baskets: b['grid_status']='GRID' if b['grid_children'] else 'NON_GRID'
          vals=[b['net'] for b in baskets]; W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gp=sum(W); gl=abs(sum(L)); net=sum(vals)
          pf=gp/gl if gl>0 else (999 if gp>0 else 0); aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0
          loss_abs=sorted([abs(x) for x in L],reverse=True); tl=sum(loss_abs)
          def dist(field):
              z=collections.Counter(str(b[field]) for b in baskets); return dict(sorted(z.items()))
          def li(name):
              m=re.findall(rf'{re.escape(name)}=(\d+)',t); return int(m[-1]) if m else 0
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          dm=re.findall(r'directionBlocked=(\d+)',t)
          out={
            'candidate':c,'window':w,'status':'OK','eligible_candidate':os.environ['ELIGIBLE']=='true',
            'config':{'allow_buy':os.environ['ALLOW_BUY']=='true','allow_sell':True,'session_start':8,'session_end':int(os.environ['SESSION_END']),'dst_aware':os.environ['DST_AWARE']=='true','grid_enabled':os.environ['GRID_ENABLED']=='true','min_atr_price':0.5,'pattern_universe':'FULL_PHASE3'},
            'baskets':len(vals),'wins':len(W),'losses':len(L),'gross_profit':gp,'gross_loss':gl,'pf':pf,'net':net,'expectancy':net/len(vals) if vals else 0,
            'win_rate_pct':100*len(W)/len(vals) if vals else 0,'realized_rr':aw/abs(al) if aw>0 and al<0 else None,
            'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'largest_loss':min(L) if L else 0,
            'top1_loss_contribution_pct':100*sum(loss_abs[:1])/tl if tl else 0,'top3_loss_contribution_pct':100*sum(loss_abs[:3])/tl if tl else 0,'top5_loss_contribution_pct':100*sum(loss_abs[:5])/tl if tl else 0,
            'signals':li('signals'),'executed_orders':li('orders'),'atr_blocked':li('atrBlocked'),'mtf_blocked':li('mtfBlocked'),'geometry_blocked':li('geometryBlocked'),
            'volume_blocked':li('volumeBlocked'),'risk_blocked':li('riskBlocked'),'capital_infeasible':li('capitalInfeasible'),
            'direction_blocked':int(dm[-1]) if dm else 0,'execution_errors':errs,
            'direction_distribution':dist('direction'),'pattern_distribution':dist('pattern'),'grid_distribution':dist('grid_status'),'session_distribution':dist('session')
          }
          ap.write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; docker run --rm -v "$PWD/seal:/work" alpine:3.22 sh -c 'rm -rf /work/data' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-EDGE-DEV-${{ matrix.preset.id }}-${{ matrix.window.id }}
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  dev_gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
      winner: ${{ steps.gate.outputs.winner }}
      session_end: ${{ steps.gate.outputs.session_end }}
      grid_enabled: ${{ steps.gate.outputs.grid_enabled }}
      dst_aware: ${{ steps.gate.outputs.dst_aware }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: V294-EDGE-DEV-*
          path: all
          merge-multiple: true
      - id: gate
        name: Development hard gate and direction attribution
        run: |
          python3 - <<'PY'
          import json,glob,pathlib,os
          rows=[json.load(open(p)) for p in glob.glob('all/audit/*.json')+glob.glob('all/*.json') if pathlib.Path(p).is_file()]
          rows=[x for x in rows if x.get('status')=='OK']
          cfg={
            'SELL_LONDON_FULLBOT':{'session_end':'13','grid_enabled':'true','dst_aware':'false'},
            'SELL_LONDON_NOGRID':{'session_end':'13','grid_enabled':'false','dst_aware':'false'}
          }
          by={}
          for x in rows: by.setdefault(x['candidate'],[]).append(x)
          summary={}
          for cid,rs in by.items():
