          pathlib.Path('V294-EDGE-FINAL-DECISION.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V294-EDGE-FINAL-DECISION
          path: V294-EDGE-FINAL-DECISION.json
          retention-days: 30
