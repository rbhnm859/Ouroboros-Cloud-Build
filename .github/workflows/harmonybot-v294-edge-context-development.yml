          vals=[b['net'] for b in baskets]; W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gp=sum(W); gl=abs(sum(L)); net=sum(vals); pf=gp/gl if gl>0 else (999 if gp>0 else 0)
