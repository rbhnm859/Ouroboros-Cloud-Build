name: HarmonyBot V29.4 Edge Context Gate Development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v294-edge-context-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE: CYPHER_SELL_NONGRID_LONDON

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccde79d22c0389ba64d9bb26a2e54379d81c91e
          path: base
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build minimal V29.4 from exact V29.3
        run: |
          set -euo pipefail
          cd base
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          python3 ../control/tmp/harmonybot-v26-build/fix_v294_edge_context_gate.py
          mkdir -p seal/{build,algo}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.4-Edge-Context-Gate-Dev' seal/build/HarmonyBotPro.cs
          grep -Fq 'V294AllowBuy' seal/build/HarmonyBotPro.cs
          grep -Fq 'V294AllowSell' seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3 GRID-RISK-CAP-HOTFIX' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v294_edge_context</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit); test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v294_edge_context.algo
          sha256sum seal/build/HarmonyBotPro.cs seal/algo/*.algo > seal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: base/seal
          retention-days: 30

  engineering_regression:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: seal
      - name: Resolve FxPro demo 1:500 USD account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Feature-off $100 D7 regression
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-edge-reg-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest             /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start=02/09/2026 --end=16/09/2026 --balance=100 --data-mode=ticks --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD             --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=true --SmallAccountMinSLPips=25             --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2             --GridProfitFib=1.618 --GridStopFib=1.618             --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25             --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-09-09T00:00:00Z             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3             --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35             --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0             --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04             --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66             --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25             --V294AllowBuy=true --V294AllowSell=true             --report=/work/reports/D7.html --report-json=/work/reports/D7.json > seal/logs/D7.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<3600;i+=3)); do
            if test -s seal/reports/D7.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/D7.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 3
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: Engineering audit
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          d=json.load(open('seal/reports/D7.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=pathlib.Path('seal/logs/D7.log').read_text(errors='ignore')
          losses=[abs(float(x.get('net',0) or 0)) for x in h if float(x.get('net',0) or 0)<0]
          errs=[x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)]
          dm=re.findall(r'directionBlocked=(\d+)',t)
          out={'source':'V29.4-Edge-Context-Gate-Dev','feature_mode':'OFF_COMPATIBILITY','trades':len(h),'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'max_single_loss_usd':max(losses,default=0),'execution_errors':len(errs),'direction_blocked':int(dm[-1]) if dm else None,'risk_cap_events':len(re.findall(r'V293-GRID-RISK-CAP',t))}
          hard=[]
          if len(h)<1: hard.append('no_trades')
          if out['max_dd_pct']>10: hard.append('dd_gt_10')
          if out['max_single_loss_usd']>1.40+1e-9: hard.append('single_loss_gt_1.40')
          if errs: hard.append('execution_integrity')
          if out['direction_blocked'] not in (0,None): hard.append('feature_off_not_compatible')
          out['pass']=not hard; out['hard_fail_reasons']=hard
          pathlib.Path('seal/audit/V294-EDGE-ENGINEERING.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if hard: raise SystemExit(','.join(hard))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-EDGE-ENGINEERING-REGRESSION
          path: seal
          retention-days: 30

  development:
    needs: engineering_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: seal
      - name: Resolve FxPro account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Frozen edge-cluster Development
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-edge-${WINDOW_ID,,}-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest             /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=10000 --data-mode=m1 --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=false --SessionStart=8 --SessionEnd=13 --MinAtrPrice=0.5             --V294AllowBuy=false --V294AllowSell=true --EnableFibGrid=false             --EnableGartley=false --EnableBat=false --EnableButterfly=false --EnableCrab=false --EnableCypher=true             --EnableRat=false --EnableDeepGartley=false --EnableAltBat=false --EnableDeepCrab=false --EnableABCD=false --EnableShark=false --EnableFiveZero=false             --MinRR=2 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25             --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL_DATE"             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 --V29PendingMinCompositeQuality=0.58             --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=false --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false             --report="/work/reports/${WINDOW_ID}.html" --report-json="/work/reports/${WINDOW_ID}.json" > "seal/logs/${WINDOW_ID}.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<6000;i+=4)); do
            if test -s "seal/reports/${WINDOW_ID}.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/${WINDOW_ID}.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 4
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          if test "$DONE" != 1; then echo '{"status":"BACKTEST_FAILED"}' > "seal/audit/${WINDOW_ID}.json"; fi
      - name: Basket audit
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,math
          w=os.environ['WINDOW_ID']; rp=pathlib.Path(f'seal/reports/{w}.json'); lp=pathlib.Path(f'seal/logs/{w}.log'); ap=pathlib.Path(f'seal/audit/{w}.json')
          if not rp.exists():
              if not ap.exists(): ap.write_text(json.dumps({'window':w,'status':'BACKTEST_FAILED'},indent=2))
              raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore')
          g={}
          for x in h:
              if str(x.get('label',''))!='HarmonyBotPro': continue
              k=(str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g[k]=g.get(k,0.0)+float(x.get('net',0) or 0)
          vals=list(g.values()); W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gw=sum(W); gl=abs(sum(L)); net=sum(vals)
          pf=gw/gl if gl>0 else (999 if gw>0 else 0); aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0
          loss_abs=sorted([abs(x) for x in L],reverse=True); tl=sum(loss_abs)
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          dm=re.findall(r'directionBlocked=(\d+)',t)
          out={'candidate':'CYPHER_SELL_NONGRID_LONDON','window':w,'status':'OK','baskets':len(vals),'wins':len(W),'losses':len(L),'pf':pf,'net':net,'expectancy':net/len(vals) if vals else 0,'win_rate_pct':100*len(W)/len(vals) if vals else 0,'realized_rr':aw/abs(al) if aw>0 and al<0 else None,'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'largest_loss':min(L) if L else 0,'top1_loss_contribution_pct':100*sum(loss_abs[:1])/tl if tl else 0,'top3_loss_contribution_pct':100*sum(loss_abs[:3])/tl if tl else 0,'top5_loss_contribution_pct':100*sum(loss_abs[:5])/tl if tl else 0,'direction_blocked':int(dm[-1]) if dm else None,'execution_errors':errs}
          ap.write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-EDGE-DEV-${{ matrix.window.id }}
          path: seal/audit
          retention-days: 30

  dev_gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: V294-EDGE-DEV-*
          path: all
          merge-multiple: true
      - id: gate
        name: Development hard gate
        run: |
          python3 - <<'PY'
          import json,glob,pathlib,os
          rows=[json.load(open(p)) for p in glob.glob('all/*.json')]; ok=[x for x in rows if x.get('status')=='OK']
          active=sum(1 for x in ok if x.get('baskets',0)>0); total=sum(x.get('baskets',0) for x in ok); net=sum(x.get('net',0) for x in ok)
          pfs=[x.get('pf',0) for x in ok if x.get('baskets',0)>0]; pos=sum(1 for x in ok if x.get('net',0)>0); maxdd=max([x.get('max_dd_pct',0) for x in ok] or [999]); errs=sum(x.get('execution_errors',0) for x in ok)
          passed=bool(len(ok)==3 and active==3 and total>=20 and maxdd<=10 and net>0 and pfs and min(pfs)>1 and pos>=2 and errs==0)
          out={'candidate':'CYPHER_SELL_NONGRID_LONDON','rows':sorted(ok,key=lambda x:x['window']),'active_windows':active,'total_baskets':total,'total_net':net,'worst_pf':min(pfs) if pfs else 0,'positive_windows':pos,'max_dd_pct':maxdd,'execution_errors':errs,'dev_gate_pass':passed}
          pathlib.Path('V294-EDGE-DEV-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('pass='+('true' if passed else 'false')+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V294-EDGE-DEVELOPMENT-GATE
          path: V294-EDGE-DEV-GATE.json
          retention-days: 30

  validation:
    needs: dev_gate
    if: needs.dev_gate.outputs.pass == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      pass: ${{ steps.audit.outputs.pass }}
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: seal
      - name: Resolve FxPro account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip(); m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Frozen VAL-2 ticks
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-edge-val2-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start=01/07/2020 --end=31/12/2020 --balance=10000 --data-mode=ticks --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=false --SessionStart=8 --SessionEnd=13 --MinAtrPrice=0.5 --V294AllowBuy=false --V294AllowSell=true --EnableFibGrid=false             --EnableGartley=false --EnableBat=false --EnableButterfly=false --EnableCrab=false --EnableCypher=true --EnableRat=false --EnableDeepGartley=false --EnableAltBat=false --EnableDeepCrab=false --EnableABCD=false --EnableShark=false --EnableFiveZero=false             --MinRR=2 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2020-07-08T00:00:00Z             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=false --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false             --report=/work/reports/VAL2.html --report-json=/work/reports/VAL2.json > seal/logs/VAL2.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<9600;i+=5)); do
            if test -s seal/reports/VAL2.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/VAL2.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - id: audit
        name: VAL-2 basket gate
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          d=json.load(open('seal/reports/VAL2.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=pathlib.Path('seal/logs/VAL2.log').read_text(errors='ignore')
          g={}
          for x in h:
              if str(x.get('label',''))!='HarmonyBotPro': continue
              k=(str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5)); g[k]=g.get(k,0.0)+float(x.get('net',0) or 0)
          vals=list(g.values()); W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gw=sum(W); gl=abs(sum(L)); net=sum(vals); pf=gw/gl if gl>0 else (999 if gw>0 else 0)
          aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0; dd=float(eq.get('maxEquityDrawdownPercent',0) or 0); errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          out={'candidate':'CYPHER_SELL_NONGRID_LONDON','baskets':len(vals),'pf':pf,'net':net,'expectancy':net/len(vals) if vals else 0,'win_rate_pct':100*len(W)/len(vals) if vals else 0,'realized_rr':aw/abs(al) if aw>0 and al<0 else None,'max_dd_pct':dd,'execution_errors':errs}
          out['val_gate_pass']=bool(len(vals)>=10 and dd<=10 and pf>1 and net>0 and out['expectancy']>0 and errs==0)
          pathlib.Path('seal/audit/VAL2-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('pass='+('true' if out['val_gate_pass'] else 'false')+'\n')
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-EDGE-VAL2
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  small_capital:
    needs: validation
    if: needs.validation.outputs.pass == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
