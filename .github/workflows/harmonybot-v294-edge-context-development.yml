          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip(); m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Frozen $100 Small-Capital Regression
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-edge-100-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start=01/07/2020 --end=31/12/2020 --balance=100 --data-mode=ticks --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=true --SmallAccountMinSLPips=25 --SessionStart=8 --SessionEnd=13 --MinAtrPrice=0.5 --V294AllowBuy=false --V294AllowSell=true --EnableFibGrid=false             --EnableGartley=false --EnableBat=false --EnableButterfly=false --EnableCrab=false --EnableCypher=true --EnableRat=false --EnableDeepGartley=false --EnableAltBat=false --EnableDeepCrab=false --EnableABCD=false --EnableShark=false --EnableFiveZero=false             --MinRR=2 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2020-07-08T00:00:00Z             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0             --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66 --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25             --report=/work/reports/SMALL100.html --report-json=/work/reports/SMALL100.json > seal/logs/SMALL100.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<9600;i+=5)); do
            if test -s seal/reports/SMALL100.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/SMALL100.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: $100 audit
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          d=json.load(open('seal/reports/SMALL100.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); main=d.get('main',{}); t=pathlib.Path('seal/logs/SMALL100.log').read_text(errors='ignore')
          g={}
          for x in h:
              if str(x.get('label',''))!='HarmonyBotPro': continue
              k=(str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5)); g[k]=g.get(k,0.0)+float(x.get('net',0) or 0)
          vals=list(g.values()); W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gw=sum(W); gl=abs(sum(L)); net=sum(vals); pf=gw/gl if gl>0 else (999 if gw>0 else 0)
          def li(n):
              m=re.findall(rf'{n}=(\d+)',t); return int(m[-1]) if m else 0
          errs=[x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)]
          margin_keys={k:v for k,v in main.items() if 'margin' in str(k).lower() or 'free' in str(k).lower()}
          out={'candidate':'CYPHER_SELL_NONGRID_LONDON','initial_balance':100,'raw_signals':None,'raw_signals_note':'V29.4 does not emit pre-ATR raw harmonic count','eligible_signals':li('geometryValid'),'executed_trades':len(vals),'skipped_by_min_volume':li('volumeBlocked'),'skipped_by_risk':li('riskBlocked'),'skipped_by_margin':len([x for x in t.splitlines() if re.search(r'Insufficient Margin',x,re.I)]),'direction_blocked':li('directionBlocked'),'net':net,'pf':pf,'expectancy':net/len(vals) if vals else 0,'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'maximum_actual_risk':None,'maximum_actual_risk_note':'entry risk telemetry not emitted; max realized loss reported separately','max_realized_loss_usd':max([abs(x) for x in L],default=0),'maximum_margin_usage':margin_keys.get('maxMargin') or margin_keys.get('maxMarginUsed'),'minimum_free_margin':margin_keys.get('minFreeMargin'),'report_margin_fields':margin_keys,'execution_errors':len(errs)}
          out['small_cap_pass']=bool(len(vals)>0 and out['max_dd_pct']<=10 and pf>1 and out['expectancy']>0 and not errs)
          pathlib.Path('seal/audit/SMALL100-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-EDGE-SMALL100
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  decision:
