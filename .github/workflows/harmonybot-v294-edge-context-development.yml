          vp=pathlib.Path('out/val/audit/VAL2-GATE.json'); val=json.load(open(vp)) if vp.exists() else {'status':'NOT_RUN','val_gate_pass':False}
          sp=pathlib.Path('out/small/audit/SMALL100-GATE.json'); small=json.load(open(sp)) if sp.exists() else {'status':'NOT_RUN','small_cap_pass':False}
