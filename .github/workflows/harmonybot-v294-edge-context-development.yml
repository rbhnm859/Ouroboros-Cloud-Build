name: HarmonyBot V29.4 Final Commercial Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v294-edge-context-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_PATCH_COMMIT: 294c73aaa9f1a133899134982ba4cd4fb54de527
  FROZEN_BUILD_RUN_ID: '35305868743'

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-EDGE-CONTEXT-BUILD
          path: seal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_BUILD_RUN_ID }}
      - name: Verify frozen V29.4 build
        run: |
          set -euo pipefail
          test "$(cat seal/SOURCE_PATCH_COMMIT.txt)" = "$SOURCE_PATCH_COMMIT"
          test -s seal/algo/HarmonyBotPro_v294_edge_context.algo
      - name: Resolve FxPro demo 1:500 USD account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd
          chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500:
              raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          )
          echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: TAIL_PAYOFF_HYBRID_MIN Development
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          OUT="TAIL_PAYOFF_HYBRID_MIN-$WINDOW_ID"
          C="v294-hybrid-$GITHUB_RUN_ID-$WINDOW_ID"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/algo/HarmonyBotPro_v294_edge_context.algo             --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER"             --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=10000 --data-mode=m1 --data-dir=/work/data             --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100             --SmallAccountMode=false --SessionStart=8 --SessionEnd=13 --DstAwareInstitutionalSession=false --MinAtrPrice=0.5             --V294AllowBuy=false --V294AllowSell=true --EnableFibGrid=true --EnableAltBat=true --EnableFiveZero=true --MinRR=2             --GridProfitFib=1.618 --GridStopFib=1.618 --GridCooldownMinutes=240 --MinPrzConfluence=0.55 --MinGeometryQuality=0.52             --GridBreakevenTriggerR=0.15 --GridTrailTriggerR=0.35 --GridScaleOutR=0.50             --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25             --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL_DATE"             --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3             --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35             --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3             --V291SmallAccountTacticalExecution=false --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false             --report="/work/reports/$OUT.html" --report-json="/work/reports/$OUT.json" > "seal/logs/$OUT.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<6000;i+=4)); do
            if test -s "seal/reports/$OUT.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/$OUT.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 4
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: Basket-level audit
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,collections
          w=os.environ['WINDOW_ID']; name=f'TAIL_PAYOFF_HYBRID_MIN-{w}'
          d=json.load(open(f'seal/reports/{name}.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{})
          t=pathlib.Path(f'seal/logs/{name}.log').read_text(errors='ignore')
          groups={}
          for x in h:
              k=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g=groups.setdefault(k,{'label':k[0],'direction':k[1],'entryTime':k[2],'closeTime':0,'net':0.0})
              g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0))
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime'])
          kids=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
          pats=re.findall(r'\[GRID\]\s+Basket\s+#\d+\s+created\s+\|\s*([^|]+?)\s*\|',t,re.I)
          baskets=[{'pattern':pats[i].strip() if i<len(pats) else 'Unknown','direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'net':g['net'],'grid':0} for i,g in enumerate(mains)]
          for k in kids:
              q=[b for b in baskets if b['direction']==k['direction'] and b['entryTime']<=k['entryTime']<=b['closeTime']]
              if not q: q=[b for b in baskets if b['direction']==k['direction'] and 0<=k['entryTime']-b['entryTime']<=14400000]
              if q:
                  b=max(q,key=lambda z:z['entryTime']); b['net']+=k['net']; b['grid']+=1; b['closeTime']=max(b['closeTime'],k['closeTime'])
          v=[b['net'] for b in baskets]; W=[x for x in v if x>0]; L=[x for x in v if x<0]; gp=sum(W); gl=abs(sum(L)); net=sum(v)
          pf=gp/gl if gl else (999 if gp else 0); aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0
          la=sorted([abs(x) for x in L],reverse=True); tl=sum(la)
          def li(n):
              m=re.findall(rf'{re.escape(n)}=(\d+)',t); return int(m[-1]) if m else 0
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          out={'candidate':'TAIL_PAYOFF_HYBRID_MIN','window':w,'data_mode':'BAR_M1','baskets':len(v),'wins':len(W),'losses':len(L),
               'gross_profit':gp,'gross_loss':gl,'pf':pf,'net':net,'expectancy':net/len(v) if v else 0,'win_rate_pct':100*len(W)/len(v) if v else 0,
               'realized_rr':aw/abs(al) if aw>0 and al<0 else None,'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),
               'largest_loss':min(L) if L else 0,'top1_loss_pct':100*sum(la[:1])/tl if tl else 0,'top3_loss_pct':100*sum(la[:3])/tl if tl else 0,
               'top5_loss_pct':100*sum(la[:5])/tl if tl else 0,'signals':li('signals'),'orders':li('orders'),'atr_blocked':li('atrBlocked'),
               'mtf_blocked':li('mtfBlocked'),'geometry_blocked':li('geometryBlocked'),'volume_blocked':li('volumeBlocked'),
               'risk_blocked':li('riskBlocked'),'capital_infeasible':li('capitalInfeasible'),'execution_errors':errs,
               'pattern_distribution':dict(collections.Counter(b['pattern'] for b in baskets)),'grid_baskets':sum(b['grid']>0 for b in baskets)}
          pathlib.Path(f'seal/audit/{name}.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; docker run --rm -v "$PWD/seal:/work" alpine:3.22 sh -c 'rm -rf /work/data' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-HYBRID-DEV-${{ matrix.window.id }}
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  dev_gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: V294-HYBRID-DEV-*
          path: all
          merge-multiple: true
      - name: TAIL_PAYOFF_HYBRID_MIN hard gate
        run: |
          python3 - <<'PY'
          import json,glob,pathlib,os
          rs=sorted([json.load(open(p)) for p in glob.glob('all/audit/*.json')],key=lambda x:x['window'])
          tb=sum(x['baskets'] for x in rs); gp=sum(x['gross_profit'] for x in rs); gl=sum(x['gross_loss'] for x in rs); net=sum(x['net'] for x in rs)
          pf=gp/gl if gl else (999 if gp else 0); exp=net/tb if tb else 0; dd=max([x['max_dd_pct'] for x in rs] or [999]); errs=sum(x['execution_errors'] for x in rs)
          tpy=tb/1.5
          edge=bool(len(rs)==3 and all(x['baskets']>0 and x['pf']>1 and x['expectancy']>0 for x in rs) and dd<=10 and net>0 and exp>0 and sum(x['net']>0 for x in rs)>=2 and errs==0)
          out={'source_commit':os.environ['SOURCE_PATCH_COMMIT'],'candidate':'TAIL_PAYOFF_HYBRID_MIN','development_data_mode':'BAR_M1','rows':rs,
               'aggregate_pf':pf,'aggregate_net':net,'aggregate_expectancy':exp,'worst_pf':min([x['pf'] for x in rs] or [0]),'max_dd_pct':dd,
               'total_baskets':tb,'trades_per_year':tpy,'development_edge_gate':'PASS' if edge else 'FAIL','frequency_gate':'PASS' if tpy>=50 else 'FAIL',
               'v294_preset_recovery':'PASS' if edge else 'EXHAUSTED','validation':'AUTHORIZED' if edge else 'BLOCKED','final_holdout':'UNTOUCHED'}
          pathlib.Path('V294-HYBRID-DEV-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V294-HYBRID-DEVELOPMENT-GATE
          path: V294-HYBRID-DEV-GATE.json
          retention-days: 30
