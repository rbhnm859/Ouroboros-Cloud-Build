name: Temp Build GoldenWavePro Mobile 20260911

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-build-goldenwavepro-20260911-0650.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build-goldenwavepro-mobile-20260911-0649

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GoldenWavePro-Mobile/GoldenWaveProMobile.csproj

      - name: Build .algo
        run: dotnet build GoldenWavePro-Mobile/GoldenWaveProMobile.csproj -c Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false

      - name: Stage .algo
        run: |
          mkdir -p artifact
          ALGO="$(find GoldenWavePro-Mobile -type f -name '*.algo' | head -n 1)"
          echo "algo=$ALGO"
          test -n "$ALGO"
          cp "$ALGO" artifact/GoldenWaveProMobile.algo

      - name: Upload .algo
        uses: actions/upload-artifact@v4
        with:
          name: GoldenWaveProMobile-algo
          path: artifact/GoldenWaveProMobile.algo
          if-no-files-found: error
