name: Fibonacci XAUUSD 3 - v3.6 TP Robustness Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fibonacci-xauusd-v3-hybrid
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-3-v36-exit-resilience-sweep.yml'
      - 'FibonacciHarmonicSniperUltimate/versions/xauusd_3/tools/v36_tp_validate.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Run cTrader TP robustness validator
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: bash FibonacciHarmonicSniperUltimate/versions/xauusd_3/tools/v36_tp_validate.sh

      - name: Upload validation package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd_3-v36-tp-robustness-validation
          path: FibonacciHarmonicSniperUltimate/versions/xauusd_3/validation-v36-tp/
          retention-days: 60

