name: HarmonyBot V29.2 Commercial Dual-Track Gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v292-commercial-gates.yml'
      - 'ci/harmonybot-v292-checkpoint.txt'
  workflow_dispatch:
    inputs:
      checkpoint:
        required: true
        default: D7
        type: choice
        options: [D7, M1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot-v292-small-account-fast-execution-rc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve checkpoint
        env:
          INPUT_CP: ${{ inputs.checkpoint }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_CP:-}" ]; then
            CP="$INPUT_CP"
          else
            CP=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/ci/harmonybot-v292-checkpoint.txt" 2>/dev/null || echo D7)
          fi
          case "$CP" in
            D7) START=02/09/2026; EVAL=2026-09-09T00:00:00Z; END=16/09/2026; KILL=600;;
            M1) START=10/08/2026; EVAL=2026-08-17T00:00:00Z; END=16/09/2026; KILL=1200;;
            *) echo "Unsupported checkpoint: $CP"; exit 2;;
          esac
          echo "CP=$CP" >> "$GITHUB_ENV"
          echo "START=$START" >> "$GITHUB_ENV"
          echo "EVAL=$EVAL" >> "$GITHUB_ENV"
          echo "END=$END" >> "$GITHUB_ENV"
          echo "KILL=$KILL" >> "$GITHUB_ENV"

      - name: Generate HarmonyBot V29.2
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py \
            tmp/harmonybot-v26-build/fix_v283_execution_quality.py \
            tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py \
            tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py \
            tmp/harmonybot-v26-build/fix_v291_small_account_execution.py \
            tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          mkdir -p seal/{build,algo,reports,logs,data,summaries}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          for x in \
            'V29.2-Small-Account-Fast-Execution-RC' \
            'V292FastSmallAccountExecution' \
            'V292TryBuildFastStop' \
            'V292MicroConfirmedFast' \
            '[V292-SUMMARY]' \
            'EnableFibGrid' \
            'GeometryQualityScore' \
            'return SmallAccountMode ? Math.Min(MinStopLossPips, SmallAccountMinSLPips)'; do
              grep -Fq "$x" seal/build/HarmonyBotPro.cs
          done

      - name: Compile V29.2 zero-error
        run: |
          set -euo pipefail
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v292_commercial_candidate</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          ! grep -q 'warning CS0649' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit)
          test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v292_commercial_candidate.algo
          sha256sum seal/algo/*.algo > seal/algo.sha256

      - name: Resolve FxPro demo account
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd
          chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig'))
          e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500:
              raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          )
          echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"

      - name: Track A - $100 Small Capital
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          set -euo pipefail
          C="v292-${CP,,}-a-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v292_commercial_candidate.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start="$START" --end="$END" --balance=100 --data-mode=m1 --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.0 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL" \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 \
            --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66 \
            --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            --report="/work/reports/${CP}-A.html" --report-json="/work/reports/${CP}-A.json" > "seal/logs/${CP}-A.log" 2>&1 &
          PID=$!
          DONE=0
          for ((i=0;i<KILL;i+=2)); do
            if test -s "seal/reports/${CP}-A.json" && python3 - <<PY
          import json
          d=json.load(open('seal/reports/${CP}-A.json',encoding='utf-8-sig')); m=d.get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: Track B - Full Bot Small Capital OFF
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          set -euo pipefail
          C="v292-${CP,,}-b-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v292_commercial_candidate.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start="$START" --end="$END" --balance=10000 --data-mode=m1 --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.0 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=false --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL" \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=false --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false \
            --report="/work/reports/${CP}-B.html" --report-json="/work/reports/${CP}-B.json" > "seal/logs/${CP}-B.log" 2>&1 &
          PID=$!
          DONE=0
          for ((i=0;i<KILL;i+=2)); do
            if test -s "seal/reports/${CP}-B.json" && python3 - <<PY
          import json
          d=json.load(open('seal/reports/${CP}-B.json',encoding='utf-8-sig')); m=d.get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: Build dual-track evidence summary and gate
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          cp=os.environ['CP']
          def parse(track):
              lp=pathlib.Path(f'seal/logs/{cp}-{track}.log')
              t=lp.read_text(errors='ignore') if lp.exists() else ''
              rp=pathlib.Path(f'seal/reports/{cp}-{track}.json')
              main={}
              if rp.exists():
                  try: main=json.load(open(rp,encoding='utf-8-sig')).get('main',{})
                  except Exception: pass
              def last(p,cast=float,default=None):
                  m=re.findall(p,t,re.M); return cast(m[-1]) if m else default
              trades=last(r'"TotalTrades"\s*:\s*(\d+)',int,0)
              wins=last(r'"WinningTrades"\s*:\s*(\d+)',int,0)
              errors=len(re.findall(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge|FAILED',t,re.I))
              return {
                'ending_equity': main.get('endingEquity', last(r'"Equity"\s*:\s*(-?[\d.]+)',float,None)),
                'net_profit': main.get('netProfit', last(r'"NetProfit"\s*:\s*(-?[\d.]+)',float,None)),
                'trades': trades,
                'wins': wins,
                'win_rate_pct': wins/trades*100 if trades else 0,
                'profit_factor': last(r'"ProfitFactor"\s*:\s*(-?[\d.]+)',float,None),
                'max_dd_pct': last(r'"MaxEquityDrawdownPercentages"\s*:\s*(-?[\d.]+)',float,None),
                'avg_r': last(r'Avg R\s*:\s*(-?[\d.]+)',float,None),
                'expectancy_r': last(r'Expectancy\s*:\s*(-?[\d.]+)R',float,None),
                'execution_error_hits': errors,
                'funnel': (re.findall(r'\[COMMERCIAL-DIAG\].*',t) or [None])[-1],
                'v29': (re.findall(r'\[V29-SUMMARY\].*',t) or [None])[-1],
                'v291': (re.findall(r'\[V291-SUMMARY\].*',t) or [None])[-1],
                'v292': (re.findall(r'\[V292-SUMMARY\].*',t) or [None])[-1],
                'effective_min_sl': last(r'effectiveMinSL=([\d.]+)',float,None)
              }
          A=parse('A'); B=parse('B')
          gateA = A['trades'] > 0 and A['execution_error_hits'] == 0 and A['effective_min_sl'] is not None and abs(A['effective_min_sl']-25.0) < 1e-6
          gateB = B['trades'] > 0 and B['execution_error_hits'] == 0
          out={'version':'V29.2-Small-Account-Fast-Execution-RC','checkpoint':cp,'trackA_100':A,'trackB_full':B,'gateA':gateA,'gateB':gateB,'dual_gate':gateA and gateB,'full_bot_balance':10000}
          pathlib.Path(f'seal/summaries/{cp}-DUAL-GATE.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not (gateA and gateB):
              raise SystemExit(3)
          PY

      - name: Cleanup secrets
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V292-COMMERCIAL-DUAL-${{ env.CP }}
          path: seal
          retention-days: 30
