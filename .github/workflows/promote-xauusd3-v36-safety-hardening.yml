name: Fibonacci XAUUSD 3 - Promote v3.6 Safety Hardening

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-v3-hybrid]
    paths:
      - '.github/workflows/promote-xauusd3-v36-safety-hardening.yml'

permissions:
  contents: write

concurrency:
  group: xauusd3-v36-safety-promotion
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fibonacci-xauusd-v3-hybrid
          fetch-depth: 0

      - name: Verify and apply safety-only patch
        shell: bash
        run: |
          set -euo pipefail
          SRC='FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs'
          EXPECTED='d2c70ff627de3711933d336ddb5b2ab849276cc9'
          ACTUAL="$(git hash-object "$SRC")"
          echo "source_git_blob=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs')
          s=p.read_text()

          old='''            ResetDay();\n            Print("VERSION xauusd_3 v3.5.0-m5-first-valid");\n'''
          new='''            ResetDay();\n            RestoreDailyStateFromHistory();\n            Print("VERSION xauusd_3 v3.6.0-safety-hardening");\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old='''            if (m5Index < 12)\n                return;\n            if (HasAnySymbolExposure())\n                return;\n'''
          new='''            if (m5Index < 12)\n                return;\n            EnsureProtectionIntegrity();\n            if (HasAnySymbolExposure())\n                return;\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old='''        private double H1AtrExpansionRatio()\n        {\n'''
          helper='''        private void EnsureProtectionIntegrity()\n        {\n            foreach (Position p in Positions.FindAll(BotLabel, SymbolName))\n            {\n                if (p.StopLoss != null && p.TakeProfit != null)\n                    continue;\n                Print("[FAILSAFE] Missing protection PID={0}; closing position", p.Id);\n                TradeResult result = ClosePosition(p);\n                if (!result.IsSuccessful)\n                    Print("[FAILSAFE FAIL] PID={0} error={1}", p.Id, result.Error);\n            }\n        }\n\n        private void RestoreDailyStateFromHistory()\n        {\n            double net = 0.0;\n            int trades = 0;\n            foreach (HistoricalTrade t in History.FindAll(BotLabel, SymbolName))\n            {\n                if (t.ClosingTime.Date == _day)\n                    net += t.NetProfit;\n                if (t.EntryTime.Date == _day)\n                    trades++;\n            }\n            _dayNet = net;\n            _tradesToday = trades;\n            _dayStartBalance = Account.Balance - _dayNet;\n            if (_dayStartBalance <= 0)\n                _dayStartBalance = Account.Balance;\n        }\n\n        private double CurrentBotFloatingNet()\n        {\n            double net = 0.0;\n            foreach (Position p in Positions.FindAll(BotLabel, SymbolName))\n                net += p.NetProfit;\n            return net;\n        }\n\n        private double H1AtrExpansionRatio()\n        {\n'''
          assert s.count(old)==1
          s=s.replace(old,helper,1)

          old='''            double cap = _dayStartBalance * MaxDailyLossPercent / 100.0;\n            return -_dayNet >= cap;\n'''
          new='''            double cap = _dayStartBalance * MaxDailyLossPercent / 100.0;\n            return -(_dayNet + CurrentBotFloatingNet()) >= cap;\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)

          for forbidden in ('TakeProfitMultiplier','EnableBreakeven','BreakevenTriggerR','BreakevenLockR','ManageOpenPositions'):
              assert forbidden not in s, forbidden
          for required in ('RestoreDailyStateFromHistory','EnsureProtectionIntegrity','CurrentBotFloatingNet','v3.6.0-safety-hardening'):
              assert required in s, required
          p.write_text(s)
          PY

          grep -q 'v3.6.0-safety-hardening' "$SRC"
          grep -q 'RestoreDailyStateFromHistory' "$SRC"
          grep -q 'EnsureProtectionIntegrity' "$SRC"
          grep -q 'CurrentBotFloatingNet' "$SRC"
          ! grep -q 'Enable Breakeven' "$SRC"
          git diff --check
          git diff -- "$SRC"

      - name: Build with official cTrader CLI image
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_3'
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "rm -rf $ROOT/bin $ROOT/obj && dotnet restore $ROOT/FibonacciXAUUSD3.csproj && dotnet build $ROOT/FibonacciXAUUSD3.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          mkdir -p validation/package validation/reports validation/cache
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO" -a -s "$ALGO"
          cp "$ALGO" validation/package/FibonacciXAUUSD3-v3.6-Safety-Hardening.algo
          cp "$ROOT/src/FibonacciXAUUSD3.cs" validation/package/FibonacciXAUUSD3-v3.6-Safety-Hardening.cs
          sha256sum validation/package/* > validation/package/SHA256SUMS.txt

      - name: Prepare credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > validation/ctrader.pwd

      - name: Regression backtests - 3M and 1Y Standard/Harsh
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}"
          test -n "${CTRADER_ACCOUNT:-}"
          run_case() {
            local label="$1" start="$2" end="$3" spread="$4" commission="$5"
            echo "=== $label ==="
            docker run --rm \
              -v "$PWD/validation:/work" \
              -e "CTID=$CTRADER_CTID" \
              -e 'PWD-FILE=/work/ctrader.pwd' \
              -e "ACCOUNT=$CTRADER_ACCOUNT" \
              ghcr.io/spotware/ctrader-console:5.9.11 \
              backtest /work/package/FibonacciXAUUSD3-v3.6-Safety-Hardening.algo \
              --environment-variables --exit-on-stop \
              --symbol=XAUUSD --period=m5 \
              --start="$start" --end="$end" --balance=10000 \
              --data-mode=m1 --data-dir=/work/cache \
              --commission="$commission" --spread="$spread" \
              --RiskPercent=0.50 --MaxDailyLossPercent=3 --MinimumRiskReward=1.5 \
              --PreScoreMin=42 --FinalScoreMin=60 --M5PreScoreFloor=50 --M5RulesNeeded=2 \
              --MinImpulseAtr=1.2 --MinStopAtr=0.20 --MaxAllowedRR=8 \
              --BuyH1MinScore=18 --BlockLondonEntries=true \
              --RequireH1AtrExpansion=true --H1AtrExpansionMin=1.15 \
              --report="/work/reports/${label}.html" \
              --report-json="/work/reports/${label}.json" \
              2>&1 | tee "validation/reports/${label}.log"
            test -s "validation/reports/${label}.json"
          }
          run_case recent3m-standard '09/06/2026' '09/09/2026' '17.42' '35'
          run_case recent3m-harsh    '09/06/2026' '09/09/2026' '30'    '50'
          run_case full1y-standard   '09/09/2025' '09/09/2026' '17.42' '35'
          run_case full1y-harsh      '09/09/2025' '09/09/2026' '30'    '50'

      - name: Enforce regression and safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json
          from pathlib import Path

          expected = {
              'recent3m-standard': dict(trades=13, net=1467.39, roi=14.67, pf=6.88, dd=2.12),
              'recent3m-harsh':    dict(trades=12, net=1306.10, roi=13.06, pf=5.98, dd=2.12),
              'full1y-standard':   dict(trades=66, net=2118.15, roi=21.18, pf=1.93, dd=5.30),
              'full1y-harsh':      dict(trades=58, net=1695.27, roi=16.95, pf=1.85, dd=5.54),
          }
          rows=[]
          for label,e in expected.items():
              d=json.loads(Path(f'validation/reports/{label}.json').read_text())
              ts=d['tradeStatistics']; main=d['main']; eq=d['equity']; hist=d['history']['items']
              trades=int(ts['totalTrades']['all']); net=float(main['netProfit']); roi=float(main['roi'])
              pf=float(ts['profitFactor']['all']); dd=float(eq['maxEquityDrawdownPercent'])
              spans=sorted((int(x['entryTime']),int(x['closeTime']),x['direction']) for x in hist)
              overlap=hedge=0
              for i,a in enumerate(spans):
                  for b in spans[i+1:]:
                      if b[0] >= a[1]: break
                      overlap += 1; hedge += int(b[2] != a[2])
              london=sum(1 for x in hist if 7 <= datetime.datetime.fromtimestamp(int(x['entryTime'])/1000, datetime.timezone.utc).hour < 13)
              assert trades == e['trades'], (label,'trades',trades,e['trades'])
              assert abs(net-e['net']) <= 1.00, (label,'net',net,e['net'])
              assert abs(roi-e['roi']) <= 0.02, (label,'roi',roi,e['roi'])
              assert abs(pf-e['pf']) <= 0.03, (label,'pf',pf,e['pf'])
              assert abs(dd-e['dd']) <= 0.03, (label,'dd',dd,e['dd'])
              assert overlap == 0 and hedge == 0 and london == 0, (label,overlap,hedge,london)
              rows.append((label,trades,net,roi,pf,dd,overlap,hedge,london))

          out=['# XAUUSD3 v3.6 Safety Hardening Promotion Validation','',
               '| Case | Trades | Net | ROI % | PF | DD % | Overlap | Hedge | London |',
               '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for r in rows:
              out.append(f'| {r[0]} | {r[1]} | {r[2]:.2f} | {r[3]:.2f} | {r[4]:.2f} | {r[5]:.2f} | {r[6]} | {r[7]} | {r[8]} |')
          out += ['', '- Regression gates: PASS', '- Safety invariants: PASS',
                  '- Promotion scope: restart daily-state recovery, missing-protection fail-safe, floating PnL in daily-loss cap only.',
                  '- Entry/exit signal parameters unchanged; no breakeven or TP multiplier included.']
          Path('validation/V36_SAFETY_PROMOTION_SUMMARY.md').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

      - name: Upload validated mobile/cloud build and reports
        uses: actions/upload-artifact@v4
        with:
          name: xauusd_3-v36-safety-hardening-promoted
          path: validation/
          retention-days: 30

      - name: Promote source after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          SRC='FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SRC"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source change to promote.'
            exit 0
          fi
          git commit -m 'promote(xauusd_3): v3.6 safety hardening'
          git push origin HEAD:fibonacci-xauusd-v3-hybrid
