name: HarmonyBot XAUUSD V1 safe core CI
on:
  push:
    branches:
      - feat/harmonybot-xauusd-core-v1-20261106
    paths:
      - 'HarmonyBot-XAUUSD-V1/**'
      - '.github/workflows/harmonybot-xauusd-v1-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hb-xauusd-v1-domain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-tests-and-algo-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated branch and unchanged protected project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p custody
          python3 -m unittest discover -s HarmonyBot-XAUUSD-V1/tools -p test_isolation.py -v
          python3 HarmonyBot-XAUUSD-V1/tools/audit_isolation.py --base c3283e6f61741a5a9a3d2fc7ea31a066b64f7806 --branch feat/harmonybot-xauusd-core-v1-20261106 --output custody/HBXAU_ISOLATION_AUDIT.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Domain and adversarial contract suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p custody
          dotnet run --project HarmonyBot-XAUUSD-V1/tests/HarmonyBot.XauUsd.Tests/HarmonyBot.XauUsd.Tests.csproj -c Release | tee custody/HBXAU_TEST_RESULT.txt
          grep -E '^SUMMARY passed=[0-9]+ total=[0-9]+$' custody/HBXAU_TEST_RESULT.txt
      - name: cTrader Research-Only adapter compile
        shell: bash
        run: |
          set -euo pipefail
          dotnet build HarmonyBot-XAUUSD-V1/src/HarmonyBot.XauUsd.cBot/HarmonyBot.XauUsd.cBot.csproj -c Release -p:AlgoPublish=false
      - name: Refuse trading API calls anywhere in V1 source
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE --include='*.cs' 'ExecuteMarketOrder[[:space:]]*\(|Place(Limit|Stop|StopLimit)Order[[:space:]]*\(|CancelPendingOrder[[:space:]]*\(|ClosePosition[[:space:]]*\(|ModifyPosition[[:space:]]*\(' HarmonyBot-XAUUSD-V1/src; then
            echo '[HBXAU-V1] BLOCKED: trading API call found' >&2
            exit 1
          fi
          echo '[HBXAU-V1] PASS read-only API boundary'
      - name: Build immutable source and binary custody
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          find HarmonyBot-XAUUSD-V1/src/HarmonyBot.XauUsd.cBot/bin/Release -type f -name '*.algo' -print
          A=$(find HarmonyBot-XAUUSD-V1/src/HarmonyBot.XauUsd.cBot/bin/Release -type f -name '*.algo' | head -1)
          test -n "$A" && test -s "$A"
          cp "$A" custody/HBXAU_V1_RESEARCH_ONLY.algo
          sha256sum custody/HBXAU_V1_RESEARCH_ONLY.algo > custody/HBXAU_ALGO_SHA256.txt
          git ls-files 'HarmonyBot-XAUUSD-V1/src/**' 'HarmonyBot-XAUUSD-V1/tests/**' | grep -E '\.(cs|csproj)$' | while IFS= read -r F; do sha256sum "$F"; done > custody/HBXAU_SOURCE_SHA256.txt
          python3 - <<'PY_CUSTODY'
          import json,hashlib,os,pathlib
          p=pathlib.Path('custody/HBXAU_V1_RESEARCH_ONLY.algo')
          isolation=pathlib.Path('custody/HBXAU_ISOLATION_AUDIT.json')
          audit=json.loads(isolation.read_text())
          if audit.get('status')!='PASS':
              raise SystemExit('ISOLATION_NOT_PASSED')
          result={'schema':'HBXAU_V1_RESEARCH_CUSTODY_1',
                  'commit':os.environ['SOURCE_COMMIT'],
                  'run_id':os.environ['WORKFLOW_RUN'],
                  'algo_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'test_output_sha256':hashlib.sha256(pathlib.Path('custody/HBXAU_TEST_RESULT.txt').read_bytes()).hexdigest(),
                  'isolation_audit_sha256':hashlib.sha256(isolation.read_bytes()).hexdigest(),
                  'isolation_status':'PASS',
                  'trading_allowed':False,'research_only':True,
                  'broker_compatibility':'NOT_VERIFIED',
                  'independent_oos':'NOT_RUN'}
          pathlib.Path('custody/HBXAU_CUSTODY.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('[HBXAU-V1-CUSTODY]',result['algo_sha256'],result['commit'])
          PY_CUSTODY
      - uses: actions/upload-artifact@v4
        with:
          name: HBXAU-V1-RESEARCH-ONLY-${{ github.sha }}
          path: custody/
          retention-days: 60
          if-no-files-found: error

  official-ctrader-tooling-readonly:
    name: Official cTrader Skill + CLI read-only verification
    needs: core-tests-and-algo-build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      DISABLE_TELEMETRY: '1'
      CTRADER_CLI_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Check official cTrader Skill agent bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p custody
          bash -n HarmonyBot-XAUUSD-V1/tools/bootstrap_ctrader_cli_skill.sh
          bash HarmonyBot-XAUUSD-V1/tools/bootstrap_ctrader_cli_skill.sh | tee custody/HBXAU_SKILL_INSTALL.txt
          grep -Fq 'PASS: official ctrader-cli agent skill installed' custody/HBXAU_SKILL_INSTALL.txt
          npx --yes skills@1.7.6 ls -g --json > custody/HBXAU_SKILLS.json
          grep -Fq 'ctrader-cli' custody/HBXAU_SKILLS.json
      - name: Probe official version-pinned CLI in isolated container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$CTRADER_CLI_IMAGE"
          docker image inspect "$CTRADER_CLI_IMAGE" --format '{{index .RepoDigests 0}}' | tee custody/HBXAU_CLI_IMAGE_DIGEST.txt
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            "$CTRADER_CLI_IMAGE" --version | tee custody/HBXAU_CLI_VERSION.txt
          test -s custody/HBXAU_CLI_VERSION.txt
      - name: Seal tooling receipt (no credentials, no trading)
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_TOOLING'
          import hashlib,json,os,pathlib
          p=pathlib.Path('custody')
          files=['HBXAU_SKILL_INSTALL.txt','HBXAU_SKILLS.json','HBXAU_CLI_IMAGE_DIGEST.txt','HBXAU_CLI_VERSION.txt']
          for name in files:
              if not (p/name).read_bytes():
                  raise SystemExit('EMPTY_TOOL_RECEIPT:'+name)
          record={'schema':'HBXAU_OFFICIAL_TOOLING_READONLY_1',
                  'commit':os.environ['SOURCE_COMMIT'],
                  'run_id':os.environ['WORKFLOW_RUN'],
                  'skill_install':'PASS',
                  'official_cli_version':(p/'HBXAU_CLI_VERSION.txt').read_text().strip(),
                  'image_ref':'ghcr.io/spotware/ctrader-console:5.9.11',
                  'image_digest':(p/'HBXAU_CLI_IMAGE_DIGEST.txt').read_text().strip(),
                  'sha256':{name:hashlib.sha256((p/name).read_bytes()).hexdigest() for name in files},
                  'broker_login':False,'trades_executed':False,'historical_backtest':'NOT_RUN',
                  'persistence':'CI_RUNNER_ONLY'}
          (p/'HBXAU_TOOLING_RECEIPT.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          print('[HBXAU-TOOLING] PASS skill, CLI version and image digest captured')
          PY_TOOLING
      - uses: actions/upload-artifact@v4
        with:
          name: HBXAU-V1-TOOLING-READONLY-${{ github.sha }}
          path: custody/
          retention-days: 60
          if-no-files-found: error
