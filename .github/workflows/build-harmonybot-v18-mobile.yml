name: Build HarmonyBotPro v18 Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HarmonyBot-v18/source/chunks/**'
      - 'HarmonyBot-v18/HarmonyBotPro_v18.csproj'
      - '.github/workflows/build-harmonybot-v18-mobile.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore v18 source
        shell: bash
        run: |
          set -euo pipefail
          cat HarmonyBot-v18/source/chunks/*.b64 > /tmp/HarmonyBotPro.cs.gz.b64
          test "$(wc -c < /tmp/HarmonyBotPro.cs.gz.b64)" -eq 20456
          base64 -d /tmp/HarmonyBotPro.cs.gz.b64 | gzip -d > HarmonyBot-v18/HarmonyBotPro.cs
          test -s HarmonyBot-v18/HarmonyBotPro.cs
          test "$(wc -c < HarmonyBot-v18/HarmonyBotPro.cs)" -eq 84511
          echo '68de9e46fb38f24f6b0356357abe48c5bb948b07fc5381aa096022862db5b892  HarmonyBot-v18/HarmonyBotPro.cs' | sha256sum -c -
          grep -q 'public class HarmonyBotPro : Robot' HarmonyBot-v18/HarmonyBotPro.cs
          wc -l HarmonyBot-v18/HarmonyBotPro.cs

      - name: Apply current cTrader API compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HarmonyBot-v18/HarmonyBotPro.cs')
          s = p.read_text(encoding='utf-8')
          old = 'double px = p.ClosePrice > 0 ? p.ClosePrice : (p.TradeType == TradeType.Buy ? _symbol.Bid : _symbol.Ask);'
          new = 'double px = p.TradeType == TradeType.Buy ? _symbol.Bid : _symbol.Ask;'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 ClosePrice compatibility sites, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('Patched Position.ClosePrice compatibility sites:', count)
          PY

      - name: Restore and build
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p HarmonyBot-v18/build-status HarmonyBot-v18/builds
          : > HarmonyBot-v18/build-status/last-build.log

          echo '=== dotnet restore ===' | tee -a HarmonyBot-v18/build-status/last-build.log
          dotnet restore HarmonyBot-v18/HarmonyBotPro_v18.csproj 2>&1 | tee -a HarmonyBot-v18/build-status/last-build.log
          RESTORE_EXIT=${PIPESTATUS[0]}

          BUILD_EXIT=$RESTORE_EXIT
          if [ "$RESTORE_EXIT" -eq 0 ]; then
            echo '=== dotnet build ===' | tee -a HarmonyBot-v18/build-status/last-build.log
            dotnet build HarmonyBot-v18/HarmonyBotPro_v18.csproj \
              --configuration Release \
              --no-restore \
              -p:AlgoPublish=False \
              -p:IncludeSource=True 2>&1 | tee -a HarmonyBot-v18/build-status/last-build.log
            BUILD_EXIT=${PIPESTATUS[0]}
          fi

          ALGO=$(find HarmonyBot-v18 -type f -name '*.algo' -print -quit)
          if [ "$BUILD_EXIT" -eq 0 ] && [ -n "$ALGO" ]; then
            cp "$ALGO" HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo
            STATUS=SUCCESS
          else
            STATUS=FAILED
            if [ "$BUILD_EXIT" -eq 0 ]; then BUILD_EXIT=99; fi
          fi

          {
            echo "status=$STATUS"
            echo "restore_exit=$RESTORE_EXIT"
            echo "build_exit=$BUILD_EXIT"
            echo "original_source_sha=68de9e46fb38f24f6b0356357abe48c5bb948b07fc5381aa096022862db5b892"
            echo "compiled_source_sha=$(sha256sum HarmonyBot-v18/HarmonyBotPro.cs | awk '{print $1}')"
            echo "commit=${GITHUB_SHA}"
            date -u '+built_at_utc=%Y-%m-%dT%H:%M:%SZ'
            if [ -f HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo ]; then
              echo "algo_size=$(stat -c%s HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo)"
              echo "algo_sha=$(sha256sum HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo | awk '{print $1}')"
            fi
          } > HarmonyBot-v18/build-status/status.txt

          cat HarmonyBot-v18/build-status/status.txt
          echo "build_exit=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

      - name: Publish build result to repository
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HarmonyBot-v18/build-status
          if [ -f HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo ]; then
            git add HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo
          fi
          git commit -m 'ci: publish HarmonyBotPro v18 mobile build [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Fail if compile failed
        if: steps.compile.outputs.build_exit != '0'
        run: exit 1

      - name: Upload mobile artifact
        if: steps.compile.outputs.build_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v18-Mobile
          path: HarmonyBot-v18/builds/HarmonyBotPro_v18_Mobile.algo
          if-no-files-found: error
          retention-days: 30
