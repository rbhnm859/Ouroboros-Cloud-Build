name: Fibonacci BTC round2 pattern specialization

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/optimize-fibonacci-btc-round2.yml'
      - 'research/fibonacci-research1/btc_round2_profiles.json'
      - 'research/fibonacci-research1/btc_round2_args.py'
      - 'research/fibonacci-research1/rank_btc_round2.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round2
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'
  DEV1_START: '08/06/2026 00:00'
  DEV1_END: '08/07/2026 23:59'
  DEV2_START: '09/07/2026 00:00'
  DEV2_END: '08/08/2026 23:59'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create Research1 candidate
        run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - name: Enable trading in ephemeral build copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.4.0-research1/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build cBot
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.4.0-research1/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.4.0-research1/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p build-artifact
          ALGO="$(find Fibonacci-v0.4.0-research1 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" build-artifact/FibonacciHarmonicSniperUltimate.algo
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round2-algo
          path: build-artifact/FibonacciHarmonicSniperUltimate.algo
          retention-days: 30

  btc-round2:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round2-algo
          path: btc
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p btc/cache btc/reports
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > btc/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Two-fold BTC development search
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          PROFILES=(
            btc_champion
            btc_duo
            btc_duo_s80
            btc_duo_rr20
            btc_recip_p3
            btc_recip_p3_rr20
            btc_recip_p2
            btc_recip_p2_s84
            btc_recip_p2_rr20
            btc_p2_duo_s84
          )
          for PROFILE in "${PROFILES[@]}"; do
            mapfile -t ARGS < <(python3 research/fibonacci-research1/btc_round2_args.py "$PROFILE")
            for FOLD in DEV1 DEV2; do
              if [ "$FOLD" = DEV1 ]; then START="$DEV1_START"; END="$DEV1_END"; else START="$DEV2_START"; END="$DEV2_END"; fi
              echo "=== BITCOIN $FOLD / $PROFILE ==="
              timeout --signal=TERM --kill-after=30s 8m docker run --rm \
                -v "$PWD/btc:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
                backtest /work/FibonacciHarmonicSniperUltimate.algo --environment-variables --exit-on-stop \
                --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
                --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 --RiskPercent=1.0 \
                "${ARGS[@]}" --report="/work/reports/${PROFILE}-BITCOIN-${FOLD}.html" --report-json="/work/reports/${PROFILE}-BITCOIN-${FOLD}.json"
            done
          done
      - name: Rank development folds and select top 4 plus champion
        run: |
          python3 research/fibonacci-research1/rank_btc_round2.py \
            --reports-dir btc/reports --top 4 \
            --selected-output btc/btc-round2-selected.txt \
            --json-output btc/btc-round2-dev-ranking.json
          cat btc/btc-round2-selected.txt
      - name: Validate selected BTC candidates
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          while IFS= read -r PROFILE; do
            test -n "$PROFILE" || continue
            mapfile -t ARGS < <(python3 research/fibonacci-research1/btc_round2_args.py "$PROFILE")
            for SPEC in \
              'OOS|09/08/2026 00:00|08/09/2026 00:00|0|65' \
              'OOSHARSH|09/08/2026 00:00|08/09/2026 00:00|1500|100' \
              'FULL3|08/06/2026 00:00|08/09/2026 00:00|0|65' \
              'FULL6|08/03/2026 00:00|08/09/2026 00:00|0|65'; do
              IFS='|' read -r PHASE START END SPREAD COMM <<< "$SPEC"
              echo "=== BITCOIN $PHASE / $PROFILE spread=$SPREAD commission=$COMM ==="
              timeout --signal=TERM --kill-after=30s 10m docker run --rm \
                -v "$PWD/btc:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
                backtest /work/FibonacciHarmonicSniperUltimate.algo --environment-variables --exit-on-stop \
                --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
                --data-mode=m1 --data-dir=/work/cache --commission="$COMM" --spread="$SPREAD" --RiskPercent=1.0 \
                "${ARGS[@]}" --report="/work/reports/${PROFILE}-BITCOIN-${PHASE}.html" --report-json="/work/reports/${PROFILE}-BITCOIN-${PHASE}.json"
            done
          done < btc/btc-round2-selected.txt
      - name: Clean credentials
        if: always()
        run: rm -f btc/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibonacci-btc-round2-results
          path: |
            btc/reports/*BITCOIN*
            btc/btc-round2-selected.txt
            btc/btc-round2-dev-ranking.json
          if-no-files-found: error
          retention-days: 30
