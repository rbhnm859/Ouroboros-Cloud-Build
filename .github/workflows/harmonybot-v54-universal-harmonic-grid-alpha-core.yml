name: HarmonyBot V54 Universal Harmonic Liberation & Fibonacci Grid Alpha Core

on:
  push:
    branches: [harmonybot/v54-universal-harmonic-grid-alpha-core]
    paths:
      - 'HarmonyBot-V54/**'
      - '.github/workflows/harmonybot-v54-universal-harmonic-grid-alpha-core.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v54-universal-harmonic-grid-alpha-core
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static contracts and build
        shell: bash
        run: |
          set -euo pipefail
          python3 HarmonyBot-V54/tools/static_audit.py HarmonyBot-V54/src/HarmonyBotV54.cs
          python3 HarmonyBot-V54/tools/geometry_contract_test.py HarmonyBot-V54/src/HarmonyBotV54.cs
          python3 HarmonyBot-V54/tools/detector_contract_test.py HarmonyBot-V54/src/HarmonyBotV54.cs
          python3 HarmonyBot-V54/tools/v54_architecture_contract_test.py HarmonyBot-V54/src/HarmonyBotV54.cs
          python3 HarmonyBot-V54/tools/liberation_contract_test.py HarmonyBot-V54/src/HarmonyBotV54.cs
          python3 HarmonyBot-V54/tools/grid_core_contract_test.py HarmonyBot-V54/src/HarmonyBotV54.cs
          dotnet restore HarmonyBot-V54/HarmonyBotV54.csproj
          dotnet build HarmonyBot-V54/HarmonyBotV54.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V54/dist HarmonyBot-V54/final
          A=$(find HarmonyBot-V54/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V54/dist/HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo
          sha256sum HarmonyBot-V54/src/HarmonyBotV54.cs "$A" > HarmonyBot-V54/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V54/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v54-build
          path: |
            HarmonyBot-V54/dist
            HarmonyBot-V54/final
          retention-days: 30

  data-seed:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v54-build
          path: control/HarmonyBot-V54/shared
      - name: Resolve dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Build immutable market-data snapshot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V54/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V54/data-seed-${{ matrix.window }}"
          O="$GITHUB_WORKSPACE/control/HarmonyBot-V54/data-seed-out-${{ matrix.window }}"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V54/shared -type f -name 'HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo' | head -1)
          test -s "$A"; cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V54-DATA-SEED-${{ matrix.window }}" START_DATE="${{ steps.d.outputs.start }}" EVAL_DATE="${{ steps.d.outputs.eval }}" END_DATE="${{ steps.d.outputs.end }}" BALANCE=10000 \
            FAMNATIVE=false FAMOBS=true CANCONTRACT=true FAMCONF=true GRIDV2=true STOPV2=true JOINT=true CORRIDOR=false ANCHORFORENSICS=false \
            IDENT=true BOUNDED=true SKIPS=2 FQUOTA=4 PRJPRZ=false DTRUTH=false FAMQUAL=false FAMROUTE=false FAMCONFV2=false CTXBUS=false GRIDEXEC=true \
            V54LIB=false V54CORE=false V54ECON=false V54FGRID=false V54SAGRID=false \
            PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V54/tools/run_backtest.sh"
          )
          test -d "$W/seal/data"
          (cd "$W/seal/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}' > "$O/data.snapshot.sha"
          tar -C "$W/seal" -czf "$O/data.tgz" data
          test -s "$O/data.tgz"; test -s "$O/data.snapshot.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: v54-data-${{ matrix.window }}
          path: control/HarmonyBot-V54/data-seed-out-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  alpha-dev:
    needs: [build, data-seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [V51_QUALITY_CORE_REPLAY, V52_LIBERATION_CONTROL, V54_CORE_PLUS_LIBERATION, V54_FULL_ALPHA]
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v54-build
          path: control/HarmonyBot-V54/shared
      - uses: actions/download-artifact@v4
        with:
          name: v54-data-${{ matrix.window }}
          path: control/HarmonyBot-V54/data-seed
      - name: Prepare immutable algo and data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V54/dist
          A=$(find control/HarmonyBot-V54/shared -type f -name 'HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V54/dist/
          W="control/HarmonyBot-V54/window-alpha-${{ matrix.variant }}-${{ matrix.window }}/seal"
          mkdir -p "$W"
          tar -xzf control/HarmonyBot-V54/data-seed/data.tgz -C "$W"
          cp control/HarmonyBot-V54/data-seed/data.snapshot.sha "$W/data.snapshot.sha"
          EXPECTED=$(tr -d '[:space:]' < "$W/data.snapshot.sha")
          ACTUAL=$((cd "$W/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
      - name: Resolve dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run fixed Alpha DEV
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V54/tools/*.sh
          control/HarmonyBot-V54/tools/run_window.sh alpha "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v54-alpha-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V54/output-alpha-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  alpha-analyze:
    needs: alpha-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      alpha_candidate: ${{ steps.gate.outputs.alpha_candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v54-alpha-*'
          path: control/HarmonyBot-V54/merged-alpha
          merge-multiple: true
      - name: Core preservation, liberation and marginal Alpha gate
        id: gate
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V54/final-alpha
          python3 control/HarmonyBot-V54/tools/analyze_alpha_dev.py control/HarmonyBot-V54/merged-alpha control/HarmonyBot-V54/final-alpha
          echo "alpha_candidate=$(cat control/HarmonyBot-V54/final-alpha/alpha_candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V54-ALPHA-FRONTIER
          path: control/HarmonyBot-V54/final-alpha
          retention-days: 30

  grid-dev:
    needs: [build, data-seed, alpha-analyze]
    if: always() && needs.build.result == 'success' && needs.data-seed.result == 'success' && needs.alpha-analyze.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [L0_ONLY, LEGACY_GRID, FAMILY_NATIVE_GRID, FAMILY_NATIVE_GRID_STATE_AWARE]
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v54-build
          path: control/HarmonyBot-V54/shared
      - uses: actions/download-artifact@v4
        with:
          name: v54-data-${{ matrix.window }}
          path: control/HarmonyBot-V54/data-seed
      - name: Prepare immutable algo and data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V54/dist
          A=$(find control/HarmonyBot-V54/shared -type f -name 'HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V54/dist/
          W="control/HarmonyBot-V54/window-grid-${{ matrix.variant }}-${{ matrix.window }}/seal"
          mkdir -p "$W"
          tar -xzf control/HarmonyBot-V54/data-seed/data.tgz -C "$W"
          cp control/HarmonyBot-V54/data-seed/data.snapshot.sha "$W/data.snapshot.sha"
          EXPECTED=$(tr -d '[:space:]' < "$W/data.snapshot.sha")
          ACTUAL=$((cd "$W/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
      - name: Resolve dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run fixed Grid DEV
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V54/tools/*.sh
          control/HarmonyBot-V54/tools/run_window.sh grid "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v54-grid-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V54/output-grid-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  grid-analyze:
    needs: grid-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      grid_candidate: ${{ steps.gate.outputs.grid_candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v54-grid-*'
          path: control/HarmonyBot-V54/merged-grid
          merge-multiple: true
      - name: Final Grid causal gate
        id: gate
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V54/final-grid
          python3 control/HarmonyBot-V54/tools/analyze_grid_dev.py control/HarmonyBot-V54/merged-grid control/HarmonyBot-V54/final-grid
          echo "grid_candidate=$(cat control/HarmonyBot-V54/final-grid/grid_candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V54-GRID-FRONTIER
          path: control/HarmonyBot-V54/final-grid
          retention-days: 30

  capital:
    needs: [alpha-analyze, grid-analyze]
    if: needs.alpha-analyze.outputs.alpha_candidate != '' && needs.grid-analyze.outputs.grid_candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100, 150, 200, 300, 500, 1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v54-build
          path: control/HarmonyBot-V54/shared
      - name: Capital validation
        shell: bash
        env:
          GRID_CANDIDATE: ${{ needs.grid-analyze.outputs.grid_candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          GEXEC=true; FGRID=false; SAGRID=false
          case "$GRID_CANDIDATE" in
            L0_ONLY) GEXEC=false;;
            LEGACY_GRID) ;;
            FAMILY_NATIVE_GRID) FGRID=true;;
            FAMILY_NATIVE_GRID_STATE_AWARE) FGRID=true; SAGRID=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V54/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V54/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V54/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V54/shared -type f -name 'HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V54-$GRID_CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE" \
            FAMNATIVE=false FAMOBS=true CANCONTRACT=true FAMCONF=true GRIDV2=true STOPV2=true JOINT=true CORRIDOR=false ANCHORFORENSICS=true \
            IDENT=true BOUNDED=true SKIPS=2 FQUOTA=4 PRJPRZ=false DTRUTH=true FAMQUAL=false FAMROUTE=false FAMCONFV2=true CTXBUS=true GRIDEXEC="$GEXEC" \
            V54LIB=true V54CORE=true V54ECON=true V54FGRID="$FGRID" V54SAGRID="$SAGRID" \
            PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V54/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V54/tools/audit_report.py --report "$W/seal/reports/V54-$GRID_CANDIDATE-CAPITAL-$BALANCE.json" --log "$W/seal/logs/V54-$GRID_CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json" --window "CAPITAL_$BALANCE" --family "$GRID_CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v54-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V54/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [alpha-analyze, grid-analyze, capital]
    if: needs.alpha-analyze.outputs.alpha_candidate != '' && needs.grid-analyze.outputs.grid_candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v54-capital-*'
          path: capital
          merge-multiple: true
      - name: Hard capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V54_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V54","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"actual_100_frequency":rows["100"]["frequency"]},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v54-capital-gate
          path: V54_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [alpha-analyze, grid-analyze, capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v54-build
          path: shared
      - name: Freeze hashes
        shell: bash
        env:
          ALPHA_CANDIDATE: ${{ needs.alpha-analyze.outputs.alpha_candidate }}
          GRID_CANDIDATE: ${{ needs.grid-analyze.outputs.grid_candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V54/src/HarmonyBotV54.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo"))
          pathlib.Path("V54_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V54","alpha_candidate":os.environ["ALPHA_CANDIDATE"],"grid_candidate":os.environ["GRID_CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v54-freeze-manifest
          path: V54_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [alpha-analyze, grid-analyze, freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v54-universal-harmonic-grid-alpha-core
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v54-build
          path: control/HarmonyBot-V54/shared
      - name: Untouched Fresh pair
        shell: bash
        env:
          GRID_CANDIDATE: ${{ needs.grid-analyze.outputs.grid_candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          GEXEC=true; FGRID=false; SAGRID=false
          case "$GRID_CANDIDATE" in
            L0_ONLY) GEXEC=false;;
            LEGACY_GRID) ;;
            FAMILY_NATIVE_GRID) FGRID=true;;
            FAMILY_NATIVE_GRID_STATE_AWARE) FGRID=true; SAGRID=true;;
            *) exit 31;;
          esac
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V54/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V54/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"; chmod +x control/HarmonyBot-V54/tools/*.sh
          A=$(find control/HarmonyBot-V54/shared -type f -name 'HarmonyBot_V54_Universal_Harmonic_Grid_Alpha_Core_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V54-$GRID_CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE" \
            FAMNATIVE=false FAMOBS=true CANCONTRACT=true FAMCONF=true GRIDV2=true STOPV2=true JOINT=true CORRIDOR=false ANCHORFORENSICS=true \
            IDENT=true BOUNDED=true SKIPS=2 FQUOTA=4 PRJPRZ=false DTRUTH=true FAMQUAL=false FAMROUTE=false FAMCONFV2=true CTXBUS=true GRIDEXEC="$GEXEC" \
            V54LIB=true V54CORE=true V54ECON=true V54FGRID="$FGRID" V54SAGRID="$SAGRID" \
            PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V54/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V54/tools/audit_report.py --report "$W/seal/reports/V54-$GRID_CANDIDATE-FRESH-$KIND.json" --log "$W/seal/logs/V54-$GRID_CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json" --window "FRESH_$KIND" --family "$GRID_CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v54-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V54/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [alpha-analyze, grid-analyze, fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v54-fresh-*'
          path: fresh
          merge-multiple: true
      - name: Final commercial decision
        shell: bash
        env:
          ALPHA_CANDIDATE: ${{ needs.alpha-analyze.outputs.alpha_candidate }}
          GRID_CANDIDATE: ${{ needs.grid-analyze.outputs.grid_candidate }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10
          ok=good(a) and good(m)
          pathlib.Path("V54_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V54","alpha_candidate":os.environ["ALPHA_CANDIDATE"],"grid_candidate":os.environ["GRID_CANDIDATE"],"fresh_alpha":a,"fresh_100":m,"fresh_validation_pass":ok},indent=2))
          pathlib.Path("V54_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V54","decision":"COMMERCIAL_FREEZE_CANDIDATE_PASS" if ok else "HOLD_WITH_EVIDENCE","fresh_used":True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v54-final-decision
          path: |
            V54_FRESH_VALIDATION.json
            V54_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
