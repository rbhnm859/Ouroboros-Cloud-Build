name: Fibonacci BTC Round12 Validate 121 Second H1 Setup

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/backtest-fibonacci-btc-round12-validate-121.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round12-validate-121
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          variants = [
            ('control','Reciprocal ABCD'),
            ('p121','121'),
            ('combo','Reciprocal ABCD,121'),
          ]
          periods = [
            ('oos','09/08/2026 00:00','08/09/2026 00:00',65,0),
            ('oos_harsh','09/08/2026 00:00','08/09/2026 00:00',100,1500),
            ('full6','08/03/2026 00:00','08/09/2026 00:00',65,0),
            ('full6_harsh','08/03/2026 00:00','08/09/2026 00:00',100,1500),
          ]
          inc=[]
          for v,p in variants:
            for n,s,e,c,sp in periods:
              inc.append({'variant':v,'patterns':p,'period':n,'start':s,'end':e,'commission':c,'spread':sp})
          print('matrix='+json.dumps({'include':inc},separators=(',',':')))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round4.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round5.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round6.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round7.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round8.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round9.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round10.py --repo-root "$PWD" --force
      - name: Enable trading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.12.0-btc-round10-funnel/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.12.0-btc-round10-funnel/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.12.0-btc-round10-funnel/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p artifact
          ALGO="$(find Fibonacci-v0.12.0-btc-round10-funnel -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" artifact/FibonacciHarmonicSniperUltimate-BTC-Round12-121.algo
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round12-121-build
          path: artifact
          retention-days: 30

  backtest:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round12-121-build
          path: work
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p work/cache work/reports/${{ matrix.variant }}/${{ matrix.period }}
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Backtest ${{ matrix.variant }} ${{ matrix.period }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          PATTERNS: ${{ matrix.patterns }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          COMMISSION: ${{ matrix.commission }}
          SPREAD: ${{ matrix.spread }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 30m docker run --rm \
            -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
            backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round12-121.algo --environment-variables --exit-on-stop \
            --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
            --data-mode=m1 --data-dir=/work/cache --commission="$COMMISSION" --spread="$SPREAD" --RiskPercent=1.0 \
            --EnabledPatterns="$PATTERNS" --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 \
            --MaxPatternAgeBars=16 --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --UseCandleConfirmation=true --CooldownBars=2 \
            --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
            --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
            --Round8LogExcursions=false --Round9ShadowTpContinuation=false --Round10LogFunnel=false --DebugLogging=false \
            --report="/work/reports/${{ matrix.variant }}/${{ matrix.period }}/report.html" \
            --report-json="/work/reports/${{ matrix.variant }}/${{ matrix.period }}/report.json" \
            2>&1 | tee "work/reports/${{ matrix.variant }}/${{ matrix.period }}/report.log"
      - name: Clean credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-r12-121-${{ matrix.variant }}-${{ matrix.period }}
          path: work/reports/${{ matrix.variant }}/${{ matrix.period }}
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: btc-r12-121-*
          path: results
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round12-121-validation-results
          path: results
          retention-days: 30
