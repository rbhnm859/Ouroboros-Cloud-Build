name: BTC Harmonic Guard Commercial RC7 Harsh Repair

on:
  workflow_dispatch:
  push:
    branches: [ btc-store-commercial-rc7-harsh-repair ]
    paths:
      - '.github/policies/commercial_rc7_policy.json'
      - '.github/policies/commercial_rc7_abcd_whitelist_audit.json'
      - '.github/scripts/commercial_rc7_transform.py'
      - '.github/scripts/commercial_rc7_verify.py'
      - '.github/scripts/commercial_rc6_transform.py'
      - '.github/scripts/commercial_rc6_verify.py'
      - '.github/scripts/commercial_rc4_parity_fix.py'
      - '.github/scripts/commercial_rc4_transform.py'
      - '.github/scripts/commercial_rc3a_transform.py'
      - '.github/workflows/btc-harmonic-guard-commercial-rc7.yml'
      - 'FibonacciHarmonicSniperUltimate/monthly-growth-v2/**'
      - 'FibonacciHarmonicSniperUltimate/monthly-growth-v3/**'
      - 'FibonacciHarmonicSniperUltimate/store-commercial-rc3a/**'

permissions:
  contents: read

concurrency:
  group: btc-harmonic-guard-commercial-rc7
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Preflight report sequence and RC7B architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_validation.sh
          test -s FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py
          test -s FibonacciHarmonicSniperUltimate/monthly-growth-v3/growth3_transform.py
          test -s .github/scripts/commercial_rc3a_transform.py
          test -s .github/scripts/commercial_rc4_transform.py
          test -s .github/scripts/commercial_rc4_parity_fix.py
          test -s .github/scripts/commercial_rc6_transform.py
          test -s .github/scripts/commercial_rc7_transform.py
          test -s .github/scripts/commercial_rc7_verify.py
          test -s .github/policies/commercial_rc7_policy.json
          test -s .github/policies/commercial_rc7_abcd_whitelist_audit.json
          python3 -m py_compile \
            .github/scripts/commercial_rc3a_transform.py \
            .github/scripts/commercial_rc4_transform.py \
            .github/scripts/commercial_rc4_parity_fix.py \
            .github/scripts/commercial_rc6_transform.py \
            .github/scripts/commercial_rc7_transform.py \
            .github/scripts/commercial_rc7_verify.py
          bash -n FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_validation.sh
          python3 - <<'PY'
          import json
          p=json.load(open('.github/policies/commercial_rc7_policy.json'))
          a=json.load(open('.github/policies/commercial_rc7_abcd_whitelist_audit.json'))
          assert p['policy_version']=='RC7B-2026-09-10'
          assert p['candidate_count']==1
          assert p['report_sequence']['rc6b_abcd_whitelist']=='REJECTED_NO_CROSS_PERIOD_ROBUST_COARSE_CELL'
          assert p['report_sequence']['active_step']=='RC6C_DEFERRED_INTENT_AND_PORTFOLIO_ARBITRATION'
          assert a['decision']=='REJECT_LIVE_WHITELIST'
          assert a['next_report_step']=='RC6C_DEFERRED_INTENT_TTL_QUEUE'
          for k in ('round22_control','h1_buy_alpha','h1_sell_alpha','m30_reciprocal_alpha','single_execute_market_order_boundary','base_risk_parameters_unchanged','frozen_windows_unchanged','commercial_gates_unchanged'):
              assert p['immutable'][k] is True
          assert p['immutable']['m30_abcd_live'] is False
          assert p['immutable']['growth3_live'] is False
          assert p['policy']['arbitration']['deferred_m30_ttl_minutes']==90
          assert p['policy']['arbitration']['deferred_m30_max_age_bars']==3
          assert p['policy']['arbitration']['deferred_execution_blackout_first_minutes_of_hour']==2
          print('[RC7B PREFLIGHT] RC6B rejected; RC6C single candidate locked')
          PY

      - name: Install RC7B transform chain
        shell: bash
        run: |
          set -euo pipefail
          cp FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py /tmp/growth2_transform.py
          test -s /tmp/growth2_transform.py
          cp .github/scripts/commercial_rc7_transform.py FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py
          python3 -m py_compile /tmp/growth2_transform.py FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py
          echo '[RC7B TRANSFORM] original Growth2 baseline preserved; RC6C arbitration/deferred-intent overlay installed'

      - name: Run full frozen validation with watchdog
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          LOG=work/commercial-rc7-validation-console.log
          : > "$LOG"
          heartbeat(){
            while true; do
              echo "[HEARTBEAT] $(date -u +%FT%TZ) RC7B alive" | tee -a "$LOG"
              find work -maxdepth 2 -type f \( -name 'report.*' -o -name '*.json' -o -name '*.algo' \) -printf '[ARTIFACT] %s %p\n' 2>/dev/null | tail -30 | tee -a "$LOG" || true
              sleep 300
            done
          }
          heartbeat & HB=$!
          trap 'kill $HB 2>/dev/null || true' EXIT INT TERM
          set +e
          timeout --signal=TERM --kill-after=60s 10800s \
            bash FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_validation.sh \
            2>&1 | tee -a "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "[RC7B ENGINEERING FAIL] rc=$rc" | tee -a "$LOG"
            exit "$rc"
          fi
          echo '[RC7B VALIDATION DONE]' | tee -a "$LOG"

      - name: RC7B independent commercial verifier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/commercial_rc7_verify.py work | tee work/commercial-rc7-gate-console.log

      - name: Emit report-directed next state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          g=json.load(open('work/Commercial-RC7-Gate.json'))
          if g.get('commercial_freeze_eligible') is True:
              pathlib.Path('work/RC7-COMMERCIAL-FREEZE-ELIGIBLE.txt').write_text('commercial_freeze_eligible=true\npolicy_version='+g['policy_version']+'\n')
              print('[RC7B PROMOTION] PASS -> FREEZE_AND_PUBLISH')
          else:
              print('[RC7B PROMOTION] REJECT ->', g.get('next_report_step'))
              print('[RC7B FAILED GATES]', ','.join(g.get('failed_formal_gates', [])))
          PY

      - name: Remove credentials
        if: always()
        shell: bash
        run: rm -f work/ctrader.pwd

      - name: Upload RC7B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Harmonic-Guard-Commercial-RC7B
          retention-days: 30
          if-no-files-found: warn
          path: |
            .github/policies/commercial_rc7_policy.json
            .github/policies/commercial_rc7_abcd_whitelist_audit.json
            .github/scripts/commercial_rc7_transform.py
            .github/scripts/commercial_rc7_verify.py
            work/commercial-rc7-validation-console.log
            work/commercial-rc7-gate-console.log
            work/Commercial-RC7-Gate.json
            work/RC7-COMMERCIAL-FREEZE-ELIGIBLE.txt
            work/build/*
            work/g2/*
            work/control-3y/report.*
            work/control-1y/report.*
            work/strict-3y/report.*
            work/balanced-3y/report.*
            work/moderate-3y/report.*
            work/recent-a/report.*
            work/recent-b/report.*
            work/y1/report.*
            work/y2/report.*
            work/y3/report.*
            work/harsh-3y/report.*
            work/harsh-y3/report.*
            work/Growth2-*.json
