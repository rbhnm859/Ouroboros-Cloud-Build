name: Export CDScalper EURUSD v1 Project

on:
  workflow_dispatch:
  push:
    branches:
      - cds-eurusd-v1

permissions:
  contents: read

env:
  EXPORT_NAME: CumulativeDeltaScalper-EURUSD-v1-project-export

jobs:
  export-project:
    name: export-project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cds-eurusd-v1
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1

      - name: Prepare export folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EXPORT_NAME" "$EXPORT_NAME.zip" "$EXPORT_NAME.zip.sha256"
          mkdir -p "$EXPORT_NAME"

          cp -R CumulativeDeltaScalper-EURUSD-v1 "$EXPORT_NAME/"

          mkdir -p "$EXPORT_NAME/.github/workflows"
          for wf in \
            cdscalper-eurusd-v1-build-algo.yml \
            cdscalper-eurusd-v1-backtest-30d.yml \
            cdscalper-eurusd-v1-backtest-30d-diagnostic.yml \
            cdscalper-eurusd-v1-backtest-1y.yml \
            export-cdscalper-eurusd-v1-project.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              cp ".github/workflows/$wf" "$EXPORT_NAME/.github/workflows/"
            fi
          done

          cat > "$EXPORT_NAME/EXPORT_README.md" <<'EOF'
# CumulativeDeltaScalper-EURUSD-v1 Project Export

Generated from branch `cds-eurusd-v1` in `rbhnm859/Ouroboros-Cloud-Build`.

Included:
- Full `CumulativeDeltaScalper-EURUSD-v1` project folder
- Source code
- Builds, presets, backtests, reports and docs if present
- Relevant GitHub Actions workflows

Current debug status:
- `.algo` build previously succeeded.
- EURUSD M1 30D backtest completed with 0 trades.
- Relaxed diagnostic backtest completed with 0 trades.
- Next fix direction: add/fix bar-delta fallback or change delta source because tick-delta does not appear to accumulate under cTrader CLI `--data-mode=m1`.
EOF

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r "$EXPORT_NAME.zip" "$EXPORT_NAME"
          sha256sum "$EXPORT_NAME.zip" > "$EXPORT_NAME.zip.sha256"
          ls -lh "$EXPORT_NAME.zip" "$EXPORT_NAME.zip.sha256"

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: CumulativeDeltaScalper-EURUSD-v1-project-export
          path: |
            CumulativeDeltaScalper-EURUSD-v1-project-export.zip
            CumulativeDeltaScalper-EURUSD-v1-project-export.zip.sha256
          retention-days: 14
