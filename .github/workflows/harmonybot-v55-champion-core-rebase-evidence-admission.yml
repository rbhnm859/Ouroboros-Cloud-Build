name: HarmonyBot V55 Champion Core Rebase & Universal Harmonic Evidence Admission Engine

on:
  push:
    branches: [harmonybot/v55-champion-core-rebase-evidence-admission]
    paths:
      - 'HarmonyBot-V55/**'
      - '.github/workflows/harmonybot-v55-champion-core-rebase-evidence-admission.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v55-champion-core-rebase-evidence-admission
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static, geometry, build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V55/tools/static_audit.py HarmonyBot-V55/src/HarmonyBotV55.cs
          python3 HarmonyBot-V55/tools/geometry_contract_test.py HarmonyBot-V55/src/HarmonyBotV55.cs
          python3 HarmonyBot-V55/tools/detector_contract_test.py HarmonyBot-V55/src/HarmonyBotV55.cs
          python3 HarmonyBot-V55/tools/conversion_contract_test.py HarmonyBot-V55/src/HarmonyBotV55.cs
          python3 HarmonyBot-V55/tools/v55_architecture_contract_test.py HarmonyBot-V55/src/HarmonyBotV55.cs
          dotnet restore HarmonyBot-V55/HarmonyBotV55.csproj
          dotnet build HarmonyBot-V55/HarmonyBotV55.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V55/dist HarmonyBot-V55/final
          A=$(find HarmonyBot-V55/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          cp "$A" HarmonyBot-V55/dist/HarmonyBot_V55_Universal_Harmonic_Liberation_Grid_Alpha_Core_RC.algo
          sha256sum HarmonyBot-V55/src/HarmonyBotV55.cs "$A" > HarmonyBot-V55/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V55/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v55-build
          path: |
            control/HarmonyBot-V55/dist
            control/HarmonyBot-V55/final
          retention-days: 30

  data-seed:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v55-build
          path: control/HarmonyBot-V55/shared
      - name: Resolve dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - name: Build immutable market-data snapshot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V55/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V55/data-seed-${{ matrix.window }}"
          O="$GITHUB_WORKSPACE/control/HarmonyBot-V55/data-seed-out-${{ matrix.window }}"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V55/shared -type f -name 'HarmonyBot_V55_Universal_Harmonic_Liberation_Grid_Alpha_Core_RC.algo' | head -1)
          test -s "$A"; cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V55-DATA-SEED-${{ matrix.window }}" START_DATE="${{ steps.d.outputs.start }}" EVAL_DATE="${{ steps.d.outputs.eval }}" END_DATE="${{ steps.d.outputs.end }}" BALANCE=10000             FAMNATIVE=false FAMOBS=true CANCONTRACT=true FAMCONF=true GRIDV2=true STOPV2=true JOINT=true CORRIDOR=false ANCHORFORENSICS=false             IDENT=true BOUNDED=true SKIPS=2 FQUOTA=4 PRJPRZ=false DTRUTH=false FAMQUAL=false FAMROUTE=false FAMCONFV2=false CTXBUS=false GRIDEXEC=true LIBERATE=false COREKEEP=false GRIDV3=false STATEGRID=false             PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false BACKTEST_TIMEOUT_SECONDS=1800             "$GITHUB_WORKSPACE/control/HarmonyBot-V55/tools/run_backtest.sh"
          )
          test -d "$W/seal/data"
          (cd "$W/seal/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}' > "$O/data.snapshot.sha"
          tar -C "$W/seal" -czf "$O/data.tgz" data
          test -s "$O/data.tgz"; test -s "$O/data.snapshot.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: v55-data-${{ matrix.window }}
          path: control/HarmonyBot-V55/data-seed-out-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  dev:
    needs: [build, data-seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        family: [V51_QUALITY_CORE_REPLAY, V52_LIBERATION_CONTROL, V55_LIBERATION_LEGACY_GRID, V55_LIBERATION_GRID_V3]
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v55-build
          path: control/HarmonyBot-V55/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V55/dist
          A=$(find control/HarmonyBot-V55/shared -type f -name 'HarmonyBot_V55_Universal_Harmonic_Liberation_Grid_Alpha_Core_RC.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V55/dist/
      - name: Resolve dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: v55-data-${{ matrix.window }}
          path: control/HarmonyBot-V55/data-seed
      - name: Install immutable market-data snapshot
        shell: bash
        run: |
          set -euo pipefail
          W="control/HarmonyBot-V55/window-${{ matrix.family }}-${{ matrix.window }}/seal"
          mkdir -p "$W"
          tar -xzf control/HarmonyBot-V55/data-seed/data.tgz -C "$W"
          cp control/HarmonyBot-V55/data-seed/data.snapshot.sha "$W/data.snapshot.sha"
          EXPECTED=$(tr -d '[:space:]' < "$W/data.snapshot.sha")
          ACTUAL=$((cd "$W/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
      - name: Run fixed DEV
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V55/tools/*.sh
          control/HarmonyBot-V55/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v55-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V55/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v55-dev-*'
          path: control/HarmonyBot-V55/merged
          merge-multiple: true
      - name: Root-cause attribution and commercial gate
        id: gate
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V55/final
          python3 control/HarmonyBot-V55/tools/analyze_parallel_dev.py control/HarmonyBot-V55/merged control/HarmonyBot-V55/final
          echo "candidate=$(cat control/HarmonyBot-V55/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V55-CHAMPION-CORE-EVIDENCE-ADMISSION-FRONTIER
          path: control/HarmonyBot-V55/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v55-build
          path: control/HarmonyBot-V55/shared
      - name: Capital validation
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          FQ=false; FR=false; FC2=false; CTX=false; GEXEC=true; LIBERATE=false; COREKEEP=false; GRIDV3=false; STATEGRID=false
          case "$CANDIDATE" in
            V55_LIBERATION_LEGACY_GRID) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; IDENT=true; BOUNDED=true; PRJ=false; FQ=true; FR=true; FC2=true; CTX=true; GEXEC=true; LIBERATE=true; COREKEEP=true; GRIDV3=false; STATEGRID=false;;
            V55_LIBERATION_GRID_V3) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; IDENT=true; BOUNDED=true; PRJ=false; FQ=true; FR=true; FC2=true; CTX=true; GEXEC=true; LIBERATE=true; COREKEEP=true; GRIDV3=true; STATEGRID=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V55/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V55/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V55/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V55/shared -type f -name 'HarmonyBot_V55_Universal_Harmonic_Liberation_Grid_Alpha_Core_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V55-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE"             FAMNATIVE=false FAMOBS=true CANCONTRACT="$CAN" FAMCONF="$FC" GRIDV2="$GRID" STOPV2="$STOP" JOINT="$JOINT" CORRIDOR=false ANCHORFORENSICS=true IDENT="$IDENT" BOUNDED="$BOUNDED" SKIPS=2 FQUOTA=4 PRJPRZ="$PRJ" DTRUTH=true FAMQUAL="$FQ" FAMROUTE="$FR" FAMCONFV2="$FC2" CTXBUS="$CTX" GRIDEXEC="$GEXEC" LIBERATE="$LIBERATE" COREKEEP="$COREKEEP" GRIDV3="$GRIDV3" STATEGRID="$STATEGRID" PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false             BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V55/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V55/tools/audit_report.py --report "$W/seal/reports/V55-$CANDIDATE-CAPITAL-$BALANCE.json"             --log "$W/seal/logs/V55-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json"             --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v55-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V55/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze, capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v55-capital-*'
          path: capital
          merge-multiple: true
      - name: Hard capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V55_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V55","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"actual_100_frequency":rows["100"]["frequency"]},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v55-capital-gate
          path: V55_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze, capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v55-build
          path: shared
      - name: Freeze hashes
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V55/src/HarmonyBotV55.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V55_Universal_Harmonic_Liberation_Grid_Alpha_Core_RC.algo"))
          pathlib.Path("V55_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V55","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v55-freeze-manifest
          path: V55_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze, freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v55-champion-core-rebase-evidence-admission
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v55-build
          path: control/HarmonyBot-V55/shared
      - name: Untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          FQ=false; FR=false; FC2=false; CTX=false; GEXEC=true
          case "$CANDIDATE" in
            V55_CONVERSION_NOGRID) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; IDENT=true; BOUNDED=true; PRJ=false; FQ=true; FR=true; FC2=true; CTX=true; GEXEC=false;;
            V55_CONVERSION_GRID) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; IDENT=true; BOUNDED=true; PRJ=false; FQ=true; FR=true; FC2=true; CTX=true; GEXEC=true;;
            *) exit 31;;
          esac
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V55/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V55/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"; chmod +x control/HarmonyBot-V55/tools/*.sh
          A=$(find control/HarmonyBot-V55/shared -type f -name 'HarmonyBot_V55_Universal_Harmonic_Liberation_Grid_Alpha_Core_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V55-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE"             FAMNATIVE=false FAMOBS=true CANCONTRACT="$CAN" FAMCONF="$FC" GRIDV2="$GRID" STOPV2="$STOP" JOINT="$JOINT" CORRIDOR=false ANCHORFORENSICS=true IDENT="$IDENT" BOUNDED="$BOUNDED" SKIPS=2 FQUOTA=4 PRJPRZ="$PRJ" DTRUTH=true FAMQUAL="$FQ" FAMROUTE="$FR" FAMCONFV2="$FC2" CTXBUS="$CTX" GRIDEXEC="$GEXEC" LIBERATE="$LIBERATE" COREKEEP="$COREKEEP" GRIDV3="$GRIDV3" STATEGRID="$STATEGRID" PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false             BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V55/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V55/tools/audit_report.py --report "$W/seal/reports/V55-$CANDIDATE-FRESH-$KIND.json"             --log "$W/seal/logs/V55-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json"             --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v55-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V55/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze, fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v55-fresh-*'
          path: fresh
          merge-multiple: true
      - name: Final commercial decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10
          ok=good(a) and good(m)
          pathlib.Path("V55_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V55","fresh_alpha":a,"fresh_100":m,"fresh_validation_pass":ok},indent=2))
          pathlib.Path("V55_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V55","decision":"COMMERCIAL_FREEZE_CANDIDATE_PASS" if ok else "HOLD_WITH_EVIDENCE","fresh_used":True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v55-final-decision
          path: |
            V55_FRESH_VALIDATION.json
            V55_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
