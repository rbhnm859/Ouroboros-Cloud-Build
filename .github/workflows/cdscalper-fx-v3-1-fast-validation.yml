name: CDS FX V3.1 - Fast Cached Validation

on:
  pull_request:
    paths:
      - 'CumulativeDeltaScalper-FX-Commercial-v3/**'
      - '.github/workflows/cdscalper-fx-v3-1-fast-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLI_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11

concurrency:
  group: cds-fx-v3-1-fast-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build exact current source
        shell: bash
        run: |
          set -euo pipefail
          PROJ='CumulativeDeltaScalper-FX-Commercial-v3/CumulativeDeltaScalper_FX_Commercial_v3.csproj'
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True
          mkdir -p out
          ALGO=$(find CumulativeDeltaScalper-FX-Commercial-v3 -type f -name '*.algo' | head -n1)
          test -n "$ALGO"
          cp "$ALGO" out/CumulativeDeltaScalper_FX_Commercial_v3.algo
          sha256sum out/CumulativeDeltaScalper_FX_Commercial_v3.algo | tee out/algo.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v3-1-fast-build
          path: out/
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - { symbol: EURUSD, spread: 0.44 }
          - { symbol: GBPUSD, spread: 0.67 }
          - { symbol: USDJPY, spread: 0.37 }
          - { symbol: EURGBP, spread: 0.98 }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v3-1-fast-build
          path: bt
      - uses: actions/cache@v4
        with:
          path: bt/cache
          key: ctrader-5.9.11-fxpro-${{ matrix.symbol }}-m1-v1
          restore-keys: |
            ctrader-5.9.11-fxpro-${{ matrix.symbol }}-m1-
      - name: Pull CLI and credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          docker pull "$CLI_IMAGE"
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > bt/ctrader.pwd
          chmod 600 bt/ctrader.pwd
          mkdir -p bt/cache bt/reports
      - name: 14-day runtime smoke
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/bt:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            "$CLI_IMAGE" backtest /work/CumulativeDeltaScalper_FX_Commercial_v3.algo \
            --environment-variables --exit-on-stop --broker=FxPro \
            --symbol=${{ matrix.symbol }} --period=m1 \
            --start='29/08/2026' --end='12/09/2026' --balance=100 \
            --spread=${{ matrix.spread }} --commission=35 --commission-type=UsdPerMillionUsdVolume \
            --precise-conversion --data-mode=m1 --data-dir=/work/cache \
            --report-json="/work/reports/${{ matrix.symbol }}-smoke.json" \
            2>&1 | tee "bt/reports/${{ matrix.symbol }}-smoke.log"
          test -s "bt/reports/${{ matrix.symbol }}-smoke.json"
          ! grep -Eqi '\[V3 CRITICAL\]|Unhandled exception|Fatal|Backtest failed' "bt/reports/${{ matrix.symbol }}-smoke.log"
      - if: always()
        run: rm -f bt/ctrader.pwd

  screen28:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { symbol: AUDCAD, spread: 1.22 }
          - { symbol: AUDCHF, spread: 1.05 }
          - { symbol: AUDJPY, spread: 1.42 }
          - { symbol: AUDNZD, spread: 1.54 }
          - { symbol: AUDUSD, spread: 0.61 }
          - { symbol: CADCHF, spread: 0.92 }
          - { symbol: CADJPY, spread: 1.22 }
          - { symbol: CHFJPY, spread: 1.40 }
          - { symbol: EURAUD, spread: 1.28 }
          - { symbol: EURCAD, spread: 1.41 }
          - { symbol: EURCHF, spread: 1.59 }
          - { symbol: EURGBP, spread: 0.98 }
          - { symbol: EURJPY, spread: 1.16 }
          - { symbol: EURNZD, spread: 2.64 }
          - { symbol: EURUSD, spread: 0.44 }
          - { symbol: GBPAUD, spread: 2.30 }
          - { symbol: GBPCAD, spread: 2.29 }
          - { symbol: GBPCHF, spread: 1.21 }
          - { symbol: GBPJPY, spread: 2.30 }
          - { symbol: GBPNZD, spread: 2.68 }
          - { symbol: GBPUSD, spread: 0.67 }
          - { symbol: NZDCAD, spread: 2.40 }
          - { symbol: NZDCHF, spread: 1.18 }
          - { symbol: NZDJPY, spread: 1.92 }
          - { symbol: NZDUSD, spread: 1.08 }
          - { symbol: USDCAD, spread: 1.00 }
          - { symbol: USDCHF, spread: 0.73 }
          - { symbol: USDJPY, spread: 0.37 }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v3-1-fast-build
          path: bt
      - uses: actions/cache@v4
        with:
          path: bt/cache
          key: ctrader-5.9.11-fxpro-${{ matrix.symbol }}-m1-v1
          restore-keys: |
            ctrader-5.9.11-fxpro-${{ matrix.symbol }}-m1-
      - name: Pull CLI and credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          docker pull "$CLI_IMAGE"
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > bt/ctrader.pwd
          chmod 600 bt/ctrader.pwd
          mkdir -p bt/cache bt/reports
      - name: 3-month coarse screen
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          SYMBOL: ${{ matrix.symbol }}
          SPREAD: ${{ matrix.spread }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/bt:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            "$CLI_IMAGE" backtest /work/CumulativeDeltaScalper_FX_Commercial_v3.algo \
            --environment-variables --exit-on-stop --broker=FxPro \
            --symbol="$SYMBOL" --period=m1 --start='12/06/2026' --end='12/09/2026' --balance=100 \
            --spread="$SPREAD" --commission=35 --commission-type=UsdPerMillionUsdVolume \
            --precise-conversion --data-mode=m1 --data-dir=/work/cache \
            --report-json="/work/reports/${SYMBOL}-screen.json" \
            2>&1 | tee "bt/reports/${SYMBOL}-screen.log"
          test -s "bt/reports/${SYMBOL}-screen.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          s=os.environ['SYMBOL']; spread=float(os.environ['SPREAD'])
          d=json.loads(Path(f'bt/reports/{s}-screen.json').read_text())
          t=d.get('tradeStatistics',{}); e=d.get('equity',{})
          def g(k, default=0):
              v=t.get(k, default); v=v.get('all', default) if isinstance(v,dict) else v
              try:return float(v)
              except:return float(default)
          out={
              'symbol':s,'spread':spread,'trades':int(g('totalTrades')),
              'net':g('netProfit'),'pf':g('profitFactor'),
              'dd':float(e.get('maxEquityDrawdownPercent') or 0)
          }
          Path(f'bt/reports/{s}-screen-summary.json').write_text(json.dumps(out))
          print(out)
          PY
      - if: always()
        run: rm -f bt/ctrader.pwd
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-screen-${{ matrix.symbol }}
          path: |
            bt/reports/${{ matrix.symbol }}-screen.json
            bt/reports/${{ matrix.symbol }}-screen.log
            bt/reports/${{ matrix.symbol }}-screen-summary.json
          if-no-files-found: warn
          retention-days: 14

  select:
    needs: screen28
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fast-screen-*
          path: screens
          merge-multiple: true
      - id: pick
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          majors={'EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD'}
          spreads={
          'AUDCAD':1.22,'AUDCHF':1.05,'AUDJPY':1.42,'AUDNZD':1.54,'AUDUSD':0.61,'CADCHF':0.92,'CADJPY':1.22,'CHFJPY':1.40,
          'EURAUD':1.28,'EURCAD':1.41,'EURCHF':1.59,'EURGBP':0.98,'EURJPY':1.16,'EURNZD':2.64,'EURUSD':0.44,'GBPAUD':2.30,
          'GBPCAD':2.29,'GBPCHF':1.21,'GBPJPY':2.30,'GBPNZD':2.68,'GBPUSD':0.67,'NZDCAD':2.40,'NZDCHF':1.18,'NZDJPY':1.92,
          'NZDUSD':1.08,'USDCAD':1.00,'USDCHF':0.73,'USDJPY':0.37}
          rows=[]
          for p in Path('screens').glob('*-screen-summary.json'):
              try: rows.append(json.loads(p.read_text()))
              except: pass
          # Always validate all Major 7 for one year. Add at most five crosses that show actual
          # activity and are not clearly broken in the 3-month coarse screen.
          extra=[r for r in rows if r['symbol'] not in majors and r['trades']>=3 and r['pf']>=0.80 and r['dd']<=12]
          extra.sort(key=lambda r:(r['pf'],r['net'],r['trades']), reverse=True)
          selected=sorted(majors) + [r['symbol'] for r in extra[:5]]
          include=[{'symbol':s,'spread':spreads[s]} for s in selected]
          matrix=json.dumps({'include':include},separators=(',',':'))
          print('Selected:', selected)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+matrix+'\n')
          PY

  full1y:
    needs: [build, select]
    if: ${{ needs.select.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v3-1-fast-build
          path: bt
      - uses: actions/cache@v4
        with:
          path: bt/cache
          key: ctrader-5.9.11-fxpro-${{ matrix.symbol }}-m1-v1
          restore-keys: |
            ctrader-5.9.11-fxpro-${{ matrix.symbol }}-m1-
      - name: Pull CLI and credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          docker pull "$CLI_IMAGE"
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > bt/ctrader.pwd
          chmod 600 bt/ctrader.pwd
          mkdir -p bt/cache bt/reports
      - name: Selective one-year validation
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          SYMBOL: ${{ matrix.symbol }}
          SPREAD: ${{ matrix.spread }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/bt:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            "$CLI_IMAGE" backtest /work/CumulativeDeltaScalper_FX_Commercial_v3.algo \
            --environment-variables --exit-on-stop --broker=FxPro \
            --symbol="$SYMBOL" --period=m1 --start='12/09/2025' --end='12/09/2026' --balance=100 \
            --spread="$SPREAD" --commission=35 --commission-type=UsdPerMillionUsdVolume \
            --precise-conversion --data-mode=m1 --data-dir=/work/cache \
            --report-json="/work/reports/${SYMBOL}-1y.json" \
            2>&1 | tee "bt/reports/${SYMBOL}-1y.log"
          test -s "bt/reports/${SYMBOL}-1y.json"
      - if: always()
        run: rm -f bt/ctrader.pwd
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-1y-${{ matrix.symbol }}
          path: |
            bt/reports/${{ matrix.symbol }}-1y.json
            bt/reports/${{ matrix.symbol }}-1y.log
          if-no-files-found: warn
          retention-days: 14
