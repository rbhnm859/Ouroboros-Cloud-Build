name: HarmonyBot V70 Causal Admission Reconstruction DEV

on:
  push:
    branches:
      - harmonybot/v70-causal-admission-reconstruction-alpha-recall-recovery
    paths:
      - 'HarmonyBot-V70/**'
      - '.github/workflows/harmonybot-v70-causal-admission-reconstruction-alpha-recall-recovery.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v70-causal-admission-reconstruction-alpha-recall-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static audit and immutable build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V70/tools/static_contract_audit.py HarmonyBot-V70/src/HarmonyBotV70.cs
          dotnet restore HarmonyBot-V70/HarmonyBotV70.csproj
          dotnet build HarmonyBot-V70/HarmonyBotV70.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V70/dist HarmonyBot-V70/final
          A=$(find HarmonyBot-V70/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V70/dist/HarmonyBot_V70_Causal_Admission_Reconstruction_Alpha_Recall_Recovery.algo
          sha256sum HarmonyBot-V70/src/HarmonyBotV70.cs "$A" > HarmonyBot-V70/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V70/final/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          s=pathlib.Path("HarmonyBot-V70/src/HarmonyBotV70.cs")
          a=pathlib.Path("HarmonyBot-V70/dist/HarmonyBot_V70_Causal_Admission_Reconstruction_Alpha_Recall_Recovery.algo")
          pathlib.Path("HarmonyBot-V70/final/V70_PREREGISTERED_FREEZE_MANIFEST.json").write_text(json.dumps({
            "version":"HarmonyBot V70",
            "source_commit":os.environ["GITHUB_SHA"],
            "source_sha256":hashlib.sha256(s.read_bytes()).hexdigest(),
            "algo_sha256":hashlib.sha256(a.read_bytes()).hexdigest(),
            "variants":["A_V69_CONTROL","B_HARD_VETO_RATIONALIZED","C_FAMILY_ROUTE_RECONSTRUCTED","D_OPPORTUNITY_COST"],
            "calibration_windows":["Y2021","Y2022","Y2023"],
            "promotion_dev_windows":["H2024H2","H2025H1","H2025H2"],
            "grid_changed":False,"exit_changed":False,
            "validation_locked":True,"fresh_locked":True,
            "post_dev_tuning_allowed":False
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v70-build
          path: |
            control/HarmonyBot-V70/dist
            control/HarmonyBot-V70/final
            control/V70_STATIC_CONTRACT_AUDIT.json
          retention-days: 30

  causal_dev:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [A_V69_CONTROL, B_HARD_VETO_RATIONALIZED, C_FAMILY_ROUTE_RECONSTRUCTED, D_OPPORTUNITY_COST]
        window: [Y2021, Y2022, Y2023, H2024H2, H2025H1, H2025H2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v70-build
          path: control/HarmonyBot-V70/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V70/dist
          A=$(find control/HarmonyBot-V70/shared -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" control/HarmonyBot-V70/dist/HarmonyBot_V70_Causal_Admission_Reconstruction_Alpha_Recall_Recovery.algo
      - name: Resolve fixed window
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT"; echo "years=1.0" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT"; echo "years=1.0" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT"; echo "years=1.0" >> "$GITHUB_OUTPUT";;
            H2024H2) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT"; echo "years=.5" >> "$GITHUB_OUTPUT";;
            H2025H1) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT"; echo "years=.5" >> "$GITHUB_OUTPUT";;
            H2025H2) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT"; echo "years=.5" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run frozen causal window
        shell: bash
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V70/tools/*.sh
          control/HarmonyBot-V70/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" "${{ steps.d.outputs.years }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V70/output-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: causal_dev
    if: always() && needs.causal_dev.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v70-*'
          path: merged
          merge-multiple: true
      - name: Build causal performance frontier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 control/HarmonyBot-V70/tools/analyze_v70.py merged final
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V70-CAUSAL-ADMISSION-FRONTIER
          path: final
          retention-days: 30
