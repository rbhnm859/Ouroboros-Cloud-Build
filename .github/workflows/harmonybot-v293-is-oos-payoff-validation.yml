name: HarmonyBot V29.3 IS-OOS Payoff Preset Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v293-is-oos-payoff-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  is-oos:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot-v293-grid-risk-cap-hotfix-rc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate and compile exact V29.3 candidate
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          mkdir -p seal/{build,algo,reports,logs,audit,data}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3-Grid-Risk-Cap-Hotfix-RC' seal/build/HarmonyBotPro.cs
          grep -Fq '[V293-GRID-RISK-CAP]' seal/build/HarmonyBotPro.cs
          grep -Fq 'CapGridStopToRiskBudget && p.StopLoss.HasValue' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v293_is_oos_payoff</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit)
          test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v293_is_oos_payoff.algo
          sha256sum seal/algo/*.algo > seal/algo.sha256

      - name: Resolve FxPro demo account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd
          chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500:
              raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          )
          echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"

      - name: IS frozen preset - server ticks
        id: is_run
        continue-on-error: true
        run: |
          set -euo pipefail
          C="v293-is-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v293_is_oos_payoff.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=01/04/2026 --end=30/06/2026 --balance=10000 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=false --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-04-08T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=false --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false \
            --report=/work/reports/IS-TICKS.html --report-json=/work/reports/IS-TICKS.json > seal/logs/IS-TICKS.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<10800;i+=5)); do
            if test -s seal/reports/IS-TICKS.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/IS-TICKS.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: OOS historical holdout frozen preset - server ticks
        id: oos_run
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          C="v293-oos-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v293_is_oos_payoff.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=01/07/2026 --end=09/08/2026 --balance=10000 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=false --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-07-08T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=false --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false \
            --report=/work/reports/OOS-TICKS.html --report-json=/work/reports/OOS-TICKS.json > seal/logs/OOS-TICKS.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<7200;i+=5)); do
            if test -s seal/reports/OOS-TICKS.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/OOS-TICKS.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: Build basket-level IS-OOS evidence matrix
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,statistics

          def aggregate(track):
              rp=pathlib.Path(f'seal/reports/{track}-TICKS.json')
              lp=pathlib.Path(f'seal/logs/{track}-TICKS.log')
              if not rp.exists(): return {'report_complete':False,'gate_pass':False,'fail':['missing_report']}
              d=json.load(open(rp,encoding='utf-8-sig')); m=d.get('main',{}); eq=d.get('equity',{}); h=d.get('history',{}).get('items',[])
              t=lp.read_text(errors='ignore') if lp.exists() else ''
              groups={}
              for x in h:
                  key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
                  g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'entryPrice':key[3],'net':0.0,'gross':0.0,'commissions':0.0,'closeTime':0,'fragments':0,'max_quantity':0.0})
                  g['net']+=float(x.get('net',0) or 0); g['gross']+=float(x.get('gross',0) or 0); g['commissions']+=float(x.get('commissions',0) or 0)
                  g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0)); g['fragments']+=1; g['max_quantity']=max(g['max_quantity'],float(x.get('quantity',0) or 0))
              mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime'])
              children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
              baskets=[]
              patterns=re.findall(r'\[GRID\]\s+Basket\s+#\d+\s+created\s+\|\s*([^|]+?)\s*\|',t,re.I)
              for i,g in enumerate(mains):
                  baskets.append({'index':i+1,'pattern':patterns[i].strip() if i<len(patterns) else 'Unknown','direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'net':g['net'],'main_net':g['net'],'grid_net':0.0,'grid_children':0,'fragments':g['fragments']})
              unassigned=[]
              for c in children:
                  cand=[b for b in baskets if b['direction']==c['direction'] and b['entryTime']<=c['entryTime']<=b['closeTime']]
                  if not cand:
                      cand=[b for b in baskets if b['direction']==c['direction'] and 0<=c['entryTime']-b['entryTime']<=4*60*60*1000]
                  if cand:
                      b=max(cand,key=lambda z:z['entryTime']); b['net']+=c['net']; b['grid_net']+=c['net']; b['grid_children']+=1; b['closeTime']=max(b['closeTime'],c['closeTime'])
                  else: unassigned.append(c)
              wins=[b['net'] for b in baskets if b['net']>0]; losses=[b['net'] for b in baskets if b['net']<0]
              gross_win=sum(wins); gross_loss=abs(sum(losses)); pf=(gross_win/gross_loss if gross_loss>0 else (999.0 if gross_win>0 else 0.0))
              avgw=sum(wins)/len(wins) if wins else 0.0; avgl=sum(losses)/len(losses) if losses else 0.0; rr=(avgw/abs(avgl) if avgw>0 and avgl<0 else None)
              net=sum(b['net'] for b in baskets); n=len(baskets); wr=len(wins)/n*100 if n else 0.0; exp=net/n if n else None
              loss_abs=sorted([abs(x) for x in losses],reverse=True)
              pts=eq.get('points',[]) or []; dd=float(eq.get('maxEquityDrawdownPercent',0) or 0)
              min_eq=min([float(x.get('minEquity',10000) or 10000) for x in pts],default=float(m.get('endingEquity',10000) or 10000))
              errs=[x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge|Margin Cascade|Exposure Explosion',x,re.I)]
              bypat={}
              for b in baskets:
                  p=b['pattern']; q=bypat.setdefault(p,{'baskets':0,'wins':0,'net':0.0,'gross_win':0.0,'gross_loss':0.0})
                  q['baskets']+=1; q['net']+=b['net']; q['wins']+=1 if b['net']>0 else 0
                  if b['net']>0: q['gross_win']+=b['net']
                  elif b['net']<0: q['gross_loss']+=abs(b['net'])
              for q in bypat.values():
                  q['win_rate_pct']=q['wins']/q['baskets']*100 if q['baskets'] else 0; q['profit_factor']=q['gross_win']/q['gross_loss'] if q['gross_loss']>0 else (999.0 if q['gross_win']>0 else 0.0)
              fail=[]
              if m.get('data',{}).get('type')!='tickDataFromServer': fail.append('not_server_ticks')
              if n<1: fail.append('no_baskets')
              if errs: fail.append('execution_errors')
              if dd>10.0+1e-9: fail.append('dd_above_10pct')
              if unassigned: fail.append('unassigned_grid_children')
              if pf<=1.0: fail.append('pf_not_above_1')
              if net<=0: fail.append('net_not_positive')
              if exp is None or exp<=0: fail.append('expectancy_not_positive')
              return {
                'report_complete':True,'data_type':m.get('data',{}).get('type'),'starting_capital':m.get('startingCapital'),'ending_equity':m.get('endingEquity'),
                'raw_history_items':len(h),'underlying_positions':len(groups),'baskets':n,'wins':len(wins),'losses':len(losses),'win_rate_pct':wr,
                'net_profit_basket_sum':net,'report_net_profit':m.get('netProfit'),'return_pct':((float(m.get('endingEquity',10000))-10000)/10000*100),
                'profit_factor_basket':pf,'average_winner_basket':avgw,'average_loser_basket':avgl,'realized_rr_basket':rr,'expectancy_per_basket':exp,
                'max_equity_drawdown_pct':dd,'minimum_equity':min_eq,'largest_loss_basket':max(loss_abs) if loss_abs else 0.0,
                'top3_loss_contribution_pct':sum(loss_abs[:3])/sum(loss_abs)*100 if loss_abs else 0.0,'grid_child_positions':len(children),
                'grid_baskets_with_children':sum(1 for b in baskets if b['grid_children']>0),'grid_child_net':sum(b['grid_net'] for b in baskets),
                'grid_risk_cap_events':len(re.findall(r'\[V293-GRID-RISK-CAP\]',t)),'scale_out_events':len(re.findall(r'\[GRID\].*SCALE-OUT',t,re.I)),
                'execution_error_count':len(errs),'unassigned_grid_children':len(unassigned),'pattern_breakdown':bypat,'basket_results':baskets,
                'gate_pass':not fail,'fail':fail}

          out={
            'method':'Frozen V29.3 source + frozen payoff preset; server tick historical robustness windows. OOS window ends before the M1 development window (10/08/2026-16/09/2026).',
            'source':'HarmonyBot V29.3 Grid Risk-Cap Hotfix RC','preset':{'GridProfitFib':1.618,'GridStopFib':1.618,'RiskPercent':1.0,'MaxSlippagePips':30},
            'IS_window':{'start':'2026-04-01','evaluation_start':'2026-04-08','end':'2026-06-30'},
            'OOS_window':{'start':'2026-07-01','evaluation_start':'2026-07-08','end':'2026-08-09'},
            'IS':aggregate('IS'),'OOS':aggregate('OOS')}
          out['gate_pass']=bool(out['IS'].get('gate_pass')) and bool(out['OOS'].get('gate_pass'))
          pathlib.Path('seal/audit/V293-IS-OOS-BASKET-MATRIX.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not out['gate_pass']:
              raise SystemExit('IS/OOS gate failed')
          PY

      - name: Cleanup credentials and tick cache
        if: always()
        run: |
          rm -f seal/ctrader.pwd seal/accounts.json
          rm -rf seal/data

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V293-IS-OOS-PAYOFF-PRESET-VALIDATION
          path: |
            seal/build.log
            seal/build/HarmonyBotPro.cs
            seal/algo
            seal/algo.sha256
            seal/reports
            seal/logs
            seal/audit
          retention-days: 30
