name: Fibonacci XAUUSD 2 - Armed PRZ Confirm v2

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-v2-predictive]
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-2-confirm-v2.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-xauusd-2-confirm-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Patch v2.1 armed confirmation candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_2'
          mkdir -p package
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FibonacciHarmonicSniperUltimate/versions/xauusd_2/src/FibonacciXAUUSD2.cs')
          s=p.read_text()

          old='''        [Parameter("Cooldown M15 Bars", DefaultValue = 4, MinValue = 0, MaxValue = 48, Group = "Execution")]\n        public int CooldownBars { get; set; }\n\n        [Parameter("Debug Logging", DefaultValue = true, Group = "General")]\n'''
          new='''        [Parameter("Cooldown M15 Bars", DefaultValue = 4, MinValue = 0, MaxValue = 48, Group = "Execution")]\n        public int CooldownBars { get; set; }\n\n        [Parameter("Confirm Window M15 Bars", DefaultValue = 3, MinValue = 1, MaxValue = 8, Group = "Execution")]\n        public int ConfirmWindowBars { get; set; }\n\n        [Parameter("Confirm Break ATR", DefaultValue = 0.02, MinValue = 0.0, MaxValue = 0.25, Group = "Execution")]\n        public double ConfirmBreakAtr { get; set; }\n\n        [Parameter("Max Entry Distance ATR", DefaultValue = 0.45, MinValue = 0.10, MaxValue = 1.50, Group = "Execution")]\n        public double MaxEntryDistanceAtr { get; set; }\n\n        [Parameter("Debug Logging", DefaultValue = true, Group = "General")]\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old='''        private readonly HashSet<string> _consumed = new HashSet<string>();\n        private readonly Dictionary<long, TradeMeta> _openMeta = new Dictionary<long, TradeMeta>();\n'''
          new='''        private readonly HashSet<string> _consumed = new HashSet<string>();\n        private ArmedSignal _armed;\n        private readonly Dictionary<long, TradeMeta> _openMeta = new Dictionary<long, TradeMeta>();\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)

          assert s.count('Print("VERSION xauusd_2 v2.0.0-predictive-prz");')==1
          s=s.replace('Print("VERSION xauusd_2 v2.0.0-predictive-prz");','Print("VERSION xauusd_2 v2.1.0-armed-prz-confirm");',1)
          s=s.replace('Print("[ARCH] M15 predictive XABC -> projected D/PRZ -> confidence score -> reversal -> fixed-risk execution | H1 context is score, not hard gate");',
                      'Print("[ARCH] M15 predictive XABC -> projected D/PRZ -> ARM on touch -> later M15 break-away confirm -> fixed-risk execution | H1 context is soft score");',1)

          needle='''            double spreadRatio = (Symbol.Ask - Symbol.Bid) / atr;\n            if (spreadRatio > MaxSpreadAtrRatio)\n            {\n                if (DebugLogging) Print("[REJECT] spreadATR={0:F4}", spreadRatio);\n                return;\n            }\n\n            List<Pivot> pivots = BuildPivots(index);\n'''
          repl='''            double spreadRatio = (Symbol.Ask - Symbol.Bid) / atr;\n            if (spreadRatio > MaxSpreadAtrRatio)\n            {\n                if (DebugLogging) Print("[REJECT] spreadATR={0:F4}", spreadRatio);\n                return;\n            }\n\n            if (_armed != null)\n            {\n                if (index > _armed.ExpiresIndex)\n                {\n                    if (DebugLogging) Print("[ARM EXPIRE] {0} {1} conf={2:F1} ageBars={3}", _armed.Candidate.Name, _armed.Candidate.Direction, _armed.Confidence, index - _armed.ArmedIndex);\n                    _armed = null;\n                }\n                else if (index > _armed.ArmedIndex)\n                {\n                    if (TryConfirmArmed(index, atr))\n                    {\n                        _armed = null;\n                        return;\n                    }\n                }\n                if (_armed != null) return;\n            }\n\n            List<Pivot> pivots = BuildPivots(index);\n'''
          assert s.count(needle)==1
          s=s.replace(needle,repl,1)

          old='''            if (best == null) return;\n            TryExecute(best, bestConfidence, atr, index);\n        }\n\n        private void TryExecute(HarmonicCandidate c, double confidence, double atr, int index)\n'''
          new='''            if (best == null) return;\n            _consumed.Add(best.Key);\n            _armed = new ArmedSignal(best, bestConfidence, index, index + ConfirmWindowBars, Bars.HighPrices[index], Bars.LowPrices[index]);\n            Print("[ARM] {0} {1} conf={2:F1} bar={3} PRZ={4:F2}-{5:F2} touchH={6:F2} touchL={7:F2} expires={8}",\n                best.Name, best.Direction, bestConfidence, index, best.ZoneLow, best.ZoneHigh, Bars.HighPrices[index], Bars.LowPrices[index], index + ConfirmWindowBars);\n        }\n\n        private bool TryConfirmArmed(int index, double atr)\n        {\n            var a = _armed;\n            if (a == null) return false;\n            double close = Bars.ClosePrices[index];\n            double open = Bars.OpenPrices[index];\n            double breakBuffer = ConfirmBreakAtr * atr;\n            bool directional = a.Candidate.Direction == TradeType.Buy ? close > open : close < open;\n            bool breakAway = a.Candidate.Direction == TradeType.Buy\n                ? close > a.TouchHigh + breakBuffer\n                : close < a.TouchLow - breakBuffer;\n\n            double distance = a.Candidate.Direction == TradeType.Buy\n                ? Math.Max(0.0, close - a.Candidate.ZoneHigh)\n                : Math.Max(0.0, a.Candidate.ZoneLow - close);\n            double distanceAtr = distance / Math.Max(atr, Symbol.PipSize);\n\n            if (distanceAtr > MaxEntryDistanceAtr)\n            {\n                Print("[ARM CANCEL] {0} {1} conf={2:F1} reason=too_far distanceATR={3:F2}", a.Candidate.Name, a.Candidate.Direction, a.Confidence, distanceAtr);\n                return true;\n            }\n\n            if (!directional || !breakAway)\n            {\n                if (DebugLogging) Print("[CONFIRM WAIT] {0} {1} conf={2:F1} directional={3} breakAway={4} distanceATR={5:F2}",\n                    a.Candidate.Name, a.Candidate.Direction, a.Confidence, directional, breakAway, distanceAtr);\n                return false;\n            }\n\n            double confirmReversal = ReversalScore(a.Candidate.Direction, index);\n            double confirmConfidence = Clamp(a.Confidence * 0.70 + confirmReversal * 0.30, 0, 100);\n            Print("[CONFIRM] {0} {1} armConf={2:F1} confirmRev={3:F1} finalConf={4:F1} distanceATR={5:F2}",\n                a.Candidate.Name, a.Candidate.Direction, a.Confidence, confirmReversal, confirmConfidence, distanceAtr);\n            TryExecute(a.Candidate, confirmConfidence, atr, index);\n            return true;\n        }\n\n        private void TryExecute(HarmonicCandidate c, double confidence, double atr, int index)\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)

          marker='''        private sealed class TradeMeta\n        {\n'''
          armed='''        private sealed class ArmedSignal\n        {\n            public ArmedSignal(HarmonicCandidate candidate, double confidence, int armedIndex, int expiresIndex, double touchHigh, double touchLow)\n            {\n                Candidate = candidate; Confidence = confidence; ArmedIndex = armedIndex; ExpiresIndex = expiresIndex; TouchHigh = touchHigh; TouchLow = touchLow;\n            }\n            public HarmonicCandidate Candidate;\n            public double Confidence;\n            public int ArmedIndex;\n            public int ExpiresIndex;\n            public double TouchHigh;\n            public double TouchLow;\n        }\n\n        private sealed class TradeMeta\n        {\n'''
          assert s.count(marker)==1
          s=s.replace(marker,armed,1)
          p.write_text(s)
          PY
          grep -q 'v2.1.0-armed-prz-confirm' "$ROOT/src/FibonacciXAUUSD2.cs"
          grep -q 'TryConfirmArmed' "$ROOT/src/FibonacciXAUUSD2.cs"
          cp "$ROOT/src/FibonacciXAUUSD2.cs" package/FibonacciXAUUSD2.cs
          cp "$ROOT/README.md" package/README.md

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Build v2.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_2'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD2.csproj && dotnet build $ROOT/FibonacciXAUUSD2.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" package/xauusd_2-confirm-v2.algo
          sha256sum package/xauusd_2-confirm-v2.algo | tee package/algo.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_2-confirm-v2-build
          path: package/
          retention-days: 30

  backtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: standard, spread: '17.42', commission: '35' }
          - { label: harsh, spread: '30', commission: '50' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_2-confirm-v2-build
          path: work
      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          chmod 600 work/ctrader.pwd
      - name: Run full 3M ${{ matrix.label }} v2 confirmation backtest
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/reports work/cache
          docker run --rm -v "$PWD/work:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/xauusd_2-confirm-v2.algo --environment-variables --exit-on-stop \
            --symbol=XAUUSD --period=m15 --start='09/06/2026' --end='09/09/2026' \
            --balance=10000 --data-mode=m1 --data-dir=/work/cache \
            --commission='${{ matrix.commission }}' --spread='${{ matrix.spread }}' \
            --RiskPercent=0.50 --MaxDailyLossPercent=3.0 --MinimumRiskReward=1.50 \
            --PivotLeft=2 --PivotRight=1 --PivotLookback=320 --MinLegAtr=0.45 \
            --MinConfidence=62 --PrzAtrWidth=0.18 --SlAtrBuffer=0.25 --MaxSpreadAtrRatio=0.05 \
            --ConfirmWindowBars=3 --ConfirmBreakAtr=0.02 --MaxEntryDistanceAtr=0.45 \
            --report='/work/reports/${{ matrix.label }}.html' --report-json='/work/reports/${{ matrix.label }}.json' \
            2>&1 | tee 'work/reports/${{ matrix.label }}.log'
          grep -E '\[(ARM|CONFIRM|OPEN|CLOSE|STATS)\]' 'work/reports/${{ matrix.label }}.log' > 'work/reports/${{ matrix.label }}-signals.txt' || true
          test -s 'work/reports/${{ matrix.label }}.json'
      - if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_2-confirm-v2-report-${{ matrix.label }}
          path: work/reports/
          retention-days: 30

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_2-confirm-v2-build
          path: package
      - uses: actions/download-artifact@v4
        with:
          pattern: xauusd_2-confirm-v2-report-*
          path: reports
          merge-multiple: true
      - name: Aggregate v2 confirmation results
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          def v(d,s,k):
              try:
                  x=d[s][k]; return float(x.get('all',0) if isinstance(x,dict) else x or 0)
              except: return 0.0
          def dd(d):
              peak=worst=0.0
              for p in d.get('equity',{}).get('points',[]):
                  peak=max(peak,float(p.get('maxEquity',p.get('balance',0)) or 0)); low=float(p.get('minEquity',p.get('balance',0)) or 0)
                  if peak>0: worst=max(worst,(peak-low)/peak*100)
              return worst
          out=['# xauusd_2 Armed PRZ Confirmation v2','',
               'Single architecture change from predictive v1: PRZ touch only arms a candidate; entry requires a later M15 directional close beyond the touch-bar extreme, within 0.45 ATR of PRZ.','',
               '| Cost | Trades | Wins | Losses | WR % | Net $ | ROI % | PF | Max Eq DD % |','|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for label in ('standard','harsh'):
              d=json.loads(Path(f'reports/{label}.json').read_text())
              t=int(v(d,'tradeStatistics','totalTrades')); w=int(v(d,'tradeStatistics','winningTrades')); l=int(v(d,'tradeStatistics','losingTrades')); net=float(d.get('main',{}).get('netProfit',0) or 0)
              hist=d.get('history',{}).get('items',[]); gp=sum(max(0.,float(x.get('net',0) or 0)) for x in hist); gl=sum(abs(min(0.,float(x.get('net',0) or 0))) for x in hist); pf=gp/gl if gl else (999. if gp else 0.)
              out.append(f'| {label} | {t} | {w} | {l} | {(100*w/t if t else 0):.2f} | {net:.2f} | {net/10000*100:.2f} | {pf:.2f} | {dd(d):.2f} |')
          out += ['', 'Predictive v1 reference: Standard 39 trades / -11.53% / PF 0.41; Harsh 30 trades / -9.46% / PF 0.38.',
                  'xauusd_1 v11 reference: 1 trade / about +0.95% Standard and +0.94% Harsh.']
          text='\n'.join(out)+'\n'; Path('package/CONFIRM_V2_BACKTEST_SUMMARY.md').write_text(text); print(text)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
          cp -r reports package/reports
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_2-confirm-v2-complete
          path: package/
          retention-days: 30
