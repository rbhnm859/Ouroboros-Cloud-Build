name: BTC Round19 v2 Selective Expansion 1Y validation

on:
  workflow_dispatch:
  push:
    branches: [ btc-round19-quality-expansion ]
    paths:
      - '.github/workflows/backtest-fibonacci-btc-round19-v2.yml'
      - 'FibonacciHarmonicSniperUltimate/versions/v0.18.0-btc-round19-quality-expansion/round19_refine_v2.py'

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round19-v2
  cancel-in-progress: true

jobs:
  build-screen-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Reconstruct exact Round19 v2 source
        run: |
          set -euo pipefail
          mkdir -p backtest/src
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, hashlib
          root=Path('FibonacciHarmonicSniperUltimate/versions/v0.17.0-btc-round18-diagnostics')
          parts=sorted(root.glob('source_payload.part*'))
          data=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          expected='5f2b7f31c4b8f0d60f52c4c15869aa75df4ff07d7224af971784137716bc8b93'
          actual=hashlib.sha256(data).hexdigest()
          if actual != expected: raise SystemExit(f'R18 SHA mismatch {actual}')
          Path('backtest/src/Round18.cs').write_bytes(data)
          PYCODE
          python3 FibonacciHarmonicSniperUltimate/versions/v0.18.0-btc-round19-quality-expansion/round19_transform.py \
            backtest/src/Round18.cs backtest/src/Round19-v1.cs
          python3 FibonacciHarmonicSniperUltimate/versions/v0.18.0-btc-round19-quality-expansion/round19_refine_v2.py \
            backtest/src/Round19-v1.cs backtest/src/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.cs
          rm -f backtest/src/Round18.cs backtest/src/Round19-v1.cs
          cat > backtest/src/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <RootNamespace>cAlgo.Robots</RootNamespace>
              <AlgoName>FibonacciHarmonicSniperUltimate-BTC-Round19-v2</AlgoName>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="cTrader.Automate" Version="1.*-*" /></ItemGroup>
          </Project>
          EOF

      - name: Build Round19 v2 .algo
        run: |
          set -euo pipefail
          PROJ=backtest/src/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.csproj
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True
          mkdir -p backtest/build backtest/cache backtest/risk090 backtest/risk095 backtest/risk098 backtest/risk100 backtest/harsh
          ALGO=$(find backtest/src/bin/Release -type f -name '*.algo' | head -n1)
          test -n "$ALGO"
          cp "$ALGO" backtest/build/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.algo
          sha256sum backtest/build/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.algo | tee backtest/build/SHA256SUMS.txt

      - name: Prepare cTrader credentials
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}"; test -n "${CTRADER_ACCOUNT:-}"; test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Pull cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Screen H1 Sell risk under Standard 1Y costs
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          for SPEC in '090 0.90' '095 0.95' '098 0.98' '100 1.00'; do
            set -- $SPEC; TAG=$1; RISK=$2; OUT="risk${TAG}"
            echo "=== H1 Sell risk ${RISK}% ==="
            docker run --rm \
              -v "$PWD/backtest:/work" \
              -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
              ghcr.io/spotware/ctrader-console:5.9.11 \
              backtest /work/build/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.algo \
              --environment-variables --exit-on-stop \
              --symbol=BITCOIN --period=h1 --start='08/09/2025 00:00' --end='08/09/2026 00:00' \
              --balance=10000 --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 \
              --RiskPercent=1.0 --Round17M30RiskPercent=0.50 --Round18CandidateDiagnostics=false \
              --Round19QualityExpansion=true --Round19H1AlignMaxAgeHours=2 --Round19MinBypassScore=96 \
              --Round19H1SellRiskPercent="$RISK" --Round19M30BuyRiskPercent=0.50 --Round19M30SellRiskPercent=0.50 --Round19AlignedBuyRiskPercent=0.50 \
              --MaxOpenPositions=1 --MaxTradesPerDay=6 --MaxDailyLossPercent=5 \
              --EnabledPatterns='Reciprocal ABCD' --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 --MaxPatternAgeBars=16 \
              --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --UseCandleConfirmation=true --CooldownBars=2 \
              --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
              --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
              --Round8LogExcursions=false --Round9ShadowTpContinuation=false --Round10LogFunnel=false \
              --Round15EnableM30Engine=true --Round16H1HealthGate=true --DebugLogging=false \
              --report="/work/${OUT}/report.html" --report-json="/work/${OUT}/report.json" 2>&1 | tee "backtest/${OUT}/report.log"
          done

      - name: Select hard-gate winner
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          specs=[('090',0.90),('095',0.95),('098',0.98),('100',1.00)]
          rows=[]
          for tag,risk in specs:
              r=json.loads(Path(f'backtest/risk{tag}/report.json').read_text())
              m={'tag':tag,'h1_sell_risk':risk,'trades':int(r['tradeStatistics']['totalTrades']['all']),
                 'roi':float(r['main']['roi']),'net_profit':float(r['main']['netProfit']),
                 'pf':float(r['tradeStatistics']['profitFactor']['all']),'dd':float(r['equity']['maxEquityDrawdownPercent'])}
              m['gates']={'trades':m['trades']>94,'roi':m['roi']>38.48,'pf':m['pf']>1.85,'dd':m['dd']<5.92}
              m['pass_all']=all(m['gates'].values()); m['gate_count']=sum(m['gates'].values()); rows.append(m)
          passing=[x for x in rows if x['pass_all']]
          best=max(passing,key=lambda x:(x['roi'],x['trades'],x['pf'],-x['dd'])) if passing else max(rows,key=lambda x:(x['gate_count'],x['roi'],x['trades'],x['pf'],-x['dd']))
          out={'target':{'trades':94,'roi':38.48,'pf':1.85,'dd':5.92},'screen':rows,'selected':best}
          Path('backtest/Round19-v2-Standard-Screen.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"SELECTED_TAG={best['tag']}\nSELECTED_RISK={best['h1_sell_risk']}\nSTANDARD_PASS={'true' if best['pass_all'] else 'false'}\n")
          PYCODE

      - name: Harsh 1Y selected candidate
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/backtest:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/build/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.algo \
            --environment-variables --exit-on-stop --symbol=BITCOIN --period=h1 \
            --start='08/09/2025 00:00' --end='08/09/2026 00:00' --balance=10000 --data-mode=m1 --data-dir=/work/cache \
            --commission=100 --spread=1500 --RiskPercent=1.0 --Round17M30RiskPercent=0.50 --Round18CandidateDiagnostics=false \
            --Round19QualityExpansion=true --Round19H1AlignMaxAgeHours=2 --Round19MinBypassScore=96 --Round19H1SellRiskPercent="$SELECTED_RISK" \
            --Round19M30BuyRiskPercent=0.50 --Round19M30SellRiskPercent=0.50 --Round19AlignedBuyRiskPercent=0.50 \
            --MaxOpenPositions=1 --MaxTradesPerDay=6 --MaxDailyLossPercent=5 --EnabledPatterns='Reciprocal ABCD' \
            --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 --MaxPatternAgeBars=16 \
            --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --UseCandleConfirmation=true --CooldownBars=2 \
            --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
            --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
            --Round8LogExcursions=false --Round9ShadowTpContinuation=false --Round10LogFunnel=false --Round15EnableM30Engine=true \
            --Round16H1HealthGate=true --DebugLogging=false --report=/work/harsh/report.html --report-json=/work/harsh/report.json \
            2>&1 | tee backtest/harsh/report.log

      - name: Final summary
        run: |
          python3 - <<'PYCODE'
          import json, re
          from pathlib import Path
          s=json.loads(Path('backtest/Round19-v2-Standard-Screen.json').read_text()); best=s['selected']
          r=json.loads(Path('backtest/harsh/report.json').read_text())
          harsh={'trades':int(r['tradeStatistics']['totalTrades']['all']),'roi':float(r['main']['roi']),
                 'net_profit':float(r['main']['netProfit']),'pf':float(r['tradeStatistics']['profitFactor']['all']),
                 'dd':float(r['equity']['maxEquityDrawdownPercent'])}
          log=Path(f"backtest/risk{best['tag']}/report.log").read_text(errors='replace')
          final={'version':'v0.18.1-btc-round19-quality-expansion-v2','source_sha256':'ad531ff93236f48d8fa23ff4ef539e1e016a7b9697062398873ab67ee1f41113',
                 'standard':best,'standard_beats_all_targets':best['pass_all'],'harsh':harsh,
                 'health_bypass_count':len(re.findall(r'\[R19 HEALTH BYPASS\]',log))}
          Path('backtest/Round19-v2-Final-Summary.json').write_text(json.dumps(final,indent=2)); print(json.dumps(final,indent=2))
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload Round19 v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fibonacci-BTC-Round19-v2
          path: |
            backtest/build/*
            backtest/src/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.cs
            backtest/src/FibonacciHarmonicSniperUltimate-BTC-Round19-v2.csproj
            backtest/risk*/report.html
            backtest/risk*/report.json
            backtest/risk*/report.log
            backtest/harsh/report.html
            backtest/harsh/report.json
            backtest/harsh/report.log
            backtest/Round19-v2-Standard-Screen.json
            backtest/Round19-v2-Final-Summary.json
          if-no-files-found: warn
          retention-days: 30
