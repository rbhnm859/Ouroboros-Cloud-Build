name: HarmonyBot V71 Protected Champion Core Incremental Alpha DEV

on:
  push:
    branches:
      - harmonybot/v71-selective-causal-alpha-reconstruction-grid-amplifier
    paths:
      - 'HarmonyBot-V71/**'
      - '.github/workflows/harmonybot-v71-selective-causal-alpha-reconstruction-grid-amplifier.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v71-protected-champion-core-incremental-alpha
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static audit and immutable dual build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V71/tools/static_contract_audit.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 -m py_compile HarmonyBot-V71/tools/*.py
          bash -n HarmonyBot-V71/tools/run_backtest.sh
          bash -n HarmonyBot-V71/tools/run_window.sh
          bash -n HarmonyBot-V71/tools/run_v51_reference.sh
          dotnet restore HarmonyBot-V71/HarmonyBotV71.csproj
          dotnet build HarmonyBot-V71/HarmonyBotV71.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V71/dist HarmonyBot-V71/reference HarmonyBot-V71/final
          A=$(find HarmonyBot-V71/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo

          T=$(mktemp -d)
          mkdir -p "$T/src"
          git show 1b670a0f43ba8ecaa637febfdacf605b1b146f01:HarmonyBot-V51/HarmonyBotV51.csproj > "$T/HarmonyBotV51.csproj"
          git show 1b670a0f43ba8ecaa637febfdacf605b1b146f01:HarmonyBot-V51/src/HarmonyBotV51.cs > "$T/src/HarmonyBotV51.cs"
          dotnet restore "$T/HarmonyBotV51.csproj"
          dotnet build "$T/HarmonyBotV51.csproj" -c Release --no-restore --nologo
          R=$(find "$T/bin/Release" -type f -name '*.algo' | head -1)
          test -s "$R"
          cp "$R" HarmonyBot-V71/reference/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo

          sha256sum HarmonyBot-V71/src/HarmonyBotV71.cs "$A" HarmonyBot-V71/reference/*.algo > HarmonyBot-V71/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V71/final/SOURCE_COMMIT.txt
          python3 -c 'import json,pathlib,os; pathlib.Path("HarmonyBot-V71/final/V71_PREREGISTERED_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V71","architecture":"PROTECTED_V51_CORE_PLUS_CROSSFIT_INCREMENTAL_EXPANSION","trusted_v51_parent":"1b670a0f43ba8ecaa637febfdacf605b1b146f01","variants":["A_V51_PROTECTED_CORE","B_PROTECTED_XFIT_SINGLE","C_PROTECTED_XFIT_GRID","D_PROTECTED_XFIT_GRID_RISK5"],"shadow_windows":["Y2021","Y2022","Y2023"],"calibration_windows":["Y2021","Y2022","Y2023"],"promotion_dev_windows":["H2024H2","H2025H1","H2025H2"],"core_risk_pct":1.0,"expansion_risk_ceiling_pct":5.0,"minimum_net_rr":2.0,"max_active_basket":1,"candidate_source":"THREE_FOLD_TEMPORAL_CROSSFIT_BURNED_CALIBRATION_ONLY","expansion_min_edge_lcb_r":0.015,"core_preemption":True,"same_setup_expansion_blocked":True,"expansion_identity_namespace_isolated":True,"reference_full_v51_commercial_env":True,"shadow_label":"V51_NATIVE_EXIT_PROXY_COMPLETED_M1","validation_locked":True,"fresh_locked":True,"v72_auto_promotion_only_after_breakthrough":True,"final_v80_targets":{"return_pct":100,"pf":2.5,"max_dd_pct":10,"win_rate":0.65,"trades_per_year":200,"realized_rr":2.0,"profitable_months":10,"net_pct_initial":100}},indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: v71-build
          path: |
            control/HarmonyBot-V71/dist
            control/HarmonyBot-V71/reference
            control/HarmonyBot-V71/final
            control/V71_STATIC_CONTRACT_AUDIT.json
          retention-days: 30

  shadow:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - name: Prepare algo and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run expansion shadow census
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          control/HarmonyBot-V71/tools/run_window.sh SHADOW_PREPASS "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-shadow-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-SHADOW_PREPASS-${{ matrix.window }}
          retention-days: 30

  fit_model:
    needs: shadow
    runs-on: ubuntu-24.04
    outputs:
      crossfit_gate: ${{ steps.m.outputs.crossfit_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-shadow-*'
          path: merged
          merge-multiple: true
      - name: Fit three-fold temporal expected Net-R model
        id: m
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          python3 control/HarmonyBot-V71/tools/fit_v71_edge_model.py merged model
          echo "crossfit_gate=$(python3 -c 'import json; print(str(json.load(open("model/MODEL_MANIFEST.json"))["crossfit_gate"]).lower())')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V71-EDGE-MODEL
          path: model
          retention-days: 30

  v51_reference:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - name: Prepare exact V51 reference and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/reference
          R=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1)
          cp "$R" control/HarmonyBot-V71/reference/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run trusted V51 reference
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh control/HarmonyBot-V51/tools/*.sh
          control/HarmonyBot-V71/tools/run_v51_reference.sh "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-v51-reference-${{ matrix.window }}
          path: control/HarmonyBot-V71/reference-output-${{ matrix.window }}
          retention-days: 30

  calibration:
    needs: [build, fit_model]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [A_V51_PROTECTED_CORE, B_PROTECTED_XFIT_SINGLE, C_PROTECTED_XFIT_GRID, D_PROTECTED_XFIT_GRID_RISK5]
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: V71-EDGE-MODEL
          path: control/HarmonyBot-V71/model
      - name: Prepare algo and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run protected-core causal calibration
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          control/HarmonyBot-V71/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-cal-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30

  calibration_analyze:
    needs: [calibration, v51_reference, fit_model]
    if: ${{ needs.calibration.result == 'success' && needs.v51_reference.result == 'success' && needs.fit_model.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.pick.outputs.candidate }}
      dev_matrix: ${{ steps.pick.outputs.dev_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-cal-*'
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-v51-reference-*'
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: V71-EDGE-MODEL
          path: model
      - name: Freeze candidate
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 control/HarmonyBot-V71/tools/calibrate_v71.py merged final model/MODEL_MANIFEST.json
          echo "candidate=$(cat final/candidate.txt)" >> "$GITHUB_OUTPUT"
          echo "dev_matrix=$(tr -d '\n' < final/dev_matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V71-CALIBRATION-FREEZE
          path: final
          retention-days: 30

  promotion_dev:
    needs: calibration_analyze
    if: ${{ needs.calibration_analyze.outputs.candidate != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: ${{ fromJSON(needs.calibration_analyze.outputs.dev_matrix) }}
        window: [H2024H2, H2025H1, H2025H2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: V71-EDGE-MODEL
          path: control/HarmonyBot-V71/model
      - name: Prepare algo and observed DEV dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            H2024H2) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT";;
            H2025H1) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT";;
            H2025H2) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run frozen observed DEV stress
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          control/HarmonyBot-V71/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .5
      - uses: actions/upload-artifact@v4
        with:
          name: v71-dev-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30

  analyze:
    needs: [calibration_analyze, promotion_dev]
    if: ${{ always() && needs.calibration_analyze.result == 'success' && (needs.calibration_analyze.outputs.candidate == '' || needs.promotion_dev.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.a.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: V71-CALIBRATION-FREEZE
          path: merged
      - uses: actions/download-artifact@v4
        if: ${{ needs.calibration_analyze.outputs.candidate != '' }}
        with:
          pattern: 'v71-dev-*'
          path: merged
          merge-multiple: true
      - name: Build performance frontier
        id: a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 control/HarmonyBot-V71/tools/analyze_v71.py merged final
          echo "promote=$(cat final/promotion.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V71-PROTECTED-CORE-FRONTIER
          path: final
          retention-days: 30

  promote_v72:
    needs: analyze
    if: ${{ needs.analyze.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Create V72 breakthrough branch and handoff
        shell: bash
        run: |
          set -euo pipefail
          BR="harmonybot/v72-protected-champion-core-incremental-alpha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          mkdir -p HarmonyBot-V72
          cat > HarmonyBot-V72/V72_BREAKTHROUGH_HANDOFF.md <<EOF
          # HarmonyBot V72 — Breakthrough Handoff
          Promoted automatically from V71 source commit: $GITHUB_SHA
          Promotion evidence: V71 protected V51 core replay PASS, cross-fit expansion PASS, fixed observed DEV PASS.
          Validation and Fresh remain locked.
          EOF
          git add HarmonyBot-V72/V72_BREAKTHROUGH_HANDOFF.md
          git commit -m "promote(v72): protected-core incremental alpha breakthrough"
          git push origin "$BR"
