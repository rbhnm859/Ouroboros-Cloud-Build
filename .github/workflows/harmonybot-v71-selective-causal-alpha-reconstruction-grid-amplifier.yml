name: HarmonyBot V71 Protected Champion Core Incremental Alpha DEV

on:
  # Single authoritative CI trigger while diagnostic PR #22 remains open.
  # Avoid duplicate push + pull_request runs cancelling each other under the
  # fail-closed concurrency group. PR #22 is observability-only and must not merge.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'HarmonyBot-V71/**'
      - '.github/workflows/harmonybot-v71-selective-causal-alpha-reconstruction-grid-amplifier.yml'

concurrency:
  group: harmonybot-v71-protected-champion-core-incremental-alpha
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static audit and immutable dual build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V71/tools/static_contract_audit.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 HarmonyBot-V71/tools/verify_frozen_harmonic_engine.py HarmonyBot-V71/src/HarmonyBotV71.cs
          python3 -m py_compile HarmonyBot-V71/tools/*.py
          bash -n HarmonyBot-V71/tools/run_backtest.sh
          bash -n HarmonyBot-V71/tools/run_window.sh
          bash -n HarmonyBot-V71/tools/run_v51_reference.sh
          bash -n HarmonyBot-V71/tools/run_v51_backtest_safe.sh
          dotnet restore HarmonyBot-V71/HarmonyBotV71.csproj
          dotnet build HarmonyBot-V71/HarmonyBotV71.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V71/dist HarmonyBot-V71/reference HarmonyBot-V71/final
          A=$(find HarmonyBot-V71/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V71/dist/HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo

          TRUSTED_V51=1b670a0f43ba8ecaa637febfdacf605b1b146f01
          EXPECTED_V51_SOURCE_BLOB=be800fc0ff2a1ca83282af818abdfb6e945a512f
          EXPECTED_V51_CSPROJ_BLOB=1e3ee7c2f35076d52183d33a6b095bf54d0fc277
          test "$(git rev-parse "$TRUSTED_V51:HarmonyBot-V51/src/HarmonyBotV51.cs")" = "$EXPECTED_V51_SOURCE_BLOB"
          test "$(git rev-parse "$TRUSTED_V51:HarmonyBot-V51/HarmonyBotV51.csproj")" = "$EXPECTED_V51_CSPROJ_BLOB"
          printf '{"trusted_commit":"%s","source_blob":"%s","csproj_blob":"%s","policy":"IMMUTABLE_MOTHER_FAIL_CLOSED"}\n'             "$TRUSTED_V51" "$EXPECTED_V51_SOURCE_BLOB" "$EXPECTED_V51_CSPROJ_BLOB" > HarmonyBot-V71/final/V51_MOTHER_PIN.json

          T=$(mktemp -d)
          mkdir -p "$T/src"
          git show "$TRUSTED_V51:HarmonyBot-V51/HarmonyBotV51.csproj" > "$T/HarmonyBotV51.csproj"
          git show "$TRUSTED_V51:HarmonyBot-V51/src/HarmonyBotV51.cs" > "$T/src/HarmonyBotV51.cs"
          dotnet restore "$T/HarmonyBotV51.csproj"
          dotnet build "$T/HarmonyBotV51.csproj" -c Release --no-restore --nologo
          R=$(find "$T/bin/Release" -type f -name '*.algo' | head -1)
          test -s "$R"
          cp "$R" HarmonyBot-V71/reference/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo

          sha256sum HarmonyBot-V71/src/HarmonyBotV71.cs "$A" HarmonyBot-V71/reference/*.algo > HarmonyBot-V71/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V71/final/SOURCE_COMMIT.txt
          python3 -c 'import json,pathlib; pathlib.Path("HarmonyBot-V71/final/V71_PREREGISTERED_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V71 -> V72","architecture":"IMMUTABLE_V51_CORE_PLUS_FROZEN_HARMONIC_DETECTOR_PLUS_0618_PULLBACK_ALPHA","trusted_v51_parent":"1b670a0f43ba8ecaa637febfdacf605b1b146f01","control":"DIRECT_TRUSTED_V51_BINARY","capital_variants":["B_V72_PULLBACK_ALPHA"],"shadow_windows":["Y2021","Y2022","Y2023"],"calibration_windows":["Y2021","Y2022","Y2023"],"promotion_dev_windows":["H2024H2","H2025H1","H2025H2"],"core_risk_pct":1.0,"alpha_qualification_risk_pct":1.0,"minimum_net_rr":2.0,"max_active_basket":1,"candidate_source":"DETERMINISTIC_REACTION_PROOF_PLUS_0618_PULLBACK_LIMIT","selector_model":"NONE","detector_policy":"FROZEN_REGION_HASH_CHANGE_ONLY_REVALIDATION","pullback_expiry":"NEXT_M15_BOUNDARY","core_preemption":True,"pareto_non_regression":True,"validation_locked":True,"fresh_locked":True,"v72_auto_promotion_only_after_breakthrough":True},indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: v71-build
          path: |
            control/HarmonyBot-V71/dist
            control/HarmonyBot-V71/reference
            control/HarmonyBot-V71/final
            control/V71_STATIC_CONTRACT_AUDIT.json
            control/V71_FROZEN_HARMONIC_ENGINE_GUARD.json
          retention-days: 30

  shadow:
    needs: [build, v51_reference, replay_gate]
    if: ${{ needs.replay_gate.outputs.pass == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: v71-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - name: Prepare algo and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run expansion shadow census
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed" control/HarmonyBot-V71/tools/run_window.sh SHADOW_PREPASS "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-shadow-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-SHADOW_PREPASS-${{ matrix.window }}
          retention-days: 30

  fit_model:
    needs: shadow
    runs-on: ubuntu-24.04
    outputs:
      crossfit_gate: ${{ steps.m.outputs.crossfit_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-shadow-*'
          path: merged
          merge-multiple: true
      - name: Evaluate deterministic V72 0.618 pullback calibration
        id: m
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          python3 control/HarmonyBot-V71/tools/evaluate_v72_reaction.py merged model
          echo "crossfit_gate=$(python3 -c 'import json; print(str(json.load(open("model/MODEL_MANIFEST.json"))["crossfit_gate"]).lower())')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V72-PULLBACK-GATE
          path: model
          retention-days: 30

  v51_reference:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - name: Resolve immutable burned-calibration custody source
        id: custody
        shell: bash
        run: |
          set -euo pipefail
          M=control/HarmonyBot-V71/final/V71_BURNED_CALIBRATION_CUSTODY.json
          test -s "$M"
          RUN_ID=$(python3 -c 'import json; print(json.load(open("control/HarmonyBot-V71/final/V71_BURNED_CALIBRATION_CUSTODY.json"))["source_run_id"])')
          EXPECTED=$(python3 -c 'import json; d=json.load(open("control/HarmonyBot-V71/final/V71_BURNED_CALIBRATION_CUSTODY.json")); print(d["windows"]["${{ matrix.window }}"]["sha256"])')
          test -n "$RUN_ID"; test -n "$EXPECTED"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "expected_sha256=$EXPECTED" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: v71-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/immutable-seed-${{ matrix.window }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.custody.outputs.run_id }}
      - name: Verify immutable custody seed
        shell: bash
        run: |
          set -euo pipefail
          D=control/HarmonyBot-V71/immutable-seed-${{ matrix.window }}
          test -d "$D"
          H=$(cd "$D" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$H" = "${{ steps.custody.outputs.expected_sha256 }}" || {
            echo "[V71-DATA-CUSTODY-FAIL] window=${{ matrix.window }} stage=rehydrate expected=${{ steps.custody.outputs.expected_sha256 }} actual=$H"
            exit 48
          }
          echo "[V71-DATA-CUSTODY] window=${{ matrix.window }} stage=rehydrate sha256=$H"
      - name: Prepare exact V51 reference and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/reference
          R=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1)
          cp "$R" control/HarmonyBot-V71/reference/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run trusted V51 reference
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          V71_DATA_SEED_DIR: ${{ github.workspace }}/control/HarmonyBot-V71/immutable-seed-${{ matrix.window }}
          V71_EXPECTED_DATA_SHA256: ${{ steps.custody.outputs.expected_sha256 }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh control/HarmonyBot-V51/tools/*.sh
          control/HarmonyBot-V71/tools/run_v51_reference.sh "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-v51-reference-${{ matrix.window }}
          path: control/HarmonyBot-V71/reference-output-${{ matrix.window }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v71-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/immutable-seed-${{ matrix.window }}
          retention-days: 30

  replay_core:
    needs: [build, v51_reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: v71-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - name: Prepare protected core and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run exact protected-core replay
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed" control/HarmonyBot-V71/tools/run_window.sh A_V51_PROTECTED_CORE "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-replay-core-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-A_V51_PROTECTED_CORE-${{ matrix.window }}
          retention-days: 30

  replay_gate:
    needs: [replay_core, v51_reference]
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.g.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-replay-core-*'
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-v51-reference-*'
          path: merged
          merge-multiple: true
      - name: Verify exact V51 replay before any expansion research
        id: g
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 control/HarmonyBot-V71/tools/verify_v51_replay.py merged final/V71_V51_REPLAY_GATE.json
          echo "pass=$(python3 -c 'import json; print(str(json.load(open("final/V71_V51_REPLAY_GATE.json"))["pass"]).lower())')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V71-V51-REPLAY-GATE
          path: final/V71_V51_REPLAY_GATE.json
          retention-days: 30

  calibration:
    needs: [build, fit_model, v51_reference, replay_gate]
    if: ${{ needs.replay_gate.outputs.pass == 'true' && needs.fit_model.outputs.crossfit_gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [B_V72_PULLBACK_ALPHA]
        window: [Y2021, Y2022, Y2023]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: V72-PULLBACK-GATE
          path: control/HarmonyBot-V71/model
      - uses: actions/download-artifact@v4
        with:
          name: v71-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - name: Prepare algo and dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            Y2021) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            Y2022) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/12/2022" >> "$GITHUB_OUTPUT";;
            Y2023) echo "start=02/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run protected-core causal calibration
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed" control/HarmonyBot-V71/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: v71-cal-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30

  calibration_analyze:
    needs: [calibration, v51_reference, fit_model, replay_gate]
    if: ${{ always() && needs.v51_reference.result == 'success' && needs.fit_model.result == 'success' && needs.replay_gate.result == 'success' && (needs.calibration.result == 'success' || needs.fit_model.outputs.crossfit_gate != 'true') }}
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.pick.outputs.candidate }}
      dev_matrix: ${{ steps.pick.outputs.dev_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        if: ${{ needs.fit_model.outputs.crossfit_gate == 'true' }}
        with:
          pattern: 'v71-cal-*'
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v71-v51-reference-*'
          path: merged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: V72-PULLBACK-GATE
          path: model
      - name: Freeze candidate
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 control/HarmonyBot-V71/tools/calibrate_v71.py merged final model/MODEL_MANIFEST.json
          echo "candidate=$(cat final/candidate.txt)" >> "$GITHUB_OUTPUT"
          echo "dev_matrix=$(tr -d '\n' < final/dev_matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: V71-CALIBRATION-FREEZE
          path: final
          retention-days: 30

  promotion_dev_seed:
    needs: [build, calibration_analyze]
    if: ${{ needs.calibration_analyze.outputs.candidate != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [H2024H2, H2025H1, H2025H2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - name: Prepare trusted V51 DEV data seed
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/reference
          R=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1)
          cp "$R" control/HarmonyBot-V71/reference/
          case "${{ matrix.window }}" in
            H2024H2) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT";;
            H2025H1) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT";;
            H2025H2) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT";;
          esac
      - name: Hydrate and seal observed DEV market data
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh control/HarmonyBot-V51/tools/*.sh
          control/HarmonyBot-V71/tools/run_v51_reference.sh "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .5
      - uses: actions/upload-artifact@v4
        with:
          name: v71-dev-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/reference-window-${{ matrix.window }}/seal/data
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v71-dev-v51-reference-${{ matrix.window }}
          path: control/HarmonyBot-V71/reference-output-${{ matrix.window }}
          retention-days: 30

  promotion_dev:
    needs: [calibration_analyze, promotion_dev_seed]
    if: ${{ needs.calibration_analyze.outputs.candidate != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: ${{ fromJSON(needs.calibration_analyze.outputs.dev_matrix) }}
        window: [H2024H2, H2025H1, H2025H2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: v71-build
          path: control/HarmonyBot-V71/shared
      - uses: actions/download-artifact@v4
        with:
          name: V72-PULLBACK-GATE
          path: control/HarmonyBot-V71/model
      - uses: actions/download-artifact@v4
        with:
          name: v71-dev-data-seed-${{ matrix.window }}
          path: control/HarmonyBot-V71/data-seed
      - name: Prepare algo and observed DEV dates
        id: d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V71/dist
          A=$(find control/HarmonyBot-V71/shared -type f -name 'HarmonyBot_V71_Protected_Champion_Core_Incremental_Alpha.algo' | head -1)
          cp "$A" control/HarmonyBot-V71/dist/
          case "${{ matrix.window }}" in
            H2024H2) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT";;
            H2025H1) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT";;
            H2025H2) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run frozen observed DEV stress
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          chmod +x control/HarmonyBot-V71/tools/*.sh
          V71_DATA_SEED_DIR="$GITHUB_WORKSPACE/control/HarmonyBot-V71/data-seed" control/HarmonyBot-V71/tools/run_window.sh "${{ matrix.variant }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" .5
      - uses: actions/upload-artifact@v4
        with:
          name: v71-dev-${{ matrix.variant }}-${{ matrix.window }}
          path: control/HarmonyBot-V71/output-${{ matrix.variant }}-${{ matrix.window }}
          retention-days: 30

  analyze:
    needs: [calibration_analyze, promotion_dev]
    if: ${{ always() && needs.calibration_analyze.result == 'success' && (needs.calibration_analyze.outputs.candidate == '' || needs.promotion_dev.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.a.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: V71-CALIBRATION-FREEZE
          path: merged
      - uses: actions/download-artifact@v4
        if: ${{ needs.calibration_analyze.outputs.candidate != '' }}
        with:
          pattern: 'v71-dev-*'
          path: merged
          merge-multiple: true
      - name: Build performance frontier
        id: a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 control/HarmonyBot-V71/tools/analyze_v71.py merged final
          echo "promote=$(cat final/promotion.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V71-PROTECTED-CORE-FRONTIER
          path: final
          retention-days: 30

  promote_v72:
    needs: analyze
    if: ${{ needs.analyze.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Create V72 breakthrough branch and handoff
        shell: bash
        run: |
          set -euo pipefail
          BR="harmonybot/v72-harmonic-reaction-alpha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          mkdir -p HarmonyBot-V72
          cat > HarmonyBot-V72/V72_BREAKTHROUGH_HANDOFF.md <<EOF
          # HarmonyBot V72 — Harmonic 0.618 Pullback Alpha Handoff
          Promoted automatically from V71 source commit: $GITHUB_SHA
          Architecture: frozen V51 Core + frozen 12-family harmonic detector + deterministic PRZ reaction proof + 0.618 pullback limit until next M15 boundary + structural stop + cost-adjusted fixed 2R target.
          Promotion evidence: burned 2021-2023 reaction calibration PASS, commercial Pareto gate PASS, fixed observed DEV PASS.
          No selector model is required in the V72 capital decision path. Validation and Fresh remain locked.
          EOF
          git add HarmonyBot-V72/V72_BREAKTHROUGH_HANDOFF.md
          git commit -m "promote(v72): harmonic 0618 pullback alpha breakthrough"
          git push origin "$BR"
