name: HarmonyBot V28.1 XAUUSD $100 Shared-Data 1Y Commercial Sweep

on:
  workflow_dispatch:
  push:
    branches: [harmonybot-v28-commercial-final-rc]
    paths: ['.github/workflows/backtest-harmonybot-v281-xauusd-100-1y-fair-sweep.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: harmonybot-v281-xauusd-100-1y-fair-sweep
  cancel-in-progress: true

jobs:
  commercial-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}

      - name: Generate hardened V28.1 source once
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          mkdir -p cli-build/HarmonyBotPro_v281
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs cli-build/HarmonyBotPro_v281/HarmonyBotPro.cs
          cat > cli-build/HarmonyBotPro_v281/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v281</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup>
            <ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup>
          </Project>
          EOF

      - name: Compile once - zero errors and nonempty algo
        run: |
          set -euo pipefail
          dotnet restore cli-build/HarmonyBotPro_v281/HarmonyBotPro.csproj
          dotnet build cli-build/HarmonyBotPro_v281/HarmonyBotPro.csproj -c Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false 2>&1 | tee build.log
          ! grep -q ' error CS' build.log
          ALGO="$(find cli-build/HarmonyBotPro_v281 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO" && test -s "$ALGO"
          mkdir -p backtest/{reports,algo,data,logs}
          cp "$ALGO" backtest/algo/HarmonyBotPro_v281.algo
          sha256sum backtest/algo/HarmonyBotPro_v281.algo | tee backtest/algo/HarmonyBotPro_v281.algo.sha256

      - name: Pull official cTrader CLI once
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Create cTrader password file
        env: {CTRADER_PASSWORD: '${{ secrets.CTRADER_PASSWORD }}'}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Resolve and verify configured trading account once
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/backtest:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > backtest/accounts.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('backtest/accounts.json',encoding='utf-8-sig')); expected=os.environ.get('CTRADER_ACCOUNT','').strip(); match=None
          for a in data:
              if str(a.get('Number','')).strip()==expected or str(a.get('Id','')).strip()==expected: match=a; break
          if not match: raise SystemExit('Configured account is not linked to this cTID')
          if match.get('Broker','').lower()!='fxpro' or match.get('Live') is not False or match.get('DepositCurrency')!='USD' or int(match.get('Leverage',0))!=500: raise SystemExit('Account profile mismatch')
          if abs(float(match.get('Balance',0))-100.0)>0.01: raise SystemExit('Account balance mismatch')
          number=str(match.get('Number','')).strip()
          if not number: raise SystemExit('Trading account number missing')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CTRADER_ACCOUNT_NUMBER='+number+'\n')
          print('account_profile_verified=FxPro Demo USD 1:500 $100')
          PY
          rm -f backtest/accounts.json

      - name: Preflight account and XAUUSD once
        env: {CTRADER_CTID: '${{ secrets.CTRADER_CTID }}'}
        run: |
          set -euo pipefail
          if docker run --rm -v "$PWD/backtest:/work" ghcr.io/spotware/ctrader-console:5.9.11 symbols --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" > backtest/symbols.txt 2>backtest/symbols.err && grep -qi 'XAUUSD' backtest/symbols.txt; then
            echo 'CTRADER_BROKER_ARG=' >> "$GITHUB_ENV"
          elif docker run --rm -v "$PWD/backtest:/work" ghcr.io/spotware/ctrader-console:5.9.11 symbols --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" --broker=fxpro > backtest/symbols.txt 2>backtest/symbols.err && grep -qi 'XAUUSD' backtest/symbols.txt; then
            echo 'CTRADER_BROKER_ARG=--broker=fxpro' >> "$GITHUB_ENV"
          else
            cat backtest/symbols.err >&2 || true
            exit 82
          fi
          rm -f backtest/symbols.txt backtest/symbols.err

      - name: Shared-data 1Y commercial sweep M1 M5 M15 M30 H1
        env: {CTRADER_CTID: '${{ secrets.CTRADER_CTID }}'}
        run: |
          set -euo pipefail
          printf 'period,status,seconds\n' > backtest/timing.csv
          for PERIOD in m1 m5 m15 m30 h1; do
            OUT="V281-XAUUSD-100-1Y-${PERIOD}"
            START_TS=$(date +%s)
            echo "=== START ${PERIOD} $(date -u +%FT%TZ) ===" | tee "backtest/logs/${PERIOD}.log"
            set +e
            docker run --rm -v "$PWD/backtest:/work" ghcr.io/spotware/ctrader-console:5.9.11 \
              backtest /work/algo/HarmonyBotPro_v281.algo --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" $CTRADER_BROKER_ARG \
              --symbol=XAUUSD --period="$PERIOD" --start='17/09/2025' --end='16/09/2026' --balance=100 --data-mode=m1 --data-dir=/work/data --commission=35 --spread=1 \
              --SymbolName=XAUUSD --RiskPercent=1.0 --MaxDrawdown=10.0 --MinStopLossPips=100.0 --SmallAccountMode=true --SmallAccountMinSLPips=25.0 \
              --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true \
              --report="/work/reports/${OUT}.html" --report-json="/work/reports/${OUT}.json" 2>&1 | tee -a "backtest/logs/${PERIOD}.log"
            RC=${PIPESTATUS[0]}
            set -e
            END_TS=$(date +%s); SECONDS_USED=$((END_TS-START_TS))
            if [ "$RC" -eq 0 ]; then STATUS=success; else STATUS="failed-${RC}"; fi
            printf '%s,%s,%s\n' "$PERIOD" "$STATUS" "$SECONDS_USED" | tee -a backtest/timing.csv
            echo "=== END ${PERIOD} status=${STATUS} seconds=${SECONDS_USED} ===" | tee -a "backtest/logs/${PERIOD}.log"
          done

      - name: Aggregate commercial metrics
        if: always()
        run: |
          python3 - <<'PY'
          import json,glob,os,csv
          rows=[]
          for p in sorted(glob.glob('backtest/reports/*.json')):
            d=json.load(open(p,encoding='utf-8-sig')); h=d.get('history',{}) if isinstance(d,dict) else {}; items=h.get('items',[]) if isinstance(h,dict) else []; profits=[]
            for x in items:
              if isinstance(x,dict):
                for k in ('netProfit','net_profit','profit','NetProfit'):
                  if isinstance(x.get(k),(int,float)): profits.append(float(x[k])); break
            wins=sum(v>0 for v in profits); gp=sum(v for v in profits if v>0); gl=-sum(v for v in profits if v<0); dd=None
            for k in ('maxEquityDrawdownPercent','maxEquityDrawdown','MaxEquityDrawdownPercent','maxDrawdownPercent'):
              if isinstance(d.get(k),(int,float)): dd=float(d[k]); break
            out={'file':os.path.basename(p),'trades':len(profits),'win_rate':(100*wins/len(profits) if profits else None),'net':sum(profits),'pf':(gp/gl if gl>0 else None),'expectancy':(sum(profits)/len(profits) if profits else None),'max_equity_dd':dd}
            out['commercial_gate']=bool(len(profits)>=100 and out['net']>0 and (out['pf'] or 0)>=1.5 and (out['expectancy'] or 0)>0 and dd is not None and dd<=10)
            rows.append(out); print(json.dumps(out,ensure_ascii=False))
          json.dump(rows,open('backtest/reports/commercial-summary.json','w'),ensure_ascii=False,indent=2)
          PY
          cat backtest/timing.csv || true

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd backtest/accounts.json backtest/symbols.txt backtest/symbols.err

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V281-XAUUSD-100-1Y-SHARED-DATA-COMMERCIAL
          path: |
            backtest/reports/
            backtest/logs/
            backtest/timing.csv
            backtest/algo/HarmonyBotPro_v281.algo.sha256
            build.log
          if-no-files-found: warn
          retention-days: 30
