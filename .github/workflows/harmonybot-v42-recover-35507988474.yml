name: HarmonyBot V42 Engineering Recovery 35507988474

on:
  push:
    branches:
      - harmonybot/v42-marginal-alpha-opportunity-portfolio
    paths:
      - '.github/workflows/harmonybot-v42-recover-35507988474.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v42-recovery-35507988474
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v42-marginal-alpha-opportunity-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v42-dev-*
          path: control/HarmonyBot-V42/merged
          merge-multiple: true
          repository: rbhnm859/Ouroboros-Cloud-Build
          run-id: 35507988474
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Paired marginal cohort + cross-validation + promotion gates
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V42/final
          python3 control/HarmonyBot-V42/tools/analyze_parallel_dev.py control/HarmonyBot-V42/merged control/HarmonyBot-V42/final
          echo "candidate=$(cat control/HarmonyBot-V42/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V42-MARGINAL-ALPHA-FRONTIER
          path: control/HarmonyBot-V42/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v42-marginal-alpha-opportunity-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v42-build-smoke
          path: control/HarmonyBot-V42/shared
          repository: rbhnm859/Ouroboros-Cloud-Build
          run-id: 35507988474
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            LEGACY_REPLAY) RS=false; OC=false; FT=false; TX=false; GR=false; Q=false; PN=false;;
            V41_FULL_REPLAY) RS=true; OC=true; FT=true; TX=true; GR=false; Q=false; PN=false;;
            OPPORTUNITY_GRID) RS=true; OC=true; FT=true; TX=true; GR=true; Q=true; PN=false;;
            FULL_V42) RS=true; OC=true; FT=true; TX=true; GR=true; Q=true; PN=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V42/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V42/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V42/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V42/shared -type f -name 'HarmonyBot_V42_Marginal_Alpha_Opportunity_Portfolio_RC.algo' | head -1)
          cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V42-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE" \
            RESCUE="$RS" OCMODEL="$OC" FOLLOW="$FT" THESISEXIT="$TX" GRIDREAL="$GR" QUEUE="$Q" PATTERNNATIVE="$PN" TTL=8 MAXCAND=12 BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V42/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V42/tools/audit_report.py --report "$W/seal/reports/V42-$CANDIDATE-CAPITAL-$BALANCE.json" \
            --log "$W/seal/logs/V42-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json" \
            --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v42-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V42/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v42-capital-*
          path: capital
          merge-multiple: true
      - name: Apply hard $100 positive-net gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          h=rows["100"]
          ok=(h["engineering_clean"] and h["baskets"]>0 and h["net"]>0 and h["expectancy"]>0 and h["pf"]>1 and
              h["max_dd_pct"]<=10 and h["actual_basket_risk_violations"]==0 and h["margin_risk_violations"]==0)
          pathlib.Path("V42_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V42","rows":rows,
            "hard_100_compatible":ok,"status":"CAPITAL_COMPATIBLE" if ok else "CAPITAL_HOLD"},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v42-capital-gate
          path: V42_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze,capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v42-marginal-alpha-opportunity-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v42-build-smoke
          path: shared
          repository: rbhnm859/Ouroboros-Cloud-Build
          run-id: 35507988474
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze source/algo
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V42/src/HarmonyBotV42.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V42_Marginal_Alpha_Opportunity_Portfolio_RC.algo"))
          m={"version":"HarmonyBot V42","candidate":os.environ["CANDIDATE"],"source_commit":"855b0f2a9b1a04903c4711384a469e9fe3df7aae","algo_origin_run":35507988474,
             "source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),
             "fresh_tuning":False,"status":"ALPHA_AND_CAPITAL_FROZEN"}
          pathlib.Path("V42_FREEZE_MANIFEST.json").write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v42-freeze-manifest
          path: V42_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v42-marginal-alpha-opportunity-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v42-build-smoke
          path: control/HarmonyBot-V42/shared
          repository: rbhnm859/Ouroboros-Cloud-Build
          run-id: 35507988474
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Untouched Fresh validation
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            LEGACY_REPLAY) RS=false; OC=false; FT=false; TX=false; GR=false; Q=false; PN=false;;
            V41_FULL_REPLAY) RS=true; OC=true; FT=true; TX=true; GR=false; Q=false; PN=false;;
            OPPORTUNITY_GRID) RS=true; OC=true; FT=true; TX=true; GR=true; Q=true; PN=false;;
            FULL_V42) RS=true; OC=true; FT=true; TX=true; GR=true; Q=true; PN=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V42/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V42/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V42/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V42/shared -type f -name 'HarmonyBot_V42_Marginal_Alpha_Opportunity_Portfolio_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V42-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE" \
            RESCUE="$RS" OCMODEL="$OC" FOLLOW="$FT" THESISEXIT="$TX" GRIDREAL="$GR" QUEUE="$Q" PATTERNNATIVE="$PN" TTL=8 MAXCAND=12 BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V42/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V42/tools/audit_report.py --report "$W/seal/reports/V42-$CANDIDATE-FRESH-$KIND.json" \
            --log "$W/seal/logs/V42-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json" \
            --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v42-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V42/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze,fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v42-fresh-*
          path: fresh
          merge-multiple: true
      - name: Final commercial gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          ok=(a["engineering_clean"] and a["baskets"]>0 and a["net"]>0 and a["expectancy"]>0 and a["pf"]>1 and a["max_dd_pct"]<=10 and
              m["engineering_clean"] and m["baskets"]>0 and m["net"]>0 and m["expectancy"]>0 and m["pf"]>1 and m["max_dd_pct"]<=10)
          pathlib.Path("V42_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V42","fresh_alpha":a,"fresh_100":m,
            "fresh_validation_pass":ok,"commercial_release_decision":"PASS_TO_FINAL_REGRESSION" if ok else "HOLD"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v42-final-decision
          path: V42_FRESH_VALIDATION.json
          retention-days: 30
