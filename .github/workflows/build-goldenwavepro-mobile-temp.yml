name: Build GoldenWavePro Mobile Temp

on:
  push:
    branches:
      - build-goldenwavepro-mobile-20260911
    paths:
      - 'GoldenWavePro-Mobile/source/**'
      - '.github/workflows/build-goldenwavepro-mobile-temp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          PROJ='GoldenWavePro-Mobile/source/GoldenWaveProMobile.csproj'
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c Release --no-restore | tee /tmp/goldenwave-build.log
          grep -q '0 Error(s)' /tmp/goldenwave-build.log

      - name: Locate and validate .algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p GoldenWavePro-Mobile/compiled-staging
          ALGO=$(find 'GoldenWavePro-Mobile/source/bin/Release' -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" 'GoldenWavePro-Mobile/compiled-staging/GoldenWaveProMobile.algo'
          sha256sum 'GoldenWavePro-Mobile/compiled-staging/GoldenWaveProMobile.algo' | tee 'GoldenWavePro-Mobile/compiled-staging/GoldenWaveProMobile.algo.sha256'
          file 'GoldenWavePro-Mobile/compiled-staging/GoldenWaveProMobile.algo'

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenWaveProMobile
          path: GoldenWavePro-Mobile/compiled-staging/
          retention-days: 14
