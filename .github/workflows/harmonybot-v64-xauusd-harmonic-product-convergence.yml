name: HarmonyBot V64 XAUUSD Harmonic Product Convergence
on:
  push:
    branches: [harmonybot/v64-product-convergence-commercial-freeze]
    paths: ['HarmonyBot-V64/**','.github/workflows/harmonybot-v64-xauusd-harmonic-product-convergence.yml']
  workflow_dispatch:
concurrency: {group: harmonybot-v64-xauusd-harmonic-product-convergence, cancel-in-progress: true}
permissions: {contents: read}
env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build-v64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V64/tools/static_audit.py HarmonyBot-V64/src/HarmonyBotV64.cs
          dotnet restore HarmonyBot-V64/HarmonyBotV64.csproj
          dotnet build HarmonyBot-V64/HarmonyBotV64.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V64/dist HarmonyBot-V64/final
          A=$(find HarmonyBot-V64/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          sha256sum HarmonyBot-V64/src/HarmonyBotV64.cs "$A" HarmonyBot-V64/PRODUCT_CHARTER.md > HarmonyBot-V64/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V64/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v64-build
          path: |
            control/HarmonyBot-V64/dist
            control/HarmonyBot-V64/final
          retention-days: 30
          if-no-files-found: error

  build-v51-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - shell: bash
        run: |
          set -euo pipefail
          cd control
          test "$(git hash-object HarmonyBot-V51/src/HarmonyBotV51.cs)" = "be800fc0ff2a1ca83282af818abdfb6e945a512f"
          dotnet restore HarmonyBot-V51/HarmonyBotV51.csproj
          dotnet build HarmonyBot-V51/HarmonyBotV51.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V51/dist
          A=$(find HarmonyBot-V51/bin/Release -type f -name '*.algo' | head -1)
          test -s "$A"
          cp "$A" HarmonyBot-V51/dist/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo
      - uses: actions/upload-artifact@v4
        with: {name: v64-v51-control-build, path: control/HarmonyBot-V51/dist, retention-days: 30, if-no-files-found: error}

  control-v51:
    needs: build-v51-control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {window: [A,B,C]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-v51-control-build, path: control/HarmonyBot-V51/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) S=01/07/2024; E=2024-07-08T00:00:00Z; X=31/12/2024;;
            B) S=02/01/2025; E=2025-01-09T00:00:00Z; X=30/06/2025;;
            C) S=01/07/2025; E=2025-07-08T00:00:00Z; X=31/12/2025;;
          esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V51/dist
          A=$(find control/HarmonyBot-V51/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V51/dist/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo
          chmod +x control/HarmonyBot-V51/tools/*.sh
          control/HarmonyBot-V51/tools/run_window.sh FAMILY_NATIVE_MATH_GEOMETRY "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        with: {name: "v64-control-v51-${{ matrix.window }}", path: "control/HarmonyBot-V51/output-FAMILY_NATIVE_MATH_GEOMETRY-${{ matrix.window }}", retention-days: 30}

  control-v64:
    needs: build-v64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {window: [A,B,C]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: control/HarmonyBot-V64/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) S=01/07/2024; E=2024-07-08T00:00:00Z; X=31/12/2024;;
            B) S=02/01/2025; E=2025-01-09T00:00:00Z; X=30/06/2025;;
            C) S=01/07/2025; E=2025-07-08T00:00:00Z; X=31/12/2025;;
          esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V64/dist
          A=$(find control/HarmonyBot-V64/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          chmod +x control/HarmonyBot-V64/tools/*.sh
          control/HarmonyBot-V64/tools/run_window.sh V64_V51_CONTROL "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1 10000 .5
      - uses: actions/upload-artifact@v4
        with: {name: "v64-control-v64-${{ matrix.window }}", path: "control/HarmonyBot-V64/output-V64_V51_CONTROL-${{ matrix.window }}-B10000-S1", retention-days: 30}

  legacy-product:
    needs: build-v64
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy: {fail-fast: false, matrix: {window: [H21,H22,H23]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: control/HarmonyBot-V64/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            H21) S=04/01/2021; E=2021-01-11T00:00:00Z; X=31/12/2021;;
            H22) S=03/01/2022; E=2022-01-10T00:00:00Z; X=30/12/2022;;
            H23) S=03/01/2023; E=2023-01-10T00:00:00Z; X=29/12/2023;;
          esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V64/dist
          A=$(find control/HarmonyBot-V64/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          chmod +x control/HarmonyBot-V64/tools/*.sh
          control/HarmonyBot-V64/tools/run_window.sh V64_PRODUCT "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1 10000 1
      - uses: actions/upload-artifact@v4
        with: {name: "v64-legacy-${{ matrix.window }}", path: "control/HarmonyBot-V64/output-V64_PRODUCT-${{ matrix.window }}-B10000-S1", retention-days: 30}

  dev-product:
    needs: build-v64
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy: {fail-fast: false, matrix: {window: [A,B,C]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: control/HarmonyBot-V64/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) S=01/07/2024; E=2024-07-08T00:00:00Z; X=31/12/2024;;
            B) S=02/01/2025; E=2025-01-09T00:00:00Z; X=30/06/2025;;
            C) S=01/07/2025; E=2025-07-08T00:00:00Z; X=31/12/2025;;
          esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V64/dist
          A=$(find control/HarmonyBot-V64/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          chmod +x control/HarmonyBot-V64/tools/*.sh
          control/HarmonyBot-V64/tools/run_window.sh V64_PRODUCT "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" 1 10000 .5
      - uses: actions/upload-artifact@v4
        with: {name: "v64-dev-${{ matrix.window }}", path: "control/HarmonyBot-V64/output-V64_PRODUCT-${{ matrix.window }}-B10000-S1", retention-days: 30}

  analyze:
    needs: [control-v51,control-v64,legacy-product,dev-product]
    runs-on: ubuntu-24.04
    outputs: {candidate: "${{ steps.a.outputs.candidate }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-control-v51-*', path: v51, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-control-v64-*', path: v64c, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-legacy-*', path: legacy, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-dev-*', path: dev, merge-multiple: true}
      - id: a
        shell: bash
        run: |
          mkdir -p final
          python3 control/HarmonyBot-V64/tools/analyze_product.py v51 v64c legacy dev final
          echo "candidate=$(cat final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: v64-product-frontier, path: final, retention-days: 30}

  validation:
    needs: [build-v64,analyze]
    if: needs.analyze.outputs.candidate == 'V64_PRODUCT'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy: {fail-fast: false, matrix: {quarter: [Q1,Q2], spread: [1.0,1.25,1.5]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: control/HarmonyBot-V64/shared}
      - id: d
        shell: bash
        run: |
          case "${{ matrix.quarter }}" in
            Q1) S=02/01/2026; E=2026-01-09T00:00:00Z; X=31/03/2026;;
            Q2) S=01/04/2026; E=2026-04-08T00:00:00Z; X=30/06/2026;;
          esac
          echo "start=$S" >> "$GITHUB_OUTPUT"; echo "eval=$E" >> "$GITHUB_OUTPUT"; echo "end=$X" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V64/dist
          A=$(find control/HarmonyBot-V64/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          chmod +x control/HarmonyBot-V64/tools/*.sh
          control/HarmonyBot-V64/tools/run_window.sh V64_PRODUCT "VAL_${{ matrix.quarter }}_S${{ matrix.spread }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}" "${{ matrix.spread }}" 10000 .25
      - uses: actions/upload-artifact@v4
        with: {name: "v64-validation-${{ matrix.quarter }}-${{ matrix.spread }}", path: "control/HarmonyBot-V64/output-V64_PRODUCT-VAL_*", retention-days: 30}

  validation-gate:
    needs: [analyze,validation]
    if: needs.analyze.outputs.candidate == 'V64_PRODUCT'
    runs-on: ubuntu-24.04
    outputs: {ok: "${{ steps.g.outputs.ok }}"}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-validation-*', path: val, merge-multiple: true}
      - id: g
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for p in pathlib.Path("val").rglob("*.json"):
              try:d=json.load(open(p))
              except:continue
              if "basket_outcomes" in d:rows.append(d)
          ok=len(rows)==6 and all(x["baskets"]>0 and x["net"]>0 and x["pf"]>1 and x["expectancy"]>0 and x["engineering_clean"] and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 for x in rows)
          pathlib.Path("validation.out").write_text("true" if ok else "false")
          pathlib.Path("V64_VALIDATION_GATE.json").write_text(json.dumps({"pass":ok,"rows":rows},indent=2))
          PY
          echo "ok=$(cat validation.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: v64-validation-gate, path: V64_VALIDATION_GATE.json, retention-days: 30}

  capital:
    needs: [build-v64,analyze,validation-gate]
    if: needs.validation-gate.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy: {fail-fast: false, matrix: {balance: [100,150,200,300,500,1000]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: control/HarmonyBot-V64/shared}
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V64/dist
          A=$(find control/HarmonyBot-V64/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          chmod +x control/HarmonyBot-V64/tools/*.sh
          control/HarmonyBot-V64/tools/run_window.sh V64_PRODUCT "CAPITAL_${{ matrix.balance }}" 01/07/2024 2024-07-08T00:00:00Z 31/12/2025 1 "${{ matrix.balance }}" 1.5
      - uses: actions/upload-artifact@v4
        with: {name: "v64-capital-${{ matrix.balance }}", path: "control/HarmonyBot-V64/output-V64_PRODUCT-CAPITAL_*", retention-days: 30}

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate == 'V64_PRODUCT'
    runs-on: ubuntu-24.04
    outputs: {ok: "${{ steps.g.outputs.ok }}"}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-capital-*', path: capital, merge-multiple: true}
      - id: g
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for p in pathlib.Path("capital").rglob("*.json"):
              try:d=json.load(open(p))
              except:continue
              if "basket_outcomes" in d:rows.append(d)
          ok=len(rows)==6 and all(x["baskets"]>0 and x["net"]>0 and x["pf"]>1 and x["expectancy"]>0 and x["max_dd_pct"]<=10 and x["engineering_clean"] and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 for x in rows)
          pathlib.Path("capital.out").write_text("true" if ok else "false")
          pathlib.Path("V64_CAPITAL_GATE.json").write_text(json.dumps({"pass":ok,"rows":rows},indent=2))
          PY
          echo "ok=$(cat capital.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: v64-capital-gate, path: V64_CAPITAL_GATE.json, retention-days: 30}

  freeze:
    needs: [build-v64,analyze,validation-gate,capital-gate]
    if: needs.validation-gate.outputs.ok == 'true' && needs.capital-gate.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: shared}
      - shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V64/src/HarmonyBotV64.cs")
          algo=next(pathlib.Path("shared").rglob("*.algo"))
          o={"version":"HarmonyBot V64","candidate":"V64_PRODUCT","source_commit":os.environ["GITHUB_SHA"],
             "source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),
             "product_architecture":"Alpha Engine + Execution Engine + Risk & Commercial Engine","fresh_used":False}
          pathlib.Path("V64_FREEZE_MANIFEST.json").write_text(json.dumps(o,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: v64-freeze-manifest, path: V64_FREEZE_MANIFEST.json, retention-days: 30}

  fresh:
    needs: [build-v64,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {include: [{kind: ALPHA, balance: 10000},{kind: SMALL, balance: 100}]}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v64-product-convergence-commercial-freeze, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v64-build, path: control/HarmonyBot-V64/shared}
      - shell: bash
        run: |
          mkdir -p control/HarmonyBot-V64/dist
          A=$(find control/HarmonyBot-V64/shared -type f -name '*.algo' | head -1)
          cp "$A" control/HarmonyBot-V64/dist/HarmonyBot_V64_XAUUSD_Harmonic_Product_Convergence_RC.algo
          chmod +x control/HarmonyBot-V64/tools/*.sh
          control/HarmonyBot-V64/tools/run_window.sh V64_PRODUCT "FRESH_${{ matrix.kind }}" 02/01/2020 2020-01-09T00:00:00Z 30/06/2020 1 "${{ matrix.balance }}" .5
      - uses: actions/upload-artifact@v4
        with: {name: "v64-fresh-${{ matrix.kind }}", path: "control/HarmonyBot-V64/output-V64_PRODUCT-FRESH_*", retention-days: 30}

  fresh-gate:
    needs: fresh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'v64-fresh-*', path: fresh, merge-multiple: true}
      - shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for p in pathlib.Path("fresh").rglob("*.json"):
              try:d=json.load(open(p))
              except:continue
              if "basket_outcomes" in d:rows.append(d)
          ok=len(rows)==2 and all(x["baskets"]>0 and x["net"]>0 and x["pf"]>1 and x["expectancy"]>0 and x["engineering_clean"] and x["actual_basket_risk_violations"]==0 for x in rows)
          pathlib.Path("V64_FRESH_GATE.json").write_text(json.dumps({"pass":ok,"rows":rows,"status":"COMMERCIAL_FREEZE" if ok else "HOLD_NEW_MAJOR_REQUIRED"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: v64-fresh-gate, path: V64_FRESH_GATE.json, retention-days: 30}
