name: HarmonyBot V45 Restored Edge Independent Setup Expansion

on:
  push:
    branches:
      - harmonybot/v45-restored-edge-independent-setup-expansion
    paths:
      - 'HarmonyBot-V45/**'
      - '.github/workflows/harmonybot-v45-restored-edge-independent-setup-expansion.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v45-restored-edge-independent-setup-expansion
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v45-restored-edge-independent-setup-expansion
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: control/HarmonyBot-V45/HarmonyBotV45.csproj
      - name: Static, geometry and build once
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V45/tools/static_audit.py HarmonyBot-V45/src/HarmonyBotV45.cs
          python3 HarmonyBot-V45/tools/geometry_contract_test.py HarmonyBot-V45/src/HarmonyBotV45.cs
          mkdir -p HarmonyBot-V45/final HarmonyBot-V45/dist
          cp V45_ARCHITECTURE_AUDIT.json V45_GEOMETRY_CONTRACT_TEST.json HarmonyBot-V45/final/
          dotnet restore HarmonyBot-V45/HarmonyBotV45.csproj
          dotnet build HarmonyBot-V45/HarmonyBotV45.csproj -c Release --no-restore --nologo 2>&1 | tee HarmonyBot-V45/final/V45_BUILD.log
          ! grep -Eq '(^|[^0-9])error (CS|MSB|NETSDK)[0-9]+' HarmonyBot-V45/final/V45_BUILD.log
          ALGO=$(find HarmonyBot-V45/bin/Release -type f -name '*.algo' | head -1)
          test -n "$ALGO" && test -s "$ALGO"
          cp "$ALGO" HarmonyBot-V45/dist/HarmonyBot_V45_Restored_Edge_Independent_Setup_Expansion_RC.algo
          sha256sum HarmonyBot-V45/src/HarmonyBotV45.cs "$ALGO" > HarmonyBot-V45/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V45/final/SOURCE_COMMIT.txt
      - name: Ultra-short execution smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V45/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V45/smoke-work"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V45/final"
          mkdir -p "$W/seal/algo"
          cp control/HarmonyBot-V45/dist/HarmonyBot_V45_Restored_Edge_Independent_Setup_Expansion_RC.algo "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME=V45-FULL_V45-SMOKE-B10000 START_DATE=04/01/2021 EVAL_DATE=2021-01-06T00:00:00Z END_DATE=15/01/2021 BALANCE=10000             RETENTION=true AGING=true RECALL=true TTL=12 MAXCAND=12 SETUPID=true CANSTD=true PIVOTGRAPH=true TPROOF=true             M1RESCUE=true RESCUEBARS=3 DIVERSITY=true ROUTEVETO=false BACKTEST_TIMEOUT_SECONDS=300             "$GITHUB_WORKSPACE/control/HarmonyBot-V45/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V45/tools/audit_report.py             --report "$W/seal/reports/V45-FULL_V45-SMOKE-B10000.json" --log "$W/seal/logs/V45-FULL_V45-SMOKE-B10000.log"             --out "$O/V45_SMOKE.json" --window SMOKE --family FULL_V45 --years .03 --balance 10000
          python3 - "$O/V45_SMOKE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["summary_present"] and x["broker_profile_present"]
          assert x["execution_errors"]==0 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          print("[V45-SMOKE] PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v45-build-smoke
          path: |
            control/HarmonyBot-V45/dist
            control/HarmonyBot-V45/final
          retention-days: 30

  dev:
    needs: build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {family: V36_REPLAY, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: V36_REPLAY, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: V36_REPLAY, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: UNIQUE_SETUP_CORE, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: UNIQUE_SETUP_CORE, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: UNIQUE_SETUP_CORE, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: STABLE_ROUTE_CANONICAL, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: STABLE_ROUTE_CANONICAL, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: STABLE_ROUTE_CANONICAL, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: FULL_V45, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: FULL_V45, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: FULL_V45, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v45-restored-edge-independent-setup-expansion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v45-build-smoke
          path: control/HarmonyBot-V45/shared
      - name: Prepare immutable V45 algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V45/dist
          A=$(find control/HarmonyBot-V45/shared -type f -name 'HarmonyBot_V45_Restored_Edge_Independent_Setup_Expansion_RC.algo' | head -1)
          test -n "$A"; cp "$A" control/HarmonyBot-V45/dist/
      - name: Restore persistent XAUUSD M1 cache
        uses: actions/cache@v4
        with:
          path: control/HarmonyBot-V45/window-${{ matrix.family }}-${{ matrix.window }}/seal/data
          key: ctrader-xauusd-m1-${{ matrix.window }}-${{ matrix.start }}-${{ matrix.end }}-v45
      - name: Run immutable V45 DEV window
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V45/tools/*.sh
          control/HarmonyBot-V45/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ matrix.start }}" "${{ matrix.eval }}" "${{ matrix.end }}"
      - name: Upload DEV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v45-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V45/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v45-restored-edge-independent-setup-expansion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v45-dev-*
          path: control/HarmonyBot-V45/merged
          merge-multiple: true
      - name: V36 reconstruction and clear historical breakthrough gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V45/final
          python3 control/HarmonyBot-V45/tools/analyze_parallel_dev.py control/HarmonyBot-V45/merged control/HarmonyBot-V45/final
          echo "candidate=$(cat control/HarmonyBot-V45/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V45-RESTORED-EDGE-FRONTIER
          path: control/HarmonyBot-V45/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v45-restored-edge-independent-setup-expansion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v45-build-smoke
          path: control/HarmonyBot-V45/shared
      - name: Run capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            UNIQUE_SETUP_CORE) SETUP=true; CAN=false; PIV=false; TP=false; R=false; D=true;;
            STABLE_ROUTE_CANONICAL) SETUP=true; CAN=true; PIV=false; TP=true; R=false; D=true;;
            FULL_V45) SETUP=true; CAN=true; PIV=true; TP=true; R=true; D=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V45/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V45/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V45/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V45/shared -type f -name 'HarmonyBot_V45_Restored_Edge_Independent_Setup_Expansion_RC.algo' | head -1)
          cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V45-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE"             RETENTION=true AGING=true RECALL=true TTL=12 MAXCAND=12 SETUPID="$SETUP" CANSTD="$CAN" PIVOTGRAPH="$PIV" TPROOF="$TP"             M1RESCUE="$R" RESCUEBARS=3 DIVERSITY="$D" ROUTEVETO=false BACKTEST_TIMEOUT_SECONDS=1800             "$GITHUB_WORKSPACE/control/HarmonyBot-V45/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V45/tools/audit_report.py --report "$W/seal/reports/V45-$CANDIDATE-CAPITAL-$BALANCE.json"             --log "$W/seal/logs/V45-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json"             --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v45-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V45/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v45-capital-*
          path: capital
          merge-multiple: true
      - name: Hard small-capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V45_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V45","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"status":"CAPITAL_COMPATIBLE" if ok else "CAPITAL_HOLD"},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v45-capital-gate
          path: V45_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze,capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v45-restored-edge-independent-setup-expansion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v45-build-smoke
          path: shared
      - name: Freeze source and algo
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V45/src/HarmonyBotV45.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V45_Restored_Edge_Independent_Setup_Expansion_RC.algo"))
          pathlib.Path("V45_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V45","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False,"status":"CLEAR_BREAKTHROUGH_FROZEN"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v45-freeze-manifest
          path: V45_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v45-restored-edge-independent-setup-expansion
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v45-build-smoke
          path: control/HarmonyBot-V45/shared
      - name: Exactly one untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            UNIQUE_SETUP_CORE) SETUP=true; CAN=false; PIV=false; TP=false; R=false; D=true;;
            STABLE_ROUTE_CANONICAL) SETUP=true; CAN=true; PIV=false; TP=true; R=false; D=true;;
            FULL_V45) SETUP=true; CAN=true; PIV=true; TP=true; R=true; D=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V45/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V45/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V45/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V45/shared -type f -name 'HarmonyBot_V45_Restored_Edge_Independent_Setup_Expansion_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V45-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE"             RETENTION=true AGING=true RECALL=true TTL=12 MAXCAND=12 SETUPID="$SETUP" CANSTD="$CAN" PIVOTGRAPH="$PIV" TPROOF="$TP"             M1RESCUE="$R" RESCUEBARS=3 DIVERSITY="$D" ROUTEVETO=false BACKTEST_TIMEOUT_SECONDS=1800             "$GITHUB_WORKSPACE/control/HarmonyBot-V45/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V45/tools/audit_report.py --report "$W/seal/reports/V45-$CANDIDATE-FRESH-$KIND.json"             --log "$W/seal/logs/V45-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json"             --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v45-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V45/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze,fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v45-fresh-*
          path: fresh
          merge-multiple: true
      - name: Commercial freeze decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          ok=(a["engineering_clean"] and a["baskets"]>0 and a["net"]>0 and a["expectancy"]>0 and a["pf"]>1 and a["max_dd_pct"]<=10 and
              m["engineering_clean"] and m["baskets"]>0 and m["net"]>0 and m["expectancy"]>0 and m["pf"]>1 and m["max_dd_pct"]<=10)
          pathlib.Path("V45_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V45","fresh_alpha":a,"fresh_100":m,"fresh_validation_pass":ok,"commercial_release_decision":"PASS_TO_COMMERCIAL_FREEZE_REVIEW" if ok else "HOLD"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v45-final-decision
          path: V45_FRESH_VALIDATION.json
          retention-days: 30
