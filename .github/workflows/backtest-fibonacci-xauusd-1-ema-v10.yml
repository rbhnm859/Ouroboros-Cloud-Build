name: Fibonacci XAUUSD 1 - ABCD EMA Gate v10

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-round1]
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-1-ema-v10.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-xauusd-1-ema-v10
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch v10 candidate source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          mkdir -p "$ROOT/src" package
          base64 -d "$ROOT/source.gz.b64" | gzip -dc > "$ROOT/src/FibonacciXAUUSD1.cs"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FibonacciHarmonicSniperUltimate/versions/xauusd_1/src/FibonacciXAUUSD1.cs')
          s=p.read_text()
          a='''        [Parameter("EMA Period", DefaultValue = 50, MinValue = 10, MaxValue = 300, Group = "Quality")]\n        public int EmaPeriod { get; set; }\n'''
          b=a+'''\n        [Parameter("Require EMA Alignment", DefaultValue = true, Group = "Quality")]\n        public bool RequireEmaAlignment { get; set; }\n'''
          assert s.count(a)==1
          s=s.replace(a,b,1)
          assert s.count('Print("VERSION xauusd_1 v1.1.0-gold-v7");')==1
          s=s.replace('Print("VERSION xauusd_1 v1.1.0-gold-v7");','Print("VERSION xauusd_1 v1.2.0-gold-v10");',1)
          gate='''            if (UseM30Confirmation && m30Score < M30ConfirmRulesNeeded)\n            {\n                Reject("m30_confirm");\n                LogDecision(selected, "REJECT", "m30_confirm");\n                return;\n            }\n'''
          ema=gate+'''\n            if (selected.Definition.Name == "ABCD" && RequireEmaAlignment && selected.EmaContextScore < 99.5)\n            {\n                Reject("ema_alignment");\n                LogDecision(selected, "REJECT", "ema_alignment");\n                return;\n            }\n'''
          assert s.count(gate)==1
          s=s.replace(gate,ema,1)
          p.write_text(s)
          PY
          grep -q 'Require EMA Alignment' "$ROOT/src/FibonacciXAUUSD1.cs"
          grep -q 'v1.2.0-gold-v10' "$ROOT/src/FibonacciXAUUSD1.cs"
          grep -q 'ema_alignment' "$ROOT/src/FibonacciXAUUSD1.cs"
          cp "$ROOT/src/FibonacciXAUUSD1.cs" package/FibonacciXAUUSD1.cs
          cp "$ROOT/README.md" package/README.md
          sha256sum "$ROOT/src/FibonacciXAUUSD1.cs" | tee package/source.sha256
      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Build xauusd_1 v10 candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD1.csproj && dotnet build $ROOT/FibonacciXAUUSD1.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" package/xauusd_1-v10-candidate.algo
          sha256sum package/xauusd_1-v10-candidate.algo | tee package/algo.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-ema-v10-build
          path: package/
          retention-days: 30

  backtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: standard
            spread: '17.42'
            commission: '35'
          - label: harsh
            spread: '30'
            commission: '50'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_1-ema-v10-build
          path: work
      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          chmod 600 work/ctrader.pwd
      - name: Run full 3M ${{ matrix.label }} v10 backtest
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/reports work/cache
          docker run --rm -v "$PWD/work:/work" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/xauusd_1-v10-candidate.algo --environment-variables --exit-on-stop \
            --symbol=XAUUSD --period=h1 --start='09/06/2026' --end='09/09/2026' \
            --balance=10000 --data-mode=m1 --data-dir=/work/cache \
            --commission='${{ matrix.commission }}' --spread='${{ matrix.spread }}' \
            --RiskPercent=0.50 --MaxDailyLossPercent=3.0 \
            --PivotLeft=3 --PivotRight=3 --EnableStandaloneABCD=true --RequireEmaAlignment=true \
            --MinQualityScore=75 --M30ConfirmRulesNeeded=2 \
            --report='/work/reports/${{ matrix.label }}.html' \
            --report-json='/work/reports/${{ matrix.label }}.json' \
            2>&1 | tee 'work/reports/${{ matrix.label }}.log'
          test -s 'work/reports/${{ matrix.label }}.json'
      - name: Remove credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_1-ema-v10-report-${{ matrix.label }}
          path: work/reports/
          retention-days: 30

  aggregate:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_1-ema-v10-build
          path: package
      - uses: actions/download-artifact@v4
        with:
          pattern: xauusd_1-ema-v10-report-*
          path: reports
          merge-multiple: true
      - name: Aggregate v10 full-period reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          def val(d, section, key):
              try:
                  v=d[section][key]
                  return float(v.get('all',0) if isinstance(v,dict) else v or 0)
              except Exception: return 0.0
          def dd(d):
              main=d.get('main',{})
              for k in ('maxEquityDrawdownPercentages','maxEquityDrawdownPercentage'):
                  if k in main:
                      try:return float(main[k] or 0)
                      except:pass
              peak=0.; worst=0.
              for p in d.get('equity',{}).get('points',[]):
                  peak=max(peak,float(p.get('maxEquity',p.get('balance',0)) or 0))
                  low=float(p.get('minEquity',p.get('balance',0)) or 0)
                  if peak>0: worst=max(worst,(peak-low)/peak*100)
              return worst
          out=['# xauusd_1 ABCD EMA Gate v10','',
               'Period: 2026-06-09 to 2026-09-09 UTC | XAUUSD H1 | M1 data | $10,000 | risk 0.5%','',
               'Single strategy-factor change from v9: standalone AB=CD requires H1 EMA direction alignment. All other pattern, M30, quality, SL/TP and risk settings unchanged. Full-period reports remove monthly-boundary double counting.','',
               '| Cost | Trades | Wins | Losses | WR % | Net $ | ROI % | PF | Max Eq DD % |',
               '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for label in ('standard','harsh'):
              p=Path(f'reports/{label}.json')
              if not p.exists():
                  out.append(f'| {label} | NO REPORT | | | | | | | |')
                  continue
              d=json.loads(p.read_text())
              t=int(val(d,'tradeStatistics','totalTrades')); w=int(val(d,'tradeStatistics','winningTrades')); l=int(val(d,'tradeStatistics','losingTrades'))
              net=float(d.get('main',{}).get('netProfit',0) or 0)
              hist=d.get('history',{}).get('items',[])
              gp=sum(max(0.,float(x.get('net',0) or 0)) for x in hist); gl=sum(abs(min(0.,float(x.get('net',0) or 0))) for x in hist)
              pf=gp/gl if gl else (999.0 if gp else 0.0)
              wr=100*w/t if t else 0
              out.append(f'| {label} | {t} | {w} | {l} | {wr:.2f} | {net:.2f} | {net/10000*100:.2f} | {pf:.2f} | {dd(d):.2f} |')
          out += ['', 'v9 diagnostic: three unique opened trades were all ABCD Sell, all had ema=0, and all hit StopLoss. The old segmented summary showed four because the 2026-07-09 boundary trade was counted twice.',
                  'Decision rule: do not promote v10 merely for removing losses. Promote only if Standard/Harsh improve materially and the remaining signal path is still viable; otherwise continue with entry/geometry diagnostics.']
          text='\n'.join(out)+'\n'
          Path('package/EMA_V10_BACKTEST_SUMMARY.md').write_text(text)
          print(text)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
          cp -r reports package/reports
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-ema-v10-complete
          path: package/
          retention-days: 30
