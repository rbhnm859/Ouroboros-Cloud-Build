name: HarmonyBotPro v19 Fast Runtime Crosscheck
on:
  workflow_dispatch:
  push:
    branches: [harmonybot-v19-50pass]
    paths: ['.github/workflows/backtest-harmonybot-v19-fast-open.yml']
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify v19 algo
        run: |
          mkdir -p bt/reports
          cp HarmonyBot-v19/builds/HarmonyBotPro_v19_50PASS_Mobile.algo bt/v19.algo
          echo 'b77762ba49914aa65be4c70817e238b5ba0f040b01a0c085897efcf3a7f074b7  bt/v19.algo' | sha256sum -c -
      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Authenticate and select FxPro demo 1-500
        env:
          CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          printf '%s' "$CTRADER_PASSWORD" > bt/pwd
          chmod 600 bt/pwd
          docker run --rm -v "$PWD/bt:/work" -e CTID -e 'PWD-FILE=/work/pwd' ghcr.io/spotware/ctrader-console:5.9.11 accounts --environment-variables > bt/accounts.json
          ACCOUNT=$(python3 - <<'PY'
          import json
          a=json.load(open('bt/accounts.json',encoding='utf-8-sig'))
          m=[x for x in a if str(x.get('Broker','')).lower()=='fxpro' and not x.get('Live',True) and str(x.get('DepositCurrency','')).upper()=='USD' and int(x.get('Leverage',0))==500]
          if not m: raise SystemExit('No FxPro USD demo 1:500')
          print(m[0]['Number'])
          PY
          )
          echo "::add-mask::$ACCOUNT"
          echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
      - name: Fast 1Y H1 open-price crosscheck
        env:
          CTID: ${{ secrets.CTRADER_CTID }}
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=20s 8m docker run --rm -v "$PWD/bt:/work" -e CTID -e ACCOUNT -e 'PWD-FILE=/work/pwd' ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/v19.algo --environment-variables --broker=FxPro --symbol=XAUUSD --period=h1 \
            --start='11/09/2025' --end='10/09/2026' --balance=100 --data-mode=open --commission=35 --spread=17.18 \
            --SymbolName=XAUUSD --RiskPercent=1.5 --MaxDrawdown=10 --AbsoluteHardDrawdownPercent=20 --DrawdownCooldownHours=24 --RecoveryRiskFactor=0.35 --MaxRiskOvershootPercent=3 \
            --DailyLossLimitPercent=4 --WeeklyLossLimitPercent=8 --MonthlyTargetPercent=12 --RiskAfterMonthlyTarget=0.5 --SessionStart=8 --SessionEnd=22 --MTFEnabled=true --H4FilterEnabled=false \
            --PatternConfidence=0.68 --MaxConcurrentTrades=1 --MaxSameDirectionTrades=1 --EnforceSinglePosition=true --NoHedging=true --MaxTradesPerDay=4 --CooldownMinutes=10 \
            --AtrPeriod=14 --SlAtrMult=1.2 --TpCdMult=1 --MinRR=2 --MaxSpreadPips=35 --MinStopLossPips=100 --MinTakeProfitPips=200 --MinStopDistancePips=15 --MinAtrPrice=3 \
            --SwingDepth=5 --SwingLookback=200 --PivotScanCount=20 --MinLegAtrRatio=0.6 --EnableGartley=true --EnableBat=true --EnableButterfly=true --EnableCrab=true --EnableCypher=true --EnableRat=true \
            --EnableDeepGartley=true --EnableAltBat=false --EnableDeepCrab=true --EnableABCD=true --EnableShark=true --EnableFiveZero=false --GlobalMinScore=0.55 --ConsensusBonus=1.12 --FibTolerance=0.05 --MaxEntryDeviationAtr=0.8 --MaxPatternAgeBars=12 \
            --EnablePartialTP=false --Tp1RR=1.2 --Tp1ClosePercent=30 --BlockNewsWindow=true --BlockedWindowsGMT='12:25-12:45;14:25-14:45' \
            --report=/work/reports/v19-fast-1Y.html --report-json=/work/reports/v19-fast-1Y.json | tee bt/v19-fast.log
          RC=${PIPESTATUS[0]}
          echo "backtest_exit=$RC"
          test -s bt/reports/v19-fast-1Y.json
      - if: always()
        run: rm -f bt/pwd bt/accounts.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v19-Fast-1Y-CriticalFixed
          path: |
            bt/reports/*
            bt/v19-fast.log
          retention-days: 30
