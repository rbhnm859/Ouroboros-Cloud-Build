          text = path.read_text()
          old = "            foreach (HistoricalTrade trade in History)\n            {\n                if (trade.ClosingTime < cutoff)"
          new = "            foreach (HistoricalTrade trade in History)\n            {\n                if (!string.Equals(trade.SymbolName, SymbolName, StringComparison.OrdinalIgnoreCase))\n                    continue;\n\n                if (trade.ClosingTime < cutoff)"
