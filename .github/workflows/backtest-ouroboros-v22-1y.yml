            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            symbols --environment-variables \
            > backtest/reports/symbols.txt

          echo "Requested symbols:"
          echo "GOLD=$GOLD_SYMBOL"
          echo "BTC=$BTC_SYMBOL"
          echo "EURUSD=$EURUSD_SYMBOL"

      - name: Restore one-year M1 data cache
        uses: actions/cache@v4
        with:
          path: backtest/cache
          key: ${{ runner.os }}-ctrader-5.9.11-${{ env.START_DATE }}-${{ env.END_DATE }}-m1-v1

      - name: Prepare parallel backtests
        run: |
          mkdir -p backtest/reports
          mkdir -p backtest/cache/XAUUSD backtest/cache/BTC backtest/cache/EURUSD

      - name: Backtest XAUUSD, Bitcoin and EURUSD in parallel
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          CTRADER_CTID="$(printf '%s' "$CTRADER_CTID" | tr -d '[:space:]')"
          CTRADER_ACCOUNT="$(printf '%s' "$CTRADER_ACCOUNT" | tr -d '[:space:]')"

          run_backtest() {
            local symbol="$1"
            local report="$2"
            local cache="$3"

            docker run --rm \
              -v "$PWD/backtest:/work" \
              -e "CTID=$CTRADER_CTID" \
              -e "PWD-FILE=/work/ctrader.pwd" \
              -e "ACCOUNT=$CTRADER_ACCOUNT" \
              ghcr.io/spotware/ctrader-console:5.9.11 \
              backtest /work/OuroborosAdvancedUniversalMobileV22_Backtest.algo \
              --environment-variables \
              --symbol="$symbol" \
              --period="$BASE_PERIOD" \
              --start="$START_DATE" \
              --end="$END_DATE" \
              --balance="$STARTING_BALANCE" \
              --data-mode=m1 \
              --data-dir="/work/cache/$cache" \
              --report="/work/reports/$report.html" \
              --report-json="/work/reports/$report.json" \
              --exit-on-stop
          }

          set +e
          run_backtest "$GOLD_SYMBOL" XAUUSD XAUUSD &
          gold_pid=$!
          run_backtest "$BTC_SYMBOL" BTC BTC &
          btc_pid=$!
          run_backtest "$EURUSD_SYMBOL" EURUSD EURUSD &
          eurusd_pid=$!

          wait "$gold_pid"
          gold_status=$?
          wait "$btc_pid"
          btc_status=$?
          wait "$eurusd_pid"
          eurusd_status=$?
          set -e

          echo "XAUUSD exit: $gold_status"
          echo "BTC exit: $btc_status"
          echo "EURUSD exit: $eurusd_status"

          if [ "$gold_status" -ne 0 ] || [ "$btc_status" -ne 0 ] || [ "$eurusd_status" -ne 0 ]; then
            exit 1
          fi

      - name: Build comparison summary
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, csv

          reports = Path('backtest/reports')
          balance = float("$STARTING_BALANCE")

          items = [
              ("XAUUSD", reports / "XAUUSD.json"),
              ("BTC", reports / "BTC.json"),
              ("EURUSD", reports / "EURUSD.json"),
          ]

          rows = []
          for name, path in items:
              d = json.loads(path.read_text())
              total = int(float(d.get("TotalTrades", 0) or 0))
              wins = int(float(d.get("WinningTrades", 0) or 0))
              losses = int(float(d.get("LosingTrades", 0) or 0))
              net = float(d.get("NetProfit", 0) or 0)
              equity = d.get("Equity", balance + net)
              try:
                  equity = float(equity)
              except Exception:
                  equity = balance + net

              win_rate = wins / total * 100 if total else 0.0
              roi = net / balance * 100 if balance else 0.0

              def val(key):
                  v = d.get(key, "")
                  return "" if v is None else v

              rows.append({
                  "Symbol": name,
                  "TotalTrades": total,
                  "WinningTrades": wins,
                  "LosingTrades": losses,
                  "WinRatePct": round(win_rate, 2),
                  "StartBalance": balance,
                  "FinalEquity": round(equity, 2),
                  "NetProfit": round(net, 2),
                  "ROIPct": round(roi, 2),
                  "ProfitFactor": val("ProfitFactor"),
                  "MaxEquityDrawdownPct": val("MaxEquityDrawdownPercentages"),
                  "MaxBalanceDrawdownPct": val("MaxBalanceDrawdownPercentages"),
                  "AverageTrade": val("AverageTrade"),
              })

          csv_path = reports / "summary.csv"
          with csv_path.open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader()
              w.writerows(rows)

          md = []
          md.append("# Ouroboros V2.2 one-year backtest")
          md.append("")
          md.append("Period: $START_DATE to $END_DATE UTC")
          md.append(f"Starting balance: ${balance:.2f}")
          md.append("Base period: $BASE_PERIOD")
          md.append("Data mode: cTrader server M1")
          md.append("")
          md.append("| Symbol | Trades | Wins | Losses | Win rate | Net profit | ROI | Profit factor | Max equity DD |")
          md.append("|---|---:|---:|---:|---:|---:|---:|---:|---:|")
          for r in rows:
              md.append(
                  f"| {r['Symbol']} | {r['TotalTrades']} | {r['WinningTrades']} | "
                  f"{r['LosingTrades']} | {r['WinRatePct']:.2f}% | "
                  f"${r['NetProfit']:.2f} | {r['ROIPct']:.2f}% | "
                  f"{r['ProfitFactor']} | {r['MaxEquityDrawdownPct']} |"
              )

          (reports / "summary.md").write_text("\n".join(md))
          print("\n".join(md))
          PYCODE

      - name: Remove credentials before upload
        if: always()
        run: |
          rm -f backtest/ctrader.pwd

      - name: Upload backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ouroboros-V2.2-1Y-Backtest-Reports
          path: |
            backtest/reports/
          if-no-files-found: warn
