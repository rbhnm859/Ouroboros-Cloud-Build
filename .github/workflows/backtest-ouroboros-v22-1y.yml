name: Backtest Ouroboros V2.2 - Daily ROI Universal M1 30D

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backtest-ouroboros-v22-1y.yml"
      - ".github/workflows/apply_universal_daily_roi.py"
  workflow_dispatch:

concurrency:
  group: ouroboros-v22-daily-roi-universal-m1-30d
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backtest:
    name: XAUUSD M1 30-day fast backtest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      START_DATE: "07/08/2026"
      END_DATE: "06/09/2026"
      STARTING_BALANCE: "200"
      BASE_PERIOD: "m1"
      TEST_SYMBOL: "XAUUSD"
      TEST_ID: "XAUUSD"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download pinned Ouroboros source
        run: |
          git clone https://github.com/floating-astronaut/ouroboros-cbot.git upstream
          cd upstream
          git checkout f5fed93990737c8bb511aaf85bf88ac6a854273b

      - name: Rebuild Universal Mobile V2 source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, base64, gzip
          text = Path(".github/workflows/build-ouroboros-universal-mobile-v2.yml").read_text()
          def get(name):
              m = re.search(name + r' = """([A-Za-z0-9+/=]+)"""', text)
              if not m:
                  raise SystemExit("Cannot find " + name + " in V2 workflow")
              return gzip.decompress(base64.b64decode(m.group(1)))
          Path("upstream/Ouroboros/Ouroboros.cs").write_bytes(get("main_payload"))
          Path("upstream/Ouroboros/Strategies/SessionAnalyst.cs").write_bytes(get("session_payload"))
          PYCODE

      - name: Apply V2.2 patch
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, base64, gzip
          text = Path(".github/workflows/build-ouroboros-universal-mobile-v2.2.yml").read_text()
          m = re.search(r'payload\s*=\s*\(\s*(.*?)\s*\)\s*Path\(', text, re.S)
          if not m:
              raise SystemExit("Cannot locate V2.2 patch payload")
          chunks = re.findall(r'"([A-Za-z0-9+/=]+)"', m.group(1))
          if not chunks:
              raise SystemExit("V2.2 payload chunks not found")
          Path("/tmp/v22.patch").write_bytes(gzip.decompress(base64.b64decode("".join(chunks))))
          PYCODE
          cd upstream/Ouroboros
          patch -p1 < /tmp/v22.patch

      - name: Restrict adaptive history to current chart symbol
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path("upstream/Ouroboros/Ouroboros.cs")
          text = path.read_text()
          old = "            foreach (HistoricalTrade trade in History)\n            {\n                if (trade.ClosingTime < cutoff)"
          new = "            foreach (HistoricalTrade trade in History)\n            {\n                if (!string.Equals(trade.SymbolName, SymbolName, StringComparison.OrdinalIgnoreCase))\n                    continue;\n\n                if (trade.ClosingTime < cutoff)"
          if old not in text:
              raise SystemExit("History bootstrap target was not found")
          path.write_text(text.replace(old, new, 1))
          PYCODE

      - name: Apply universal daily ROI and deterministic risk patch
        run: python3 .github/workflows/apply_universal_daily_roi.py upstream/Ouroboros/Ouroboros.cs

      - name: Sanity check universal daily ROI V2.2 source
        run: |
          grep -n "class OuroborosAdvancedUniversalMobileV22" upstream/Ouroboros/Ouroboros.cs
          grep -n "trade.SymbolName, SymbolName" upstream/Ouroboros/Ouroboros.cs
          grep -n "BootstrapStrategyPerformanceFromHistory" upstream/Ouroboros/Ouroboros.cs
          grep -n "UniversalVolumeForRisk" upstream/Ouroboros/Ouroboros.cs
          grep -n "OuroborosMarket.Generic" upstream/Ouroboros/Ouroboros.cs
          grep -n "DailyProfitGivebackPct" upstream/Ouroboros/Ouroboros.cs

      - name: Restore V2.2 project
        run: dotnet restore upstream/Ouroboros/Ouroboros.csproj

      - name: Build OuroborosAdvancedUniversalMobileV22.algo
        run: |
          dotnet build upstream/Ouroboros/Ouroboros.csproj \
            --configuration Release \
            --no-restore \
            -p:AlgoPublish=False \
            -p:IncludeSource=True
          mkdir -p artifact backtest/reports "backtest/cache/$TEST_ID"
          ALGO="$(find upstream -type f -name '*.algo' -print -quit)"
          if [ -z "$ALGO" ]; then
            echo "No .algo generated"
            exit 1
          fi
          cp "$ALGO" artifact/OuroborosAdvancedUniversalMobileV22.algo
          cp "$ALGO" backtest/OuroborosAdvancedUniversalMobileV22.algo
          ls -lah artifact backtest

      - name: Create cTrader credentials file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          if [ -z "${CTRADER_PASSWORD:-}" ]; then
            echo "Missing GitHub Secret: CTRADER_PASSWORD"
            exit 1
          fi
          printf '%s' "$CTRADER_PASSWORD" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Verify cTrader account
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          if [ -z "${CTRADER_CTID:-}" ] || [ -z "${CTRADER_ACCOUNT:-}" ]; then
            echo "Missing CTRADER_CTID or CTRADER_ACCOUNT"
            exit 1
          fi
          CTRADER_CTID="$(printf '%s' "$CTRADER_CTID" | tr -d '[:space:]')"
          CTRADER_ACCOUNT="$(printf '%s' "$CTRADER_ACCOUNT" | tr -d '[:space:]')"
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e "PWD-FILE=/work/ctrader.pwd" \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            accounts --environment-variables > backtest/reports/accounts.txt

      - name: Backtest representative symbol M1 for 30 days
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          CTRADER_CTID="$(printf '%s' "$CTRADER_CTID" | tr -d '[:space:]')"
          CTRADER_ACCOUNT="$(printf '%s' "$CTRADER_ACCOUNT" | tr -d '[:space:]')"
          set -o pipefail
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e "PWD-FILE=/work/ctrader.pwd" \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/OuroborosAdvancedUniversalMobileV22.algo \
            --environment-variables \
            --symbol="$TEST_SYMBOL" \
            --period="$BASE_PERIOD" \
            --start="$START_DATE" \
            --end="$END_DATE" \
            --balance="$STARTING_BALANCE" \
            --data-mode=m1 \
            --data-dir="/work/cache/$TEST_ID" \
            --report="/work/reports/$TEST_ID-M1-30D.html" \
            --report-json="/work/reports/$TEST_ID-M1-30D.json" \
            --exit-on-stop 2>&1 | tee backtest/reports/XAUUSD-console.log

      - name: Build verified backtest summary
        if: success()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from collections import Counter
          from datetime import datetime
          import json
          import os
          import re

          test_id = os.environ["TEST_ID"]
          symbol = os.environ["TEST_SYMBOL"]
          report = Path(f"backtest/reports/{test_id}-M1-30D.json")
          data = json.loads(report.read_text())
          balance = 200.0

          main = data.get("main", {})
          equity = data.get("equity", {})
          closed = data.get("history", {}).get("items", [])

          def value(node, key, default=0.0):
              try:
                  return float(node.get(key, default))
              except (AttributeError, TypeError, ValueError):
                  return default

          trade_nets = [value(trade, "net") for trade in closed]
          total = len(trade_nets)
          wins = sum(net_value > 0 for net_value in trade_nets)
          losses = sum(net_value < 0 for net_value in trade_nets)
          flats = total - wins - losses
          net = value(main, "netProfit", sum(trade_nets))
          gross_profit = sum(net_value for net_value in trade_nets if net_value > 0)
          gross_loss = -sum(net_value for net_value in trade_nets if net_value < 0)
          profit_factor = gross_profit / gross_loss if gross_loss > 0 else (float("inf") if gross_profit > 0 else 0.0)
          max_equity_dd = value(equity, "maxEquityDrawdownPercent")
          win_rate = wins / total * 100 if total else 0.0
          roi = net / balance * 100 if balance else 0.0
          average_trade = net / total if total else 0.0
          start = datetime.strptime(os.environ["START_DATE"], "%d/%m/%Y")
          end = datetime.strptime(os.environ["END_DATE"], "%d/%m/%Y")
          elapsed_days = max(1, (end - start).days)
          daily_average = total / elapsed_days

          console_path = Path(f"backtest/reports/{test_id}-console.log")
          console = console_path.read_text(errors="replace") if console_path.exists() else ""
          block_reasons = Counter()
          hold_reasons = Counter()
          for line in console.splitlines():
              block = re.search(r"BLOCK [^:]+:\s*(.*)", line)
              if block:
                  reason = re.sub(r"\d+(?:\.\d+)?", "#", block.group(1)).strip()
                  block_reasons[reason] += 1
              hold = re.search(r"HOLD [^:]+:\s*(.*)", line)
              if hold:
                  hold_reasons[hold.group(1).strip()] += 1

          diagnostic = ""
          if total == 0:
              diagnostic_lines = ["", "## Zero-trade diagnostics", ""]
              diagnostic_lines.append(f"Wired cells: {len(re.findall(r'WIRED ', console))}")
              diagnostic_lines.append(f"Candidate signals blocked: {len(re.findall(r'BLOCK ', console))}")
              diagnostic_lines.append(f"Hold decisions: {len(re.findall(r'HOLD ', console))}")
              if block_reasons:
                  diagnostic_lines.extend(["", "Top block reasons:"])
                  diagnostic_lines.extend(f"- {count}x {reason}" for reason, count in block_reasons.most_common(12))
              if hold_reasons:
                  diagnostic_lines.extend(["", "Top hold reasons:"])
                  diagnostic_lines.extend(f"- {count}x {reason}" for reason, count in hold_reasons.most_common(12))
              diagnostic = "\n".join(diagnostic_lines) + "\n"

          summary = (
              f"# Ouroboros V2.2 Daily ROI — {symbol} M1 30-day backtest\n\n"
              "Period: 07/08/2026 to 06/09/2026 UTC\n"
              f"Trades: {total}\n"
              f"Wins: {wins}\n"
              f"Losses: {losses}\n"
              f"Flat/immediate risk-guard closes: {flats}\n"
              f"Win rate: {win_rate:.2f}%\n"
              f"Net profit: ${net:.2f}\n"
              f"ROI: {roi:.2f}%\n"
              f"Profit factor: {profit_factor:.2f}\n"
              f"Max equity drawdown: {max_equity_dd:.2f}%\n"
              f"Average trade P/L: ${average_trade:.4f}\n"
              f"Average trades/day: {daily_average:.2f}\n"
              f"{diagnostic}"
          )
          Path(f"backtest/reports/{test_id}-summary.md").write_text(summary)
          print(summary)
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload compiled mobile ALGO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ouroboros-Advanced-Universal-Mobile-V2.2-Daily-ROI-XAUUSD
          path: artifact/OuroborosAdvancedUniversalMobileV22.algo
          if-no-files-found: error

      - name: Upload representative 30-day reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ouroboros-V2.2-Daily-ROI-XAUUSD-M1-30D-Reports
          path: backtest/reports/
          if-no-files-found: warn
