name: GQ Session Scalper v2 Smoke Backtest

on:
  push:
    branches:
      - gq-session-scalper-v2-robust-20260908
    paths:
      - '.github/workflows/gq-session-scalper-v2-smoke-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GQ branch
        uses: actions/checkout@v4

      - name: Verify secure cTrader inputs
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          echo 'Secure cTrader inputs are present.'

      - name: Pull official cTrader container
        run: docker pull ghcr.io/spotware/ctrader-console:latest

      - name: Build GQ cBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p GQ-Session-Scalper-v2/backtests/smoke/cache GQ-Session-Scalper-v2/backtests/smoke/reports
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo \
            ghcr.io/spotware/ctrader-console:latest -c \
            "dotnet restore GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.csproj && dotnet build GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find GQ-Session-Scalper-v2/src/bin -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" GQ-Session-Scalper-v2/backtests/smoke/GQ_Session_Scalper_v2.algo
          test -s GQ-Session-Scalper-v2/backtests/smoke/GQ_Session_Scalper_v2.algo

      - name: Create temporary password file
        shell: bash
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CTRADER_PASSWORD" > GQ-Session-Scalper-v2/backtests/smoke/ctrader.pwd
          chmod 600 GQ-Session-Scalper-v2/backtests/smoke/ctrader.pwd

      - name: Run EURUSD M15 cBot lifecycle smoke test
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          # cTrader CLI parses these dates as DD/MM/YYYY.
          START_DATE='01/09/2026 00:00'
          END_DATE='07/09/2026 23:59'
          echo "GQ smoke backtest: EURUSD M15 $START_DATE -> $END_DATE"
          timeout --signal=TERM --kill-after=30s 8m docker run --rm \
            -v "$PWD/GQ-Session-Scalper-v2/backtests/smoke:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:latest \
            backtest /work/GQ_Session_Scalper_v2.algo \
            --environment-variables --exit-on-stop \
            --symbol=EURUSD \
            --period=m15 \
            --start="$START_DATE" \
            --end="$END_DATE" \
            --balance=1000 \
            --spread=1 --commission=35 \
            --data-mode=m1 \
            --data-dir=/work/cache \
            --report=/work/reports/EURUSD-M15-smoke.html \
            --report-json=/work/reports/EURUSD-M15-smoke.json
          test -s GQ-Session-Scalper-v2/backtests/smoke/reports/EURUSD-M15-smoke.json

      - name: Summarize smoke report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, datetime
          p = Path('GQ-Session-Scalper-v2/backtests/smoke/reports/EURUSD-M15-smoke.json')
          if not p.exists():
              print('SMOKE_RESULT=NO_REPORT')
              raise SystemExit(0)
          d = json.loads(p.read_text())
          main = d.get('main', {})
          stats = d.get('tradeStatistics', {})
          total = stats.get('totalTrades', {}).get('all')
          period = main.get('testingPeriod', {})
          start_ms = period.get('startDate') if isinstance(period, dict) else None
          end_ms = period.get('endDate') if isinstance(period, dict) else None
          start = datetime.datetime.fromtimestamp(start_ms / 1000, datetime.timezone.utc).date().isoformat() if start_ms else None
          end = datetime.datetime.fromtimestamp(end_ms / 1000, datetime.timezone.utc).date().isoformat() if end_ms else None
          print('SMOKE_RESULT=REPORT_CREATED')
          print('symbol=', main.get('symbol'))
          print('period=', period)
          print('resolvedStart=', start)
          print('resolvedEnd=', end)
          print('netProfit=', main.get('netProfit'))
          print('roi=', main.get('roi'))
          print('trades=', total)
          if start != '2026-09-01' or end != '2026-09-07':
              raise SystemExit(f'DATE_ASSERTION_FAILED: {start} -> {end}')
          print('DATE_ASSERTION=PASS')
          print('This run validates cBot lifecycle only; it is not a profitability verdict.')
          PY

      - name: Remove temporary credentials
        if: always()
        run: rm -f GQ-Session-Scalper-v2/backtests/smoke/ctrader.pwd

      - name: Upload GQ smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GQ-Session-Scalper-v2-EURUSD-M15-smoke-correct-dates
          path: |
            GQ-Session-Scalper-v2/backtests/smoke/reports/EURUSD-M15-smoke.html
            GQ-Session-Scalper-v2/backtests/smoke/reports/EURUSD-M15-smoke.json
          if-no-files-found: warn
          retention-days: 30
