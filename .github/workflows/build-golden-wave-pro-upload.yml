name: Build GoldenWavePro Mobile Algo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-golden-wave-pro-upload.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Recreate GoldenWavePro project
        shell: bash
        run: |
          mkdir -p cli-build/GoldenWavePro
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip
          Path('cli-build/GoldenWavePro/GoldenWavePro.cs').write_bytes(gzip.decompress(base64.b64decode('')))
          Path('cli-build/GoldenWavePro/GoldenWavePro.csproj').write_bytes(gzip.decompress(base64.b64decode('')))
          PYCODE

      - name: Restore cTrader package
        run: dotnet restore cli-build/GoldenWavePro/GoldenWavePro.csproj

      - name: Build GoldenWavePro .algo
        run: |
          dotnet build cli-build/GoldenWavePro/GoldenWavePro.csproj \
            --configuration Release \
            --no-restore \
            -p:AlgoPublish=False \
            -p:IncludeSource=True

      - name: Collect .algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ALGO=$(find cli-build/GoldenWavePro -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" dist/GoldenWavePro.algo
          ls -lh dist/GoldenWavePro.algo

      - name: Upload .algo artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenWavePro-algo
          path: dist/GoldenWavePro.algo
          if-no-files-found: error
