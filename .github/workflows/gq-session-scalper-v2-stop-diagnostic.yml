name: GQ Session Scalper v2 Stop Diagnostic

on:
  push:
    branches:
      - gq-session-scalper-v2-robust-20260908
    paths:
      - '.github/workflows/gq-session-scalper-v2-stop-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GQ branch
        uses: actions/checkout@v4

      - name: Verify secure cTrader inputs
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}"
          test -n "${CTRADER_ACCOUNT:-}"
          test -n "${CTRADER_PASSWORD:-}"
          echo 'Secure cTrader inputs are present.'

      - name: Pull official cTrader container
        run: docker pull ghcr.io/spotware/ctrader-console:latest

      - name: Build patched GQ cBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p GQ-Session-Scalper-v2/backtests/stop-diagnostic/{cache,reports,logs}
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo \
            ghcr.io/spotware/ctrader-console:latest -c \
            "dotnet restore GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.csproj && dotnet build GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find GQ-Session-Scalper-v2/src/bin -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" GQ-Session-Scalper-v2/backtests/stop-diagnostic/GQ_Session_Scalper_v2.algo

      - name: Create temporary password file
        shell: bash
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          printf '%s' "$CTRADER_PASSWORD" > GQ-Session-Scalper-v2/backtests/stop-diagnostic/ctrader.pwd
          chmod 600 GQ-Session-Scalper-v2/backtests/stop-diagnostic/ctrader.pwd

      - name: Run target-period EURUSD M15 stop diagnostic
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          START_DATE='08/06/2026 00:00'
          END_DATE='30/06/2026 23:59'
          LOG='GQ-Session-Scalper-v2/backtests/stop-diagnostic/logs/EURUSD-M15-stop-diagnostic.log'
          timeout --signal=TERM --kill-after=30s 9m docker run --rm \
            -v "$PWD/GQ-Session-Scalper-v2/backtests/stop-diagnostic:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:latest \
            backtest /work/GQ_Session_Scalper_v2.algo \
            --environment-variables --exit-on-stop \
            --symbol=EURUSD --period=m15 \
            --start="$START_DATE" --end="$END_DATE" \
            --balance=1000 --spread=1 --commission=35 \
            --data-mode=m1 --data-dir=/work/cache \
            --report=/work/reports/EURUSD-M15-stop-diagnostic.html \
            --report-json=/work/reports/EURUSD-M15-stop-diagnostic.json \
            2>&1 | tee "$LOG"
          test -s GQ-Session-Scalper-v2/backtests/stop-diagnostic/reports/EURUSD-M15-stop-diagnostic.json

      - name: Analyze stop-management behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('GQ-Session-Scalper-v2/backtests/stop-diagnostic')
          log_path = root / 'logs/EURUSD-M15-stop-diagnostic.log'
          report_path = root / 'reports/EURUSD-M15-stop-diagnostic.json'
          text = log_path.read_text(errors='replace')
          lines = text.splitlines()

          req_re = re.compile(r'\| Trade \| Modifying position (PID\d+) \(SL: ([0-9.]+)')
          ok_re = re.compile(r'\| Trade \| → Modifying position (PID\d+) \(SL: ([0-9.]+).*SUCCEEDED')
          requests = []
          successes = []
          for line in lines:
              m = req_re.search(line)
              if m:
                  requests.append((m.group(1), m.group(2)))
              m = ok_re.search(line)
              if m:
                  successes.append((m.group(1), m.group(2)))

          successful_set = set()
          duplicate_after_success = []
          success_iter = iter([])
          # Walk chronologically so a retry after a failed request is not falsely flagged.
          for line in lines:
              m_ok = ok_re.search(line)
              if m_ok:
                  successful_set.add((m_ok.group(1), m_ok.group(2)))
                  continue
              m_req = req_re.search(line)
              if m_req:
                  key = (m_req.group(1), m_req.group(2))
                  if key in successful_set:
                      duplicate_after_success.append(key)

          stop_update_errors = sum('[STOP_UPDATE_ERROR]' in x for x in lines)
          invalid_stop_errors = sum('InvalidStopLossTakeProfit' in x for x in lines)
          d = json.loads(report_path.read_text())
          main = d.get('main', {})
          stats = d.get('tradeStatistics', {})
          total = stats.get('totalTrades', {}).get('all')

          summary = {
              'period_requested': '2026-06-08 to 2026-06-30',
              'symbol': main.get('symbol'),
              'timeframe': 'M15',
              'trades': total,
              'net_profit_diagnostic_only': main.get('netProfit'),
              'roi_diagnostic_only': main.get('roi'),
              'stop_modify_requests': len(requests),
              'stop_modify_successes': len(successes),
              'duplicate_identical_requests_after_success': len(duplicate_after_success),
              'stop_update_errors': stop_update_errors,
              'invalid_stop_loss_take_profit_errors': invalid_stop_errors,
              'stop_patch_gate': 'PASS' if not duplicate_after_success and stop_update_errors == 0 and invalid_stop_errors == 0 else 'FAIL'
          }
          out = root / 'reports/stop-management-summary.json'
          out.write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))

          if len(successes) == 0:
              raise SystemExit('STOP_PATCH_GATE_INCONCLUSIVE: no successful stop modifications occurred')
          if summary['stop_patch_gate'] != 'PASS':
              raise SystemExit('STOP_PATCH_GATE_FAILED')
          PY

      - name: Remove temporary credentials
        if: always()
        run: rm -f GQ-Session-Scalper-v2/backtests/stop-diagnostic/ctrader.pwd

      - name: Upload GQ stop diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GQ-Session-Scalper-v2-stop-diagnostic
          path: |
            GQ-Session-Scalper-v2/backtests/stop-diagnostic/reports/
            GQ-Session-Scalper-v2/backtests/stop-diagnostic/logs/EURUSD-M15-stop-diagnostic.log
          if-no-files-found: warn
          retention-days: 30
