name: HarmonyBotPro v18 XAUUSD H1 $100 Fast Crosscheck
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backtest-harmonybot-xauusd-fast-open.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: harmonybot-v18-h1-fast-crosscheck
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 1Y, start: '11/09/2025', end: '10/09/2026' }
          - { label: 3Y, start: '11/09/2023', end: '10/09/2026' }
    steps:
      - uses: actions/checkout@v4
      - name: Get exact v18 algo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bt/algo bt/reports
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10183039414/zip" -o bt/v18.zip
          unzip -o bt/v18.zip -d bt/algo
          cp bt/algo/HarmonyBotPro_v18_Mobile.algo bt/HarmonyBotPro_v18_Mobile.algo
          echo '1e830c6cd334460d8f49faad4ecdf600b2ad81b419d9b7368aa6c96207597623  bt/HarmonyBotPro_v18_Mobile.algo' | sha256sum -c -
      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: printf '%s' "$CTRADER_PASSWORD" > bt/ctrader.pwd
      - name: Select FxPro demo USD 1-500
        env:
          CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          docker run --rm -v "$PWD/bt:/work" -e CTID -e 'PWD-FILE=/work/ctrader.pwd' ghcr.io/spotware/ctrader-console:5.9.11 accounts --environment-variables > bt/accounts.json
          ACCOUNT=$(python3 - <<'PY'
          import json
          a=json.load(open('bt/accounts.json'))
          m=[x for x in a if str(x.get('Broker','')).lower()=='fxpro' and not x.get('Live',True) and str(x.get('DepositCurrency','')).upper()=='USD' and int(x.get('Leverage',0))==500]
          if not m: raise SystemExit('No FxPro demo USD 1:500 account')
          print(m[0]['Number'])
          PY
          )
          echo "::add-mask::$ACCOUNT"
          echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
      - name: Fast H1 crosscheck ${{ matrix.label }}
        env:
          CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          OUT="HarmonyBotPro-v18-H1-FAST-${{ matrix.label }}"
          docker run --rm -v "$PWD/bt:/work" -e CTID -e ACCOUNT -e 'PWD-FILE=/work/ctrader.pwd' ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/HarmonyBotPro_v18_Mobile.algo --environment-variables \
            --broker=FxPro --symbol=XAUUSD --period=h1 --start='${{ matrix.start }}' --end='${{ matrix.end }}' --balance=100 --data-mode=open --commission=35 --spread=17.18 \
            --SymbolName=XAUUSD --RiskPercent=1.5 --MaxDrawdown=10 --DailyLossLimitPercent=4 --WeeklyLossLimitPercent=8 --MonthlyTargetPercent=12 --RiskAfterMonthlyTarget=0.5 \
            --CloseAllOnDailyLock=false --AutoReprotectOnStart=true --EmergencySlAtrMult=2 --EmergencyTpRR=2 --SessionStart=8 --SessionEnd=22 --MTFEnabled=true --H4FilterEnabled=false \
            --PatternConfidence=0.72 --MaxConcurrentTrades=3 --MaxSameDirectionTrades=1 --MaxTradesPerDay=4 --CooldownMinutes=10 --AtrPeriod=14 --SlAtrMult=1.2 --TpCdMult=1 --MinRR=2 \
            --MaxSpreadPips=35 --MinStopLossPips=100 --MinTakeProfitPips=200 --MinStopDistancePips=15 --MinAtrPrice=3 --SwingDepth=5 --SwingLookback=200 --PivotScanCount=14 --MinLegAtrRatio=0.8 \
            --EnableGartley=true --EnableBat=true --EnableButterfly=true --EnableCrab=true --EnableCypher=true --EnableRat=true --EnableDeepGartley=true --EnableAltBat=false --EnableDeepCrab=true --EnableABCD=true --EnableShark=true --EnableFiveZero=false \
            --GlobalMinScore=0.55 --ConsensusBonus=1.12 --FibTolerance=0.05 --MaxEntryDeviationAtr=0.5 --MaxTradesPerPatternPercent=50 --AutoDisableLosing=true --AutoDisableWinRate=50 \
            --SlUpdateStepPips=2 --SlUpdateCooldownSec=5 --BreakEvenTriggerPips=100 --BreakEvenOffsetPips=10 --TrailingTriggerPips=150 --TrailingDistancePips=90 --EnablePartialTP=true --Tp1RR=1 --Tp1ClosePercent=60 \
            --BlockNewsWindow=true --BlockedWindowsGMT='12:25-12:45;14:25-14:45' --report="/work/reports/${OUT}.html" --report-json="/work/reports/${OUT}.json"
      - if: always()
        run: rm -f bt/ctrader.pwd bt/accounts.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v18-H1-FAST-${{ matrix.label }}
          path: bt/reports/*
          if-no-files-found: warn
          retention-days: 30
