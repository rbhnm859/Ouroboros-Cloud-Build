name: Fibonacci Store RC1 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fibonacci-store-v0.4.0-rc1
    paths:
      - '.github/workflows/validate-fibonacci-store-rc1.yml'
      - 'FibonacciHarmonicSniperUltimate/versions/v0.4.0-store-rc1/**'

permissions:
  contents: read

concurrency:
  group: fibonacci-store-rc1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: xau-m15-dev
            symbol: XAUUSD
            period: m15
            start: '01/01/2024 00:00'
            end: '31/12/2025 23:59'
            min_trades: 60
          - id: xau-m15-recent
            symbol: XAUUSD
            period: m15
            start: '01/01/2026 00:00'
            end: '09/09/2026 23:59'
            min_trades: 25
          - id: xau-h1-recent
            symbol: XAUUSD
            period: h1
            start: '01/01/2026 00:00'
            end: '09/09/2026 23:59'
            min_trades: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install official cTrader CLI for Linux
        run: |
          set -euxo pipefail
          CLI_ROOT="$RUNNER_TEMP/ctrader-cli"
          mkdir -p "$CLI_ROOT" "$HOME/.local/bin"
          curl -fsSL "https://getctrader.spotware.com/cli/homebrew/ctrader-cli-5.9.0-linux-x64.tar.gz" -o "$RUNNER_TEMP/ctrader-cli.tar.gz"
          echo "da0f5fb0c58980be9143fafca9839de784084b6e323321d9e03e5c3e64bec562  $RUNNER_TEMP/ctrader-cli.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ctrader-cli.tar.gz" -C "$CLI_ROOT"
          find "$CLI_ROOT" -type f | while read -r f; do
            b="$(basename "$f")"
            if [[ "$b" != *.* || "$b" == "algohost.netcore" ]]; then chmod +x "$f" || true; fi
          done
          CLI_BIN="$(find "$CLI_ROOT" -type f -name ctrader-cli -print -quit)"
          test -n "$CLI_BIN"
          ln -sf "$CLI_BIN" "$HOME/.local/bin/ctrader-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ctrader-cli" --version
          dotnet --info

      - name: Prepare store RC1 with trading enabled for backtest
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          src = Path('FibonacciHarmonicSniperUltimate/versions/v0.4.0-store-rc1')
          dst = Path('fibonacci-store-test/FibonacciHarmonicSniperUltimate')
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(src, dst)
          p = dst / 'FibonacciHarmonicSniperUltimate.cs'
          text = p.read_text()
          old = '[Parameter("Trading Enabled", DefaultValue = false'
          new = '[Parameter("Trading Enabled", DefaultValue = true'
          if old not in text: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(text.replace(old, new, 1))
          PYCODE

      - name: Build Net8 cBot
        run: |
          set -euxo pipefail
          mkdir -p backtest/cache backtest/reports
          dotnet restore fibonacci-store-test/FibonacciHarmonicSniperUltimate/FibonacciHarmonicSniperUltimate.csproj
          dotnet build fibonacci-store-test/FibonacciHarmonicSniperUltimate/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True
          ALGO="$(find fibonacci-store-test -type f -name '*.algo' -print -quit)"
          test -n "$ALGO" || { echo 'Build succeeded but no .algo was found'; find fibonacci-store-test -maxdepth 8 -type f -print; exit 1; }
          cp "$ALGO" backtest/FibonacciHarmonicSniperUltimate-v0.4.0-store-rc1.algo
          ctrader-cli metadata backtest/FibonacciHarmonicSniperUltimate-v0.4.0-store-rc1.algo

      - name: Upload compiled RC1
        if: matrix.id == 'xau-m15-recent'
        uses: actions/upload-artifact@v4
        with:
          name: FibonacciHarmonicSniperUltimate-v0.4.0-store-rc1
          path: backtest/FibonacciHarmonicSniperUltimate-v0.4.0-store-rc1.algo
          if-no-files-found: error
          retention-days: 30

      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Backtest ${{ matrix.id }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          timeout --signal=TERM --kill-after=30s 25m ctrader-cli backtest \
            backtest/FibonacciHarmonicSniperUltimate-v0.4.0-store-rc1.algo \
            --ctid="$CTRADER_CTID" \
            --pwd-file=backtest/ctrader.pwd \
            --account="$CTRADER_ACCOUNT" \
            --symbol=${{ matrix.symbol }} \
            --period=${{ matrix.period }} \
            --start="${{ matrix.start }}" \
            --end="${{ matrix.end }}" \
            --balance=10000 \
            --spread=30 \
            --commission=35 \
            --commission-type=UsdPerMillionUsdVolume \
            --data-mode=m1 \
            --data-dir=backtest/cache \
            --report=backtest/reports/${{ matrix.id }}.html \
            --report-json=backtest/reports/${{ matrix.id }}.json \
            --exit-on-stop

      - name: Build Store-readiness metrics
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime
          import json, os
          report = Path('backtest/reports/${{ matrix.id }}.json')
          if not report.exists(): raise SystemExit('No JSON backtest report produced')
          d = json.loads(report.read_text())
          main = d.get('main', d)
          equity = d.get('equity', d)
          stats = d.get('tradeStatistics', d)
          history = d.get('history', {}).get('items', []) if isinstance(d.get('history', {}), dict) else []
          def scan(names, default=0.0):
              wanted={x.lower() for x in names}
              stack=[d]
              while stack:
                  x=stack.pop()
                  if isinstance(x,dict):
                      for k,v in x.items():
                          if str(k).lower() in wanted:
                              try:return float(v)
                              except: pass
                          if isinstance(v,(dict,list)): stack.append(v)
                  elif isinstance(x,list): stack.extend(x)
              return float(default)
          nets=[]
          for item in history:
              if isinstance(item,dict):
                  for key in ('netProfit','NetProfit'):
                      if key in item:
                          try:nets.append(float(item[key]))
                          except:pass
                          break
          total=int(scan(['TotalTrades'],len(nets)))
          wins=int(scan(['WinningTrades'],sum(x>0 for x in nets)))
          losses=int(scan(['LosingTrades'],sum(x<0 for x in nets)))
          net=scan(['NetProfit'],sum(nets))
          roi=scan(['ROI','Roi'],net/10000*100)
          max_dd=scan(['MaxEquityDrawdownPercentages','MaxEquityDrawdownPercent','maxDrawdownPercent'])
          pf=scan(['ProfitFactor'],-1)
          if pf < 0:
              gp=sum(x for x in nets if x>0); gl=-sum(x for x in nets if x<0); pf=gp/gl if gl>0 else (999.0 if gp>0 else 0.0)
          win_rate=100*wins/total if total else 0.0
          start=datetime.strptime('${{ matrix.start }}','%d/%m/%Y %H:%M'); end=datetime.strptime('${{ matrix.end }}','%d/%m/%Y %H:%M')
          days=max(1.0,(end-start).total_seconds()/86400)
          monthly=((1+roi/100)**(30.4375/days)-1)*100 if roi>-100 else None
          gate=bool(monthly is not None and monthly>=7 and pf>=1.30 and max_dd<=15 and total>=int('${{ matrix.min_trades }}') and net>0)
          result={'version':'v0.4.0-store-rc1','case':'${{ matrix.id }}','symbol':'${{ matrix.symbol }}','period':'${{ matrix.period }}','total_trades':total,'wins':wins,'losses':losses,'win_rate_percent':win_rate,'net_profit':net,'roi_percent':roi,'compounded_monthly_roi_percent':monthly,'profit_factor':pf,'max_equity_drawdown_percent':max_dd,'internal_promotion_gate':gate}
          text=json.dumps(result,indent=2)
          Path('backtest/reports/${{ matrix.id }}-summary.json').write_text(text)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('```json\n'+text+'\n```\n')
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fibonacci-Store-RC1-${{ matrix.id }}-Reports
          path: |
            backtest/reports/${{ matrix.id }}.html
            backtest/reports/${{ matrix.id }}.json
            backtest/reports/${{ matrix.id }}-summary.json
          if-no-files-found: warn
          retention-days: 30
