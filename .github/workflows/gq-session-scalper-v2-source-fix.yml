name: GQ Session Scalper v2 source compatibility fix

on:
  push:
    branches:
      - gq-session-scalper-v2-robust-20260908
    paths:
      - '.github/workflows/gq-session-scalper-v2-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix risk sizing and protection overload compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.cs')
          s = p.read_text()
          old = '            double volume = Symbol.VolumeForProportionalRisk(RiskType.Equity, riskPercent, stopLossPips, RoundingMode.Down);\n'
          new = ('            double minimumVolumeRisk = Symbol.AmountRisked(Symbol.VolumeInUnitsMin, stopLossPips);\n'
                 '            double volume = IsFinitePositive(minimumVolumeRisk)\n'
                 '                ? Symbol.VolumeInUnitsMin * (Account.Equity * riskPercent / 100.0) / minimumVolumeRisk\n'
                 '                : 0;\n')
          if old not in s:
              raise SystemExit('Risk sizing anchor not found')
          s = s.replace(old, new, 1)
          old = '            var result = ModifyPosition(position, candidateStop, position.TakeProfit);\n'
          new = '            var result = ModifyPosition(position, candidateStop, position.TakeProfit, ProtectionType.Absolute);\n'
          if old not in s:
              raise SystemExit('ModifyPosition anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -n 'minimumVolumeRisk\|ProtectionType.Absolute' GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.cs
          ! grep -n 'RiskType\|VolumeForProportionalRisk' GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.cs
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GQ-Session-Scalper-v2/src/GQ_Session_Scalper_v2.cs
          git commit -m 'Fix GQ v2 risk sizing API compatibility'
          git push origin HEAD:${GITHUB_REF_NAME}
