name: CDS FX Adaptive v2 - 1Y retry A

on:
  push:
    branches: [cds-fx-adaptive-v2-1y-screening]
    paths: ['.github/workflows/cdscalper-fx-adaptive-v2-1y-retry-a.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cds-fx-adaptive-v2-1y-retry-a
  cancel-in-progress: true

jobs:
  backtest:
    name: Retry A ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { symbol: AUDCAD, spread: 1.22 }
          - { symbol: AUDCHF, spread: 1.05 }
          - { symbol: AUDNZD, spread: 1.54 }
          - { symbol: CADJPY, spread: 1.22 }
          - { symbol: CHFJPY, spread: 1.40 }
          - { symbol: EURAUD, spread: 1.28 }
          - { symbol: EURGBP, spread: 0.98 }
          - { symbol: EURJPY, spread: 1.16 }
          - { symbol: EURNZD, spread: 2.64 }
    steps:
      - name: Download exact compiled V2 artifact
        uses: actions/download-artifact@v4
        with:
          name: cds-fx-adaptive-v2-algo
          path: bt
          github-token: ${{ github.token }}
          repository: rbhnm859/Ouroboros-Cloud-Build
          run-id: 34699409145

      - name: Prepare environment
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -f bt/CumulativeDeltaScalper_FX_Adaptive_v2.algo
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p bt/cache bt/reports
          printf '%s' "$CTRADER_PASSWORD" > bt/ctrader.pwd
          chmod 600 bt/ctrader.pwd
          docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Retry ${{ matrix.symbol }} with strict validation
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}"
          test -n "${CTRADER_ACCOUNT:-}"
          docker run --rm \
            -v "$PWD/bt:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/CumulativeDeltaScalper_FX_Adaptive_v2.algo \
            --environment-variables --exit-on-stop --broker=FxPro \
            --symbol=${{ matrix.symbol }} --period=m1 \
            --start='12/09/2025' --end='12/09/2026' --balance=100 \
            --spread=${{ matrix.spread }} --commission=35 \
            --data-mode=m1 --data-dir=/work/cache \
            --report="/work/reports/${{ matrix.symbol }}-1Y-M1-costed.html" \
            --report-json="/work/reports/${{ matrix.symbol }}-1Y-M1-costed.json" \
            2>&1 | tee "bt/reports/${{ matrix.symbol }}-1Y-M1-costed.log"
          test -s "bt/reports/${{ matrix.symbol }}-1Y-M1-costed.json"

      - name: Cleanup credential
        if: always()
        run: rm -f bt/ctrader.pwd

      - name: Upload retry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-v2-retryA-${{ matrix.symbol }}-1y-m1
          path: bt/reports/
          if-no-files-found: warn
          retention-days: 30
