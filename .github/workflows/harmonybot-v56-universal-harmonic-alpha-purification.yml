name: HarmonyBot V56 Universal Harmonic High-Frequency Alpha Purification

on:
  push:
    branches: [harmonybot/v56-universal-harmonic-alpha-purification-core-protected]
    paths:
      - 'HarmonyBot-V56/**'
      - '.github/workflows/harmonybot-v56-universal-harmonic-alpha-purification.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v56-universal-harmonic-alpha-purification
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static, geometry, detector, conversion, V56 contracts and build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V56/tools/static_audit.py HarmonyBot-V56/src/HarmonyBotV56.cs
          python3 HarmonyBot-V56/tools/geometry_contract_test.py HarmonyBot-V56/src/HarmonyBotV56.cs
          python3 HarmonyBot-V56/tools/detector_contract_test.py HarmonyBot-V56/src/HarmonyBotV56.cs
          python3 HarmonyBot-V56/tools/conversion_contract_test.py HarmonyBot-V56/src/HarmonyBotV56.cs
          python3 HarmonyBot-V56/tools/v56_architecture_contract_test.py
          dotnet restore HarmonyBot-V56/HarmonyBotV56.csproj
          dotnet build HarmonyBot-V56/HarmonyBotV56.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V56/dist HarmonyBot-V56/final
          A=$(find HarmonyBot-V56/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          cp "$A" HarmonyBot-V56/dist/HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo
          sha256sum HarmonyBot-V56/src/HarmonyBotV56.cs "$A" > HarmonyBot-V56/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V56/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v56-build
          path: |
            control/HarmonyBot-V56/dist
            control/HarmonyBot-V56/final
          retention-days: 30

  data-seed:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v56-build
          path: control/HarmonyBot-V56/shared
      - name: Resolve DEV2 dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT";;
            B) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT";;
            C) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT";;
          esac
      - name: Build immutable DEV2 market-data snapshot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V56/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V56/data-seed-${{ matrix.window }}"
          O="$GITHUB_WORKSPACE/control/HarmonyBot-V56/data-seed-out-${{ matrix.window }}"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V56/shared -type f -name 'HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo' | head -1)
          test -s "$A"; cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V56-DATA-SEED-${{ matrix.window }}" START_DATE="${{ steps.d.outputs.start }}" EVAL_DATE="${{ steps.d.outputs.eval }}" END_DATE="${{ steps.d.outputs.end }}" BALANCE=10000 \
            FAMNATIVE=false FAMOBS=true CANCONTRACT=true FAMCONF=true GRIDV2=true STOPV2=true JOINT=true CORRIDOR=false ANCHORFORENSICS=false \
            IDENT=false BOUNDED=false SKIPS=2 FQUOTA=4 PRJPRZ=false DTRUTH=true FAMQUAL=false FAMROUTE=false FAMCONFV2=false CTXBUS=false GRIDEXEC=true \
            LIBERATE=false COREKEEP=false GRIDV3=false STATEGRID=false EVIDENCE=false COREPROT=false GRIDV4=false BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V56/tools/run_backtest.sh"
          )
          test -d "$W/seal/data"
          (cd "$W/seal/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}' > "$O/data.snapshot.sha"
          tar -C "$W/seal" -czf "$O/data.tgz" data
      - uses: actions/upload-artifact@v4
        with:
          name: v56-data-${{ matrix.window }}
          path: control/HarmonyBot-V56/data-seed-out-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  dev2:
    needs: [build, data-seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        family: [V51_CHAMPION_CONTROL, V56_CORE_REBASE, V56_EVIDENCE_EXPANSION_L0, V56_EVIDENCE_EXPANSION_LEGACY_GRID, V56_EVIDENCE_EXPANSION_GRID_V4]
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v56-build
          path: control/HarmonyBot-V56/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V56/dist
          A=$(find control/HarmonyBot-V56/shared -type f -name 'HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V56/dist/
      - name: Resolve DEV2 dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=01/07/2024" >> "$GITHUB_OUTPUT"; echo "eval=2024-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2024" >> "$GITHUB_OUTPUT";;
            B) echo "start=02/01/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-01-09T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2025" >> "$GITHUB_OUTPUT";;
            C) echo "start=01/07/2025" >> "$GITHUB_OUTPUT"; echo "eval=2025-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2025" >> "$GITHUB_OUTPUT";;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: v56-data-${{ matrix.window }}
          path: control/HarmonyBot-V56/data-seed
      - name: Install immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          W="control/HarmonyBot-V56/window-${{ matrix.family }}-${{ matrix.window }}/seal"
          mkdir -p "$W"
          tar -xzf control/HarmonyBot-V56/data-seed/data.tgz -C "$W"
          cp control/HarmonyBot-V56/data-seed/data.snapshot.sha "$W/data.snapshot.sha"
          EXPECTED=$(tr -d '[:space:]' < "$W/data.snapshot.sha")
          ACTUAL=$((cd "$W/data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
      - name: Run fixed DEV2
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V56/tools/*.sh
          control/HarmonyBot-V56/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v56-dev2-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V56/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v56-dev2-*'
          path: control/HarmonyBot-V56/merged
          merge-multiple: true
      - name: Core parity, evidence admission, expansion and superiority gates
        id: gate
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V56/final
          python3 control/HarmonyBot-V56/tools/analyze_parallel_dev.py control/HarmonyBot-V56/merged control/HarmonyBot-V56/final
          echo "candidate=$(cat control/HarmonyBot-V56/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V56-HIGH-FREQUENCY-ALPHA-PURIFICATION-FRONTIER
          path: control/HarmonyBot-V56/final
          retention-days: 30

  validation:
    needs: [build, analyze]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        window: [VA, VB]
        spread: [1, 1.25, 1.5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v56-build
          path: control/HarmonyBot-V56/shared
      - name: Resolve validation dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            VA) echo "start=03/01/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2023" >> "$GITHUB_OUTPUT";;
            VB) echo "start=03/07/2023" >> "$GITHUB_OUTPUT"; echo "eval=2023-07-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=29/12/2023" >> "$GITHUB_OUTPUT";;
          esac
      - name: Run untouched validation
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          SPREAD: ${{ matrix.spread }}
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V56/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V56/validation-${{ matrix.window }}-${{ matrix.spread }}"
          O="$GITHUB_WORKSPACE/control/HarmonyBot-V56/validation-out-${{ matrix.window }}-${{ matrix.spread }}"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V56/shared -type f -name 'HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V56-$CANDIDATE-VAL-${{ matrix.window }}-S${{ matrix.spread }}" START_DATE="${{ steps.d.outputs.start }}" EVAL_DATE="${{ steps.d.outputs.eval }}" END_DATE="${{ steps.d.outputs.end }}" BALANCE=10000 SPREAD="${{ matrix.spread }}" \
            CANDIDATE="$CANDIDATE" "$GITHUB_WORKSPACE/control/HarmonyBot-V56/tools/run_candidate.sh"
          )
          python3 control/HarmonyBot-V56/tools/audit_report.py --report "$W/seal/reports/V56-$CANDIDATE-VAL-${{ matrix.window }}-S${{ matrix.spread }}.json" --log "$W/seal/logs/V56-$CANDIDATE-VAL-${{ matrix.window }}-S${{ matrix.spread }}.log" --out "$O/${{ matrix.window }}-${{ matrix.spread }}.json" --window "${{ matrix.window }}_S${{ matrix.spread }}" --family "$CANDIDATE" --years .5 --balance 10000
      - uses: actions/upload-artifact@v4
        with:
          name: v56-validation-${{ matrix.window }}-${{ matrix.spread }}
          path: control/HarmonyBot-V56/validation-out-${{ matrix.window }}-${{ matrix.spread }}
          retention-days: 30

  validation-gate:
    needs: [analyze, validation]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      valok: ${{ steps.v.outputs.valok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v56-validation-*'
          path: validation
          merge-multiple: true
      - name: Hard untouched validation gate
        id: v
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("validation")
          rows=[json.load(open(x)) for x in p.rglob("*.json")]
          def pf(vals):
            gp=sum(x for x in vals if x>0); gl=abs(sum(x for x in vals if x<0)); return gp/gl if gl else (999 if gp else 0)
          groups={}
          for r in rows:
            s=r["window"].split("_S")[-1]; groups.setdefault(s,[]).append(r)
          ok=len(rows)==6 and all(r["engineering_clean"] and r["actual_basket_risk_violations"]==0 and r["margin_risk_violations"]==0 and r["max_dd_pct"]<=10 for r in rows)
          for s,rs in groups.items():
            vals=[o["net"] for r in rs for o in r.get("basket_outcomes",[])]
            net=sum(vals); q=pf(vals)
            if s=="1": ok=ok and all(r["net"]>0 for r in rs) and net>0 and q>=1.5
            else: ok=ok and net>0 and q>1.0
          pathlib.Path("V56_VALIDATION_GATE.json").write_text(json.dumps({"pass":ok,"rows":rows},indent=2))
          pathlib.Path("val.out").write_text("true" if ok else "false")
          PY
          echo "valok=$(cat val.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v56-validation-gate
          path: V56_VALIDATION_GATE.json
          retention-days: 30

  capital:
    needs: [build, analyze, validation-gate]
    if: needs.validation-gate.outputs.valok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v56-build
          path: control/HarmonyBot-V56/shared
      - name: Capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V56/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V56/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V56/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V56/shared -type f -name 'HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V56-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=01/07/2024 EVAL_DATE=2024-07-08T00:00:00Z END_DATE=31/12/2025 BALANCE="$BALANCE" CANDIDATE="$CANDIDATE" \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V56/tools/run_candidate.sh"
          )
          python3 control/HarmonyBot-V56/tools/audit_report.py --report "$W/seal/reports/V56-$CANDIDATE-CAPITAL-$BALANCE.json" --log "$W/seal/logs/V56-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json" --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v56-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V56/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze, capital]
    if: needs.capital.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.c.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v56-capital-*'
          path: capital
          merge-multiple: true
      - name: Hard capital gate
        id: c
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital"); rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V56_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"actual_100_frequency":rows["100"]["frequency"]},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v56-capital-gate
          path: V56_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze, capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v56-build
          path: shared
      - name: Freeze source/algo/admission/grid hashes
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V56/src/HarmonyBotV56.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo"))
          charter=pathlib.Path("control/HarmonyBot-V56/MAJOR_VERSION_EXECUTION_CHARTER.md")
          pathlib.Path("V56_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V56","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"charter_sha256":hashlib.sha256(charter.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v56-freeze-manifest
          path: V56_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [build, analyze, freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v56-universal-harmonic-alpha-purification-core-protected
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v56-build
          path: control/HarmonyBot-V56/shared
      - name: Exactly one untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V56/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V56/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V56/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V56/shared -type f -name 'HarmonyBot_V56_Universal_Harmonic_Alpha_Purification_Core_Protected_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V56-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE" CANDIDATE="$CANDIDATE" \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V56/tools/run_candidate.sh"
          )
          python3 control/HarmonyBot-V56/tools/audit_report.py --report "$W/seal/reports/V56-$CANDIDATE-FRESH-$KIND.json" --log "$W/seal/logs/V56-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json" --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v56-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V56/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze, fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v56-fresh-*'
          path: fresh
          merge-multiple: true
      - name: Final commercial decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=good(a) and good(m)
          pathlib.Path("V56_FRESH_VALIDATION.json").write_text(json.dumps({"fresh_alpha":a,"fresh_100":m,"pass":ok},indent=2))
          pathlib.Path("V56_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V56","decision":"COMMERCIAL_FREEZE_CANDIDATE_PASS" if ok else "HOLD_WITH_EVIDENCE","fresh_used":True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v56-final-decision
          path: |
            V56_FRESH_VALIDATION.json
            V56_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
