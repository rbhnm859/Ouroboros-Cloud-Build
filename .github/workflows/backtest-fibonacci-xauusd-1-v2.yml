name: Fibonacci XAUUSD 1 - 3M Segmented Backtest v3

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-round1]
    paths:
      - 'FibonacciHarmonicSniperUltimate/versions/xauusd_1/**'
      - '.github/workflows/backtest-fibonacci-xauusd-1-v2.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-xauusd-1-3m-v3
  cancel-in-progress: true

jobs:
  build-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          mkdir -p "$ROOT/src" backtest/cache backtest/reports backtest/package
          base64 -d "$ROOT/source.gz.b64" | gzip -dc > "$ROOT/src/FibonacciXAUUSD1.cs"
          sha256sum "$ROOT/src/FibonacciXAUUSD1.cs" | tee backtest/package/source.sha256
          cp "$ROOT/src/FibonacciXAUUSD1.cs" backtest/package/FibonacciXAUUSD1.cs
          cp "$ROOT/README.md" backtest/package/README.md

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Build xauusd_1.algo
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_1'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD1.csproj && dotnet build $ROOT/FibonacciXAUUSD1.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          ALGO="$(find "$ROOT" -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" backtest/xauusd_1.algo
          cp "$ALGO" backtest/package/xauusd_1.algo
          sha256sum backtest/xauusd_1.algo | tee backtest/package/algo.sha256

      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || exit 1
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Run segmented 3M standard backtests
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          run_bt() {
            label="$1"; start="$2"; end="$3"; spread="$4"; commission="$5"
            docker run --rm -v "$PWD/backtest:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/xauusd_1.algo --environment-variables --exit-on-stop --symbol=XAUUSD --period=h1 --start="$start" --end="$end" --balance=10000 --data-mode=m1 --data-dir=/work/cache --commission="$commission" --spread="$spread" --RiskPercent=0.50 --MaxDailyLossPercent=3.0 --report="/work/reports/${label}.html" --report-json="/work/reports/${label}.json" 2>&1 | tee "backtest/reports/${label}.log"
            test -s "backtest/reports/${label}.json"
          }
          run_bt standard-m1 '09/06/2026' '09/07/2026' 17.42 35
          run_bt standard-m2 '09/07/2026' '09/08/2026' 17.42 35
          run_bt standard-m3 '09/08/2026' '09/09/2026' 17.42 35

      - name: Run segmented 3M harsh backtests
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          run_bt() {
            label="$1"; start="$2"; end="$3"
            docker run --rm -v "$PWD/backtest:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/xauusd_1.algo --environment-variables --exit-on-stop --symbol=XAUUSD --period=h1 --start="$start" --end="$end" --balance=10000 --data-mode=m1 --data-dir=/work/cache --commission=50 --spread=30 --RiskPercent=0.50 --MaxDailyLossPercent=3.0 --report="/work/reports/${label}.html" --report-json="/work/reports/${label}.json" 2>&1 | tee "backtest/reports/${label}.log"
            test -s "backtest/reports/${label}.json"
          }
          run_bt harsh-m1 '09/06/2026' '09/07/2026'
          run_bt harsh-m2 '09/07/2026' '09/08/2026'
          run_bt harsh-m3 '09/08/2026' '09/09/2026'

      - name: Aggregate reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          def pick(d,*keys):
              for k in keys:
                  if k in d:
                      v=d[k]
                      if isinstance(v,dict):
                          for kk in ('all','All','value','Value'):
                              if kk in v: v=v[kk]; break
                      try:return float(v)
                      except: pass
              return 0.0
          out=['# xauusd_1 segmented 3M backtest','', 'Period: 2026-06-09 to 2026-09-09 UTC | XAUUSD H1 | M1 data | $10,000 | 0.5% risk','']
          out += ['| Cost | Reports | Trades | Wins | Losses | Net $ | ROI % | Gross Profit | Gross Loss | Aggregate PF | Worst DD % |','|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for cost in ('standard','harsh'):
              reports=[]
              for i in range(1,4):
                  p=Path(f'backtest/reports/{cost}-m{i}.json')
                  if p.exists(): reports.append(json.loads(p.read_text()))
              trades=sum(int(pick(d,'totalTrades','TotalTrades')) for d in reports)
              wins=sum(int(pick(d,'winningTrades','WinningTrades')) for d in reports)
              losses=sum(int(pick(d,'losingTrades','LosingTrades')) for d in reports)
              net=sum(pick(d,'netProfit','NetProfit') for d in reports)
              gp=sum(pick(d,'grossProfit','GrossProfit') for d in reports)
              gl=sum(abs(pick(d,'grossLoss','GrossLoss')) for d in reports)
              pf=gp/gl if gl else (999 if gp else 0)
              dd=max([pick(d,'maxEquityDrawdownPercentages','MaxEquityDrawdownPercentages') for d in reports] or [0])
              out.append(f'| {cost} | {len(reports)}/3 | {trades} | {wins} | {losses} | {net:.2f} | {net/10000*100:.2f} | {gp:.2f} | {gl:.2f} | {pf:.2f} | {dd:.2f} |')
          text='\n'.join(out)+'\n'
          Path('backtest/reports/SUMMARY.md').write_text(text)
          print(text)
          PY

      - name: Package reports and build
        if: always()
        run: cp -r backtest/reports backtest/package/reports || true
      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd
      - name: Upload xauusd_1 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd_1-3m-segmented-v3
          path: backtest/package/
          if-no-files-found: error
          retention-days: 30
