name: Fibonacci BTC Round16 H1 Health Gate

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/backtest-fibonacci-btc-round16-h1-health.yml'
      - 'tools/create_fibonacci_btc_round16_h1_health.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round16-h1-health
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows=[
            ('pre6','08/09/2025 00:00','07/03/2026 23:59',65,0),
            ('pre6_harsh','08/09/2025 00:00','07/03/2026 23:59',100,1500),
            ('full6','08/03/2026 00:00','08/09/2026 00:00',65,0),
            ('full6_harsh','08/03/2026 00:00','08/09/2026 00:00',100,1500),
            ('oos','09/08/2026 00:00','08/09/2026 00:00',65,0),
            ('oos_harsh','09/08/2026 00:00','08/09/2026 00:00',100,1500),
          ]
          print('matrix='+json.dumps({'include':[{'period':n,'start':s,'end':e,'commission':c,'spread':sp} for n,s,e,c,sp in rows]},separators=(',',':')))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round4.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round5.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round6.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round7.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round8.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round9.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round10.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round15.py --repo-root "$PWD" --force
      - run: python3 tools/create_fibonacci_btc_round16_h1_health.py --repo-root "$PWD" --force
      - name: Enable trading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.15.0-btc-round16-h1-health/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build candidate
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.15.0-btc-round16-h1-health/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.15.0-btc-round16-h1-health/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p artifact
          ALGO="$(find Fibonacci-v0.15.0-btc-round16-h1-health -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" artifact/FibonacciHarmonicSniperUltimate-BTC-Round16-H1Health.algo
          cp Fibonacci-v0.15.0-btc-round16-h1-health/FibonacciHarmonicSniperUltimate.cs artifact/FibonacciHarmonicSniperUltimate-BTC-Round16-H1Health.cs
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round16-h1-health-build
          path: artifact
          retention-days: 30

  backtest:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round16-h1-health-build
          path: work
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p work/cache work/report
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Backtest ${{ matrix.period }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          COMMISSION: ${{ matrix.commission }}
          SPREAD: ${{ matrix.spread }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 30m docker run --rm \
            -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
            backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round16-H1Health.algo --environment-variables --exit-on-stop \
            --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
            --data-mode=m1 --data-dir=/work/cache --commission="$COMMISSION" --spread="$SPREAD" \
            --RiskPercent=1.0 --MaxOpenPositions=1 --MaxTradesPerDay=6 --MaxDailyLossPercent=5 \
            --EnabledPatterns='Reciprocal ABCD' --PivotLeft=2 --PivotRight=2 --RatioTolerancePercent=6 --MinPatternScore=84 \
            --MaxPatternAgeBars=16 --MaxEntryDistanceAtr=1.80 --ConfirmationMoveAtr=0.05 --UseCandleConfirmation=true --CooldownBars=2 \
            --FallbackRiskReward=1.80 --MinimumRiskReward=1.50 --StopAnchorMode=LegacyD --TargetRiskRewardPolicy=LegacyFallback \
            --Round5Mode=ObserveOnly --MtfMode=Off --Round6RequireM30SellConfirm=false --Round7VetoM30SellAlignment=false \
            --Round8LogExcursions=false --Round9ShadowTpContinuation=false --Round10LogFunnel=false --Round15EnableM30Engine=true --Round16H1HealthGate=true --DebugLogging=false \
            --report=/work/report/report.html --report-json=/work/report/report.json 2>&1 | tee work/report/report.log
      - name: Clean credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-r16-health-${{ matrix.period }}
          path: work/report
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: btc-r16-health-*
          path: results
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round16-h1-health-results
          path: results
          retention-days: 30
