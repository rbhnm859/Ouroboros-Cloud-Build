name: HarmonyBot Commercial Convergence A-B-C One-Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-commercial-convergence-abc.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: fccde79d22c0389ba64d9bb26a2e54379d81c91e
  V294_SOURCE_COMMIT: 294c73aaa9f1a133899134982ba4cd4fb54de527
  V295_PATCH_COMMIT: 027820acec9cda2b3a82337b934ba6b8b9ae1298
  CC_PATCH_COMMIT: 63213f64eb019bbaddaaaa2fc705e43062503126

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ env.BASE_COMMIT }} }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Reconstruct frozen V29.5 and apply one-pass RC
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          curl -fsSL "https://raw.githubusercontent.com/rbhnm859/Ouroboros-Cloud-Build/$V294_SOURCE_COMMIT/tmp/harmonybot-v26-build/fix_v294_edge_context_gate.py" -o /tmp/v294.py
          python3 /tmp/v294.py
          curl -fsSL "https://raw.githubusercontent.com/rbhnm859/Ouroboros-Cloud-Build/$V295_PATCH_COMMIT/tmp/harmonybot-v26-build/fix_v295_thesis_validity_minimum.py" -o /tmp/v295.py
          python3 /tmp/v295.py
          curl -fsSL "https://raw.githubusercontent.com/rbhnm859/Ouroboros-Cloud-Build/$CC_PATCH_COMMIT/tmp/harmonybot-v26-build/fix_harmonybot_commercial_convergence_rc.py" -o /tmp/cc.py
          python3 /tmp/cc.py
          grep -q 'Commercial-Convergence-RC' cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs
          grep -q '\[CC-ADMISSION\]' cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs
          grep -q 'V29.3 GRID-RISK-CAP-HOTFIX' cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs
      - name: Compile RC
        run: |
          set -euo pipefail
          mkdir -p seal/{algo,build}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBot_Commercial_Convergence_RC</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore --nologo | tee seal/build.log
          A=$(find seal/build/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          cp "$A" seal/algo/HarmonyBot_Commercial_Convergence_RC.algo
          sha256sum seal/build/HarmonyBotPro.cs seal/algo/HarmonyBot_Commercial_Convergence_RC.algo > seal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: CC-RC-BUILD, path: seal, retention-days: 30 }

  development:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        candidate: [1,2,3]
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CANDIDATE: ${{ matrix.candidate }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: CC-RC-BUILD, path: . }
      - name: Resolve FxPro demo account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Run preregistered candidate/window
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          OUT="CC-C$CANDIDATE-$WINDOW_ID"; C="cc-$GITHUB_RUN_ID-$CANDIDATE-$WINDOW_ID"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/algo/HarmonyBot_Commercial_Convergence_RC.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=10000 --data-mode=m1 --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxSlippagePips=30 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=false --SessionStart=8 --SessionEnd=22 --DstAwareInstitutionalSession=false --MinAtrPrice=0.5 \
            --V294AllowBuy=false --V294AllowSell=true --EnableFibGrid=true --EnableAltBat=true --EnableFiveZero=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 --GridCooldownMinutes=240 --MinPrzConfluence=0.55 --MinGeometryQuality=0.52 \
            --GridBreakevenTriggerR=0.15 --GridTrailTriggerR=0.35 --GridScaleOutR=0.50 \
            --V295ThesisGuard=true --V295NoMfeKillR=0.85 --V295MinFavorableProofR=0.15 --V295MinInvalidationAgeMinutes=2 \
            --CCCandidate="$CANDIDATE" --CCHighAtr=1.30 --CCRelativeAtrRatio=1.50 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true \
            --EvaluationStartUtcIso="$EVAL_DATE" --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 \
            --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 --V291SmallAccountTacticalExecution=false --V292FastSmallAccountExecution=false \
            --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false --report="/work/reports/$OUT.html" --report-json="/work/reports/$OUT.json" > "seal/logs/$OUT.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<7000;i+=5)); do
            if test -s "seal/reports/$OUT.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/$OUT.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: Basket-level audit
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          c=int(os.environ['CANDIDATE']); w=os.environ['WINDOW_ID']; name=f'CC-C{c}-{w}'
          d=json.load(open(f'seal/reports/{name}.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{})
          t=pathlib.Path(f'seal/logs/{name}.log').read_text(errors='ignore')
          g={}
          for x in h:
              k=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              z=g.setdefault(k,{'label':k[0],'net':0.0}); z['net']+=float(x.get('net',0) or 0)
          v=[z['net'] for z in g.values() if z['label']=='HarmonyBotPro']; W=[x for x in v if x>0]; L=[x for x in v if x<0]
          gp=sum(W); gl=abs(sum(L)); net=sum(v); pf=gp/gl if gl else (999 if gp else 0)
          aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          sm=re.findall(r'\[CC-SUMMARY\].*?structuralBlocked=(\d+).*?regimeBlocked=(\d+).*?hour15Blocked=(\d+)',t)
          blocks=list(map(int,sm[-1])) if sm else [0,0,0]
          out={'candidate':c,'window':w,'baskets':len(v),'wins':len(W),'losses':len(L),'pf':pf,'net':net,'expectancy':net/len(v) if v else 0,
               'win_rate_pct':100*len(W)/len(v) if v else 0,'realized_rr':aw/abs(al) if aw>0 and al<0 else None,
               'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'execution_errors':errs,
               'blocked_structural':blocks[0],'blocked_regime':blocks[1],'blocked_hour15':blocks[2]}
          pathlib.Path(f'seal/audit/{name}.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; docker run --rm -v "$PWD/seal:/work" alpine:3.22 sh -c 'rm -rf /work/data' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CC-C${{ matrix.candidate }}-${{ matrix.window.id }}
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'CC-C*-DEV-*', path: all, merge-multiple: true }
      - name: Select or stop
        run: |
          python3 - <<'PY'
          import glob,json,pathlib
          rows=[json.load(open(p)) for p in glob.glob('all/audit/CC-C*-DEV-*.json')]
          out=[]
          for c in (1,2,3):
              rs=sorted([x for x in rows if x['candidate']==c],key=lambda x:x['window'])
              tb=sum(x['baskets'] for x in rs); net=sum(x['net'] for x in rs)
              gp=sum(max(x['net'],0) for x in []) # basket PF is aggregated below from window PF unavailable gross; gate uses per-window PF + net/expectancy
              dd=max([x['max_dd_pct'] for x in rs] or [999]); errs=sum(x['execution_errors'] for x in rs); freq=tb/1.5
              passed=len(rs)==3 and all(x['baskets']>0 and x['pf']>1 and x['expectancy']>0 for x in rs) and net>0 and dd<=10 and errs==0 and freq>=50
              out.append({'candidate':c,'rows':rs,'total_baskets':tb,'trades_per_year':freq,'aggregate_net':net,'aggregate_expectancy':net/tb if tb else 0,
                          'worst_pf':min([x['pf'] for x in rs] or [0]),'max_dd_pct':dd,'execution_errors':errs,'development_gate':'PASS' if passed else 'FAIL'})
          winners=[x for x in out if x['development_gate']=='PASS']
          selected=max(winners,key=lambda x:(x['worst_pf'],x['aggregate_expectancy'],x['trades_per_year']))['candidate'] if winners else None
          result={'baseline_run':35322359842,'candidates':out,'selected_candidate':selected,
                  'next_gate':'VALIDATION_AUTHORIZED' if selected else 'STOP_STRATEGY_ARCHITECTURE_LIMITATION',
                  'final_holdout':'UNTOUCHED'}
          pathlib.Path('COMMERCIAL-CONVERGENCE-DEVELOPMENT-GATE.json').write_text(json.dumps(result,indent=2))
          if not winners:
              pathlib.Path('STRATEGY_ARCHITECTURE_LIMITATION.md').write_text('# STRATEGY ARCHITECTURE LIMITATION\n\nNone of the three preregistered candidates passed 3/3 PF>1, 3/3 expectancy>0, DD<=10%, errors=0 and >=50 baskets/year. No further sequential strategy version is authorized.\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CC-DEVELOPMENT-GATE
          path: |
            COMMERCIAL-CONVERGENCE-DEVELOPMENT-GATE.json
            STRATEGY_ARCHITECTURE_LIMITATION.md
          if-no-files-found: ignore
          retention-days: 30
