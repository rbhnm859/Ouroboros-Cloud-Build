name: HarmonyBot V29.3 D7-A Conservative Execution Preset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v292-grid-lifecycle-hotfix-d7-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d7-a-conservative-execution-preset:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot-v293-grid-risk-cap-hotfix-rc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate and compile exact V29.3 candidate
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          mkdir -p seal/{build,algo,reports,logs,data,audit}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3-Grid-Risk-Cap-Hotfix-RC' seal/build/HarmonyBotPro.cs
          grep -Fq '[V293-GRID-RISK-CAP]' seal/build/HarmonyBotPro.cs
          grep -Fq 'CapGridStopToRiskBudget && p.StopLoss.HasValue' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v293_grid_risk_cap_hotfix</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit)
          test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v293_grid_risk_cap_hotfix.algo
          sha256sum seal/algo/*.algo > seal/algo.sha256

      - name: Resolve FxPro demo account and run D7-A tick preset
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd
          chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          ACCT=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          )
          C="v293-d7-a-conservative-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v293_grid_risk_cap_hotfix.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$ACCT" \
            --symbol=XAUUSD --period=m1 --start=02/09/2026 --end=16/09/2026 --balance=100 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-09-09T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 \
            --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66 \
            --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            --report=/work/reports/D7-A-CONSERVATIVE-TICKS.html --report-json=/work/reports/D7-A-CONSERVATIVE-TICKS.json > seal/logs/D7-A-CONSERVATIVE-TICKS.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<3600;i+=3)); do
            if test -s seal/reports/D7-A-CONSERVATIVE-TICKS.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/D7-A-CONSERVATIVE-TICKS.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 3
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: Audit D7-A conservative preset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib
          rp=pathlib.Path('seal/reports/D7-A-CONSERVATIVE-TICKS.json')
          lp=pathlib.Path('seal/logs/D7-A-CONSERVATIVE-TICKS.log')
          d=json.load(open(rp,encoding='utf-8-sig')); m=d.get('main',{}); s=d.get('tradeStatistics',{}); h=d.get('history',{}).get('items',[])
          t=lp.read_text(errors='ignore')
          def sv(n,default=None):
              x=s.get(n,{}); return x.get('all',default) if isinstance(x,dict) else default
          trades=int(sv('totalTrades',len(h)) or 0); wins=int(sv('winningTrades',0) or 0)
          losses=[x for x in h if float(x.get('net',0) or 0)<0]
          maxloss=max([abs(float(x.get('net',0) or 0)) for x in losses],default=0.0)
          errs=[x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)]
          baskets=len(re.findall(r'\[GRID\]\s+Basket\s+#.*created',t,re.I)); caps=len(re.findall(r'\[V293-GRID-RISK-CAP\]',t))
          out={
            'preset':{'RiskPercent':1.40,'MaxSlippagePips':70,'SmallAccountMinSLPips':25,'balance':100},
            'starting_capital':m.get('startingCapital'),'ending_equity':m.get('endingEquity'),'net_profit':m.get('netProfit'),
            'trades':trades,'wins':wins,'win_rate_pct':wins/trades*100 if trades else 0,'profit_factor':sv('profitFactor'),
            'max_single_trade_loss_usd':maxloss,'max_single_trade_loss_pct_initial':maxloss,
            'execution_error_count':len(errs),'grid_baskets_created':baskets,'v293_grid_risk_cap_events':caps,'history':h}
          hard=[]
          if trades < 1: hard.append('no_trades')
          if errs: hard.append('execution_errors')
          if trades and baskets < 1: hard.append('grid_basket_missing')
          if trades and caps < 1: hard.append('risk_cap_not_exercised')
          if maxloss > 1.40 + 1e-9: hard.append('realized_risk_above_configured_1.40pct')
          out['functional_gate_pass']=not hard; out['hard_fail_reasons']=hard
          pathlib.Path('seal/audit/D7-A-CONSERVATIVE-GATE.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          print('===== D7-A EXECUTION TELEMETRY =====')
          for line in t.splitlines():
              if re.search(r'V292-FAST-READY|V293-GRID-RISK-CAP|V284-GRID-CAP|RISK-|VOLUME|\[GRID\].*(created|STOP|TP)|Executing Market Order|InvalidRequest|Insufficient Margin',line,re.I): print(line)
          if hard: raise SystemExit(','.join(hard))
          PY

      - name: Cleanup credentials
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V293-D7-A-CONSERVATIVE-EXECUTION-PRESET
          path: seal
          retention-days: 30
