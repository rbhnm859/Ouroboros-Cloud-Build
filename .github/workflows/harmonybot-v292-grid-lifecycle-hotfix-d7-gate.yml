name: HarmonyBot V29.2 Grid Lifecycle Hotfix D7 Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v292-grid-lifecycle-hotfix-d7-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d7-grid-hotfix-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot-v292-grid-lifecycle-hotfix-rc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate exact V29.2 hotfix candidate
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py \
            tmp/harmonybot-v26-build/fix_v283_execution_quality.py \
            tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py \
            tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py \
            tmp/harmonybot-v26-build/fix_v291_small_account_execution.py \
            tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py \
            tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          mkdir -p seal/{build,algo,reports,logs,data,audit}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          for x in \
            'V29.2-Grid-Lifecycle-Hotfix-RC' \
            'V29.2 GRID-LIFECYCLE-HOTFIX' \
            'CreateBasketFor(tr.Position)' \
            'EnableFibGrid' \
            'GridProfitFib' \
            'GridStopFib' \
            'GeometryQualityScore' \
            'return SmallAccountMode ? Math.Min(MinStopLossPips, SmallAccountMinSLPips)'; do
              grep -Fq "$x" seal/build/HarmonyBotPro.cs
          done

      - name: Compile hotfix zero-error
        run: |
          set -euo pipefail
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v292_grid_lifecycle_hotfix</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit)
          test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v292_grid_lifecycle_hotfix.algo
          sha256sum seal/algo/*.algo > seal/algo.sha256

      - name: Resolve FxPro demo account
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd
          chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500:
              raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          )
          echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"

      - name: D7-A tick $100 Small Capital
        id: track_a
        continue-on-error: true
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          set -euo pipefail
          C="v292-grid-d7-a-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v292_grid_lifecycle_hotfix.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=02/09/2026 --end=16/09/2026 --balance=100 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.0 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-09-09T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 \
            --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66 \
            --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            --report=/work/reports/D7-A-TICKS.html --report-json=/work/reports/D7-A-TICKS.json > seal/logs/D7-A-TICKS.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<3600;i+=3)); do
            if test -s seal/reports/D7-A-TICKS.json && python3 - <<'PY'
          import json
          d=json.load(open('seal/reports/D7-A-TICKS.json',encoding='utf-8-sig')); m=d.get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 3
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: D7-B tick Full Bot Small Capital OFF
        id: track_b
        if: always()
        continue-on-error: true
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          set -euo pipefail
          C="v292-grid-d7-b-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v292_grid_lifecycle_hotfix.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=02/09/2026 --end=16/09/2026 --balance=10000 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.0 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=false --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-09-09T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=false --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=false --V292EnableCapitalCapStop=false --V292EnableEarlyTrigger=false \
            --report=/work/reports/D7-B-TICKS.html --report-json=/work/reports/D7-B-TICKS.json > seal/logs/D7-B-TICKS.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<3600;i+=3)); do
            if test -s seal/reports/D7-B-TICKS.json && python3 - <<'PY'
          import json
          d=json.load(open('seal/reports/D7-B-TICKS.json',encoding='utf-8-sig')); m=d.get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 3
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true
          docker rm -f "$C" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test "$DONE" = 1

      - name: Emit D7 stop and Grid execution telemetry
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,re
          rx=re.compile(r'V292-FAST-READY|V291-TACTICAL|\[GRID\]|\[ORDER|\[ENTRY|STOP|SL=|stopPips=|maxStop=|risk|margin|InvalidRequest|Insufficient Margin',re.I)
          for track in ('A','B'):
              p=pathlib.Path(f'seal/logs/D7-{track}-TICKS.log')
              print(f'===== D7-{track} EXECUTION TELEMETRY =====')
              if not p.exists():
                  print('LOG_MISSING')
                  continue
              lines=[line for line in p.read_text(errors='ignore').splitlines() if rx.search(line)]
              for line in lines[-500:]: print(line)
              print(f'===== D7-{track} TELEMETRY_LINES={len(lines)} =====')
          PY

      - name: Build D7 Grid lifecycle evidence and gate
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          out={}
          hard_fail=[]
          for track,balance in [('A',100.0),('B',10000.0)]:
              rp=pathlib.Path(f'seal/reports/D7-{track}-TICKS.json')
              lp=pathlib.Path(f'seal/logs/D7-{track}-TICKS.log')
              t=lp.read_text(errors='ignore') if lp.exists() else ''
              if not rp.exists():
                  out[track]={'report_complete':False}; hard_fail.append(f'{track}:missing_report'); continue
              d=json.load(open(rp,encoding='utf-8-sig')); m=d.get('main',{}); s=d.get('tradeStatistics',{}); h=d.get('history',{}).get('items',[])
              def sv(name,default=None):
                  x=s.get(name,{}); return x.get('all',default) if isinstance(x,dict) else default
              trades=int(sv('totalTrades',len(h)) or 0)
              wins=int(sv('winningTrades',0) or 0)
              errors=[]
              for line in t.splitlines():
                  if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',line,re.I): errors.append(line)
                  elif re.search(r'\bFAILED\b',line) and not re.search(r'pendingOrderFailed=0',line): errors.append(line)
              basket_created=len(re.findall(r'\[GRID\]\s+Basket\s+#.*created',t,re.I))
              grid_target=len(re.findall(r'\[GRID\].*(?:TARGET|target)',t))
              grid_stop=len(re.findall(r'\[GRID\].*(?:STOP|stop)',t))
              grid_scale=len(re.findall(r'\[GRID\].*(?:SCALE|scale)',t))
              grid_add=len(re.findall(r'\[GRID\].*(?:ADD|add)',t))
              opposite_overlap=0
              hs=sorted(h,key=lambda x:int(x.get('entryTime',0) or 0))
              for i,x in enumerate(hs):
                  e=int(x.get('entryTime',0) or 0); c=int(x.get('closeTime',0) or 0); side=str(x.get('tradeType','')).lower()
                  for y in hs[i+1:]:
                      ye=int(y.get('entryTime',0) or 0)
                      if c and ye>=c: break
                      yside=str(y.get('tradeType','')).lower()
                      if ye>e and side and yside and side!=yside: opposite_overlap+=1
              losses=[x for x in h if float(x.get('net',0) or 0)<0]
              max_loss_pct=max([abs(float(x.get('net',0) or 0))/balance*100 for x in losses],default=0.0)
              v29=(re.findall(r'\[V29-SUMMARY\].*',t) or [None])[-1]
              grid_orders=0
              if v29:
                  mm=re.search(r'gridOrders=(\d+)',v29); grid_orders=int(mm.group(1)) if mm else 0
              out[track]={
                  'report_complete':True,'starting_capital':m.get('startingCapital'),'ending_equity':m.get('endingEquity'),'net_profit':m.get('netProfit'),
                  'trades':trades,'wins':wins,'win_rate_pct':wins/trades*100 if trades else 0.0,'profit_factor':sv('profitFactor'),
                  'max_single_trade_loss_pct_initial':max_loss_pct,'execution_error_count':len(errors),'execution_errors':errors[:30],
                  'grid_orders':grid_orders,'grid_baskets_created':basket_created,'grid_target_events':grid_target,'grid_stop_events':grid_stop,
                  'grid_scale_events':grid_scale,'grid_add_events':grid_add,'opposite_direction_overlap_count':opposite_overlap,
                  'v29':v29,'v291':(re.findall(r'\[V291-SUMMARY\].*',t) or [None])[-1],
                  'v292':(re.findall(r'\[V292-SUMMARY\].*',t) or [None])[-1],
                  'history':h
              }
              if errors: hard_fail.append(f'{track}:execution_errors')
              if opposite_overlap: hard_fail.append(f'{track}:opposite_overlap')
              if trades>0 and basket_created==0: hard_fail.append(f'{track}:grid_basket_missing')
              if grid_orders>0 and basket_created==0: hard_fail.append(f'{track}:grid_order_without_basket')
          out['functional_gate_pass']=not hard_fail
          out['hard_fail_reasons']=hard_fail
          pathlib.Path('seal/audit/D7-GRID-LIFECYCLE-GATE.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if hard_fail: raise SystemExit('D7 Grid functional gate failed: '+','.join(hard_fail))
          PY

      - name: Cleanup credentials
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V292-GRID-LIFECYCLE-HOTFIX-D7-GATE
          path: seal
          retention-days: 30
