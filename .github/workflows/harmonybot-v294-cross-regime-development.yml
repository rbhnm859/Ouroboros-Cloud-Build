name: HarmonyBot V29.4 Cross-Regime Development Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v294-cross-regime-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccde79d22c0389ba64d9bb26a2e54379d81c91e
          path: base
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build V29.4 from exact V29.3 baseline
        run: |
          set -euo pipefail
          cd base
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          python3 ../control/tmp/harmonybot-v26-build/fix_v294_cross_regime_adaptive_atr.py
          mkdir -p seal/{build,algo}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.4-Cross-Regime-ATR-Rolling-Dev' seal/build/HarmonyBotPro.cs
          grep -Fq 'V294RelativeAtrRegime' seal/build/HarmonyBotPro.cs
          grep -Fq 'V294RollingTrueRangeBaseline' seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3 GRID-RISK-CAP-HOTFIX' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v294_cross_regime_dev</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit); test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v294_cross_regime_dev.algo
          sha256sum seal/build/HarmonyBotPro.cs seal/algo/*.algo > seal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: V294-CROSS-REGIME-BUILD
          path: base/seal
          retention-days: 30

  engineering_regression:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-CROSS-REGIME-BUILD
          path: seal
      - name: Resolve FxPro demo account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          ACCT=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$ACCT" >> "$GITHUB_ENV"
      - name: D7 $100 compatibility regression
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-reg-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v294_cross_regime_dev.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=02/09/2026 --end=16/09/2026 --balance=100 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2026-09-09T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 \
            --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66 \
            --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            --V294RelativeAtrRegime=false \
            --report=/work/reports/D7.json.html --report-json=/work/reports/D7.json > seal/logs/D7.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<3600;i+=3)); do
            if test -s seal/reports/D7.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/D7.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 3
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: Regression audit
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          d=json.load(open('seal/reports/D7.json',encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=pathlib.Path('seal/logs/D7.log').read_text(errors='ignore')
          losses=[abs(float(x.get('net',0) or 0)) for x in h if float(x.get('net',0) or 0)<0]
          errs=[x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)]
          out={'source':'V29.4-Cross-Regime-ATR-Rolling-Dev','feature_mode':'compatibility_off','trades':len(h),'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'max_single_loss_usd':max(losses,default=0),'execution_error_count':len(errs),'risk_cap_events':len(re.findall(r'V293-GRID-RISK-CAP',t))}
          hard=[]
          if len(h)<1: hard.append('no_trades')
          if out['max_dd_pct']>10: hard.append('dd_gt_10')
          if out['max_single_loss_usd']>1.40+1e-9: hard.append('single_loss_gt_1.40')
          if errs: hard.append('execution_integrity')
          out['pass']=not hard; out['hard_fail_reasons']=hard
          pathlib.Path('seal/audit/V294-ENGINEERING-REGRESSION.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if hard: raise SystemExit(','.join(hard))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-ENGINEERING-REGRESSION
          path: seal
          retention-days: 30

  development:
    needs: engineering_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate: [REL_ATR_085, REL_ATR_100, REL_ATR_115]
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CANDIDATE: ${{ matrix.candidate }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-CROSS-REGIME-BUILD
          path: seal
      - name: Resolve FxPro account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Candidate ratio
        run: |
          case "$CANDIDATE" in
            REL_ATR_085) R=0.85;;
            REL_ATR_100) R=1.00;;
            REL_ATR_115) R=1.15;;
            *) exit 2;;
          esac
          echo "RATIO=$R" >> "$GITHUB_ENV"
      - name: $100 Development backtest
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-${CANDIDATE,,}-${WINDOW_ID,,}-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v294_cross_regime_dev.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=100 --data-mode=m1 --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL_DATE" \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 --V29PendingMinCompositeQuality=0.58 \
            --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true \
            --V292EarlyTriggerMinQuality=0.66 --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            --V294RelativeAtrRegime=true --V294AtrBaselineBars=240 --V294MinAtrBaselineRatio="$RATIO" --V294AbsoluteAtrFloor=0.10 \
            --report="/work/reports/${CANDIDATE}-${WINDOW_ID}.html" --report-json="/work/reports/${CANDIDATE}-${WINDOW_ID}.json" > "seal/logs/${CANDIDATE}-${WINDOW_ID}.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<7200;i+=4)); do
            if test -s "seal/reports/${CANDIDATE}-${WINDOW_ID}.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/${CANDIDATE}-${WINDOW_ID}.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 4
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          if test "$DONE" != 1; then echo '{"status":"BACKTEST_FAILED"}' > "seal/audit/${CANDIDATE}-${WINDOW_ID}.json"; exit 0; fi
      - name: Basket audit
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,statistics
          c=os.environ['CANDIDATE']; w=os.environ['WINDOW_ID']; rp=pathlib.Path(f'seal/reports/{c}-{w}.json'); lp=pathlib.Path(f'seal/logs/{c}-{w}.log')
          if not rp.exists(): raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore')
          groups={}
          for x in h:
              key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'closeTime':0,'net':0.0})
              g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0))
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime'])
          children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
          pats=re.findall(r'\[TRADE\]\s+(\S+)\s+',t)
          baskets=[{'pattern':pats[i] if i<len(pats) else 'Unknown','direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'net':g['net'],'grid_children':0} for i,g in enumerate(mains)]
          for ch in children:
              cand=[b for b in baskets if b['direction']==ch['direction'] and b['entryTime']<=ch['entryTime']<=b['closeTime']]
              if not cand: cand=[b for b in baskets if b['direction']==ch['direction'] and 0<=ch['entryTime']-b['entryTime']<=4*60*60*1000]
              if cand:
                  b=max(cand,key=lambda z:z['entryTime']); b['net']+=ch['net']; b['grid_children']+=1; b['closeTime']=max(b['closeTime'],ch['closeTime'])
          vals=[b['net'] for b in baskets]; W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gw=sum(W); gl=abs(sum(L))
          pf=gw/gl if gl>0 else (999 if gw>0 else 0); net=sum(vals); exp=net/len(vals) if vals else 0; wr=100*len(W)/len(vals) if vals else 0
          aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0; rr=aw/abs(al) if aw>0 and al<0 else None
          def li(n):
              m=re.findall(rf'{n}=(\d+)',t); return int(m[-1]) if m else 0
          bypat={}
          for b in baskets: bypat.setdefault(b['pattern'],[]).append(b['net'])
          def stats(v):
              a=[x for x in v if x>0]; z=[x for x in v if x<0]; g=sum(a); l=abs(sum(z)); p=g/l if l>0 else (999 if g>0 else 0)
              return {'count':len(v),'net':sum(v),'pf':p,'expectancy':sum(v)/len(v) if v else 0}
          out={'status':'OK','candidate':c,'window':w,'initial_capital':100,'baskets':len(vals),'pf':pf,'net':net,'expectancy':exp,'win_rate_pct':wr,'realized_rr':rr,
               'max_dd_pct':float(eq.get('maxEquityDrawdownPercent',0) or 0),'pattern':{k:stats(v) for k,v in bypat.items()},
               'funnel':{'signals':li('signals'),'orders':li('orders'),'atr_blocked':li('atrBlocked'),'mtf_blocked':li('mtfBlocked'),'geometry_blocked':li('geometryBlocked'),'capital_hard_reject':li('capitalHardReject'),'volume_blocked':li('volumeBlocked'),'risk_blocked':li('riskBlocked')},
               'execution_errors':len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])}
          pathlib.Path(f'seal/audit/{c}-{w}.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-DEV-${{ matrix.candidate }}-${{ matrix.window.id }}
          path: seal/audit
          retention-days: 30

  dev_gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      winner: ${{ steps.gate.outputs.winner }}
      has_winner: ${{ steps.gate.outputs.has_winner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: V294-DEV-*
          path: all
          merge-multiple: true
      - id: gate
        run: |
          python3 - <<'PY'
          import glob,json,statistics,pathlib,os
          cs=['REL_ATR_085','REL_ATR_100','REL_ATR_115']; ws=['DEV-A','DEV-B','DEV-C']; M={}; passed=[]
          for c in cs:
              rows=[]
              for w in ws:
                  p=glob.glob(f'all/**/{c}-{w}.json',recursive=True)
                  if p:
                      x=json.load(open(p[0]))
                      if x.get('status')=='OK': rows.append(x)
              rec={'candidate':c,'windows':{x['window']:x for x in rows},'dev_gate_pass':False}
              if len(rows)==3:
                  active=sum(x['baskets']>0 for x in rows); total=sum(x['baskets'] for x in rows); net=sum(x['net'] for x in rows); pfs=[x['pf'] for x in rows if x['baskets']>0]; dds=[x['max_dd_pct'] for x in rows]
                  rec.update({'active_windows':active,'total_baskets':total,'worst_pf':min(pfs) if pfs else 0,'median_pf':statistics.median(pfs) if pfs else 0,'total_net':net,'total_expectancy':net/total if total else 0,'max_window_dd':max(dds),'execution_errors':sum(x['execution_errors'] for x in rows)})
                  rec['dev_gate_pass']=bool(active==3 and total>=18 and max(dds)<=10 and min(pfs)>1 and net>0 and rec['total_expectancy']>0 and rec['execution_errors']==0)
              if rec['dev_gate_pass']: passed.append(c)
              M[c]=rec
          passed.sort(key=lambda c:(M[c]['worst_pf'],M[c]['median_pf'],M[c]['total_net'],M[c]['total_baskets']),reverse=True)
          winner=passed[0] if passed else ''
          out={'winner':winner,'passed':passed,'matrix':M,'gate':'3 active windows; >=18 baskets; every PF>1; every DD<=10; total Net/Expectancy>0; zero execution errors'}
          pathlib.Path('V294-DEVELOPMENT-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'winner={winner}\n'); f.write('has_winner='+('true' if winner else 'false')+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V294-DEVELOPMENT-GATE
          path: V294-DEVELOPMENT-GATE.json
          retention-days: 30

  validation:
    needs: dev_gate
    if: needs.dev_gate.outputs.has_winner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CANDIDATE: ${{ needs.dev_gate.outputs.winner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-CROSS-REGIME-BUILD
          path: seal
      - name: Resolve FxPro account and ratio
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip(); m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
          case "$CANDIDATE" in REL_ATR_085) R=0.85;; REL_ATR_100) R=1.00;; REL_ATR_115) R=1.15;; *) exit 2;; esac
          echo "RATIO=$R" >> "$GITHUB_ENV"
      - name: VAL-2 $100 server ticks
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="v294-val2-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v294_cross_regime_dev.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=01/07/2020 --end=31/12/2020 --balance=100 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2020-07-08T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 --V29PendingMinCompositeQuality=0.58 \
            --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true \
            --V292EarlyTriggerMinQuality=0.66 --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            --V294RelativeAtrRegime=true --V294AtrBaselineBars=240 --V294MinAtrBaselineRatio="$RATIO" --V294AbsoluteAtrFloor=0.10 \
            --report=/work/reports/VAL2.html --report-json=/work/reports/VAL2.json > seal/logs/VAL2.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<10800;i+=5)); do
            if test -s seal/reports/VAL2.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/VAL2.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          if test "$DONE" != 1; then echo '{"status":"DATA_UNAVAILABLE_OR_BACKTEST_FAILED","val_gate_pass":false}' > seal/audit/VAL2-GATE.json; exit 0; fi
      - name: Validation basket gate
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          rp=pathlib.Path('seal/reports/VAL2.json'); lp=pathlib.Path('seal/logs/VAL2.log')
          if not rp.exists(): raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore')
          groups={}
          for x in h:
              key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5)); g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'closeTime':0,'net':0.0}); g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0))
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime']); children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime']); baskets=[{'direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'net':g['net']} for g in mains]
          for ch in children:
              cand=[b for b in baskets if b['direction']==ch['direction'] and b['entryTime']<=ch['entryTime']<=b['closeTime']]
              if not cand: cand=[b for b in baskets if b['direction']==ch['direction'] and 0<=ch['entryTime']-b['entryTime']<=4*60*60*1000]
              if cand: b=max(cand,key=lambda z:z['entryTime']); b['net']+=ch['net']; b['closeTime']=max(b['closeTime'],ch['closeTime'])
          vals=[b['net'] for b in baskets]; W=[x for x in vals if x>0]; L=[x for x in vals if x<0]; gw=sum(W); gl=abs(sum(L)); pf=gw/gl if gl>0 else (999 if gw>0 else 0); net=sum(vals); exp=net/len(vals) if vals else 0; wr=100*len(W)/len(vals) if vals else 0; aw=sum(W)/len(W) if W else 0; al=sum(L)/len(L) if L else 0; rr=aw/abs(al) if aw>0 and al<0 else None; dd=float(eq.get('maxEquityDrawdownPercent',0) or 0); errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          out={'status':'OK','candidate':os.environ['CANDIDATE'],'data_mode':'ticks','initial_capital':100,'baskets':len(vals),'pf':pf,'net':net,'expectancy':exp,'win_rate_pct':wr,'realized_rr':rr,'max_dd_pct':dd,'execution_errors':errs,'val_gate_pass':bool(len(vals)>=10 and dd<=10 and pf>1 and net>0 and exp>0 and errs==0)}
          pathlib.Path('seal/audit/VAL2-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V294-VAL2
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  decision:
    needs: [engineering_regression, dev_gate, validation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V294-ENGINEERING-REGRESSION
          path: out/reg
      - uses: actions/download-artifact@v4
        with:
          name: V294-DEVELOPMENT-GATE
          path: out/dev
      - uses: actions/download-artifact@v4
        if: needs.dev_gate.outputs.has_winner == 'true'
        with:
          name: V294-VAL2
          path: out/val
      - name: Decision
        run: |
          python3 - <<'PY'
          import json,pathlib
          reg=json.load(open('out/reg/audit/V294-ENGINEERING-REGRESSION.json')); dev=json.load(open('out/dev/V294-DEVELOPMENT-GATE.json')); vp=pathlib.Path('out/val/audit/VAL2-GATE.json'); val=json.load(open(vp)) if vp.exists() else {'status':'NOT_RUN','val_gate_pass':False}
          advance=bool(reg.get('pass') and dev.get('winner') and val.get('val_gate_pass'))
          out={'source_version':'V29.4-Cross-Regime-ATR-Rolling-Dev','rollback_baseline':'V29.3-Grid-Risk-Cap-Hotfix-RC','engineering_regression':'PASS' if reg.get('pass') else 'FAIL','dev_winner':dev.get('winner',''),'development':dev,'validation':val,'status':'ADVANCE_TO_OOS_WF' if advance else 'HOLD','engineering_freeze':'PASS' if reg.get('pass') else 'HOLD','performance_freeze':'OPEN' if advance else 'FAIL_STAGE1','final_holdout':'UNTOUCHED_NOT_RUN','final_commercial_freeze':'HOLD'}
          pathlib.Path('V294-CROSS-REGIME-DECISION.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V294-CROSS-REGIME-DECISION
          path: V294-CROSS-REGIME-DECISION.json
          retention-days: 30
