name: Fibonacci BTC round3 long-short optimization

on:
  push:
    branches: [fibonacci-research1-build]
    paths:
      - '.github/workflows/optimize-fibonacci-btc-round3.yml'
      - 'tools/create_fibonacci_btc_round3.py'
      - 'research/fibonacci-research1/btc_round3_profiles.json'
      - 'research/fibonacci-research1/btc_round3_args.py'
      - 'research/fibonacci-research1/rank_btc_round3.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round3
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  BALANCE: '10000'
  DEV1_START: '08/06/2026 00:00'
  DEV1_END: '08/07/2026 23:59'
  DEV2_START: '09/07/2026 00:00'
  DEV2_END: '08/08/2026 23:59'
  OOS_START: '09/08/2026 00:00'
  OOS_END: '08/09/2026 00:00'
  FULL3_START: '08/06/2026 00:00'
  FULL3_END: '08/09/2026 00:00'
  FULL6_START: '08/03/2026 00:00'
  FULL6_END: '08/09/2026 00:00'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create Research1 baseline candidate
        run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - name: Create BTC Round3 candidate
        run: python3 tools/create_fibonacci_btc_round3.py --repo-root "$PWD" --force
      - name: Enable trading in ephemeral Round3 build copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.5.0-btc-round3/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build BTC Round3 cBot
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.5.0-btc-round3/FibonacciHarmonicSniperUltimate.csproj && dotnet build Fibonacci-v0.5.0-btc-round3/FibonacciHarmonicSniperUltimate.csproj --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p build-artifact
          ALGO="$(find Fibonacci-v0.5.0-btc-round3 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" build-artifact/FibonacciHarmonicSniperUltimate-BTC-Round3.algo
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-btc-round3-algo
          path: build-artifact/FibonacciHarmonicSniperUltimate-BTC-Round3.algo
          retention-days: 30

  btc-round3:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-btc-round3-algo
          path: btc
      - name: Prepare
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p btc/cache btc/reports
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > btc/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
      - name: Two-fold sell-side development search
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          mapfile -t PROFILES < <(python3 - <<'PY'
          import json
          p=json.load(open('research/fibonacci-research1/btc_round3_profiles.json'))
          print('\n'.join(p.keys()))
          PY
          )
          for PROFILE in "${PROFILES[@]}"; do
            mapfile -t ARGS < <(python3 research/fibonacci-research1/btc_round3_args.py "$PROFILE")
            for FOLD in DEV1 DEV2; do
              if [ "$FOLD" = DEV1 ]; then START="$DEV1_START"; END="$DEV1_END"; else START="$DEV2_START"; END="$DEV2_END"; fi
              echo "=== BITCOIN $FOLD / $PROFILE ==="
              timeout --signal=TERM --kill-after=30s 8m docker run --rm \
                -v "$PWD/btc:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
                backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round3.algo --environment-variables --exit-on-stop \
                --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
                --data-mode=m1 --data-dir=/work/cache --commission=65 --spread=0 --RiskPercent=1.0 \
                "${ARGS[@]}" --report="/work/reports/${PROFILE}-BITCOIN-${FOLD}.html" --report-json="/work/reports/${PROFILE}-BITCOIN-${FOLD}.json"
            done
          done
      - name: Rank sell robustness and select top 4 plus champion
        run: |
          python3 research/fibonacci-research1/rank_btc_round3.py \
            --reports-dir btc/reports --top 4 \
            --selected-output btc/btc-round3-selected.txt \
            --json-output btc/btc-round3-dev-ranking.json
          cat btc/btc-round3-selected.txt
      - name: Validate frozen BTC Round3 candidates
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          while IFS= read -r PROFILE; do
            test -n "$PROFILE" || continue
            mapfile -t ARGS < <(python3 research/fibonacci-research1/btc_round3_args.py "$PROFILE")
            for SPEC in 'OOS|0|65' 'OOSHARSH|1500|100' 'FULL3|0|65' 'FULL6|0|65' 'FULL6HARSH|1500|100'; do
              IFS='|' read -r PHASE SPREAD COMM <<< "$SPEC"
              case "$PHASE" in
                OOS|OOSHARSH) START="$OOS_START"; END="$OOS_END" ;;
                FULL3) START="$FULL3_START"; END="$FULL3_END" ;;
                FULL6|FULL6HARSH) START="$FULL6_START"; END="$FULL6_END" ;;
              esac
              echo "=== BITCOIN $PHASE / $PROFILE spread=$SPREAD commission=$COMM ==="
              timeout --signal=TERM --kill-after=30s 10m docker run --rm \
                -v "$PWD/btc:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" "$CTRADER_IMAGE" \
                backtest /work/FibonacciHarmonicSniperUltimate-BTC-Round3.algo --environment-variables --exit-on-stop \
                --symbol=BITCOIN --period=h1 --start="$START" --end="$END" --balance="$BALANCE" \
                --data-mode=m1 --data-dir=/work/cache --commission="$COMM" --spread="$SPREAD" --RiskPercent=1.0 \
                "${ARGS[@]}" --report="/work/reports/${PROFILE}-BITCOIN-${PHASE}.html" --report-json="/work/reports/${PROFILE}-BITCOIN-${PHASE}.json"
            done
          done < btc/btc-round3-selected.txt
      - name: Clean credentials
        if: always()
        run: rm -f btc/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibonacci-btc-round3-results
          path: |
            btc/reports/*BITCOIN*
            btc/btc-round3-selected.txt
            btc/btc-round3-dev-ranking.json
          if-no-files-found: error
          retention-days: 30
