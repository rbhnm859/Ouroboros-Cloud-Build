name: Fibonacci XAUUSD 3 - v3.6 Sequential Exit Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - fibonacci-xauusd-v3-hybrid
    paths:
      - .github/workflows/backtest-fibonacci-xauusd-3-v36-sequential-sweep.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build v3.6 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FibonacciHarmonicSniperUltimate/versions/xauusd_3/src/FibonacciXAUUSD3.cs')
          s = p.read_text()
          s = s.replace('Print("VERSION xauusd_3 v3.5.0-m5-first-valid");', 'Print("VERSION xauusd_3 v3.6.0-exit-resilience-candidate");', 1)

          old = '''        [Parameter("H1 ATR14/ATR50 Min", DefaultValue = 1.15, MinValue = 1.00, MaxValue = 2.00, Group = "Regime")]\n        public double H1AtrExpansionMin { get; set; }\n'''
          new = old + '''\n        [Parameter("TP Distance Multiplier", DefaultValue = 1.0, MinValue = 0.80, MaxValue = 1.50, Group = "Exit")]
        public double TakeProfitMultiplier { get; set; }

        [Parameter("Enable Breakeven", DefaultValue = false, Group = "Exit")]
        public bool EnableBreakeven { get; set; }

        [Parameter("Breakeven Trigger R", DefaultValue = 1.0, MinValue = 0.5, MaxValue = 3.0, Group = "Exit")]
        public double BreakevenTriggerR { get; set; }

        [Parameter("Breakeven Lock R", DefaultValue = 0.05, MinValue = 0.0, MaxValue = 0.50, Group = "Exit")]
        public double BreakevenLockR { get; set; }
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        private readonly Dictionary<long, TradeMeta> _openMeta = new Dictionary<long, TradeMeta>();\n'''
          new = old + '''        private readonly Dictionary<long, double> _initialRiskPips = new Dictionary<long, double>();
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''            ResetDay();\n            Print("VERSION xauusd_3 v3.6.0-exit-resilience-candidate");\n'''
          new = '''            ResetDay();
            RestoreDailyStateFromHistory();
            Print("VERSION xauusd_3 v3.6.0-exit-resilience-candidate");
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''            if (m5Index < 12)\n                return;\n            if (HasAnySymbolExposure())\n                return;\n'''
          new = '''            if (m5Index < 12)
                return;
            EnsureProtectionIntegrity();
            ManageOpenPositions();
            if (HasAnySymbolExposure())
                return;
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''                double tpPips = tpDistance / Symbol.PipSize;\n                double rr = tpPips / slPips;\n'''
          new = '''                double tpPips = (tpDistance / Symbol.PipSize) * TakeProfitMultiplier;
                double rr = tpPips / slPips;
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''                _openMeta[result.Position.Id] = new TradeMeta(a.Tag, a.Direction, finalScore, rr, confirmRules, session);\n'''
          new = old + '''                _initialRiskPips[result.Position.Id] = slPips;
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = '''        private double H1AtrExpansionRatio()\n        {\n'''
          helper = '''        private void EnsureProtectionIntegrity()
        {
            foreach (Position p in Positions.FindAll(BotLabel, SymbolName))
            {
                if (p.StopLoss != null && p.TakeProfit != null)
                    continue;
                Print("[FAILSAFE] Missing protection PID={0}; closing position", p.Id);
                ClosePosition(p);
            }
        }

        private void ManageOpenPositions()
        {
            if (!EnableBreakeven)
                return;
            foreach (Position p in Positions.FindAll(BotLabel, SymbolName))
            {
                if (p.StopLoss == null || p.TakeProfit == null)
                    continue;
                double initialRiskPips;
                if (!_initialRiskPips.TryGetValue(p.Id, out initialRiskPips))
                {
                    bool alreadyProtected = p.TradeType == TradeType.Buy ? p.StopLoss.Value >= p.EntryPrice : p.StopLoss.Value <= p.EntryPrice;
                    if (alreadyProtected)
                        continue;
                    initialRiskPips = Math.Abs(p.EntryPrice - p.StopLoss.Value) / Symbol.PipSize;
                    if (initialRiskPips <= 0)
                        continue;
                    _initialRiskPips[p.Id] = initialRiskPips;
                }
                double favorablePips = p.TradeType == TradeType.Buy ? (Symbol.Bid - p.EntryPrice) / Symbol.PipSize : (p.EntryPrice - Symbol.Ask) / Symbol.PipSize;
                if (favorablePips < BreakevenTriggerR * initialRiskPips)
                    continue;
                double desired = p.TradeType == TradeType.Buy ? p.EntryPrice + BreakevenLockR * initialRiskPips * Symbol.PipSize : p.EntryPrice - BreakevenLockR * initialRiskPips * Symbol.PipSize;
                bool improves = p.TradeType == TradeType.Buy ? desired > p.StopLoss.Value : desired < p.StopLoss.Value;
                if (!improves)
                    continue;
                double market = p.TradeType == TradeType.Buy ? Symbol.Bid : Symbol.Ask;
                double distancePips = Math.Abs(market - desired) / Symbol.PipSize;
                double brokerMin = BrokerMinDistancePips(market, Symbol.MinStopLossDistance) * 1.10;
                if (distancePips <= brokerMin)
                    continue;
                TradeResult mr = ModifyPosition(p, desired, p.TakeProfit);
                if (mr.IsSuccessful)
                    Print("[BREAKEVEN] PID={0} trigger={1:F2}R lock={2:F2}R", p.Id, BreakevenTriggerR, BreakevenLockR);
                else
                    Print("[BREAKEVEN FAIL] PID={0} error={1}", p.Id, mr.Error);
            }
        }

        private void RestoreDailyStateFromHistory()
        {
            double net = 0.0;
            int trades = 0;
            foreach (HistoricalTrade t in History.FindAll(BotLabel, SymbolName))
            {
                if (t.ClosingTime.Date == _day)
                    net += t.NetProfit;
                if (t.EntryTime.Date == _day)
                    trades++;
            }
            _dayNet = net;
            _tradesToday = trades;
            _dayStartBalance = Account.Balance - _dayNet;
            if (_dayStartBalance <= 0)
                _dayStartBalance = Account.Balance;
        }

        private double CurrentBotFloatingNet()
        {
            double net = 0.0;
            foreach (Position p in Positions.FindAll(BotLabel, SymbolName))
                net += p.NetProfit;
            return net;
        }

        private double H1AtrExpansionRatio()
        {
'''
          assert s.count(marker) == 1
          s = s.replace(marker, helper, 1)

          old = '''            double cap = _dayStartBalance * MaxDailyLossPercent / 100.0;\n            return -_dayNet >= cap;\n'''
          new = '''            double cap = _dayStartBalance * MaxDailyLossPercent / 100.0;
            return -(_dayNet + CurrentBotFloatingNet()) >= cap;
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''            _openMeta.Remove(p.Id);\n'''
          new = '''            _openMeta.Remove(p.Id);
            _initialRiskPips.Remove(p.Id);
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_3'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD3.csproj && dotnet build $ROOT/FibonacciXAUUSD3.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          mkdir -p work/reports work/cache work/package
          cp "$(find "$ROOT" -type f -name '*.algo' -print -quit)" work/FibonacciXAUUSD3-v3.6-ExitResilience.algo
          cp "$ROOT/src/FibonacciXAUUSD3.cs" work/package/FibonacciXAUUSD3-v3.6.cs
          sha256sum work/FibonacciXAUUSD3-v3.6-ExitResilience.algo > work/package/algo.sha256

      - name: Credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd

      - name: Run 1Y Standard and Harsh sweep
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            local variant="$1" tp="$2" be="$3" trigger="$4" lockr="$5" cost="$6" spread="$7" commission="$8"
            local label="${variant}-1y-${cost}"
            echo "=== ${label} ==="
            docker run --rm -v "$PWD/work:/work" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/work/ctrader.pwd' -e "ACCOUNT=$CTRADER_ACCOUNT" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/FibonacciXAUUSD3-v3.6-ExitResilience.algo --environment-variables --exit-on-stop --symbol=XAUUSD --period=m5 --start='09/09/2025' --end='09/09/2026' --balance=10000 --data-mode=m1 --data-dir=/work/cache --commission="$commission" --spread="$spread" --RiskPercent=0.50 --MaxDailyLossPercent=3 --MinimumRiskReward=1.5 --PreScoreMin=42 --FinalScoreMin=60 --M5PreScoreFloor=50 --M5RulesNeeded=2 --MinImpulseAtr=1.2 --MinStopAtr=0.20 --MaxAllowedRR=8 --BuyH1MinScore=18 --BlockLondonEntries=true --RequireH1AtrExpansion=true --H1AtrExpansionMin=1.15 --TakeProfitMultiplier="$tp" --EnableBreakeven="$be" --BreakevenTriggerR="$trigger" --BreakevenLockR="$lockr" --report="/work/reports/${label}.html" --report-json="/work/reports/${label}.json" 2>&1 | tee "work/reports/${label}.log"
            test -s "work/reports/${label}.json"
          }

          for spec in \
            'base 1.00 false 1.00 0.05' \
            'tp110 1.10 false 1.00 0.05' \
            'tp120 1.20 false 1.00 0.05' \
            'tp130 1.30 false 1.00 0.05' \
            'tp110-be100 1.10 true 1.00 0.05' \
            'tp120-be125 1.20 true 1.25 0.05'
          do
            set -- $spec
            run_case "$1" "$2" "$3" "$4" "$5" standard 17.42 35
            run_case "$1" "$2" "$3" "$4" "$5" harsh 30 50
          done

      - name: Aggregate sweep and audit safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json
          from pathlib import Path
          variants = ['base','tp110','tp120','tp130','tp110-be100','tp120-be125']
          out = ['# xauusd_3 v3.6 Sequential 1Y Sweep','', '| Variant | Cost | Trades | W | L | Net | ROI % | PF | DD % | Overlap | Hedge | London |', '|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          rows = []
          for v in variants:
              for cost in ('standard','harsh'):
                  d = json.loads(Path(f'work/reports/{v}-1y-{cost}.json').read_text())
                  ts=d['tradeStatistics']; main=d['main']; eq=d['equity']; hist=d['history']['items']
                  spans=sorted((int(x['entryTime']),int(x['closeTime']),x['direction']) for x in hist)
                  overlap=hedge=0
                  for i,a in enumerate(spans):
                      for b in spans[i+1:]:
                          if b[0] >= a[1]: break
                          overlap += 1; hedge += int(b[2] != a[2])
                  london=sum(1 for x in hist if 7 <= datetime.datetime.fromtimestamp(int(x['entryTime'])/1000, datetime.timezone.utc).hour < 13)
                  trades=int(ts['totalTrades']['all']); wins=int(ts['winningTrades']['all']); losses=int(ts['losingTrades']['all'])
                  net=float(main['netProfit']); roi=float(main['roi']); pf=float(ts['profitFactor']['all']); dd=float(eq['maxEquityDrawdownPercent'])
                  assert overlap == 0 and hedge == 0 and london == 0
                  rows.append((v,cost,trades,wins,losses,net,roi,pf,dd))
                  out.append(f'| {v} | {cost} | {trades} | {wins} | {losses} | {net:.2f} | {roi:.2f} | {pf:.2f} | {dd:.2f} | {overlap} | {hedge} | {london} |')
          out += ['', '## Robustness ranking', '']
          ranking=[]
          for v in variants:
              vr=[r for r in rows if r[0]==v]
              minroi=min(r[6] for r in vr); minpf=min(r[7] for r in vr); maxdd=max(r[8] for r in vr)
              score=minroi + 2*(minpf-1) - max(0,maxdd-6)
              ranking.append((score,v,minroi,minpf,maxdd))
          for score,v,minroi,minpf,maxdd in sorted(ranking, reverse=True):
              out.append(f'- {v}: score={score:.2f}; minROI={minroi:.2f}%; minPF={minpf:.2f}; maxDD={maxdd:.2f}%')
          Path('work/V36_1Y_SWEEP_SUMMARY.md').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_3-v36-sequential-sweep
          path: |
            work/package/
            work/reports/
            work/V36_1Y_SWEEP_SUMMARY.md
            work/FibonacciXAUUSD3-v3.6-ExitResilience.algo
          retention-days: 30
