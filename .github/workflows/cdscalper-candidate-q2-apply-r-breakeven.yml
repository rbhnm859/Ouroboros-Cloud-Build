name: Apply CDScalper Candidate Q2 R Breakeven

on:
  workflow_dispatch:
  push:
    branches: [cds-eurusd-v1]
    paths:
      - '.github/workflows/cdscalper-candidate-q2-apply-r-breakeven.yml'
      - 'CumulativeDeltaScalper-EURUSD-v1/tools/apply_candidate_q2_r_breakeven.py'

permissions:
  contents: write

jobs:
  refactor-and-compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Candidate Q2 refactor
        shell: pwsh
        run: python CumulativeDeltaScalper-EURUSD-v1/tools/apply_candidate_q2_r_breakeven.py

      - name: Structural sanity checks
        shell: pwsh
        run: |
          $p='CumulativeDeltaScalper-EURUSD-v1/src/CumulativeDeltaScalper_EURUSD_v1.cs'
          $s=Get-Content $p -Raw
          foreach($x in @('UseRiskMultipleBreakeven','BreakevenAtR','triggerPips = Math.Max')){ if(-not $s.Contains($x)){ throw "Missing $x" } }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Compile refactored cBot
        shell: pwsh
        run: |
          $project='CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
          dotnet restore $project
          dotnet build $project -c Release -p:AlgoName=CumulativeDeltaScalper_EURUSD_v1 -p:AlgoBuild=true -p:AlgoPublish=false -p:IncludeSource=true

      - name: Commit refactored source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CumulativeDeltaScalper-EURUSD-v1/src/CumulativeDeltaScalper_EURUSD_v1.cs
          if (git diff --cached --quiet) { Write-Host 'No source changes to commit'; exit 0 }
          git commit -m 'Candidate Q2 normalize breakeven by initial risk'
          git push origin HEAD:cds-eurusd-v1
