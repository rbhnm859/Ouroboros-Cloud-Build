name: HarmonyBot V51 Family-Native Mathematical Geometry & Economic Conversion Kernel

on:
  push:
    branches: [harmonybot/v51-pattern-native-retest-rr-recovery]
    paths:
      - 'HarmonyBot-V51/**'
      - '.github/workflows/harmonybot-v51-family-native-math-geometry.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v51-family-native-math-geometry
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v51-pattern-native-retest-rr-recovery
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Static, geometry, build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V51/tools/static_audit.py HarmonyBot-V51/src/HarmonyBotV51.cs
          python3 HarmonyBot-V51/tools/geometry_contract_test.py HarmonyBot-V51/src/HarmonyBotV51.cs
          dotnet restore HarmonyBot-V51/HarmonyBotV51.csproj
          dotnet build HarmonyBot-V51/HarmonyBotV51.csproj -c Release --no-restore --nologo
          mkdir -p HarmonyBot-V51/dist HarmonyBot-V51/final
          A=$(find HarmonyBot-V51/bin/Release -type f -name '*.algo' | head -1); test -s "$A"
          cp "$A" HarmonyBot-V51/dist/HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo
          sha256sum HarmonyBot-V51/src/HarmonyBotV51.cs "$A" > HarmonyBot-V51/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V51/final/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v51-build
          path: |
            control/HarmonyBot-V51/dist
            control/HarmonyBot-V51/final
          retention-days: 30

  dev:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        family: [V46_SCALE_CONTROL, V50_FULL_CONTROL, FAMILY_NATIVE_MATH_GEOMETRY, FULL_V51_COMMERCIAL]
        window: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v51-pattern-native-retest-rr-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v51-build
          path: control/HarmonyBot-V51/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V51/dist
          A=$(find control/HarmonyBot-V51/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1)
          test -s "$A"; cp "$A" control/HarmonyBot-V51/dist/
      - name: Resolve dates
        id: d
        shell: bash
        run: |
          case "${{ matrix.window }}" in
            A) echo "start=04/01/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-01-11T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2021" >> "$GITHUB_OUTPUT";;
            B) echo "start=01/07/2021" >> "$GITHUB_OUTPUT"; echo "eval=2021-07-08T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=31/12/2021" >> "$GITHUB_OUTPUT";;
            C) echo "start=03/01/2022" >> "$GITHUB_OUTPUT"; echo "eval=2022-01-10T00:00:00Z" >> "$GITHUB_OUTPUT"; echo "end=30/06/2022" >> "$GITHUB_OUTPUT";;
          esac
      - uses: actions/cache@v4
        with:
          path: control/HarmonyBot-V51/window-${{ matrix.family }}-${{ matrix.window }}/seal/data
          key: ctrader-xauusd-m1-${{ matrix.window }}-${{ steps.d.outputs.start }}-${{ steps.d.outputs.end }}-v51
      - name: Run fixed DEV
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V51/tools/*.sh
          control/HarmonyBot-V51/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ steps.d.outputs.start }}" "${{ steps.d.outputs.eval }}" "${{ steps.d.outputs.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v51-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V51/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v51-pattern-native-retest-rr-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v51-dev-*'
          path: control/HarmonyBot-V51/merged
          merge-multiple: true
      - name: Root-cause attribution and commercial gate
        id: gate
        shell: bash
        run: |
          mkdir -p control/HarmonyBot-V51/final
          python3 control/HarmonyBot-V51/tools/analyze_parallel_dev.py control/HarmonyBot-V51/merged control/HarmonyBot-V51/final
          echo "candidate=$(cat control/HarmonyBot-V51/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V51-FAMILY-NATIVE-MATH-FRONTIER
          path: control/HarmonyBot-V51/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v51-pattern-native-retest-rr-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v51-build
          path: control/HarmonyBot-V51/shared
      - name: Capital validation
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            FAMILY_NATIVE_MATH_GEOMETRY) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; CORRIDOR=false;;
            FULL_V51_COMMERCIAL) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; CORRIDOR=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V51/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V51/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V51/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V51/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V51-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE"             FAMNATIVE=false FAMOBS=true CANCONTRACT="$CAN" FAMCONF="$FC" GRIDV2="$GRID" STOPV2="$STOP" JOINT="$JOINT" CORRIDOR="$CORRIDOR" ANCHORFORENSICS=true PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false             BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V51/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V51/tools/audit_report.py --report "$W/seal/reports/V51-$CANDIDATE-CAPITAL-$BALANCE.json"             --log "$W/seal/logs/V51-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json"             --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v51-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V51/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze, capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v51-capital-*'
          path: capital
          merge-multiple: true
      - name: Hard capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V51_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V51","rows":rows,"all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"actual_100_frequency":rows["100"]["frequency"]},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v51-capital-gate
          path: V51_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze, capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v51-pattern-native-retest-rr-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v51-build
          path: shared
      - name: Freeze hashes
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V51/src/HarmonyBotV51.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo"))
          pathlib.Path("V51_FREEZE_MANIFEST.json").write_text(json.dumps({"version":"HarmonyBot V51","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),"fresh_tuning":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v51-freeze-manifest
          path: V51_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze, freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v51-pattern-native-retest-rr-recovery
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v51-build
          path: control/HarmonyBot-V51/shared
      - name: Untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            FAMILY_NATIVE_MATH_GEOMETRY) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; CORRIDOR=false;;
            FULL_V51_COMMERCIAL) CAN=true; FC=true; GRID=true; STOP=true; JOINT=true; CORRIDOR=true;;
            *) exit 31;;
          esac
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V51/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V51/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"; chmod +x control/HarmonyBot-V51/tools/*.sh
          A=$(find control/HarmonyBot-V51/shared -type f -name 'HarmonyBot_V51_Family_Native_Math_Geometry_Economic_Conversion_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V51-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE"             FAMNATIVE=false FAMOBS=true CANCONTRACT="$CAN" FAMCONF="$FC" GRIDV2="$GRID" STOPV2="$STOP" JOINT="$JOINT" CORRIDOR="$CORRIDOR" ANCHORFORENSICS=true PQUEUE=false HANDOFF=false NATIVE=false DECAY=false REVALIDATE=false             BACKTEST_TIMEOUT_SECONDS=1800 "$GITHUB_WORKSPACE/control/HarmonyBot-V51/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V51/tools/audit_report.py --report "$W/seal/reports/V51-$CANDIDATE-FRESH-$KIND.json"             --log "$W/seal/logs/V51-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json"             --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v51-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V51/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze, fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v51-fresh-*'
          path: fresh
          merge-multiple: true
      - name: Final commercial decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          def good(x): return x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and x["max_dd_pct"]<=10
          ok=good(a) and good(m)
          pathlib.Path("V51_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V51","fresh_alpha":a,"fresh_100":m,"fresh_validation_pass":ok},indent=2))
          pathlib.Path("V51_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V51","decision":"COMMERCIAL_FREEZE_CANDIDATE_PASS" if ok else "HOLD_WITH_EVIDENCE","fresh_used":True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v51-final-decision
          path: |
            V51_FRESH_VALIDATION.json
            V51_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
