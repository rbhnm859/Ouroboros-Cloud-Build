name: Build HarmonyBot Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HarmonyBot-Mobile/**'
      - '.github/workflows/build-harmonybot-mobile.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore cTrader packages
        run: dotnet restore HarmonyBot-Mobile/HarmonyBot.csproj

      - name: Build cTrader mobile .algo
        run: |
          dotnet build HarmonyBot-Mobile/HarmonyBot.csproj \
            --configuration Release \
            --no-restore \
            -p:AlgoPublish=False \
            -p:IncludeSource=True

      - name: Locate and verify .algo
        run: |
          mkdir -p dist
          ALGO=$(find HarmonyBot-Mobile -type f -name '*.algo' | head -n 1)
          if [ -z "$ALGO" ]; then
            echo 'Build completed but no .algo was found.'
            find HarmonyBot-Mobile -maxdepth 8 -type f | sort
            exit 1
          fi
          cp "$ALGO" dist/HarmonyBot-Mobile.algo
          test -s dist/HarmonyBot-Mobile.algo
          ls -lh dist/HarmonyBot-Mobile.algo

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBot-Mobile
          path: dist/HarmonyBot-Mobile.algo
          if-no-files-found: error

  backtest:
    needs: build
    name: XAUUSD ${{ matrix.period }} ${{ matrix.window }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: m15
            window: 1Y
            start: '11/09/2025'
            end: '11/09/2026'
          - period: h1
            window: 1Y
            start: '11/09/2025'
            end: '11/09/2026'
          - period: m15
            window: 3Y
            start: '11/09/2023'
            end: '11/09/2026'
          - period: h1
            window: 3Y
            start: '11/09/2023'
            end: '11/09/2026'

    steps:
      - name: Download HarmonyBot .algo
        uses: actions/download-artifact@v4
        with:
          name: HarmonyBot-Mobile
          path: backtest

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Backtest XAUUSD
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          echo "::add-mask::$CTRADER_CTID"
          echo "::add-mask::$CTRADER_ACCOUNT"
          mkdir -p backtest/cache backtest/reports
          OUT="XAUUSD-${{ matrix.period }}-${{ matrix.window }}"
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/HarmonyBot-Mobile.algo \
            --environment-variables \
            --symbol=XAUUSD \
            --period=${{ matrix.period }} \
            --start='${{ matrix.start }}' \
            --end='${{ matrix.end }}' \
            --balance=100 \
            --data-mode=m1 \
            --data-dir=/work/cache \
            --report="/work/reports/${OUT}.html" \
            --report-json="/work/reports/${OUT}.json"

      - name: Create compact metrics summary
        if: success()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, re
          period='${{ matrix.period }}'
          window='${{ matrix.window }}'
          p=Path(f'backtest/reports/XAUUSD-{period}-{window}.json')
          d=json.loads(p.read_text())
          flat={}
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      key=re.sub(r'[^a-z0-9]','',k.lower())
                      if key not in flat and not isinstance(v,(dict,list)):
                          flat[key]=v
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          def get(*names):
              for n in names:
                  v=flat.get(re.sub(r'[^a-z0-9]','',n.lower()))
                  if v not in (None,''): return v
              return ''
          out={
              'symbol':'XAUUSD','period':period,'window':window,
              'start':'${{ matrix.start }}','end':'${{ matrix.end }}','starting_balance':100,
              'total_trades':get('TotalTrades','Trades'),
              'winning_trades':get('WinningTrades','WinningPositions','Wins'),
              'losing_trades':get('LosingTrades','LosingPositions','Losses'),
              'win_rate':get('WinRate','WinningTradesPercentages'),
              'net_profit':get('NetProfit','NetProfitAmount'),
              'profit_factor':get('ProfitFactor'),
              'max_equity_drawdown_percent':get('MaxEquityDrawdownPercentages','MaxEquityDrawdownPercentage','MaxDrawdownPercentages','MaxDrawdownPercentage'),
              'ending_balance':get('EndingBalance','Balance'),
          }
          Path(f'backtest/reports/XAUUSD-{period}-{window}-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBot-XAUUSD-${{ matrix.period }}-${{ matrix.window }}
          path: |
            backtest/reports/XAUUSD-${{ matrix.period }}-${{ matrix.window }}.html
            backtest/reports/XAUUSD-${{ matrix.period }}-${{ matrix.window }}.json
            backtest/reports/XAUUSD-${{ matrix.period }}-${{ matrix.window }}-summary.json
          if-no-files-found: warn
          retention-days: 30
