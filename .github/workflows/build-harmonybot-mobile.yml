name: Build HarmonyBot Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HarmonyBot-Mobile/**'
      - '.github/workflows/build-harmonybot-mobile.yml'

permissions:
  contents: read

concurrency:
  group: harmonybot-mobile-xauusd-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore cTrader packages
        run: dotnet restore HarmonyBot-Mobile/HarmonyBot.csproj

      - name: Build cTrader mobile .algo
        run: |
          dotnet build HarmonyBot-Mobile/HarmonyBot.csproj \
            --configuration Release \
            --no-restore \
            -p:AlgoPublish=False \
            -p:IncludeSource=True

      - name: Locate and verify .algo
        run: |
          mkdir -p dist
          ALGO=$(find HarmonyBot-Mobile -type f -name '*.algo' | head -n 1)
          if [ -z "$ALGO" ]; then
            echo 'Build completed but no .algo was found.'
            find HarmonyBot-Mobile -maxdepth 8 -type f | sort
            exit 1
          fi
          cp "$ALGO" dist/HarmonyBot-Mobile.algo
          test -s dist/HarmonyBot-Mobile.algo
          ls -lh dist/HarmonyBot-Mobile.algo

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBot-Mobile
          path: dist/HarmonyBot-Mobile.algo
          if-no-files-found: error

  backtest:
    needs: build
    name: XAUUSD M15-H1 1Y-3Y shared-cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download HarmonyBot .algo
        uses: actions/download-artifact@v4
        with:
          name: HarmonyBot-Mobile
          path: backtest

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Backtest four XAUUSD windows
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          echo "::add-mask::$CTRADER_CTID"
          echo "::add-mask::$CTRADER_ACCOUNT"
          mkdir -p backtest/cache backtest/reports

          run_bt() {
            PERIOD="$1"
            WINDOW="$2"
            START="$3"
            END="$4"
            OUT="XAUUSD-${PERIOD}-${WINDOW}"
            echo "===== START ${OUT}: ${START} -> ${END} ====="
            docker run --rm \
              -v "$PWD/backtest:/work" \
              -e "CTID=$CTRADER_CTID" \
              -e 'PWD-FILE=/work/ctrader.pwd' \
              -e "ACCOUNT=$CTRADER_ACCOUNT" \
              ghcr.io/spotware/ctrader-console:5.9.11 \
              backtest /work/HarmonyBot-Mobile.algo \
              --environment-variables \
              --symbol=XAUUSD \
              --period="$PERIOD" \
              --start="$START" \
              --end="$END" \
              --balance=100 \
              --data-mode=m1 \
              --data-dir=/work/cache \
              --report="/work/reports/${OUT}.html" \
              --report-json="/work/reports/${OUT}.json"
            test -s "backtest/reports/${OUT}.json"
            echo "===== DONE ${OUT} ====="
          }

          # Run the widest windows first so later tests can reuse the downloaded M1 history.
          run_bt m15 3Y '10/09/2023' '10/09/2026'
          run_bt h1  3Y '10/09/2023' '10/09/2026'
          run_bt m15 1Y '10/09/2025' '10/09/2026'
          run_bt h1  1Y '10/09/2025' '10/09/2026'

      - name: Create comparison summary
        if: success()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, re

          specs = [
              ('m15','3Y','10/09/2023','10/09/2026'),
              ('h1','3Y','10/09/2023','10/09/2026'),
              ('m15','1Y','10/09/2025','10/09/2026'),
              ('h1','1Y','10/09/2025','10/09/2026'),
          ]

          def flatten(x, out):
              if isinstance(x, dict):
                  for k,v in x.items():
                      key=re.sub(r'[^a-z0-9]','',k.lower())
                      if key not in out and not isinstance(v,(dict,list)):
                          out[key]=v
                      flatten(v,out)
              elif isinstance(x,list):
                  for v in x: flatten(v,out)

          def pick(flat,*names):
              for n in names:
                  v=flat.get(re.sub(r'[^a-z0-9]','',n.lower()))
                  if v not in (None,''):
                      return v
              return ''

          rows=[]
          for period,window,start,end in specs:
              p=Path(f'backtest/reports/XAUUSD-{period}-{window}.json')
              d=json.loads(p.read_text())
              flat={}; flatten(d,flat)
              row={
                  'symbol':'XAUUSD','period':period,'window':window,
                  'start':start,'end':end,'starting_balance':100,
                  'total_trades':pick(flat,'TotalTrades','Trades'),
                  'winning_trades':pick(flat,'WinningTrades','WinningPositions','Wins'),
                  'losing_trades':pick(flat,'LosingTrades','LosingPositions','Losses'),
                  'win_rate':pick(flat,'WinRate','WinningTradesPercentages'),
                  'net_profit':pick(flat,'NetProfit','NetProfitAmount'),
                  'profit_factor':pick(flat,'ProfitFactor'),
                  'max_equity_drawdown_percent':pick(flat,'MaxEquityDrawdownPercentages','MaxEquityDrawdownPercentage','MaxDrawdownPercentages','MaxDrawdownPercentage'),
                  'ending_balance':pick(flat,'EndingBalance','Balance'),
              }
              rows.append(row)
              Path(f'backtest/reports/XAUUSD-{period}-{window}-summary.json').write_text(json.dumps(row,ensure_ascii=False,indent=2))

          Path('backtest/reports/comparison-summary.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PYCODE

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload all backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBot-XAUUSD-M15-H1-1Y-3Y
          path: backtest/reports/
          if-no-files-found: warn
          retention-days: 30
