name: CDS FX Adaptive v2 - 28 Pairs 1Y Backtest

on:
  push:
    branches: [ cds-fx-adaptive-v2-1y-allpairs ]
    paths:
      - 'CumulativeDeltaScalper-FX-Adaptive-v2/**'
      - '.github/workflows/cds-fx-adaptive-v2-1y-allpairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build adaptive multi-FX algo
        run: |
          set -euo pipefail
          PROJ='CumulativeDeltaScalper-FX-Adaptive-v2/CumulativeDeltaScalper_FX_Adaptive_v2.csproj'
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True
          mkdir -p out
          ALGO=$(find 'CumulativeDeltaScalper-FX-Adaptive-v2/bin/Release' -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" out/CumulativeDeltaScalper_FX_Adaptive_v2.algo
          sha256sum out/CumulativeDeltaScalper_FX_Adaptive_v2.algo | tee out/CumulativeDeltaScalper_FX_Adaptive_v2.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cds-fx-adaptive-v2-algo
          path: out/
          retention-days: 30

  backtest:
    needs: build
    if: ${{ secrets.CTRADER_CTID != '' && secrets.CTRADER_ACCOUNT != '' && secrets.CTRADER_PASSWORD != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        symbol:
          - AUDCAD
          - AUDCHF
          - AUDJPY
          - AUDNZD
          - AUDUSD
          - CADCHF
          - CADJPY
          - CHFJPY
          - EURAUD
          - EURCAD
          - EURCHF
          - EURGBP
          - EURJPY
          - EURNZD
          - EURUSD
          - GBPAUD
          - GBPCAD
          - GBPCHF
          - GBPJPY
          - GBPNZD
          - GBPUSD
          - NZDCAD
          - NZDCHF
          - NZDJPY
          - NZDUSD
          - USDCAD
          - USDCHF
          - USDJPY
    env:
      START_DATE: '09/12/2025'
      END_DATE: '09/12/2026'
      STARTING_BALANCE: '100'
      PERIOD: 'm1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cds-fx-adaptive-v2-algo
          path: downloaded-algo
      - name: Backtest ${{ matrix.symbol }} M1 one year
        env:
          SYMBOL: ${{ matrix.symbol }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -uo pipefail
          mkdir -p "backtest/cache/$SYMBOL" "backtest/reports/$SYMBOL"
          cp downloaded-algo/CumulativeDeltaScalper_FX_Adaptive_v2.algo backtest/
          printf '%s' "$CTRADER_PASSWORD" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

          set +e
          docker run --rm -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e "PWD-FILE=/work/ctrader.pwd" \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/CumulativeDeltaScalper_FX_Adaptive_v2.algo --environment-variables \
            --symbol="$SYMBOL" --period="$PERIOD" \
            --start="$START_DATE" --end="$END_DATE" \
            --balance="$STARTING_BALANCE" --data-mode=m1 \
            --data-dir="/work/cache/$SYMBOL" \
            --report="/work/reports/$SYMBOL/$SYMBOL-M1.html" \
            --report-json="/work/reports/$SYMBOL/$SYMBOL-M1.json" \
            --exit-on-stop 2>&1 | tee "backtest/reports/$SYMBOL/console.log"
          RC=${PIPESTATUS[0]}
          set -e
          rm -f backtest/ctrader.pwd
          echo "$RC" > "backtest/reports/$SYMBOL/exit_code.txt"

          python3 - "$SYMBOL" "$RC" <<'PY'
          import json, math, sys
          from pathlib import Path

          symbol = sys.argv[1]
          rc = int(sys.argv[2])
          root = Path('backtest/reports') / symbol
          rep = root / f'{symbol}-M1.json'
          log = root / 'console.log'

          out = {
              'schema_version': 2,
              'bot': 'CumulativeDeltaScalper_FX_Adaptive_v2',
              'symbol': symbol,
              'timeframe': 'M1',
              'period': {'start': '2025-09-12', 'end_exclusive': '2026-09-12', 'timezone': 'UTC'},
              'starting_balance': 100.0,
              'data_mode': 'm1',
              'engine': 'cTrader Console 5.9.11',
              'status': 'failed',
              'exit_code': rc,
              'metrics': {}
          }

          if rep.exists():
              try:
                  d = json.loads(rep.read_text(errors='replace'))
                  m = d.get('main', {}) or {}
                  hist = (d.get('history', {}) or {}).get('items', []) or []
                  nets = []
                  for t in hist:
                      try:
                          nets.append(float(t.get('net', 0) or 0))
                      except Exception:
                          pass
                  wins = sum(1 for n in nets if n > 0)
                  losses = sum(1 for n in nets if n < 0)
                  breakeven = sum(1 for n in nets if n == 0)
                  gp = sum(n for n in nets if n > 0)
                  gl = -sum(n for n in nets if n < 0)
                  total = len(nets)
                  pf = gp / gl if gl > 0 else (999999.0 if gp > 0 else 0.0)
                  net = m.get('netProfit')
                  if net is None:
                      net = sum(nets)
                  try:
                      net = float(net)
                  except Exception:
                      net = sum(nets)
                  equity = d.get('equity', {}) or {}
                  max_dd = equity.get('maxEquityDrawdownPercent')
                  try:
                      max_dd = float(max_dd) if max_dd is not None else None
                  except Exception:
                      max_dd = None

                  max_consec_losses = 0
                  run = 0
                  for n in nets:
                      if n < 0:
                          run += 1
                          max_consec_losses = max(max_consec_losses, run)
                      elif n > 0:
                          run = 0

                  out['status'] = 'completed' if rc == 0 else 'completed_with_nonzero_exit'
                  out['metrics'] = {
                      'net_profit': net,
                      'return_percent': net,
                      'ending_balance': 100.0 + net,
                      'profit_factor': pf,
                      'win_rate_percent': (wins / total * 100.0) if total else None,
                      'max_equity_drawdown_percent': max_dd,
                      'total_trades': total,
                      'wins': wins,
                      'losses': losses,
                      'breakeven': breakeven,
                      'gross_profit': gp,
                      'gross_loss': gl,
                      'average_trade': (sum(nets) / total) if total else None,
                      'largest_win': max(nets) if nets else None,
                      'largest_loss': min(nets) if nets else None,
                      'max_consecutive_losses': max_consec_losses
                  }
              except Exception as e:
                  out['parse_error'] = repr(e)
          else:
              out['error'] = 'report_json_missing'

          if log.exists():
              text = log.read_text(errors='replace')
              out['console_tail'] = '\n'.join(text.splitlines()[-30:])[-8000:]

          (root / f'summary-{symbol}.json').write_text(json.dumps(out, indent=2, ensure_ascii=False))
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx1y-${{ matrix.symbol }}
          path: backtest/reports/${{ matrix.symbol }}/
          retention-days: 30

  aggregate:
    needs: backtest
    if: ${{ always() && needs.backtest.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fx1y-*
          path: collected
          merge-multiple: true
      - name: Build 28-pair ranking report
        run: |
          mkdir -p CumulativeDeltaScalper-FX-Adaptive-v2/backtests/1y
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          files = sorted(Path('collected').glob('summary-*.json'))
          rows = [json.loads(p.read_text()) for p in files]
          symbols = [
              'AUDCAD','AUDCHF','AUDJPY','AUDNZD','AUDUSD','CADCHF','CADJPY','CHFJPY',
              'EURAUD','EURCAD','EURCHF','EURGBP','EURJPY','EURNZD','EURUSD','GBPAUD',
              'GBPCAD','GBPCHF','GBPJPY','GBPNZD','GBPUSD','NZDCAD','NZDCHF','NZDJPY',
              'NZDUSD','USDCAD','USDCHF','USDJPY'
          ]
          by_symbol = {r.get('symbol'): r for r in rows}
          for s in symbols:
              if s not in by_symbol:
                  by_symbol[s] = {
                      'symbol': s, 'status': 'missing', 'timeframe': 'M1',
                      'period': {'start': '2025-09-12', 'end_exclusive': '2026-09-12'},
                      'starting_balance': 100.0, 'metrics': {}
                  }
          rows = [by_symbol[s] for s in symbols]

          def metric(r, k):
              return (r.get('metrics') or {}).get(k)
          completed = [r for r in rows if str(r.get('status','')).startswith('completed')]
          ranked = sorted(completed, key=lambda r: (metric(r,'net_profit') is not None, metric(r,'net_profit') or -10**18), reverse=True)
          rankmap = {r['symbol']: i+1 for i, r in enumerate(ranked)}

          outdir = Path('CumulativeDeltaScalper-FX-Adaptive-v2/backtests/1y')
          payload = {
              'bot': 'CumulativeDeltaScalper_FX_Adaptive_v2',
              'test': '28 supported FX pairs, M1, one-year cross-sectional screening',
              'period': {'start': '2025-09-12', 'end_exclusive': '2026-09-12', 'timezone': 'UTC'},
              'starting_balance': 100.0,
              'data_mode': 'm1',
              'symbols_requested': 28,
              'completed': len(completed),
              'results': rows
          }
          (outdir / 'CDS_FX_Adaptive_v2_28pairs_1Y_results.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False))

          headers = ['rank','symbol','status','net_profit','return_percent','ending_balance','profit_factor','win_rate_percent','max_equity_drawdown_percent','total_trades','average_trade','largest_win','largest_loss','max_consecutive_losses']
          with (outdir / 'CDS_FX_Adaptive_v2_28pairs_1Y_ranking.csv').open('w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=headers)
              w.writeheader()
              for r in rows:
                  m = r.get('metrics') or {}
                  w.writerow({
                      'rank': rankmap.get(r['symbol'], ''), 'symbol': r['symbol'], 'status': r.get('status'),
                      **{k: m.get(k) for k in headers[3:]}
                  })

          def fmt(v, digits=2):
              if v is None: return '—'
              try: return f'{float(v):.{digits}f}'
              except Exception: return str(v)

          md = []
          md.append('# CDS FX Adaptive v2 — 28 FX pairs / 1-year M1 backtest')
          md.append('')
          md.append('- Period: 2025-09-12 to 2026-09-12 (end-exclusive, UTC)')
          md.append('- Starting balance: $100 per symbol')
          md.append('- cTrader Console: 5.9.11')
          md.append('- Data mode: M1')
          md.append(f'- Completed: {len(completed)}/28')
          md.append('')
          md.append('| Rank | Symbol | Status | Net $ | Return % | PF | Win % | Max DD % | Trades | Avg trade |')
          md.append('|---:|---|---|---:|---:|---:|---:|---:|---:|---:|')
          for r in sorted(rows, key=lambda x: (rankmap.get(x['symbol'], 999), x['symbol'])):
              m = r.get('metrics') or {}
              md.append(f"| {rankmap.get(r['symbol'],'—')} | {r['symbol']} | {r.get('status')} | {fmt(m.get('net_profit'))} | {fmt(m.get('return_percent'))} | {fmt(m.get('profit_factor'))} | {fmt(m.get('win_rate_percent'))} | {fmt(m.get('max_equity_drawdown_percent'))} | {m.get('total_trades','—')} | {fmt(m.get('average_trade'),4)} |")
          md.append('')
          profitable = [r for r in completed if (metric(r,'net_profit') or 0) > 0]
          md.append(f'Profitable pairs: {len(profitable)}/{len(completed)} completed tests.')
          (outdir / 'CDS_FX_Adaptive_v2_28pairs_1Y_report.md').write_text('\n'.join(md) + '\n')
          print('\n'.join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CDS-FX-Adaptive-v2-28pairs-1Y-report
          path: CumulativeDeltaScalper-FX-Adaptive-v2/backtests/1y/
          retention-days: 30
      - name: Commit summary reports to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CumulativeDeltaScalper-FX-Adaptive-v2/backtests/1y/
          git commit -m 'backtest: CDS FX Adaptive v2 28-pair one-year report [skip ci]' || echo 'nothing to commit'
          git push
