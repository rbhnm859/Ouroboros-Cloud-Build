name: Fibonacci XAUUSD 3 - v3.6 Safety Multi-Period Validation

on:
  workflow_dispatch:
  push:
    branches: [fibonacci-xauusd-v3-hybrid]
    paths:
      - '.github/workflows/backtest-fibonacci-xauusd-3-v36-safety-multiperiod-validation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Build v3.5 baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_3'
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD3.csproj && dotnet build $ROOT/FibonacciXAUUSD3.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          mkdir -p package
          cp "$(find "$ROOT" -type f -name '*.algo' -print -quit)" package/FibonacciXAUUSD3-v3.5-Baseline.algo
          cp "$ROOT/src/FibonacciXAUUSD3.cs" package/FibonacciXAUUSD3-v3.5.cs

      - name: Patch and build v3.6 safety candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT='FibonacciHarmonicSniperUltimate/versions/xauusd_3'
          python3 "$ROOT/tools/patch_v36_candidate.py"
          grep -q 'v3.6.0-exit-resilience-candidate' "$ROOT/src/FibonacciXAUUSD3.cs"
          rm -rf "$ROOT/bin" "$ROOT/obj"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo ghcr.io/spotware/ctrader-console:5.9.11 -c "dotnet restore $ROOT/FibonacciXAUUSD3.csproj && dotnet build $ROOT/FibonacciXAUUSD3.csproj -c Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True"
          cp "$(find "$ROOT" -type f -name '*.algo' -print -quit)" package/FibonacciXAUUSD3-v3.6-Safety.algo
          cp "$ROOT/src/FibonacciXAUUSD3.cs" package/FibonacciXAUUSD3-v3.6-Safety.cs
          sha256sum package/*.algo > package/algo.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_3-v36-safety-validation-build
          path: package/
          retention-days: 30

  backtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        version: [v35, v36safe]
        window: [recent3m, recent6m, first6m, second6m, full1y]
        cost: [standard, harsh]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_3-v36-safety-validation-build
          path: work

      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}"
          printf '%s' "$CTRADER_PASSWORD" > work/ctrader.pwd

      - name: Backtest ${{ matrix.version }} ${{ matrix.window }} ${{ matrix.cost }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail

          case '${{ matrix.version }}' in
            v35) ALGO='/work/FibonacciXAUUSD3-v3.5-Baseline.algo'; EXTRA=() ;;
            v36safe) ALGO='/work/FibonacciXAUUSD3-v3.6-Safety.algo'; EXTRA=(--TakeProfitMultiplier=1.00 --EnableBreakeven=false --BreakevenTriggerR=1.00 --BreakevenLockR=0.05) ;;
            *) exit 2 ;;
          esac

          case '${{ matrix.window }}' in
            recent3m) START='09/06/2026'; END='09/09/2026' ;;
            recent6m) START='09/03/2026'; END='09/09/2026' ;;
            first6m) START='09/09/2025'; END='09/03/2026' ;;
            second6m) START='09/03/2026'; END='09/09/2026' ;;
            full1y) START='09/09/2025'; END='09/09/2026' ;;
            *) exit 2 ;;
          esac

          case '${{ matrix.cost }}' in
            standard) SPREAD='17.42'; COMMISSION='35' ;;
            harsh) SPREAD='30'; COMMISSION='50' ;;
            *) exit 2 ;;
          esac

          mkdir -p work/reports work/cache
          LABEL='${{ matrix.version }}-${{ matrix.window }}-${{ matrix.cost }}'

          docker run --rm -v "$PWD/work:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest "$ALGO" \
            --environment-variables --exit-on-stop \
            --symbol=XAUUSD --period=m5 \
            --start="$START" --end="$END" --balance=10000 \
            --data-mode=m1 --data-dir=/work/cache \
            --commission="$COMMISSION" --spread="$SPREAD" \
            --RiskPercent=0.50 --MaxDailyLossPercent=3 --MinimumRiskReward=1.5 \
            --PreScoreMin=42 --FinalScoreMin=60 --M5PreScoreFloor=50 --M5RulesNeeded=2 \
            --MinImpulseAtr=1.2 --MinStopAtr=0.20 --MaxAllowedRR=8 \
            --BuyH1MinScore=18 --BlockLondonEntries=true \
            --RequireH1AtrExpansion=true --H1AtrExpansionMin=1.15 \
            "${EXTRA[@]}" \
            --report="/work/reports/${LABEL}.html" \
            --report-json="/work/reports/${LABEL}.json" \
            2>&1 | tee "work/reports/${LABEL}.log"

          test -s "work/reports/${LABEL}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd_3-v36-safety-${{ matrix.version }}-${{ matrix.window }}-${{ matrix.cost }}
          path: work/reports/
          retention-days: 30

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xauusd_3-v36-safety-validation-build
          path: package

      - uses: actions/download-artifact@v4
        with:
          pattern: xauusd_3-v36-safety-*
          path: reports
          merge-multiple: true

      - name: Aggregate multi-period comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          from pathlib import Path

          versions = ['v35', 'v36safe']
          windows = ['recent3m', 'recent6m', 'first6m', 'second6m', 'full1y']
          costs = ['standard', 'harsh']
          rows = []
          out = [
              '# xauusd_3 v3.6 Safety Multi-Period Validation',
              '',
              '| Version | Window | Cost | Trades | W | L | Net | ROI % | PF | DD % | Overlap | Hedge | London |',
              '|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
          ]

          for v in versions:
              for w in windows:
                  for c in costs:
                      p = Path(f'reports/{v}-{w}-{c}.json')
                      d = json.loads(p.read_text())
                      ts = d['tradeStatistics']; main = d['main']; eq = d['equity']; hist = d['history']['items']
                      spans = sorted((int(x['entryTime']), int(x['closeTime']), x['direction']) for x in hist)
                      overlap = hedge = 0
                      for i, a in enumerate(spans):
                          for b in spans[i+1:]:
                              if b[0] >= a[1]:
                                  break
                              overlap += 1
                              hedge += int(b[2] != a[2])
                      london = sum(1 for x in hist if 7 <= datetime.datetime.fromtimestamp(int(x['entryTime'])/1000, datetime.timezone.utc).hour < 13)
                      trades = int(ts['totalTrades']['all'])
                      wins = int(ts['winningTrades']['all'])
                      losses = int(ts['losingTrades']['all'])
                      net = float(main['netProfit'])
                      roi = float(main['roi'])
                      pf = float(ts['profitFactor']['all'])
                      dd = float(eq['maxEquityDrawdownPercent'])
                      rows.append((v,w,c,trades,wins,losses,net,roi,pf,dd,overlap,hedge,london))
                      out.append(f'| {v} | {w} | {c} | {trades} | {wins} | {losses} | {net:.2f} | {roi:.2f} | {pf:.2f} | {dd:.2f} | {overlap} | {hedge} | {london} |')

          out += ['', '## v3.6-safety minus v3.5', '', '| Window | Cost | ΔTrades | ΔNet | ΔROI | ΔPF | ΔDD |', '|---|---|---:|---:|---:|---:|---:|']
          for w in windows:
              for c in costs:
                  a = next(r for r in rows if r[0]=='v35' and r[1]==w and r[2]==c)
                  b = next(r for r in rows if r[0]=='v36safe' and r[1]==w and r[2]==c)
                  out.append(f'| {w} | {c} | {b[3]-a[3]} | {b[6]-a[6]:.2f} | {b[7]-a[7]:.2f} | {b[8]-a[8]:.2f} | {b[9]-a[9]:.2f} |')

          safe_rows = [r for r in rows if r[0]=='v36safe']
          hard_ok = all(r[10] == 0 and r[11] == 0 and r[12] == 0 for r in safe_rows)
          robust_positive = all(r[6] > 0 and r[8] > 1.0 for r in safe_rows if r[1] in ('recent6m','first6m','second6m','full1y'))
          out += ['', '## Gates', '', f'- Safety invariants pass: {hard_ok}', f'- Positive/PF>1 on all 6M+ windows: {robust_positive}']

          Path('V36_SAFETY_MULTIPERIOD_SUMMARY.md').write_text('\n'.join(out) + '\n')
          print('\n'.join(out))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xauusd_3-v36-safety-multiperiod-complete
          path: |
            package/
            reports/
            V36_SAFETY_MULTIPERIOD_SUMMARY.md
          retention-days: 30
