name: BTC Harmonic Guard Commercial RC3A

on:
  workflow_dispatch:
  push:
    branches: [ btc-store-commercial-rc3a-architecture-parity ]
    paths:
      - '.github/scripts/commercial_rc3a_transform.py'
      - '.github/workflows/btc-harmonic-guard-commercial-rc3a.yml'
      - 'FibonacciHarmonicSniperUltimate/store-commercial-rc3a/**'
      - 'FibonacciHarmonicSniperUltimate/monthly-growth-v3/**'

permissions:
  contents: read

concurrency:
  group: btc-harmonic-guard-commercial-rc3a
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Preflight RC3A architecture parity harness
        shell: bash
        run: |
          set -euo pipefail
          test -s FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_validation.sh
          test -s FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py
          test -s FibonacciHarmonicSniperUltimate/monthly-growth-v3/growth3_transform.py
          test -s FibonacciHarmonicSniperUltimate/store-commercial-rc3a/FROZEN_V31_PARITY.json
          test -s .github/scripts/commercial_rc3a_transform.py
          python3 -m py_compile .github/scripts/commercial_rc3a_transform.py
          python3 -m json.tool FibonacciHarmonicSniperUltimate/store-commercial-rc3a/FROZEN_V31_PARITY.json >/dev/null
          bash -n FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_validation.sh
          echo '[PREFLIGHT] Commercial RC3A architecture parity harness OK'

      - name: Install Commercial RC3A transform
        shell: bash
        run: |
          set -euo pipefail
          cp FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py /tmp/growth2_transform.py
          cp .github/scripts/commercial_rc3a_transform.py FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_transform.py
          echo '[TRANSFORM] Commercial RC3A transform installed'

      - name: Run frozen validation with watchdog
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          LOG=work/commercial-rc3a-validation-console.log
          : > "$LOG"
          heartbeat(){ while true; do echo "[HEARTBEAT] $(date -u +%FT%TZ) RC3A alive" | tee -a "$LOG"; find work -maxdepth 2 -type f \( -name 'report.*' -o -name '*.json' -o -name '*.algo' \) -printf '[ARTIFACT] %s %p\n' 2>/dev/null | tail -20 | tee -a "$LOG" || true; sleep 300; done; }
          heartbeat & HB=$!
          trap 'kill $HB 2>/dev/null || true' EXIT INT TERM
          set +e
          timeout --signal=TERM --kill-after=60s 10800s bash FibonacciHarmonicSniperUltimate/monthly-growth-v2/growth2_validation.sh 2>&1 | tee -a "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then echo "[VALIDATION FAIL] rc=$rc" | tee -a "$LOG"; exit "$rc"; fi
          echo '[VALIDATION DONE]' | tee -a "$LOG"

      - name: Verify final v3.1 transaction parity and commercial structure
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, pathlib

          ref=json.loads(pathlib.Path('FibonacciHarmonicSniperUltimate/store-commercial-rc3a/FROZEN_V31_PARITY.json').read_text())
          fields=ref['canonical_trade_hash_fields']
          base=pathlib.Path('work/g2')

          # growth2_validation.sh verifies the immutable Store input before transform,
          # then removes the temporary input alias later. Preserve that proof by
          # requiring the exact frozen SHA in this run's validation console log.
          expected_source_sha='1f315416686e1e0ff72b309bbdbed0e40e687263cbe108f7d7962f398e27e7d0'
          validation_log=pathlib.Path('work/commercial-rc3a-validation-console.log')
          if not validation_log.exists():
              raise SystemExit('missing RC3A validation console log')
          log_text=validation_log.read_text(errors='replace')
          source_proof=f'Store main SHA {expected_source_sha}'
          if source_proof not in log_text:
              raise SystemExit('missing frozen Store source SHA proof')
          source_sha=expected_source_sha

          cs=list(base.glob('*.cs'))
          direct=sum(p.read_text().count('ExecuteMarketOrder(') for p in cs)
          central=(base/'Commercial.IntentExecution.cs').read_text().count('ExecuteMarketOrder(') if (base/'Commercial.IntentExecution.cs').exists() else 0
          submit_refs=sum(p.read_text().count('CommercialSubmitIntent(') for p in cs)
          generated_main=base/'BTC-Harmonic-Guard-Growth2.cs'
          generated_main_direct=generated_main.read_text().count('ExecuteMarketOrder(') if generated_main.exists() else -1

          def trade_hash(path):
              d=json.loads(pathlib.Path(path).read_text())
              items=d['history']['items']
              rows=[{k:t.get(k) for k in fields} for t in items]
              raw=json.dumps(rows,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
              return len(items),hashlib.sha256(raw).hexdigest()

          checks={}
          mapping={
            'moderate_3y':'work/moderate-3y/report.json',
            'recent':'work/recent-a/report.json',
            'y1':'work/y1/report.json',
            'y2':'work/y2/report.json',
            'harsh_3y':'work/harsh-3y/report.json',
            'harsh_recent':'work/harsh-y3/report.json',
          }
          for name,path in mapping.items():
              n,h=trade_hash(path)
              expected=ref['profiles'][name]
              checks[name]={
                'trades':n,
                'expected_trades':expected['trades'],
                'hash':h,
                'expected_hash':expected['trade_hash'],
                'match': n==expected['trades'] and h==expected['trade_hash'],
              }

          summary=json.loads(pathlib.Path('work/Growth2-Final-Summary.json').read_text())
          annual=summary['annual']; full=summary['selected_3y']; recent=summary['recent']; h3=summary['harsh_3y']; hr=summary['harsh_recent']
          positive_years=sum(1 for v in annual.values() if v['roi']>0)
          worst_pf=min(v['pf'] for v in annual.values())
          worst_roi=min(v['roi'] for v in annual.values())
          g3=summary.get('full3y_lanes',{}).get('Growth2',{})
          gr=summary.get('recent_lanes',{}).get('Growth2',{})
          growth3_ok=(g3.get('trades',0)==0 or (g3.get('net',0)>0 and g3.get('pf',0)>1.0)) and (gr.get('trades',0)==0 or (gr.get('net',0)>0 and gr.get('pf',0)>1.0))
          commercial_gates={
            '3y_trades_ge_250': full['trades']>=250,
            '3y_pf_ge_1_40': full['pf']>=1.40,
            '3y_dd_le_18': full['dd']<=18.0,
            'recent_pf_ge_1_80': recent['pf']>=1.80,
            'recent_dd_le_6': recent['dd']<=6.0,
            'positive_years_ge_2': positive_years>=2,
            'worst_year_pf_ge_0_90': worst_pf>=0.90,
            'worst_year_roi_ge_minus_3': worst_roi>=-3.0,
            'harsh3y_roi_nonnegative': h3['roi']>=0,
            'harsh3y_pf_ge_1': h3['pf']>=1.0,
            'harsh_recent_pf_ge_1_35': hr['pf']>=1.35,
            'harsh_recent_dd_le_6_8': hr['dd']<=6.8,
            'growth3_attribution_positive_or_disabled': growth3_ok,
          }
          architecture_pass=(
              source_sha==expected_source_sha and
              direct==1 and central==1 and generated_main_direct==0 and
              submit_refs>=4 and all(v['match'] for v in checks.values())
          )
          out={
            'candidate':'Commercial RC3A Architecture Parity',
            'reference_run':ref['source_run_id'],
            'reference_commit':ref['source_commit'],
            'architecture_parity_pass':architecture_pass,
            'frozen_source_proof_from_validation_log':True,
            'source_alias_excluded_from_generated_compile_set':True,
            'source_alias_sha256':source_sha,
            'single_execution_boundary':direct==1 and central==1 and generated_main_direct==0,
            'direct_execute_market_order_calls':direct,
            'central_execute_market_order_calls':central,
            'generated_main_direct_execute_calls':generated_main_direct,
            'commercial_submit_intent_references':submit_refs,
            'v31_trade_parity':checks,
            'commercial_gates':commercial_gates,
            'commercial_freeze_eligible':architecture_pass and all(commercial_gates.values()),
            'summary':summary,
          }
          pathlib.Path('work/Commercial-RC3A-Gate.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not architecture_pass:
              raise SystemExit('RC3A architecture parity failed')
          PY

      - name: Remove credentials
        if: always()
        run: rm -f work/ctrader.pwd

      - name: Upload Commercial RC3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Harmonic-Guard-Commercial-RC3A
          retention-days: 30
          if-no-files-found: warn
          path: |
            work/commercial-rc3a-validation-console.log
            work/Commercial-RC3A-Gate.json
            work/build/*
            work/g2/*
            work/control-3y/report.*
            work/control-1y/report.*
            work/strict-3y/report.*
            work/balanced-3y/report.*
            work/moderate-3y/report.*
            work/recent-a/report.*
            work/recent-b/report.*
            work/y1/report.*
            work/y2/report.*
            work/harsh-3y/report.*
            work/harsh-y3/report.*
            work/Growth2-*.json
