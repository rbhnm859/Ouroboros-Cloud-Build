name: V28 Autonomous Commercial Diagnostic Optimization

on:
  push:
    branches: [harmonybot-v28-commercial-final-rc]
    paths: ['.github/workflows/optimize-harmonybot-v28-commercial-autonomous.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Goal: diagnose low trade frequency and search safer parameter regions without Grid/risk inflation.
# Final commercial seal still requires a separate M1/Tick + true OOS validation.
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        profile: [BASE, OPENCONF, OPENMTF, OPENLEG, OPENENTRY, FREQSAFE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build hardened Mobile algo
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          mkdir -p output reports secure
          cat > cli-build/HarmonyBotPro_v261/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v28_AutonomousCommercial</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore cli-build/HarmonyBotPro_v261/HarmonyBotPro.csproj
          dotnet build cli-build/HarmonyBotPro_v261/HarmonyBotPro.csproj -c Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false 2>&1 | tee build.log
          ! grep -q ' error CS' build.log
          ALGO=$(find cli-build/HarmonyBotPro_v261 -type f -name '*.algo' | head -n1); test -n "$ALGO"
          cp "$ALGO" output/HarmonyBotPro_v28_AutonomousCommercial_Mobile.algo
          sha256sum output/HarmonyBotPro_v28_AutonomousCommercial_Mobile.algo | tee output/algo.sha256
      - name: Select FxPro Live USD 1:500
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:latest
          printf '%s' "$CTRADER_PASSWORD" > secure/pwd; chmod 600 secure/pwd
          docker run --rm -v "$PWD/secure:/secure" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/secure/pwd' ghcr.io/spotware/ctrader-console:latest accounts --environment-variables > secure/accounts.json
          python3 - <<'PY'
          import json
          d=json.load(open('secure/accounts.json',encoding='utf-8-sig'))
          m=[x for x in d if str(x.get('Broker','')).lower()=='fxpro' and bool(x.get('Live')) and str(x.get('DepositCurrency','')).upper()=='USD' and int(x.get('Leverage',0))==500]
          if not m: raise SystemExit('No FxPro Live USD 1:500 account')
          open('secure/account','w').write(str(m[0]['Number']))
          print('FxPro Live USD 1:500 selected (masked)')
          PY
          rm secure/accounts.json
      - name: Diagnostic M1 backtest
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          set -euo pipefail
          ACCOUNT=$(cat secure/account); P='${{ matrix.profile }}'
          CONF=.72; MTF=true; H4=false; LEG=.80; ENTRY=.85; SCORE=.55; PROV=.30; MAXDAY=4; COOL=10; SESSION=8
          case "$P" in
            OPENCONF) CONF=.62; SCORE=.48;;
            OPENMTF) MTF=false;;
            OPENLEG) LEG=.45;;
            OPENENTRY) ENTRY=1.35; PROV=.20;;
            FREQSAFE) CONF=.64; SCORE=.50; LEG=.55; ENTRY=1.20; PROV=.20; MAXDAY=6; COOL=5; SESSION=7;;
          esac
          OUT="reports/V28-${P}-XAUUSD-M15-1Y-M1"
          docker run --rm -v "$PWD/output:/work/output" -v "$PWD/reports:/work/reports" -v "$PWD/secure:/secure" -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/secure/pwd' -e "ACCOUNT=$ACCOUNT" ghcr.io/spotware/ctrader-console:latest backtest /work/output/HarmonyBotPro_v28_AutonomousCommercial_Mobile.algo --environment-variables --exit-on-stop --broker=FxPro --symbol=XAUUSD --period=m15 --start='12/09/2025 00:00' --end='11/09/2026 23:59' --balance=100 --data-mode=m1 --commission=35 --spread=17.14 --SymbolName=XAUUSD --RiskPercent=1.5 --MaxDrawdown=10 --DailyLossLimitPercent=4 --WeeklyLossLimitPercent=8 --SmallAccountMode=true --SmallAccountThreshold=100 --AllowMinVolumeFallback=true --MinVolumeRiskCapPercent=5 --MicroMinVolumeRiskCapPercent=10 --SessionStart="$SESSION" --SessionEnd=22 --MTFEnabled="$MTF" --H4FilterEnabled="$H4" --PatternConfidence="$CONF" --AntiHedge=true --MaxTradesPerDay="$MAXDAY" --CooldownMinutes="$COOL" --AtrPeriod=14 --SlAtrMult=1.0 --MinRR=2 --UseCostAdjustedRR=true --CommissionPerMillionPerSide=35 --MaxSpreadPips=35 --MinStopLossPips=100 --MinTakeProfitPips=200 --MinStopDistancePips=15 --MinAtrPrice=3 --MaxSlippagePips=30 --SwingDepth=5 --SwingLookback=200 --PivotScanCount=14 --MinLegAtrRatio="$LEG" --EnableGartley=true --EnableBat=true --EnableButterfly=true --EnableCrab=true --EnableCypher=true --EnableRat=true --EnableDeepGartley=true --EnableAltBat=true --EnableDeepCrab=true --EnableABCD=true --EnableShark=true --EnableFiveZero=true --GlobalMinScore="$SCORE" --ConsensusBonus=1.12 --FibTolerance=.05 --MaxEntryDeviationAtr="$ENTRY" --AdaptiveFrequencyRecovery=true --SoftMtfReversalGate=true --ClosedBarProvisionalD=true --ProvisionalDMinMoveAtr="$PROV" --CommercialRiskEngine=true --ProjectedRiskGuard=true --RiskHeadroomPercent=.25 --CompressStopToRiskBudget=true --MaxStopCompressionRatio=.90 --DisablePartialAtMinVolume=true --EnableFibGrid=false --report="/work/${OUT}.html" --report-json="/work/${OUT}.json" > "${OUT}.console.txt" 2>&1
      - name: Diagnose and score
        if: always()
        run: |
          python3 - <<'PY'
          import json,glob,os,re
          for p in glob.glob('reports/*.json'):
            d=json.load(open(p)); ts=d.get('tradeStatistics',{}); eq=d.get('equity',{})
            def v(x): return x.get('all',0) if isinstance(x,dict) else (x or 0)
            n=v(ts.get('totalTrades')); w=v(ts.get('winningTrades')); net=v(ts.get('netProfit')); pf=v(ts.get('profitFactor')); dd=eq.get('maxEquityDrawdownPercent',0)
            out={'profile':'${{ matrix.profile }}','trades':n,'wins':w,'winRatePct':100*w/n if n else 0,'netProfit':net,'profitFactor':pf,'expectancy':net/n if n else 0,'maxEquityDDPct':dd,'commercialGate':bool(n>=100 and net>0 and pf>=1.5 and dd<=10)}
            json.dump(out,open('reports/summary.json','w'),indent=2); print(json.dumps(out,indent=2))
          for p in glob.glob('reports/*.console.txt'):
            txt=open(p,errors='ignore').read(); keys=['RISK-BLOCK','COMMERCIAL-DIAG','CAPITAL','MTF','PATTERN','SIGNAL','ENTRY','TRADE']
            lines=[x for x in txt.splitlines() if any(k in x.upper() for k in keys)]
            open('reports/diagnostics.txt','w').write('\n'.join(lines[-5000:]))
          PY
      - name: Remove credentials
        if: always()
        run: rm -rf secure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V28-AUTO-${{ matrix.profile }}-XAUUSD-M15-M1
          path: |
            output/
            reports/
            build.log
          retention-days: 30
