name: HarmonyBot V49 Harmonic Family Confirmation Kernel
on:
  push:
    branches: [harmonybot/v49-harmonic-family-confirmation-kernel]
    paths:
      - 'HarmonyBot-V49/**'
      - '.github/workflows/harmonybot-v49-run.yml'
  workflow_dispatch:
concurrency:
  group: harmonybot-v49-harmonic-family-confirmation-kernel
  cancel-in-progress: true
permissions:
  contents: read
env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v49-harmonic-family-confirmation-kernel, path: control, fetch-depth: 1}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: control/HarmonyBot-V49/HarmonyBotV49.csproj
      - name: Static, geometry and deterministic build
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V49/tools/static_audit.py HarmonyBot-V49/src/HarmonyBotV49.cs
          python3 HarmonyBot-V49/tools/geometry_contract_test.py HarmonyBot-V49/src/HarmonyBotV49.cs
          mkdir -p HarmonyBot-V49/final HarmonyBot-V49/dist
          cp V49_ARCHITECTURE_AUDIT.json V49_GEOMETRY_CONTRACT_TEST.json HarmonyBot-V49/final/
          dotnet restore HarmonyBot-V49/HarmonyBotV49.csproj
          dotnet build HarmonyBot-V49/HarmonyBotV49.csproj -c Release --no-restore --nologo 2>&1 | tee HarmonyBot-V49/final/V49_BUILD.log
          ! grep -Eq '(^|[^0-9])error (CS|MSB|NETSDK)[0-9]+' HarmonyBot-V49/final/V49_BUILD.log
          ALGO=$(find HarmonyBot-V49/bin/Release -type f -name '*.algo' | head -1)
          test -n "$ALGO" && test -s "$ALGO"
          cp "$ALGO" HarmonyBot-V49/dist/HarmonyBot_V49_Harmonic_Family_Confirmation_Kernel_RC.algo
          sha256sum HarmonyBot-V49/src/HarmonyBotV49.cs "$ALGO" > HarmonyBot-V49/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V49/final/SOURCE_COMMIT.txt
      - name: V49 full-kernel smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V49/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V49/smoke-work"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V49/final"
          mkdir -p "$W/seal/algo"
          cp control/HarmonyBot-V49/dist/HarmonyBot_V49_Harmonic_Family_Confirmation_Kernel_RC.algo "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME=V49-FULL_V49_COMMERCIAL-SMOKE-B10000 START_DATE=04/01/2021 EVAL_DATE=2021-01-06T00:00:00Z END_DATE=15/01/2021 BALANCE=10000 \
            CFAUDIT=true NATIVELANES=true EXTNATIVE=true EVIDENCEBARS=12 BACKTEST_TIMEOUT_SECONDS=300 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V49/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V49/tools/audit_report.py --report "$W/seal/reports/V49-FULL_V49_COMMERCIAL-SMOKE-B10000.json" \
            --log "$W/seal/logs/V49-FULL_V49_COMMERCIAL-SMOKE-B10000.log" --out "$O/V49_SMOKE.json" \
            --window SMOKE --family FULL_V49_COMMERCIAL --years .03 --balance 10000
          python3 - "$O/V49_SMOKE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["summary_present"] and x["broker_profile_present"]
          assert x["execution_errors"]==0 and x["actual_basket_risk_violations"]==0
          assert x["margin_risk_violations"]==0 and x["unprotected_survivors"]==0
          print("[V49-SMOKE] PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v49-build-smoke
          path: |
            control/HarmonyBot-V49/dist
            control/HarmonyBot-V49/final
          retention-days: 30
          if-no-files-found: error

  dev:
    needs: build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {family: V46_SCALE_CONTROL, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: V46_SCALE_CONTROL, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: V46_SCALE_CONTROL, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: COUNTERFACTUAL_NATIVE_CONFIRM, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: COUNTERFACTUAL_NATIVE_CONFIRM, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: COUNTERFACTUAL_NATIVE_CONFIRM, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: PROVEN_PLUS_NATIVE_LANES, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: PROVEN_PLUS_NATIVE_LANES, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: PROVEN_PLUS_NATIVE_LANES, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: FULL_V49_COMMERCIAL, window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: FULL_V49_COMMERCIAL, window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: FULL_V49_COMMERCIAL, window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v49-harmonic-family-confirmation-kernel, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v49-build-smoke, path: control/HarmonyBot-V49/shared}
      - name: Prepare immutable V49 algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V49/dist
          A=$(find control/HarmonyBot-V49/shared -type f -name 'HarmonyBot_V49_Harmonic_Family_Confirmation_Kernel_RC.algo' | head -1)
          test -n "$A"; cp "$A" control/HarmonyBot-V49/dist/
      - name: Restore XAUUSD M1 cache
        uses: actions/cache@v4
        with:
          path: control/HarmonyBot-V49/window-${{ matrix.family }}-${{ matrix.window }}/seal/data
          key: ctrader-xauusd-m1-${{ matrix.window }}-${{ matrix.start }}-${{ matrix.end }}-v49
      - name: Run fixed V49 DEV
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V49/tools/*.sh
          control/HarmonyBot-V49/tools/run_window.sh "${{ matrix.family }}" "${{ matrix.window }}" "${{ matrix.start }}" "${{ matrix.eval }}" "${{ matrix.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v49-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V49/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v49-harmonic-family-confirmation-kernel, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v49-dev-*', path: control/HarmonyBot-V49/merged, merge-multiple: true}
      - name: Counterfactual forensics and preregistered performance gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V49/final
          python3 control/HarmonyBot-V49/tools/analyze_parallel_dev.py control/HarmonyBot-V49/merged control/HarmonyBot-V49/final
          echo "candidate=$(cat control/HarmonyBot-V49/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V49-CONFIRMATION-FRONTIER
          path: control/HarmonyBot-V49/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v49-harmonic-family-confirmation-kernel, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v49-build-smoke, path: control/HarmonyBot-V49/shared}
      - name: Actual capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            PROVEN_PLUS_NATIVE_LANES) EX=false;;
            FULL_V49_COMMERCIAL) EX=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V49/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V49/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V49/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V49/shared -type f -name 'HarmonyBot_V49_Harmonic_Family_Confirmation_Kernel_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V49-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE" \
            CFAUDIT=true NATIVELANES=true EXTNATIVE="$EX" EVIDENCEBARS=12 BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V49/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V49/tools/audit_report.py --report "$W/seal/reports/V49-$CANDIDATE-CAPITAL-$BALANCE.json" \
            --log "$W/seal/logs/V49-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json" \
            --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v49-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V49/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'v49-capital-*', path: capital, merge-multiple: true}
      - name: Capital gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          def good(x):
            return (x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and
                    x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 and
                    x["unprotected_survivors"]==0 and x["duplicate_reentries"]==0)
          ok=all(good(x) for x in rows.values())
          pathlib.Path("V49_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V49","rows":rows,
            "all_capital_compatible":ok,"hard_100_compatible":good(rows["100"]),"actual_100_frequency":rows["100"]["frequency"],
            "decision":"CAPITAL_PASS" if ok else "HOLD_WITH_EVIDENCE"},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          if not ok:
            pathlib.Path("V49_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V49",
              "decision":"HOLD_WITH_EVIDENCE","stage":"CAPITAL","fresh_used":False},indent=2))
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v49-capital-gate
          path: |
            V49_CAPITAL_COMPATIBILITY.json
            V49_FINAL_COMMERCIAL_DECISION.json
          if-no-files-found: ignore
          retention-days: 30

  freeze:
    needs: [analyze,capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v49-harmonic-family-confirmation-kernel, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v49-build-smoke, path: shared}
      - name: Freeze source, algo, commit and preregistered config
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V49/src/HarmonyBotV49.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V49_Harmonic_Family_Confirmation_Kernel_RC.algo"))
          c=os.environ["CANDIDATE"]
          m={"version":"HarmonyBot V49","candidate":c,"source_commit":os.environ["GITHUB_SHA"],
             "source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),
             "config":{"counterfactual_audit":True,"native_evidence_lanes":True,"extended_native_research":c=="FULL_V49_COMMERCIAL",
                       "evidence_window_completed_m1":12,"basket_risk_percent":1.0,"max_active_basket":1},
             "fresh_tuning":False,"status":"COMMERCIAL_FREEZE_CANDIDATE_FROZEN"}
          pathlib.Path("V49_FREEZE_MANIFEST.json").write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: v49-freeze-manifest, path: V49_FREEZE_MANIFEST.json, retention-days: 30}

  fresh:
    needs: [analyze,capital-gate,freeze]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with: {ref: harmonybot/v49-harmonic-family-confirmation-kernel, path: control, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {name: v49-build-smoke, path: control/HarmonyBot-V49/shared}
      - name: Exactly one untouched Fresh pair
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            PROVEN_PLUS_NATIVE_LANES) EX=false;;
            FULL_V49_COMMERCIAL) EX=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V49/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V49/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V49/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V49/shared -type f -name 'HarmonyBot_V49_Harmonic_Family_Confirmation_Kernel_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V49-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE" \
            CFAUDIT=true NATIVELANES=true EXTNATIVE="$EX" EVIDENCEBARS=12 BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V49/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V49/tools/audit_report.py --report "$W/seal/reports/V49-$CANDIDATE-FRESH-$KIND.json" \
            --log "$W/seal/logs/V49-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json" \
            --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v49-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V49/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze,capital-gate,fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'v49-fresh-*', path: fresh, merge-multiple: true}
      - name: Final commercial decision
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          def good(x):
            return (x["engineering_clean"] and x["baskets"]>0 and x["net"]>0 and x["expectancy"]>0 and x["pf"]>1 and
                    x["max_dd_pct"]<=10 and x["actual_basket_risk_violations"]==0 and x["margin_risk_violations"]==0 and
                    x["unprotected_survivors"]==0 and x["duplicate_reentries"]==0)
          ok=good(a) and good(m)
          pathlib.Path("V49_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V49","fresh_alpha":a,"fresh_100":m,
            "fresh_validation_pass":ok},indent=2))
          pathlib.Path("V49_FINAL_COMMERCIAL_DECISION.json").write_text(json.dumps({"version":"HarmonyBot V49",
            "decision":"COMMERCIAL_FREEZE_CANDIDATE_PASS" if ok else "HOLD_WITH_EVIDENCE","fresh_used":True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v49-final-decision
          path: |
            V49_FRESH_VALIDATION.json
            V49_FINAL_COMMERCIAL_DECISION.json
          retention-days: 30
