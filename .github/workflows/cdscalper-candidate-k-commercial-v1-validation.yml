name: Validate CDScalper Candidate K Commercial v1

on:
  workflow_dispatch:
  push:
    branches: [cds-k-commercial-v1]
    paths:
      - '.github/workflows/cdscalper-candidate-k-commercial-v1-validation.yml'
      - 'CumulativeDeltaScalper-EURUSD-v1/presets/eurusd_m1_candidate_k_commercial_v1.json'
      - 'CumulativeDeltaScalper-EURUSD-v1/src/**'
      - 'CumulativeDeltaScalper-EURUSD-v1/builds/**'

permissions:
  contents: read

env:
  SYMBOL: EURUSD
  PERIOD: m1
  STARTING_BALANCE: '30'
  COMMISSION_PER_MILLION: '35'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { tag: IS_1Y, start: '09/09/2024', end: '09/08/2025', spread: '0.43' }
          - { tag: OOS_1Y, start: '09/09/2025', end: '09/09/2026', spread: '0.43' }
          - { tag: FULL_2Y, start: '09/09/2024', end: '09/09/2026', spread: '0.43' }
          - { tag: RECENT_6M, start: '03/09/2026', end: '09/09/2026', spread: '0.43' }
          - { tag: OOS_STRESS_1P5X, start: '09/09/2025', end: '09/09/2026', spread: '0.65' }
          - { tag: FULL_STRESS_1P5X, start: '09/09/2024', end: '09/09/2026', spread: '0.65' }
    env:
      CTID: ${{ secrets.CTRADER_CTID }}
      ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CT_PASS: ${{ secrets.CTRADER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cds-k-commercial-v1
      - name: Run Candidate K Commercial v1 case
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          START_DATE: ${{ matrix.start }}
          END_DATE: ${{ matrix.end }}
          CASE_SPREAD: ${{ matrix.spread }}
        run: |
          set -euo pipefail
          mkdir -p backtest/reports backtest/cache/EURUSD
          cp CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo backtest/CumulativeDeltaScalper_EURUSD_v1.algo
          printf '%s' "$CT_PASS" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd
          timeout --signal=TERM --kill-after=60s 110m docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTID" -e "ACCOUNT=$ACCOUNT" -e "PWD-FILE=/work/ctrader.pwd" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/CumulativeDeltaScalper_EURUSD_v1.algo \
            --environment-variables \
            --symbol="$SYMBOL" --period="$PERIOD" \
            --start="$START_DATE" --end="$END_DATE" --balance="$STARTING_BALANCE" \
            --commission="$COMMISSION_PER_MILLION" --spread="$CASE_SPREAD" --data-mode=m1 --data-dir=/work/cache/EURUSD \
            --DeltaThreshold=150 --MinConfirmations=4 \
            --UseBarDeltaFallback=true --FallbackBelowTickDelta=2 --BarDeltaPointMultiplier=1.4 \
            --UseSessionFilter=true --OverlapOnly=true \
            --SessionStartHour=13 --SessionStartMinute=30 --SessionEndHour=15 --SessionEndMinute=30 \
            --UseWeekdayFilter=true --TradeMonday=true --TradeTuesday=true --TradeWednesday=true --TradeThursday=false --TradeFriday=true \
            --UseHtfEmaFilter=true --HtfTimeFrameName=Minute15 --EmaSlopeBars=3 --AdxThreshold=18 \
            --MinAtr=0.00008 --MaxAtr=0.00100 \
            --MaxSpreadPoints=12 --SpreadAvgMultiplier=1.5 \
            --RiskMode=FixedMoneyRisk --FixedMoneyRisk=0.75 --AutoScaleFixedRisk=true --RiskReferenceBalance=100 --MinFixedMoneyRisk=0.05 --MaxLotSize=0.03 \
            --SlAtrMultiplier=0.8 --TpAtrMultiplier=0.8 \
            --MaxDailyTrades=3 --MaxDailyLossPercent=3.0 --MaxDailyLossMoney=0.45 --DailyProfitTargetMoney=1.20 \
            --MaxConsecutiveLosses=2 --MinSecondsBetweenTrades=900 --LossCooldownMinutes=60 \
            --MaxDailyEquityDrawdownMoney=0.60 --MaxFloatingLossMoney=0.70 --MaxEquityDrawdownPercent=10 --CloseOnEquityGuard=true \
            --MaxTradeSeconds=1800 --UseBreakeven=true --BreakevenPips=1.2 --AdverseDeltaExit=true --SummaryLogging=true \
            --report="/work/reports/EURUSD-M1-K-COMM-V1-${TAG}.html" \
            --report-json="/work/reports/EURUSD-M1-K-COMM-V1-${TAG}.json" \
            --exit-on-stop
          rm -f backtest/ctrader.pwd
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K_COMM_V1_${{ matrix.tag }}
          path: backtest/reports/*
          if-no-files-found: warn
          retention-days: 14
