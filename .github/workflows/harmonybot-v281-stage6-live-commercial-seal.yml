name: HarmonyBot V28.1 Stage6 Live D1-D7-M1-M3-1Y Seal
on:
  push:
    branches: [harmonybot-v28-commercial-final-rc]
    paths: ['.github/workflows/harmonybot-v281-stage6-live-commercial-seal.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: D1, start: '15/09/2026', end: '16/09/2026', timeout: 480}
          - {label: D7, start: '09/09/2026', end: '16/09/2026', timeout: 1200}
          - {label: M1, start: '17/08/2026', end: '16/09/2026', timeout: 2400}
          - {label: M3, start: '17/06/2026', end: '16/09/2026', timeout: 5400}
          - {label: 1Y, start: '17/09/2025', end: '16/09/2026', timeout: 6600}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Generate Stage6 optimized V28.1
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_performance_stage6.py
          mkdir -p live/{build,algo,reports,logs,data}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs live/build/HarmonyBotPro.cs
          grep -q 'EnableFibGrid' live/build/HarmonyBotPro.cs
          grep -q 'GeometryQualityScore' live/build/HarmonyBotPro.cs
          grep -q '\[PERF-STAGE6\]' live/build/HarmonyBotPro.cs
      - name: Compile zero-error
        run: |
          cat > live/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v281_stage6</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore live/build/HarmonyBotPro.csproj
          dotnet build live/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee live/build.log
          ! grep -q ' error CS' live/build.log
          A=$(find live/build -name '*.algo' -type f -print -quit); test -s "$A"; cp "$A" live/algo/HarmonyBotPro_v281_stage6.algo; sha256sum live/algo/*.algo > live/algo.sha256
      - name: Resolve FxPro account
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > live/ctrader.pwd; chmod 600 live/ctrader.pwd
          docker run --rm -v "$PWD/live:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > live/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('live/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip(); m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Backtest ${{ matrix.label }}
        env: {CTRADER_CTID: '${{ secrets.CTRADER_CTID }}'}
        run: |
          set -uo pipefail; T0=$(date +%s); set +e
          timeout --signal=TERM --kill-after=20s ${{ matrix.timeout }} docker run --rm -v "$PWD/live:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest /work/algo/HarmonyBotPro_v281_stage6.algo --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" --symbol=XAUUSD --period=m1 --start='${{ matrix.start }}' --end='${{ matrix.end }}' --balance=100 --data-mode=m1 --data-dir=/work/data --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.0 --MaxDrawdown=10 --MinStopLossPips=100 --SmallAccountMode=true --SmallAccountMinSLPips=25 --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 --report=/work/reports/${{ matrix.label }}.html --report-json=/work/reports/${{ matrix.label }}.json 2>&1 | tee live/logs/${{ matrix.label }}.log
          RC=${PIPESTATUS[0]}; set -e; printf 'exit_code=%s\nseconds=%s\n' "$RC" "$(($(date +%s)-T0))" > live/${{ matrix.label }}-timing.txt
      - name: Publish live performance summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          L='${{ matrix.label }}'; p=pathlib.Path(f'live/reports/{L}.json'); log=pathlib.Path(f'live/logs/{L}.log'); d={}
          if p.exists():
            try:d=json.load(open(p))
            except:pass
          t=log.read_text(errors='ignore') if log.exists() else ''
          def val(names,default=0):
            for k in names:
              if k in d:
                try:return float(d[k] or 0)
                except:pass
            return default
          eq=val(['Equity','CurrentEquity'],100); net=val(['NetProfit'],eq-100); tr=int(val(['TotalTrades','Trades'])); wins=int(val(['WinningTrades','Wins'])); losses=max(0,tr-wins); pf=val(['ProfitFactor']); dd=val(['MaxEquityDrawdownPercentages','MaxEquityDrawdownPercentage'],999); wr=100*wins/tr if tr else 0
          rs=re.findall(r'Avg R\s+:\s+(-?[0-9.]+)',t); rr=float(rs[-1]) if rs else 0
          out={'checkpoint':L,'initial':100,'equity':eq,'net_profit':net,'return_pct':eq-100,'profit_factor':pf,'max_dd_pct':dd,'trades':tr,'wins':wins,'losses':losses,'win_rate_pct':wr,'avg_R':rr,'report_present':p.exists()}
          pathlib.Path(f'live/{L}-LIVE-PERFORMANCE.json').write_text(json.dumps(out,indent=2)); print('LIVE_PERFORMANCE='+json.dumps(out))
          with open(pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']),'a') as f:
            f.write(f"## {L} live performance\n```json\n{json.dumps(out,indent=2)}\n```\n")
          PY
        env: {PYTHONUNBUFFERED: '1'}
      - name: D1 semantic equivalence gate
        if: matrix.label == 'D1'
        run: |
          python3 - <<'PY'
          import json,sys
          d=json.load(open('live/D1-LIVE-PERFORMANCE.json'))
          ok=abs(d['equity']-104.30)<0.02 and abs(d['net_profit']-4.30)<0.02 and d['trades']==1 and d['wins']==1 and abs(d['avg_R']-4.13)<0.02
          print('D1_SEMANTIC_EQUIVALENCE=',ok)
          if not ok: sys.exit(2)
          PY
      - name: Cleanup
        if: always()
        run: rm -f live/ctrader.pwd live/accounts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V281-STAGE6-LIVE-${{ matrix.label }}
          path: |
            live/${{ matrix.label }}-LIVE-PERFORMANCE.json
            live/${{ matrix.label }}-timing.txt
            live/reports/${{ matrix.label }}.*
            live/logs/${{ matrix.label }}.log
            live/algo.sha256
            live/build.log
          retention-days: 30