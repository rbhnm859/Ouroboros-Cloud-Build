name: Validate Original Candidate K Cost Decomposition

on:
  workflow_dispatch:
  push:
    branches: [cds-k-original-commercial-validation]
    paths:
      - '.github/workflows/cdscalper-original-k-cost-decomposition.yml'

permissions:
  contents: read

env:
  SYMBOL: EURUSD
  PERIOD: m1
  STARTING_BALANCE: '30'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cds-k-original-commercial-validation
      - name: Build exact historical Candidate K
        shell: bash
        run: |
          set -euo pipefail
          dotnet build CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj -c Release -p:AlgoBuild=true
          mkdir -p out
          find CumulativeDeltaScalper-EURUSD-v1 -type f -name '*.algo' -print -exec cp {} out/ \;
          test -n "$(find out -maxdepth 1 -name '*.algo' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: CDScalper_ORIGINAL_K_DECOMP_algo
          path: out/*.algo
          retention-days: 30

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { tag: ZERO_COST_GUARD_ON_2Y, spread: '', commission: '', maxdd: '12', closeguard: 'true' }
          - { tag: SPREAD_ONLY_2Y, spread: '0.43', commission: '', maxdd: '12', closeguard: 'true' }
          - { tag: COMMISSION_ONLY_2Y, spread: '', commission: '35', maxdd: '12', closeguard: 'true' }
          - { tag: FULL_COST_GUARD_ON_2Y, spread: '0.43', commission: '35', maxdd: '12', closeguard: 'true' }
          - { tag: FULL_COST_ACCOUNT_DD_OFF_2Y, spread: '0.43', commission: '35', maxdd: '0', closeguard: 'false' }
    env:
      CTID: ${{ secrets.CTRADER_CTID }}
      ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CT_PASS: ${{ secrets.CTRADER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cds-k-original-commercial-validation
      - uses: actions/download-artifact@v4
        with:
          name: CDScalper_ORIGINAL_K_DECOMP_algo
          path: backtest
      - name: Run exact K decomposition matrix
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          CASE_SPREAD: ${{ matrix.spread }}
          CASE_COMMISSION: ${{ matrix.commission }}
          CASE_MAXDD: ${{ matrix.maxdd }}
          CASE_CLOSEGUARD: ${{ matrix.closeguard }}
        run: |
          set -euo pipefail
          ALGO="$(find backtest -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          mkdir -p backtest/reports backtest/cache/EURUSD
          printf '%s' "$CT_PASS" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd
          EXTRA=()
          if [ -n "$CASE_SPREAD" ]; then EXTRA+=(--spread="$CASE_SPREAD"); fi
          if [ -n "$CASE_COMMISSION" ]; then EXTRA+=(--commission="$CASE_COMMISSION"); fi
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTID" -e "ACCOUNT=$ACCOUNT" -e "PWD-FILE=/work/ctrader.pwd" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest "/work/$(basename "$ALGO")" \
            --environment-variables \
            --symbol="$SYMBOL" --period="$PERIOD" \
            --start='09/09/2024' --end='09/09/2026' --balance="$STARTING_BALANCE" \
            --data-mode=m1 --data-dir=/work/cache/EURUSD \
            "${EXTRA[@]}" \
            --DeltaThreshold=125 --MinConfirmations=3 \
            --UseBarDeltaFallback=true --FallbackBelowTickDelta=2 --BarDeltaPointMultiplier=1.6 \
            --UseSessionFilter=true --OverlapOnly=true \
            --SessionStartHour=14 --SessionStartMinute=0 --SessionEndHour=14 --SessionEndMinute=54 \
            --UseWeekdayFilter=true --TradeMonday=true --TradeTuesday=true --TradeWednesday=true --TradeThursday=false --TradeFriday=true \
            --UseHtfEmaFilter=true --HtfTimeFrameName=Minute15 --EmaSlopeBars=3 --AdxThreshold=16 \
            --MinAtr=0.00005 --MaxAtr=0.00105 --MaxSpreadPoints=18 --SpreadAvgMultiplier=1.8 \
            --RiskMode=FixedMoneyRisk --FixedMoneyRisk=1.0 --AutoScaleFixedRisk=true --RiskReferenceBalance=100 --MinFixedMoneyRisk=0.05 \
            --MaxLotSize=0.05 --SlAtrMultiplier=0.8 --TpAtrMultiplier=0.4 \
            --MaxDailyTrades=3 --MaxDailyLossPercent=4.0 --MaxDailyLossMoney=0.55 --DailyProfitTargetMoney=1.10 \
            --MaxConsecutiveLosses=2 --MinSecondsBetweenTrades=900 --LossCooldownMinutes=45 \
            --MaxDailyEquityDrawdownMoney=0.75 --MaxFloatingLossMoney=0.90 \
            --MaxEquityDrawdownPercent="$CASE_MAXDD" --CloseOnEquityGuard="$CASE_CLOSEGUARD" \
            --MaxTradeSeconds=1800 --UseBreakeven=true --BreakevenPips=1.0 --AdverseDeltaExit=true \
            --report="/work/reports/${TAG}.html" --report-json="/work/reports/${TAG}.json" --exit-on-stop
          rm -f backtest/ctrader.pwd
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K_DECOMP_${{ matrix.tag }}
          path: backtest/reports/*
          if-no-files-found: warn
          retention-days: 30
