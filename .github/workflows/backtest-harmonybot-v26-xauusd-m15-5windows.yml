name: HarmonyBotPro v26 XAUUSD M15 $100 FxPro 5 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - compile-harmonybot-v26-20260912
    paths:
      - '.github/workflows/backtest-harmonybot-v26-xauusd-m15-5windows.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: harmonybot-v26-xauusd-m15-five-windows
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: D7
            start: '05/09/2026 00:00'
            end: '11/09/2026 23:59'
          - label: M3
            start: '12/06/2026 00:00'
            end: '11/09/2026 23:59'
          - label: M6
            start: '12/03/2026 00:00'
            end: '11/09/2026 23:59'
          - label: 1Y
            start: '12/09/2025 00:00'
            end: '11/09/2026 23:59'
          - label: 3Y
            start: '12/09/2023 00:00'
            end: '11/09/2026 23:59'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact compiled HarmonyBotPro v26 mobile algo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p backtest/cache backtest/reports backtest/algo
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10297483882/zip" \
            -o backtest/HarmonyBotPro-v26-Mobile.zip
          unzip -o backtest/HarmonyBotPro-v26-Mobile.zip -d backtest/algo
          ALGO="$(find backtest/algo -type f -name 'HarmonyBotPro_v26_Mobile.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" backtest/HarmonyBotPro_v26_Mobile.algo
          test -s backtest/HarmonyBotPro_v26_Mobile.algo
          echo '7457dede9159e4c0cd70a695eaa47e1574b25a73f1632002a90c498851ef24a9  backtest/HarmonyBotPro_v26_Mobile.algo' | sha256sum -c -

      - name: Pull official cTrader CLI
        run: docker pull ghcr.io/spotware/ctrader-console:5.9.11

      - name: Validate cBot metadata
        run: |
          docker run --rm -v "$PWD/backtest:/work" ghcr.io/spotware/ctrader-console:5.9.11 \
            metadata /work/HarmonyBotPro_v26_Mobile.algo | tee backtest/reports/metadata-${{ matrix.label }}.txt

      - name: Create cTrader password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}" || { echo 'Missing CTRADER_PASSWORD'; exit 1; }
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd

      - name: Backtest XAUUSD M15 $100 FxPro ${{ matrix.label }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}" || { echo 'Missing CTRADER_CTID'; exit 1; }
          test -n "${CTRADER_ACCOUNT:-}" || { echo 'Missing CTRADER_ACCOUNT'; exit 1; }
          OUT="HarmonyBotPro-v26-XAUUSD-M15-100-${{ matrix.label }}"
          docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTRADER_CTID" \
            -e 'PWD-FILE=/work/ctrader.pwd' \
            -e "ACCOUNT=$CTRADER_ACCOUNT" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest /work/HarmonyBotPro_v26_Mobile.algo --environment-variables \
            --broker=fxpro --symbol=XAUUSD --period=m15 \
            --start='${{ matrix.start }}' --end='${{ matrix.end }}' \
            --balance=100 --data-mode=m1 --commission=35 \
            --SymbolName=XAUUSD \
            --RiskPercent=1.5 --MaxDrawdown=10.0 --DailyLossLimitPercent=4.0 --WeeklyLossLimitPercent=8.0 \
            --MonthlyTargetPercent=12.0 --RiskAfterMonthlyTarget=0.5 --CloseAllOnDailyLock=false \
            --AutoReprotectOnStart=true --EmergencySlAtrMult=2.0 --EmergencyTpRR=2.0 \
            --MaxConsecutiveLosses=3 --ConsecutiveLossCooldownMin=60 --MarginBufferPercent=20.0 \
            --SmallAccountMode=true --SmallAccountThreshold=100.0 --SmallAccountMinSLPips=25.0 --SmallAccountMinTPPips=50.0 \
            --AllowMinVolumeFallback=true --MinVolumeRiskCapPercent=5.0 --MicroMinVolumeRiskCapPercent=10.0 \
            --MaxNotionalToEquityRatio=500.0 \
            --SessionStart=8 --SessionEnd=22 --MTFEnabled=true --H4FilterEnabled=false --PatternConfidence=0.72 \
            --MaxConcurrentTrades=3 --MaxSameDirectionTrades=1 --AntiHedge=true --MaxTradesPerDay=4 --CooldownMinutes=10 \
            --AtrPeriod=14 --SlAtrMult=1.2 --TpCdMult=1.0 --MinRR=2.0 --UseCostAdjustedRR=true \
            --MaxSpreadPips=35.0 --MinStopLossPips=100.0 --MinTakeProfitPips=200.0 --MinStopDistancePips=15.0 \
            --MinAtrPrice=3.0 --MaxSlippagePips=30.0 \
            --SwingDepth=5 --SwingLookback=200 --PivotScanCount=14 --MinLegAtrRatio=0.8 \
            --EnableGartley=true --EnableBat=true --EnableButterfly=true --EnableCrab=true --EnableCypher=true \
            --EnableRat=true --EnableDeepGartley=true --EnableAltBat=false --EnableDeepCrab=true \
            --EnableABCD=true --EnableShark=true --EnableFiveZero=false \
            --GlobalMinScore=0.55 --ConsensusBonus=1.12 --FibTolerance=0.05 --MaxEntryDeviationAtr=0.5 \
            --MaxTradesPerPatternPercent=50 --AutoDisableLosing=true --AutoDisableWinRate=50.0 \
            --SlUpdateStepPips=2.0 --SlUpdateCooldownSec=5 --BreakEvenTriggerPips=100.0 --BreakEvenOffsetPips=10.0 \
            --TrailingTriggerPips=150.0 --TrailingDistancePips=90.0 --EnablePartialTP=true --Tp1RR=1.0 --Tp1ClosePercent=60.0 \
            --BlockNewsWindow=true --BlockedWindowsGMT='12:25-12:45;14:25-14:45' \
            --EnableFibGrid=true --GridMaxLevels=5 \
            --GridLevelFibs='0.382,0.618,0.786,1.0,1.272,1.618,2.618,4.236' \
            --GridSizeFibs='1,1,2,3,5,8,13,21' \
            --GridProfitFib=0.618 --GridStopFib=2.618 --GridMaxTotalRiskPercent=10.0 --GridCooldownMinutes=15 \
            --GridMinStepPips=20.0 --GridOnlyWithTrend=true --GridUseGoldenMath=true --GridGoldenRiskConvergence=true \
            --GridGoldenTrailCompression=true --GridBreakevenTriggerR=0.25 --GridBreakevenLockPips=5.0 \
            --GridTrailTriggerR=0.5 --GridTrailDistanceFib=0.382 --GridScaleOutEnabled=true --GridScaleOutR=0.618 \
            --GridScaleOutPercent=38.2 --GridMaxAddsPerDay=6 --GridVolatilityAdapt=true --GridDrawdownScaleRisk=true \
            --report="/work/reports/${OUT}.html" --report-json="/work/reports/${OUT}.json" \
            | tee "backtest/reports/${OUT}.console.txt"

      - name: Print compact result
        if: always()
        run: |
          python3 - <<'PY'
          import json, glob, os
          for p in glob.glob('backtest/reports/*.json'):
              print('\n===== '+os.path.basename(p)+' =====')
              try:
                  d=json.load(open(p,encoding='utf-8-sig'))
              except Exception as e:
                  print('JSON parse error:',e); continue
              def walk(x,prefix=''):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          lk=k.lower()
                          if any(s in lk for s in ['netprofit','profitfactor','drawdown','trades','winrate','winning','losing','balance','equity','sharpe','sortino']):
                              if not isinstance(v,(dict,list)):
                                  print(f'{prefix}{k}: {v}')
                          walk(v,prefix+k+'.')
                  elif isinstance(x,list):
                      for i,v in enumerate(x[:3]): walk(v,prefix+f'[{i}].')
              walk(d)
          PY

      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v26-XAUUSD-M15-100-${{ matrix.label }}
          path: |
            backtest/reports/*${{ matrix.label }}*
          if-no-files-found: warn
          retention-days: 30
