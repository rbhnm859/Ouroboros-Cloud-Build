name: HarmonyBot V74 R18 Gate Replay From Sealed Artifacts

# Manual only. Re-runs ONLY the Python evaluator on window artifacts that an
# earlier R18 run already sealed. It never touches cTrader, never uses secrets
# and never changes a gate threshold. It refuses to run when any runtime-semantic
# file differs between the source run commit and this commit.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run id of a completed R18 run whose window artifacts are reused'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: harmonybot-v74-gate-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
      - name: Fingerprint guard (fail closed when runtime semantics changed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          case "$SRC_RUN" in ''|*[!0-9]*) echo "[REPLAY-REFUSED] source_run_id must be numeric"; exit 1;; esac
          SRC_SHA=$(gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN" --jq '.head_sha')
          SRC_STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN" --jq '.status')
          echo "[REPLAY] source_run=$SRC_RUN source_sha=$SRC_SHA status=$SRC_STATUS current_sha=${{ github.sha }} $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') Taipei GMT+8"
          test "$SRC_STATUS" = "completed" || { echo "[REPLAY-REFUSED] source run not completed"; exit 1; }
          # Seal before hydration: five successful source windows AND their GitHub
          # artifact digests are required. A green job without artifacts is not proof.
          gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN" > /tmp/r18-source-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN/jobs?per_page=100" > /tmp/r18-source-jobs.json
          gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN/artifacts?per_page=100" > /tmp/r18-source-artifacts.json
          python3 - <<'PY_CUSTODY'
          import json,re
          run=json.load(open('/tmp/r18-source-run.json'))
          jobs=json.load(open('/tmp/r18-source-jobs.json')).get('jobs',[])
          artifacts=json.load(open('/tmp/r18-source-artifacts.json')).get('artifacts',[])
          needed={f'r18_semantic_universe (Y{y})' for y in range(2016,2021)}
          needed.add('r18_build')
          good={j['name'] for j in jobs if j.get('conclusion')=='success'}
          arts={a['name']:a for a in artifacts}
          expected={f'v74-r18-semantic-Y{y}' for y in range(2016,2021)}
          if (run.get('status'),run.get('conclusion'))!=('completed','success') or (
              run.get('path')!='.github/workflows/harmonybot-v74-r18-semantic.yml' or
              run.get('head_branch')!='harmonybot/v73-opportunity-universe'):
              raise SystemExit('[REPLAY-REFUSED] wrong source workflow/branch or failed run')
          if not needed<=good:
              raise SystemExit('[REPLAY-REFUSED] unsuccessful source jobs: '+repr(sorted(needed-good)))
          if not expected<=set(arts):
              raise SystemExit('[REPLAY-REFUSED] missing annual artifacts: '+repr(sorted(expected-set(arts))))
          for name in sorted(expected):
              a=arts[name]
              if a.get('expired') or not re.fullmatch(r'sha256:[a-f0-9]{64}',str(a.get('digest',''))):
                  raise SystemExit('[REPLAY-REFUSED] expired/unverifiable artifact: '+name)
          print('[REPLAY-CUSTODY] five successful windows and five unexpired digest-addressed artifacts verified')
          PY_CUSTODY
          cd control
          git cat-file -e "$SRC_SHA^{commit}" || { echo "[REPLAY-REFUSED] source commit not reachable"; exit 1; }
          CHANGED=$(git diff --name-only "$SRC_SHA" "${{ github.sha }}" -- \
            HarmonyBot-V71/src \
            HarmonyBot-V71/HarmonyBotV71.csproj \
            HarmonyBot-V71/tools/run_r18_semantic_window.sh \
            HarmonyBot-V71/tools/run_backtest.sh \
            HarmonyBot-V71/tools/resolve_window.sh \
            HarmonyBot-V71/tools/v74_r18_outcome.py || true)
          if [ -n "$CHANGED" ]; then
            echo "[REPLAY-REFUSED] runtime-semantic files changed since source run; a full cTrader re-run is required:"
            echo "$CHANGED"
            exit 1
          fi
          echo "[REPLAY-OK] runtime-semantic fingerprint unchanged"
      - uses: actions/download-artifact@v4
        with:
          pattern: v74-r18-semantic-Y*
          path: merged
          merge-multiple: false
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify downloaded annual log custody before evaluator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SEALED'
          import hashlib,json,pathlib,re
          for y in range(2016,2021):
              w=f'Y{y}'
              root=pathlib.Path('merged')/f'v74-r18-semantic-{w}'
              custody=root/'R18_SEMANTIC_CUSTODY.json'
              if not custody.is_file(): raise SystemExit('[REPLAY-REFUSED] missing '+str(custody))
              d=json.loads(custody.read_text())
              if d.get('schema')!='V74_R18_SEMANTIC_CUSTODY_V1' or d.get('window')!=w or d.get('data_mode')!='ticks' or d.get('tick_time_semantics')!='FORWARD' or any(d.get(k) is not False for k in ('burned_used','validation_used','fresh_used')):
                  raise SystemExit('[REPLAY-REFUSED] annual semantic custody mismatch: '+w)
              logs=list((root/'raw-logs').glob('*-R15.log'))
              if len(logs)!=1: raise SystemExit('[REPLAY-REFUSED] annual log missing/ambiguous: '+w)
              actual=hashlib.sha256(logs[0].read_bytes()).hexdigest()
              if actual!=d.get('evidence_sha256') or not re.fullmatch(r'[a-f0-9]{64}',str(d.get('tick_sha256',''))):
                  raise SystemExit('[REPLAY-REFUSED] SHA256 custody mismatch: '+w)
          print('[REPLAY-CUSTODY] five sealed annual evidence SHA256 values match source logs')
          PY_SEALED
      - name: Evaluate sealed windows
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          echo "[REPLAY-GATE-START] $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') Taipei GMT+8"
          python3 control/HarmonyBot-V71/tools/evaluate_v74_r18_semantics.py merged research
          test -s research/V74_R18_SEMANTIC_MANIFEST.json
          echo "[REPLAY-GATE-END] $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') Taipei GMT+8"
      - name: Gate summary (observability only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 control/HarmonyBot-V71/tools/r18_report.py gate research/V74_R18_SEMANTIC_MANIFEST.json "${{ job.status }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V74-R18-GATE-REPLAY-${{ inputs.source_run_id }}
          path: research
          retention-days: 90
