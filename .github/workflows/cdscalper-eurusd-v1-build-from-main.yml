name: Build CDScalper EURUSD v1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cdscalper-eurusd-v1-build-from-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout cds-eurusd-v1 branch
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Set supported TargetFramework
        shell: bash
        run: |
          set -euo pipefail
          PROJ='CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
          test -f "$PROJ"
          sed -i 's#<TargetFramework>net7.0</TargetFramework>#<TargetFramework>net6.0</TargetFramework>#' "$PROJ"

      - name: Restore and build CDScalper .algo
        shell: bash
        run: |
          set -euo pipefail
          PROJ='CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
          test -f "$PROJ"
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c Release -p:AlgoName=CumulativeDeltaScalper_EURUSD_v1 -p:AlgoBuild=true -p:AlgoPublish=false -p:IncludeSource=true | tee /tmp/cdscalper-build.log

      - name: Locate and stage .algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'CumulativeDeltaScalper-EURUSD-v1/builds'
          ALGO=$(find 'CumulativeDeltaScalper-EURUSD-v1/bin/Release' -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" 'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo'
          sha256sum 'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo' | tee 'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256'
          file 'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo'

      - name: Write build result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'CumulativeDeltaScalper-EURUSD-v1/reports'
          {
            echo '# Build Result'
            echo
            echo '- Status: success'
            echo '- Build method: GitHub Actions ubuntu-latest + dotnet build + cTrader.Automate NuGet'
            echo '- Project: CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
            echo '- Artifact: CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo'
            echo '- SHA256: see CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256'
            echo
            echo 'This file is expected to be a real cTrader .algo produced by the cTrader.Automate build pipeline, not a renamed zip file.'
          } > 'CumulativeDeltaScalper-EURUSD-v1/reports/build_result.md'

      - name: Commit .algo to cds-eurusd-v1 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo' \
                  'CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256' \
                  'CumulativeDeltaScalper-EURUSD-v1/reports/build_result.md'
          git commit -m 'Generate CumulativeDeltaScalper EURUSD v1 algo'
          git push origin HEAD:cds-eurusd-v1

      - name: Upload compiled .algo
        uses: actions/upload-artifact@v4
        with:
          name: CumulativeDeltaScalper_EURUSD_v1
          path: |
            CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
            CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo.sha256
          retention-days: 14
