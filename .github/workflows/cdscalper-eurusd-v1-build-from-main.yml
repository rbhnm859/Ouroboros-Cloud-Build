name: Build CDScalper EURUSD v1 from main

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cdscalper-eurusd-v1-build-from-main.yml'

permissions:
  contents: write

jobs:
  build_cdscalper_algo:
    name: Build cTrader .algo
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout cds-eurusd-v1 branch
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore and build cTrader .algo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
          if (!(Test-Path $project)) {
            throw "Missing project file: $project"
          }
          dotnet --info
          dotnet restore $project
          dotnet build $project -c Release -p:AlgoName=CumulativeDeltaScalper_EURUSD_v1 -p:AlgoBuild=true -p:AlgoPublish=false -p:IncludeSource=true

      - name: Copy generated .algo to builds folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'CumulativeDeltaScalper-EURUSD-v1'
          $builds = Join-Path $root 'builds'
          New-Item -ItemType Directory -Force -Path $builds | Out-Null
          $algos = Get-ChildItem -Path $root -Recurse -Filter '*.algo' -ErrorAction SilentlyContinue
          if (-not $algos -or $algos.Count -eq 0) {
            throw 'cTrader.Automate build completed but no .algo file was found.'
          }
          $selected = $algos | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $target = Join-Path $builds 'CumulativeDeltaScalper_EURUSD_v1.algo'
          Copy-Item $selected.FullName $target -Force
          Write-Host "Selected: $($selected.FullName)"
          Write-Host "Copied to: $target"

      - name: Write success build report
        shell: pwsh
        run: |
          $report = 'CumulativeDeltaScalper-EURUSD-v1/reports/build_result.md'
          $text = @"
# Build Result

- Status: success
- Build method: GitHub Actions windows-latest + dotnet build + cTrader.Automate NuGet
- Project: CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj
- Artifact: CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
- Generated at: $(Get-Date -Format o)

This is intended to be a real cTrader .algo generated by the cTrader.Automate build pipeline, not a renamed zip file.
"@
          Set-Content -Path $report -Value $text -Encoding UTF8

      - name: Commit .algo back to cds-eurusd-v1
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo CumulativeDeltaScalper-EURUSD-v1/reports/build_result.md
          git status --short
          git commit -m 'Generate CumulativeDeltaScalper EURUSD v1 algo'
          git push origin HEAD:cds-eurusd-v1

      - name: Upload algo artifact
        uses: actions/upload-artifact@v4
        with:
          name: CumulativeDeltaScalper_EURUSD_v1.algo
          path: CumulativeDeltaScalper-EURUSD-v1/builds/CumulativeDeltaScalper_EURUSD_v1.algo
