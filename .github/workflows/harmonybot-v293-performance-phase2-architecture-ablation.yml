name: HarmonyBot V29.3 Performance Phase-2 Architecture Ablation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harmonybot-v293-performance-phase2-architecture-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccde79d22c0389ba64d9bb26a2e54379d81c91e
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build exact frozen V29.3
        run: |
          set -euo pipefail
          python3 tmp/harmonybot-v26-build/build_v261_frequency.py
          python3 tmp/harmonybot-v26-build/fix_v261_mtf_overload.py
          python3 tmp/harmonybot-v26-build/fix_v262_frequency_safe.py
          python3 tmp/harmonybot-v26-build/fix_v262_grid_guard_band.py
          python3 tmp/harmonybot-v26-build/fix_v27_commercial_rc.py
          python3 tmp/harmonybot-v26-build/fix_v28_frequency_architecture.py
          python3 tmp/harmonybot-v26-build/fix_v28_cost_rr.py
          python3 tmp/harmonybot-v26-build/fix_v281_geometry_quality_engine.py
          python3 tmp/harmonybot-v26-build/fix_v281_commercial_onepass.py
          python3 tmp/harmonybot-v26-build/fix_v282_strategy_quality_rc.py
          python3 tmp/harmonybot-v26-build/fix_v283_execution_quality.py
          python3 tmp/harmonybot-v26-build/fix_v284_capital_aware_precision.py
          python3 tmp/harmonybot-v26-build/fix_v29_persistent_prz_execution.py
          python3 tmp/harmonybot-v26-build/fix_v291_small_account_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_small_account_fast_execution.py
          python3 tmp/harmonybot-v26-build/fix_v292_grid_lifecycle_hotfix.py
          python3 tmp/harmonybot-v26-build/fix_v293_grid_risk_cap_hotfix.py
          mkdir -p seal/{build,algo}
          cp cli-build/HarmonyBotPro_v261/HarmonyBotPro.cs seal/build/HarmonyBotPro.cs
          grep -Fq 'V29.3-Grid-Risk-Cap-Hotfix-RC' seal/build/HarmonyBotPro.cs
          cat > seal/build/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net6.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AlgoName>HarmonyBotPro_v293_phase2</AlgoName><AlgoBuild>true</AlgoBuild><AlgoPublish>false</AlgoPublish><IncludeSource>false</IncludeSource></PropertyGroup><ItemGroup><PackageReference Include="cTrader.Automate" Version="1.0.19" /></ItemGroup></Project>
          EOF
          dotnet restore seal/build/HarmonyBotPro.csproj
          dotnet build seal/build/HarmonyBotPro.csproj -c Release --no-restore 2>&1 | tee seal/build.log
          ! grep -q ' error CS' seal/build.log
          A=$(find seal/build -name '*.algo' -type f -print -quit); test -n "$A"; test -s "$A"
          cp "$A" seal/algo/HarmonyBotPro_v293_phase2.algo
          sha256sum seal/build/HarmonyBotPro.cs seal/algo/*.algo > seal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: V293-PHASE2-BUILD
          path: seal
          retention-days: 30

  development:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate: [BASE100, MTF_OFF100, GEOM_OFF100, PATTERN_TOL100, NON_GRID100, ATR15_QUALITY60]
        window:
          - { id: DEV-A, start: '04/01/2021', eval: '2021-01-11T00:00:00Z', end: '30/06/2021' }
          - { id: DEV-B, start: '01/07/2021', eval: '2021-07-08T00:00:00Z', end: '31/12/2021' }
          - { id: DEV-C, start: '03/01/2022', eval: '2022-01-10T00:00:00Z', end: '30/06/2022' }
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CANDIDATE: ${{ matrix.candidate }}
      WINDOW_ID: ${{ matrix.window.id }}
      START_DATE: ${{ matrix.window.start }}
      EVAL_DATE: ${{ matrix.window.eval }}
      END_DATE: ${{ matrix.window.end }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V293-PHASE2-BUILD
          path: seal
      - name: Resolve FxPro demo 1:500 USD account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip()
          m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or m.get('DepositCurrency')!='USD' or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Candidate override
        run: |
          case "$CANDIDATE" in
            BASE100) EXTRA="";;
            MTF_OFF100) EXTRA="--MTFEnabled=false --H4FilterEnabled=false";;
            GEOM_OFF100) EXTRA="--EnableGeometryQualityEngine=false";;
            PATTERN_TOL100) EXTRA="--FibTolerance=0.07";;
            NON_GRID100) EXTRA="--EnableFibGrid=false";;
            ATR15_QUALITY60) EXTRA="--MinAtrPrice=1.5 --MinGeometryQuality=0.60 --MinPrzConfluence=0.60";;
            *) exit 2;;
          esac
          echo "EXTRA_ARGS=$EXTRA" >> "$GITHUB_ENV"
      - name: Development $100 coarse backtest
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="p2-${CANDIDATE,,}-${WINDOW_ID,,}-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v293_phase2.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start="$START_DATE" --end="$END_DATE" --balance=100 --data-mode=m1 --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD \
            --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 \
            --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 \
            --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso="$EVAL_DATE" \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 \
            --V29PendingMinCompositeQuality=0.58 --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 \
            --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 \
            --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true --V292EarlyTriggerMinQuality=0.66 \
            --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 \
            $EXTRA_ARGS \
            --report="/work/reports/${CANDIDATE}-${WINDOW_ID}.html" --report-json="/work/reports/${CANDIDATE}-${WINDOW_ID}.json" > "seal/logs/${CANDIDATE}-${WINDOW_ID}.log" 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<6000;i+=4)); do
            if test -s "seal/reports/${CANDIDATE}-${WINDOW_ID}.json" && python3 - <<PY
          import json
          m=json.load(open('seal/reports/${CANDIDATE}-${WINDOW_ID}.json',encoding='utf-8-sig')).get('main',{})
          raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 4
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          test "$DONE" = 1
      - name: Basket, pattern, funnel and small-cap audit
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,statistics
          c=os.environ['CANDIDATE']; w=os.environ['WINDOW_ID']
          rp=pathlib.Path(f'seal/reports/{c}-{w}.json'); lp=pathlib.Path(f'seal/logs/{c}-{w}.log')
          if not rp.exists():
              pathlib.Path(f'seal/audit/{c}-{w}.json').write_text(json.dumps({'candidate':c,'window':w,'status':'DATA_UNAVAILABLE_OR_BACKTEST_FAILED'},indent=2)); raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore') if lp.exists() else ''
          groups={}
          for x in h:
              key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'entryPrice':key[3],'closeTime':0,'net':0.0})
              g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0))
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime'])
          children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
          pats=re.findall(r'\[TRADE\]\s+(\S+)\s+',t)
          baskets=[{'pattern':pats[i] if i<len(pats) else 'Unknown','direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'net':g['net'],'grid_children':0} for i,g in enumerate(mains)]
          for ch in children:
              cand=[b for b in baskets if b['direction']==ch['direction'] and b['entryTime']<=ch['entryTime']<=b['closeTime']]
              if not cand: cand=[b for b in baskets if b['direction']==ch['direction'] and 0<=ch['entryTime']-b['entryTime']<=4*60*60*1000]
              if cand:
                  b=max(cand,key=lambda z:z['entryTime']); b['net']+=ch['net']; b['grid_children']+=1; b['closeTime']=max(b['closeTime'],ch['closeTime'])
          vals=[b['net'] for b in baskets]; wins=[x for x in vals if x>0]; losses=[x for x in vals if x<0]
          gw=sum(wins); gl=abs(sum(losses)); pf=gw/gl if gl>0 else (999 if gw>0 else 0); net=sum(vals); exp=net/len(vals) if vals else 0
          wr=100*len(wins)/len(vals) if vals else 0; aw=sum(wins)/len(wins) if wins else 0; al=sum(losses)/len(losses) if losses else 0; rr=aw/abs(al) if aw>0 and al<0 else None
          dd=float(eq.get('maxEquityDrawdownPercent',0) or 0)
          def last_int(name,default=0):
              m=re.findall(rf'{name}=(\d+)',t); return int(m[-1]) if m else default
          diag={k:last_int(v) for k,v in {
            'detected_signals_post_atr':'signals','orders':'orders','risk_blocked':'riskBlocked','atr_blocked':'atrBlocked',
            'budget_blocked':'budgetBlocked','mtf_blocked':'mtfBlocked','geometry_blocked':'geometryBlocked',
            'volume_blocked':'volumeBlocked','duplicate_blocked':'duplicateBlocked','capital_infeasible':'capitalInfeasible',
            'geometry_valid':'geometryValid','geometry_quality_rejected':'geometryQualityRejected'}.items()}
          diag.update({
            'precision_ready':last_int('precisionReady'),'precision_wait':last_int('precisionWait'),
            'capital_hard_reject':last_int('capitalHardReject'),'native_risk_reject':last_int('nativeRiskReject'),
            'pending_created':last_int('pendingCreated'),'pending_executed':last_int('pendingExecuted'),
            'tactical_executed':last_int('tacticalExecuted'),'early_trigger':last_int('earlyTrigger'),
            'margin_warning_events':len(re.findall(r'\[MARGIN\]',t)),
            'min_volume_skip_log_events':len(re.findall(r'Native min-volume risk .*trade skipped',t)),
            'min_volume_fallback_log_events':len(re.findall(r'Native min-volume fallback',t)),
            'spread_warning_events':len(re.findall(r'\[SKIP\] Spread',t)),
            'raw_harmonic_signals':'UNOBSERVABLE_BEFORE_ATR_IN_V29.3_TELEMETRY',
            'session_rejects':'UNOBSERVABLE_IN_V29.3_TELEMETRY',
            'cooldown_rejects':'UNOBSERVABLE_IN_V29.3_TELEMETRY'
          })
          bypat={}; split={'grid':[],'non_grid':[]}
          for b in baskets:
              bypat.setdefault(b['pattern'],[]).append(b['net'])
              split['grid' if b['grid_children']>0 else 'non_grid'].append(b['net'])
          def stats(v):
              W=[x for x in v if x>0]; L=[x for x in v if x<0]; g=sum(W); l=abs(sum(L)); P=g/l if l>0 else (999 if g>0 else 0)
              return {'count':len(v),'net':sum(v),'pf':P,'wr_pct':100*len(W)/len(v) if v else 0,'expectancy':sum(v)/len(v) if v else 0}
          pattern={k:stats(v) for k,v in bypat.items()}
          grid_split={k:stats(v) for k,v in split.items()}
          loss_abs=sorted([abs(x) for x in losses],reverse=True); total_loss=sum(loss_abs)
          tail={
            'largest_loss':min(losses) if losses else 0,
            'median_loss':statistics.median(losses) if losses else 0,
            'top1_loss_contribution_pct':100*sum(loss_abs[:1])/total_loss if total_loss else 0,
            'top3_loss_contribution_pct':100*sum(loss_abs[:3])/total_loss if total_loss else 0,
            'top5_loss_contribution_pct':100*sum(loss_abs[:5])/total_loss if total_loss else 0
          }
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          out={'candidate':c,'window':w,'status':'OK','initial_capital':100,'baskets':len(vals),'pf':pf,'net':net,'expectancy':exp,'win_rate_pct':wr,'realized_rr':rr,'max_dd_pct':dd,'execution_errors':errs,'funnel':diag,'pattern':pattern,'grid_split':grid_split,'tail':tail}
          pathlib.Path(f'seal/audit/{c}-{w}.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-DEV-${{ matrix.candidate }}-${{ matrix.window.id }}
          path: seal/audit
          retention-days: 30

  dev_gate:
    needs: development
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      winner: ${{ steps.gate.outputs.winner }}
      has_winner: ${{ steps.gate.outputs.has_winner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PHASE2-DEV-*
          path: all
          merge-multiple: true
      - id: gate
        name: Development gate + filter contribution matrix
        run: |
          python3 - <<'PY'
          import json,glob,statistics,os,pathlib
          cs=['BASE100','MTF_OFF100','GEOM_OFF100','PATTERN_TOL100','NON_GRID100','ATR15_QUALITY60']; ws=['DEV-A','DEV-B','DEV-C']; M={}; passed=[]
          for c in cs:
              rows=[]
              for w in ws:
                  p=glob.glob(f'all/**/{c}-{w}.json',recursive=True)
                  if p:
                      x=json.load(open(p[0]))
                      if x.get('status')=='OK': rows.append(x)
              rec={'candidate':c,'windows':{x['window']:x for x in rows}}
              if len(rows)==3:
                  active=sum(x['baskets']>0 for x in rows); pfs=[x['pf'] for x in rows if x['baskets']>0]; nets=[x['net'] for x in rows]; dds=[x['max_dd_pct'] for x in rows]
                  total_baskets=sum(x['baskets'] for x in rows); total_net=sum(nets); total_exp=total_net/total_baskets if total_baskets else 0
                  rec.update({'active_windows':active,'total_baskets':total_baskets,'worst_pf':min(pfs) if pfs else 0,'median_pf':statistics.median(pfs) if pfs else 0,'total_net':total_net,'total_expectancy':total_exp,'max_window_dd':max(dds),'execution_errors':sum(x['execution_errors'] for x in rows)})
                  rec['dev_gate_pass']=bool(c not in ['BASE100','NON_GRID100'] and active==3 and total_baskets>=18 and max(dds)<=10 and min(pfs)>1 and total_net>0 and total_exp>0 and sum(x['execution_errors'] for x in rows)==0)
              else: rec['dev_gate_pass']=False
              if rec['dev_gate_pass']: passed.append(c)
              M[c]=rec
          base=M.get('BASE100',{})
          contributions={}
          for c in ['MTF_OFF100','GEOM_OFF100','PATTERN_TOL100','NON_GRID100','ATR15_QUALITY60']:
              rr=[]
              for w in ws:
                  b=base.get('windows',{}).get(w); x=M.get(c,{}).get('windows',{}).get(w)
                  if b and x:
                      rr.append({'window':w,'trade_delta':x['baskets']-b['baskets'],'pf_delta':x['pf']-b['pf'],'expectancy_delta':x['expectancy']-b['expectancy'],'dd_delta':x['max_dd_pct']-b['max_dd_pct']})
              contributions[c]=rr
          passed.sort(key=lambda c:(M[c]['worst_pf'],M[c]['median_pf'],M[c]['total_net'],M[c]['total_baskets']),reverse=True)
          winner=passed[0] if passed else ''
          out={'winner':winner,'passed':passed,'matrix':M,'filter_contribution_vs_BASE100':contributions,'gate':'all 3 windows active; >=18 baskets; every window DD<=10 and PF>1; total Net/Expectancy>0; zero execution errors; reference/non-grid diagnostic excluded from winner'}
          pathlib.Path('PHASE2-DEVELOPMENT-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'winner={winner}\n'); f.write('has_winner='+('true' if winner else 'false')+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PHASE2-DEVELOPMENT-GATE
          path: PHASE2-DEVELOPMENT-GATE.json
          retention-days: 30

  validation:
    needs: dev_gate
    if: needs.dev_gate.outputs.has_winner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
      CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
      CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CANDIDATE: ${{ needs.dev_gate.outputs.winner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V293-PHASE2-BUILD
          path: seal
      - name: Resolve FxPro account
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > seal/ctrader.pwd; chmod 600 seal/ctrader.pwd
          docker run --rm -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 accounts --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd > seal/accounts.json
          N=$(python3 - <<'PY'
          import json,os
          a=json.load(open('seal/accounts.json',encoding='utf-8-sig')); e=os.environ['CTRADER_ACCOUNT'].strip(); m=next((x for x in a if str(x.get('Number',''))==e or str(x.get('Id',''))==e),None)
          if not m or m.get('Broker','').lower()!='fxpro' or m.get('Live') is not False or int(m.get('Leverage',0))!=500: raise SystemExit('account mismatch')
          print(m['Number'])
          PY
          ); echo "CTRADER_ACCOUNT_NUMBER=$N" >> "$GITHUB_ENV"
      - name: Frozen winner override
        run: |
          case "$CANDIDATE" in
            MTF_OFF100) EXTRA="--MTFEnabled=false --H4FilterEnabled=false";;
            GEOM_OFF100) EXTRA="--EnableGeometryQualityEngine=false";;
            PATTERN_TOL100) EXTRA="--FibTolerance=0.07";;
            ATR15_QUALITY60) EXTRA="--MinAtrPrice=1.5 --MinGeometryQuality=0.60 --MinPrzConfluence=0.60";;
            *) exit 2;;
          esac
          echo "EXTRA_ARGS=$EXTRA" >> "$GITHUB_ENV"
      - name: VAL-2 $100 server ticks
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p seal/{reports,logs,data,audit}
          C="p2-val2-${GITHUB_RUN_ID}"
          docker run --name "$C" -v "$PWD/seal:/work" ghcr.io/spotware/ctrader-console:5.9.11 backtest \
            /work/algo/HarmonyBotPro_v293_phase2.algo \
            --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT_NUMBER" \
            --symbol=XAUUSD --period=m1 --start=01/07/2020 --end=31/12/2020 --balance=100 --data-mode=ticks --data-dir=/work/data \
            --commission=35 --spread=1 --SymbolName=XAUUSD --RiskPercent=1.40 --MaxSlippagePips=70 --MaxDrawdown=10 --MinStopLossPips=100 \
            --SmallAccountMode=true --SmallAccountMinSLPips=25 --EnableAltBat=true --EnableFiveZero=true --EnableFibGrid=true --MinRR=2 \
            --GridProfitFib=1.618 --GridStopFib=1.618 --EnableCapitalAwarePrecisionEntry=true --PrecisionPrzMaxDistanceAtr=0.45 --PrecisionMaxWaitAtr=1.25 \
            --CapitalSafetyHeadroom=0.98 --CapGridStopToRiskBudget=true --EvaluationStartUtcIso=2020-07-08T00:00:00Z \
            --V29PersistentPrzQueue=true --V29PendingMaxBars=90 --V29PendingGlobalMax=12 --V29PendingPerPatternMax=3 --V29PendingMinCompositeQuality=0.58 \
            --V29PendingTriggerMaxPrzAtr=0.85 --V29HighQualityPrzBonusAtr=0.35 --V29CandidateReplacementMargin=0.03 --V29WarmupSeedPending=true --V29MaxOrderAttemptsPerCandidate=3 \
            --V291SmallAccountTacticalExecution=true --V291TacticalBudgetUse=0.98 --V291RequireMicroConfirmation=true --V291MinTacticalRR=2.0 \
            --V292FastSmallAccountExecution=true --V292MicroPivotBars=2 --V292MicroPivotAtrBuffer=0.04 --V292EnableCapitalCapStop=true --V292EnableEarlyTrigger=true \
            --V292EarlyTriggerMinQuality=0.66 --V292EarlyTriggerMaxPrzAtr=0.95 --V292MicroBodyMinAtr=0.02 --V292WickBodyConfirmRatio=0.25 $EXTRA_ARGS \
            --report=/work/reports/VAL2.html --report-json=/work/reports/VAL2.json > seal/logs/VAL2.log 2>&1 &
          PID=$!; DONE=0
          for ((i=0;i<9600;i+=5)); do
            if test -s seal/reports/VAL2.json && python3 - <<'PY'
          import json
          m=json.load(open('seal/reports/VAL2.json',encoding='utf-8-sig')).get('main',{}); raise SystemExit(0 if 'endingEquity' in m and 'netProfit' in m else 1)
          PY
            then DONE=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          docker stop --time 3 "$C" >/dev/null 2>&1 || true; docker rm -f "$C" >/dev/null 2>&1 || true; wait "$PID" 2>/dev/null || true
          if test "$DONE" != 1; then echo '{"status":"DATA_UNAVAILABLE_OR_BACKTEST_FAILED","val_gate_pass":false}' > seal/audit/VAL2-GATE.json; exit 0; fi
      - name: VAL-2 basket gate
        if: always()
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          rp=pathlib.Path('seal/reports/VAL2.json'); lp=pathlib.Path('seal/logs/VAL2.log'); c=os.environ['CANDIDATE']
          if not rp.exists(): raise SystemExit(0)
          d=json.load(open(rp,encoding='utf-8-sig')); h=d.get('history',{}).get('items',[]); eq=d.get('equity',{}); t=lp.read_text(errors='ignore') if lp.exists() else ''
          groups={}
          for x in h:
              key=(str(x.get('label','')),str(x.get('direction','')).lower(),int(x.get('entryTime',0) or 0),round(float(x.get('entryPrice',0) or 0),5))
              g=groups.setdefault(key,{'label':key[0],'direction':key[1],'entryTime':key[2],'entryPrice':key[3],'closeTime':0,'net':0.0}); g['net']+=float(x.get('net',0) or 0); g['closeTime']=max(g['closeTime'],int(x.get('closeTime',0) or 0))
          mains=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro'],key=lambda z:z['entryTime']); children=sorted([g for g in groups.values() if g['label']=='HarmonyBotPro-G'],key=lambda z:z['entryTime'])
          baskets=[{'direction':g['direction'],'entryTime':g['entryTime'],'closeTime':g['closeTime'],'net':g['net']} for g in mains]
          for ch in children:
              cand=[b for b in baskets if b['direction']==ch['direction'] and b['entryTime']<=ch['entryTime']<=b['closeTime']]
              if not cand: cand=[b for b in baskets if b['direction']==ch['direction'] and 0<=ch['entryTime']-b['entryTime']<=4*60*60*1000]
              if cand: b=max(cand,key=lambda z:z['entryTime']); b['net']+=ch['net']; b['closeTime']=max(b['closeTime'],ch['closeTime'])
          vals=[b['net'] for b in baskets]; wins=[x for x in vals if x>0]; losses=[x for x in vals if x<0]; gw=sum(wins); gl=abs(sum(losses))
          pf=gw/gl if gl>0 else (999 if gw>0 else 0); net=sum(vals); exp=net/len(vals) if vals else 0; wr=100*len(wins)/len(vals) if vals else 0
          aw=sum(wins)/len(wins) if wins else 0; al=sum(losses)/len(losses) if losses else 0; rr=aw/abs(al) if aw>0 and al<0 else None; dd=float(eq.get('maxEquityDrawdownPercent',0) or 0)
          errs=len([x for x in t.splitlines() if re.search(r'InvalidRequest|Invalid Volume|Insufficient Margin|unprotected position|unexpected hedge',x,re.I)])
          out={'candidate':c,'status':'OK','data_mode':'ticks','initial_capital':100,'baskets':len(vals),'pf':pf,'net':net,'expectancy':exp,'win_rate_pct':wr,'realized_rr':rr,'max_dd_pct':dd,'execution_errors':errs,'val_gate_pass':bool(len(vals)>=10 and dd<=10 and pf>1 and net>0 and exp>0 and errs==0)}
          pathlib.Path('seal/audit/VAL2-GATE.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Cleanup
        if: always()
        run: rm -f seal/ctrader.pwd seal/accounts.json; rm -rf seal/data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-VAL2
          path: |
            seal/audit
            seal/reports
            seal/logs
          retention-days: 30

  decision:
    needs: [dev_gate, validation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PHASE2-DEVELOPMENT-GATE
          path: out/dev
      - uses: actions/download-artifact@v4
        if: needs.dev_gate.outputs.has_winner == 'true'
        with:
          name: PHASE2-VAL2
          path: out/val
      - name: Phase-2 decision
        run: |
          python3 - <<'PY'
          import json,pathlib
          dev=json.load(open('out/dev/PHASE2-DEVELOPMENT-GATE.json')); vp=pathlib.Path('out/val/audit/VAL2-GATE.json'); val=json.load(open(vp)) if vp.exists() else {'status':'NOT_RUN','val_gate_pass':False}
          advance=bool(dev.get('winner') and val.get('val_gate_pass'))
          out={'source_version':'V29.3','source_changed':False,'engineering_freeze':'PASS','development_winner':dev.get('winner',''),'development_gate':dev,'validation':val,'phase2_status':'ADVANCE_TO_OOS_WF' if advance else 'HOLD','performance_freeze':'OPEN' if advance else 'FAIL_STAGE1','final_holdout':'UNTOUCHED_NOT_RUN','final_commercial_freeze':'HOLD'}
          pathlib.Path('PHASE2-FINAL-DECISION.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V293-PERFORMANCE-PHASE2-DECISION
          path: PHASE2-FINAL-DECISION.json
          retention-days: 30
