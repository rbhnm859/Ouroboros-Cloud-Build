name: Build HarmonyBotPro v18 Mobile

on:
  push:
    branches:
      - build/harmonybotpro-v18-mobile-20260911
    paths:
      - '.github/workflows/build-harmonybotpro-v18-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Recreate uploaded v18 source
        run: |
          mkdir -p cli-build/HarmonyBotPro
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, hashlib
          payload = "[... ELLIPSIZATION ...]"
          src = gzip.decompress(base64.b64decode(payload))
          expected = '68de9e46fb38f24f6b0356357abe48c5bb948b07fc5381aa096022862db5b892'
          actual = hashlib.sha256(src).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch: {actual}')
          Path('cli-build/HarmonyBotPro/HarmonyBotPro.cs').write_bytes(src)
          print('source sha256:', actual)
          PYCODE
          cat > cli-build/HarmonyBotPro/HarmonyBotPro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <AlgoName>HarmonyBotPro-v18-Mobile</AlgoName>
              <AlgoBuild>true</AlgoBuild>
              <AlgoPublish>false</AlgoPublish>
              <IncludeSource>false</IncludeSource>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="cTrader.Automate" Version="1.0.19" />
            </ItemGroup>
          </Project>
          EOF

      - name: Restore
        run: dotnet restore cli-build/HarmonyBotPro/HarmonyBotPro.csproj

      - name: Build Release ALGO
        run: dotnet build cli-build/HarmonyBotPro/HarmonyBotPro.csproj -c Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false

      - name: Collect ALGO
        run: |
          mkdir -p output
          ALGO=$(find cli-build/HarmonyBotPro -type f -name '*.algo' -print -quit)
          test -n "$ALGO"
          cp "$ALGO" output/HarmonyBotPro-v18-Mobile.algo
          sha256sum output/HarmonyBotPro-v18-Mobile.algo | tee output/HarmonyBotPro-v18-Mobile.sha256
          ls -lh output/HarmonyBotPro-v18-Mobile.algo

      - name: Upload Mobile ALGO
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v18-Mobile
          path: |
            output/HarmonyBotPro-v18-Mobile.algo
            output/HarmonyBotPro-v18-Mobile.sha256
          if-no-files-found: error
          retention-days: 30
