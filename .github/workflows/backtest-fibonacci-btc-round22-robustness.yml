name: BTC Round22 Robustness validation

on:
  workflow_dispatch:
  push:
    branches: [ btc-round22-capital-efficiency ]
    paths:
      - 'FibonacciHarmonicSniperUltimate/versions/v0.21.0-btc-round22-capital-efficiency/robustness_split_half.sh'
      - '.github/workflows/backtest-fibonacci-btc-round22-robustness.yml'

permissions:
  contents: read

concurrency:
  group: fibonacci-btc-round22-robustness
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: h1-standard, start: '08/09/2025 00:00', end: '09/03/2026 00:00', commission: 65, spread: 0 }
          - { id: h2-standard, start: '09/03/2026 00:00', end: '08/09/2026 00:00', commission: 65, spread: 0 }
          - { id: h1-harsh, start: '08/09/2025 00:00', end: '09/03/2026 00:00', commission: 100, spread: 1500 }
          - { id: h2-harsh, start: '09/03/2026 00:00', end: '08/09/2026 00:00', commission: 100, spread: 1500 }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Run split-half control validation
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: bash FibonacciHarmonicSniperUltimate/versions/v0.21.0-btc-round22-capital-efficiency/robustness_split_half.sh "${{ matrix.id }}" "${{ matrix.start }}" "${{ matrix.end }}" "${{ matrix.commission }}" "${{ matrix.spread }}"
      - name: Remove credentials
        if: always()
        run: rm -f work/ctrader.pwd
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Round22-Robustness-${{ matrix.id }}
          path: |
            work/${{ matrix.id }}/comparison.json
            work/${{ matrix.id }}/control/report.json
            work/${{ matrix.id }}/balanced/report.json
            work/${{ matrix.id }}/control/report.log
            work/${{ matrix.id }}/balanced/report.log
          if-no-files-found: warn
          retention-days: 30
