name: Validate CDScalper K Commercial v3

on:
  workflow_dispatch:
  push:
    branches: [cds-k-commercial-v3-architecture]
    paths:
      - '.github/workflows/cdscalper-k-commercial-v3-validation.yml'
      - 'CumulativeDeltaScalper-K-Commercial-v3/**'

permissions:
  contents: read

env:
  SYMBOL: EURUSD
  PERIOD: m1
  STARTING_BALANCE: '30'
  COMMISSION_PER_MILLION: '35'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cds-k-commercial-v3-architecture
      - name: Build K Commercial v3
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet build CumulativeDeltaScalper-K-Commercial-v3/CumulativeDeltaScalper_K_Commercial_v3.csproj -c Release -p:AlgoBuild=true
          mkdir -p out
          find CumulativeDeltaScalper-K-Commercial-v3 -type f -name '*.algo' -print -exec cp {} out/ \;
          test -n "$(find out -maxdepth 1 -name '*.algo' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K_COMM_V3_algo
          path: out/*.algo
          retention-days: 14

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { tag: IS_1Y, start: '09/09/2024', end: '09/08/2025', spread: '0.43' }
          - { tag: OOS_1Y, start: '09/09/2025', end: '09/09/2026', spread: '0.43' }
          - { tag: FULL_2Y, start: '09/09/2024', end: '09/09/2026', spread: '0.43' }
          - { tag: RECENT_6M, start: '03/09/2026', end: '09/09/2026', spread: '0.43' }
          - { tag: OOS_STRESS_1P5X, start: '09/09/2025', end: '09/09/2026', spread: '0.65' }
          - { tag: FULL_STRESS_1P5X, start: '09/09/2024', end: '09/09/2026', spread: '0.65' }
    env:
      CTID: ${{ secrets.CTRADER_CTID }}
      ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
      CT_PASS: ${{ secrets.CTRADER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cds-k-commercial-v3-architecture
      - uses: actions/download-artifact@v4
        with:
          name: CDScalper_K_COMM_V3_algo
          path: backtest
      - name: Run K Commercial v3 tick validation
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          START_DATE: ${{ matrix.start }}
          END_DATE: ${{ matrix.end }}
          CASE_SPREAD: ${{ matrix.spread }}
        run: |
          set -euo pipefail
          ALGO="$(find backtest -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          mkdir -p backtest/reports backtest/cache/EURUSD
          printf '%s' "$CT_PASS" | tr -d '\r\n' > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd
          timeout --signal=TERM --kill-after=60s 140m docker run --rm \
            -v "$PWD/backtest:/work" \
            -e "CTID=$CTID" -e "ACCOUNT=$ACCOUNT" -e "PWD-FILE=/work/ctrader.pwd" \
            ghcr.io/spotware/ctrader-console:5.9.11 \
            backtest "/work/$(basename "$ALGO")" \
            --environment-variables \
            --symbol="$SYMBOL" --period="$PERIOD" \
            --start="$START_DATE" --end="$END_DATE" --balance="$STARTING_BALANCE" \
            --commission="$COMMISSION_PER_MILLION" --spread="$CASE_SPREAD" \
            --data-mode=tick --data-dir=/work/cache/EURUSD \
            --MinTicksPerBar=20 --ImbalanceTrigger=0.18 --PersistenceBars=3 --MinSameDirectionBars=2 --EntryScoreMin=0.62 \
            --SessionStartHour=12 --SessionStartMinute=30 --SessionEndHour=16 --SessionEndMinute=30 \
            --AdxMinimum=16 --MinAtr=0.00005 --MaxAtr=0.00120 \
            --MaxSpreadPoints=15 --MaxSpreadAtrRatio=0.25 \
            --FixedMoneyRisk=0.90 --RiskReferenceBalance=100 --MinFixedMoneyRisk=0.05 --HardMaxLossMoney=1.00 --MaxLotSize=0.03 \
            --SlAtrMultiplier=0.80 --RewardRisk=1.00 --BreakevenAtR=0.80 --BreakevenBufferPips=0.20 --MaxTradeMinutes=45 \
            --MaxDailyTrades=4 --MaxDailyLossMoney=0.60 --MaxConsecutiveLosses=2 --LossCooldownMinutes=45 --MinMinutesBetweenTrades=10 \
            --DebugLogging=false \
            --report="/work/reports/EURUSD-M1-K-COMM-V3-${TAG}.html" \
            --report-json="/work/reports/EURUSD-M1-K-COMM-V3-${TAG}.json" \
            --exit-on-stop
          rm -f backtest/ctrader.pwd
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDScalper_K_COMM_V3_${{ matrix.tag }}
          path: backtest/reports/*
          if-no-files-found: warn
          retention-days: 14
