name: cTrader Credential Admission
on:
  pull_request:
    branches: ['harmonybot/v73-opportunity-universe']
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/ctrader-credential-admission.yml']
permissions:
  contents: read
jobs:
  admission:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/m3-execution-stability-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout, downloads, account login, model call or trading execution.
      - name: Verify existing credential availability without exposing values
        shell: bash
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          printf 'Source: %s\n' "$SOURCE_SHA"
          date -u +%FT%TZ
          for name in CTRADER_CTID CTRADER_PASSWORD CTRADER_ACCOUNT; do
            if [ -n "${!name:-}" ]; then
              printf '%s: AVAILABLE\n' "$name"
            else
              printf '%s: MISSING\n' "$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            printf 'BLOCKED: required credentials unavailable to this authorized PR job.\n'
            exit 1
          fi
          printf 'PASS: presence only. Authentication, demo identity and account-session isolation NOT VERIFIED.\n'
