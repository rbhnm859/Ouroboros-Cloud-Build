name: Fibonacci Research1 3M 4-symbol screening

on:
  push:
    branches:
      - fibonacci-research1-build
    paths:
      - '.github/workflows/backtest-fibonacci-research1-3m-4symbols.yml'
      - 'research/fibonacci-research1/**'
      - 'tools/create_fibonacci_research1.py'
      - 'Fibonacci-v0.3.0-fix3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibonacci-research1-3m-4symbols
  cancel-in-progress: true

env:
  CTRADER_IMAGE: ghcr.io/spotware/ctrader-console:5.9.11
  RESEARCH_BALANCE: '10000'
  TEST_START: '08/06/2026 00:00'
  TEST_END: '08/09/2026 00:00'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create Research1 candidate
        run: python3 tools/create_fibonacci_research1.py --repo-root "$PWD" --force
      - name: Enable trading in ephemeral build copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Fibonacci-v0.4.0-research1/FibonacciHarmonicSniperUltimate.cs')
          s=p.read_text(encoding='utf-8')
          old='[Parameter("Trading Enabled", DefaultValue = false'
          new='[Parameter("Trading Enabled", DefaultValue = true'
          if old not in s: raise SystemExit('Trading Enabled parameter not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build cBot
        run: |
          docker pull "$CTRADER_IMAGE"
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$CTRADER_IMAGE" -c \
            'dotnet restore Fibonacci-v0.4.0-research1/FibonacciHarmonicSniperUltimate.csproj && \
             dotnet build Fibonacci-v0.4.0-research1/FibonacciHarmonicSniperUltimate.csproj \
             --configuration Release --no-restore -p:AlgoPublish=False -p:IncludeSource=True'
          mkdir -p build-artifact
          ALGO="$(find Fibonacci-v0.4.0-research1 -type f -name '*.algo' -print -quit)"
          test -n "$ALGO"
          cp "$ALGO" build-artifact/FibonacciHarmonicSniperUltimate.algo
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-research1-3m-algo
          path: build-artifact/FibonacciHarmonicSniperUltimate.algo
          if-no-files-found: error
          retention-days: 30

  verify-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify FxPro account symbols
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CTRADER_CTID:-}"
          test -n "${CTRADER_ACCOUNT:-}"
          test -n "${CTRADER_PASSWORD:-}"
          mkdir -p symbol-check
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > symbol-check/ctrader.pwd
          docker pull "$CTRADER_IMAGE"
          docker run --rm -v "$PWD/symbol-check:/work" "$CTRADER_IMAGE" \
            symbols --ctid="$CTRADER_CTID" --pwd-file=/work/ctrader.pwd --account="$CTRADER_ACCOUNT" \
            | tee symbol-check/symbols.txt
          for s in EURUSD XAUUSD BITCOIN ETHEREUM; do
            grep -Fxq "$s" symbol-check/symbols.txt || { echo "Required symbol not found: $s"; exit 2; }
          done
          rm -f symbol-check/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibonacci-research1-symbol-list
          path: symbol-check/symbols.txt
          if-no-files-found: warn
          retention-days: 7

  backtest:
    needs: [build, verify-symbols]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [EURUSD, XAUUSD, BITCOIN, ETHEREUM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fibonacci-research1-3m-algo
          path: backtest
      - name: Credentials
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          test -n "${CTRADER_PASSWORD:-}"
          umask 077
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
      - name: Run six finite profiles
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}
        run: |
          set -euo pipefail
          mkdir -p backtest/cache backtest/reports
          mapfile -t PROFILES < <(python3 - <<'PY'
          import json
          print('\n'.join(json.load(open('research/fibonacci-research1/profiles.json'))))
          PY
          )
          for PROFILE in "${PROFILES[@]}"; do
            echo "=== ${{ matrix.symbol }} / $PROFILE ==="
            mapfile -t PROFILE_ARGS < <(python3 research/fibonacci-research1/profile_args.py "$PROFILE")
            timeout --signal=TERM --kill-after=30s 10m docker run --rm \
              -v "$PWD/backtest:/work" \
              -e "CTID=$CTRADER_CTID" \
              -e 'PWD-FILE=/work/ctrader.pwd' \
              -e "ACCOUNT=$CTRADER_ACCOUNT" \
              "$CTRADER_IMAGE" \
              backtest /work/FibonacciHarmonicSniperUltimate.algo \
              --environment-variables --exit-on-stop \
              --symbol="${{ matrix.symbol }}" \
              --period=h1 \
              --start="$TEST_START" \
              --end="$TEST_END" \
              --balance="$RESEARCH_BALANCE" \
              --data-mode=m1 \
              --data-dir=/work/cache \
              --commission-auto \
              --precise-conversion \
              --RiskPercent=1.0 \
              "${PROFILE_ARGS[@]}" \
              --report="/work/reports/${PROFILE}-${{ matrix.symbol }}.html" \
              --report-json="/work/reports/${PROFILE}-${{ matrix.symbol }}.json"
          done
      - name: Remove credentials
        if: always()
        run: rm -f backtest/ctrader.pwd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibonacci-research1-3m-${{ matrix.symbol }}
          path: backtest/reports/*-${{ matrix.symbol }}.*
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fibonacci-research1-3m-*
          path: reports
          merge-multiple: true
      - name: Summarize results
        run: |
          python3 research/fibonacci-research1/summarize_3m.py \
            --reports-dir reports \
            --json-output fibonacci-research1-3m-summary.json \
            --md-output fibonacci-research1-3m-summary.md
          cat fibonacci-research1-3m-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fibonacci-research1-3m-summary
          path: |
            fibonacci-research1-3m-summary.json
            fibonacci-research1-3m-summary.md
          if-no-files-found: error
          retention-days: 30
