name: HarmonyBot V43 Pattern Native Structural Routing Portfolio

on:
  push:
    branches:
      - harmonybot/v43-pattern-native-structural-routing-portfolio
    paths:
      - 'HarmonyBot-V43/**'
      - '.github/workflows/harmonybot-v43-pattern-native-structural-routing.yml'
  workflow_dispatch:

concurrency:
  group: harmonybot-v43-pattern-native-structural-routing
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
  CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
  CTRADER_ACCOUNT: ${{ secrets.CTRADER_ACCOUNT }}

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v43-pattern-native-structural-routing-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: control/HarmonyBot-V43/HarmonyBotV43.csproj
      - name: Static audit and build once
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 HarmonyBot-V43/tools/static_audit.py HarmonyBot-V43/src/HarmonyBotV43.cs
          mkdir -p HarmonyBot-V43/final HarmonyBot-V43/dist
          cp V43_ARCHITECTURE_AUDIT.json HarmonyBot-V43/final/
          dotnet restore HarmonyBot-V43/HarmonyBotV43.csproj
          dotnet build HarmonyBot-V43/HarmonyBotV43.csproj -c Release --no-restore --nologo 2>&1 | tee HarmonyBot-V43/final/V43_BUILD.log
          ! grep -Eq '(^|[^0-9])error (CS|MSB|NETSDK)[0-9]+' HarmonyBot-V43/final/V43_BUILD.log
          ALGO=$(find HarmonyBot-V43/bin/Release -type f -name '*.algo' | head -1)
          test -n "$ALGO" && test -s "$ALGO"
          cp "$ALGO" HarmonyBot-V43/dist/HarmonyBot_V43_Pattern_Native_Structural_Routing_Portfolio_RC.algo
          sha256sum HarmonyBot-V43/src/HarmonyBotV43.cs "$ALGO" > HarmonyBot-V43/final/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > HarmonyBot-V43/final/SOURCE_COMMIT.txt
      - name: Ultra-short engineering smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/HarmonyBot-V43/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V43/smoke-work"
          O="$GITHUB_WORKSPACE/control/HarmonyBot-V43/final"
          mkdir -p "$W/seal/algo"
          cp control/HarmonyBot-V43/dist/HarmonyBot_V43_Pattern_Native_Structural_Routing_Portfolio_RC.algo "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME=V43-FULL_V43-SMOKE-B10000 START_DATE=04/01/2021 EVAL_DATE=2021-01-06T00:00:00Z END_DATE=15/01/2021 BALANCE=10000 \
            RESCUE=true OCMODEL=true FOLLOW=true THESISEXIT=true CONVERSION=true REPLAN=true FALLBACK=true ROUTEWATCH=true EVENTLIFE=true NATIVEEVID=true ROUTEREFRESH=true TTL=8 MAXCAND=12 BACKTEST_TIMEOUT_SECONDS=300 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V43/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V43/tools/audit_report.py \
            --report "$W/seal/reports/V43-FULL_V43-SMOKE-B10000.json" --log "$W/seal/logs/V43-FULL_V43-SMOKE-B10000.log" \
            --out "$O/V43_SMOKE.json" --window SMOKE --family FULL_V43 --years .03 --balance 10000
          python3 - "$O/V43_SMOKE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["summary_present"] and x["broker_profile_present"]
          assert x["execution_errors"]==0 and x["actual_basket_risk_violations"]==0
          assert x["margin_risk_violations"]==0 and x["unprotected_survivors"]==0
          print("[V43-SMOKE] PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v43-build-smoke
          path: |
            control/HarmonyBot-V43/dist
            control/HarmonyBot-V43/final
          retention-days: 30

  dev:
    needs: build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {family: V42_REPLAY, routewatch: "false", eventlife: "false", nativeevid: "false", routerefresh: "false", window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: V42_REPLAY, routewatch: "false", eventlife: "false", nativeevid: "false", routerefresh: "false", window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: V42_REPLAY, routewatch: "false", eventlife: "false", nativeevid: "false", routerefresh: "false", window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: ROUTE_WATCH, routewatch: "true", eventlife: "false", nativeevid: "false", routerefresh: "true", window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: ROUTE_WATCH, routewatch: "true", eventlife: "false", nativeevid: "false", routerefresh: "true", window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: ROUTE_WATCH, routewatch: "true", eventlife: "false", nativeevid: "false", routerefresh: "true", window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: STRUCTURAL_LIFETIME, routewatch: "true", eventlife: "true", nativeevid: "false", routerefresh: "true", window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: STRUCTURAL_LIFETIME, routewatch: "true", eventlife: "true", nativeevid: "false", routerefresh: "true", window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: STRUCTURAL_LIFETIME, routewatch: "true", eventlife: "true", nativeevid: "false", routerefresh: "true", window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
          - {family: FULL_V43, routewatch: "true", eventlife: "true", nativeevid: "true", routerefresh: "true", window: A, start: "04/01/2021", eval: "2021-01-11T00:00:00Z", end: "30/06/2021"}
          - {family: FULL_V43, routewatch: "true", eventlife: "true", nativeevid: "true", routerefresh: "true", window: B, start: "01/07/2021", eval: "2021-07-08T00:00:00Z", end: "31/12/2021"}
          - {family: FULL_V43, routewatch: "true", eventlife: "true", nativeevid: "true", routerefresh: "true", window: C, start: "03/01/2022", eval: "2022-01-10T00:00:00Z", end: "30/06/2022"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v43-pattern-native-structural-routing-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v43-build-smoke
          path: control/HarmonyBot-V43/shared
      - name: Prepare immutable algo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V43/dist
          A=$(find control/HarmonyBot-V43/shared -type f -name 'HarmonyBot_V43_Pattern_Native_Structural_Routing_Portfolio_RC.algo' | head -1)
          test -n "$A"; cp "$A" control/HarmonyBot-V43/dist/
      - name: Restore persistent XAUUSD M1 cache
        uses: actions/cache@v4
        with:
          path: control/HarmonyBot-V43/window-${{ matrix.family }}-${{ matrix.window }}/seal/data
          key: ctrader-xauusd-m1-${{ matrix.window }}-${{ matrix.start }}-${{ matrix.end }}-v1
      - name: Run one V43 structural DEV window
        shell: bash
        run: |
          chmod +x control/HarmonyBot-V43/tools/*.sh
          control/HarmonyBot-V43/tools/run_window.sh \
            "${{ matrix.family }}" "${{ matrix.window }}" "${{ matrix.start }}" "${{ matrix.eval }}" "${{ matrix.end }}" \
            "${{ matrix.routewatch }}" "${{ matrix.eventlife }}" "${{ matrix.nativeevid }}" "${{ matrix.routerefresh }}"
      - name: Upload window evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v43-dev-${{ matrix.family }}-${{ matrix.window }}
          path: control/HarmonyBot-V43/output-${{ matrix.family }}-${{ matrix.window }}
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v43-pattern-native-structural-routing-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v43-dev-*
          path: control/HarmonyBot-V43/merged
          merge-multiple: true
      - name: Paired structural marginal cohort + cross-validation + V36 gates
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/HarmonyBot-V43/final
          python3 control/HarmonyBot-V43/tools/analyze_parallel_dev.py control/HarmonyBot-V43/merged control/HarmonyBot-V43/final
          echo "candidate=$(cat control/HarmonyBot-V43/final/candidate.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HARMONYBOT-V43-STRUCTURAL-ROUTING-FRONTIER
          path: control/HarmonyBot-V43/final
          retention-days: 30

  capital:
    needs: analyze
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        balance: [100,150,200,300,500,1000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v43-pattern-native-structural-routing-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v43-build-smoke
          path: control/HarmonyBot-V43/shared
      - name: Run capital compatibility
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            V42_REPLAY) RW=false; EL=false; NE=false; RR=false;;
            ROUTE_WATCH) RW=true; EL=false; NE=false; RR=true;;
            STRUCTURAL_LIFETIME) RW=true; EL=true; NE=false; RR=true;;
            FULL_V43) RW=true; EL=true; NE=true; RR=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V43/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V43/capital-$BALANCE"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V43/capital-out-$BALANCE"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V43/shared -type f -name 'HarmonyBot_V43_Pattern_Native_Structural_Routing_Portfolio_RC.algo' | head -1)
          cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V43-$CANDIDATE-CAPITAL-$BALANCE" START_DATE=04/01/2021 EVAL_DATE=2021-01-11T00:00:00Z END_DATE=30/06/2022 BALANCE="$BALANCE" \
            RESCUE=true OCMODEL=true FOLLOW=true THESISEXIT=true CONVERSION=true REPLAN=true FALLBACK=true ROUTEWATCH="$RW" EVENTLIFE="$EL" NATIVEEVID="$NE" ROUTEREFRESH="$RR" TTL=8 MAXCAND=12 BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V43/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V43/tools/audit_report.py --report "$W/seal/reports/V43-$CANDIDATE-CAPITAL-$BALANCE.json" \
            --log "$W/seal/logs/V43-$CANDIDATE-CAPITAL-$BALANCE.log" --out "$O/$BALANCE.json" \
            --window "CAPITAL_$BALANCE" --family "$CANDIDATE" --years 1.5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v43-capital-${{ matrix.balance }}
          path: control/HarmonyBot-V43/capital-out-${{ matrix.balance }}
          retention-days: 30

  capital-gate:
    needs: [analyze,capital]
    if: needs.analyze.outputs.candidate != ''
    runs-on: ubuntu-24.04
    outputs:
      capok: ${{ steps.cap.outputs.capok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v43-capital-*
          path: capital
          merge-multiple: true
      - name: Apply hard $100 positive-net gate
        id: cap
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("capital")
          rows={str(b):json.load(open(next(p.rglob(f"{b}.json")))) for b in [100,150,200,300,500,1000]}
          h=rows["100"]
          ok=(h["engineering_clean"] and h["baskets"]>0 and h["net"]>0 and h["expectancy"]>0 and h["pf"]>1 and
              h["max_dd_pct"]<=10 and h["actual_basket_risk_violations"]==0 and h["margin_risk_violations"]==0)
          pathlib.Path("V43_CAPITAL_COMPATIBILITY.json").write_text(json.dumps({"version":"HarmonyBot V43","rows":rows,
            "hard_100_compatible":ok,"status":"CAPITAL_COMPATIBLE" if ok else "CAPITAL_HOLD"},indent=2))
          pathlib.Path("cap.out").write_text("true" if ok else "false")
          PY
          echo "capok=$(cat cap.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v43-capital-gate
          path: V43_CAPITAL_COMPATIBILITY.json
          retention-days: 30

  freeze:
    needs: [analyze,capital-gate]
    if: needs.capital-gate.outputs.capok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v43-pattern-native-structural-routing-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v43-build-smoke
          path: shared
      - name: Freeze source/algo
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          src=pathlib.Path("control/HarmonyBot-V43/src/HarmonyBotV43.cs")
          algo=next(pathlib.Path("shared").rglob("HarmonyBot_V43_Pattern_Native_Structural_Routing_Portfolio_RC.algo"))
          m={"version":"HarmonyBot V43","candidate":os.environ["CANDIDATE"],"source_commit":os.environ["GITHUB_SHA"],
             "source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"algo_sha256":hashlib.sha256(algo.read_bytes()).hexdigest(),
             "fresh_tuning":False,"status":"ALPHA_AND_CAPITAL_FROZEN"}
          pathlib.Path("V43_FREEZE_MANIFEST.json").write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v43-freeze-manifest
          path: V43_FREEZE_MANIFEST.json
          retention-days: 30

  fresh:
    needs: [analyze,freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {kind: ALPHA, balance: 10000}
          - {kind: SMALL, balance: 100}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonybot/v43-pattern-native-structural-routing-portfolio
          path: control
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v43-build-smoke
          path: control/HarmonyBot-V43/shared
      - name: Untouched Fresh validation
        shell: bash
        env:
          CANDIDATE: ${{ needs.analyze.outputs.candidate }}
          KIND: ${{ matrix.kind }}
          BALANCE: ${{ matrix.balance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            V42_REPLAY) RW=false; EL=false; NE=false; RR=false;;
            ROUTE_WATCH) RW=true; EL=false; NE=false; RR=true;;
            STRUCTURAL_LIFETIME) RW=true; EL=true; NE=false; RR=true;;
            FULL_V43) RW=true; EL=true; NE=true; RR=true;;
            *) exit 31;;
          esac
          chmod +x control/HarmonyBot-V43/tools/*.sh
          W="$GITHUB_WORKSPACE/control/HarmonyBot-V43/fresh-$KIND"; O="$GITHUB_WORKSPACE/control/HarmonyBot-V43/fresh-out-$KIND"
          mkdir -p "$W/seal/algo" "$O"
          A=$(find control/HarmonyBot-V43/shared -type f -name 'HarmonyBot_V43_Pattern_Native_Structural_Routing_Portfolio_RC.algo' | head -1); cp "$A" "$W/seal/algo/"
          (
            cd "$W"
            RUN_NAME="V43-$CANDIDATE-FRESH-$KIND" START_DATE=02/01/2020 EVAL_DATE=2020-01-09T00:00:00Z END_DATE=30/06/2020 BALANCE="$BALANCE" \
            RESCUE=true OCMODEL=true FOLLOW=true THESISEXIT=true CONVERSION=true REPLAN=true FALLBACK=true ROUTEWATCH="$RW" EVENTLIFE="$EL" NATIVEEVID="$NE" ROUTEREFRESH="$RR" TTL=8 MAXCAND=12 BACKTEST_TIMEOUT_SECONDS=1800 \
            "$GITHUB_WORKSPACE/control/HarmonyBot-V43/tools/run_backtest.sh"
          )
          python3 control/HarmonyBot-V43/tools/audit_report.py --report "$W/seal/reports/V43-$CANDIDATE-FRESH-$KIND.json" \
            --log "$W/seal/logs/V43-$CANDIDATE-FRESH-$KIND.log" --out "$O/$KIND.json" \
            --window "FRESH_$KIND" --family "$CANDIDATE" --years .5 --balance "$BALANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v43-fresh-${{ matrix.kind }}
          path: control/HarmonyBot-V43/fresh-out-${{ matrix.kind }}
          retention-days: 30

  final-decision:
    needs: [analyze,fresh]
    if: always() && needs.fresh.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v43-fresh-*
          path: fresh
          merge-multiple: true
      - name: Final commercial gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("fresh"); a=json.load(open(next(p.rglob("ALPHA.json")))); m=json.load(open(next(p.rglob("SMALL.json"))))
          ok=(a["engineering_clean"] and a["baskets"]>0 and a["net"]>0 and a["expectancy"]>0 and a["pf"]>1 and a["max_dd_pct"]<=10 and
              m["engineering_clean"] and m["baskets"]>0 and m["net"]>0 and m["expectancy"]>0 and m["pf"]>1 and m["max_dd_pct"]<=10)
          pathlib.Path("V43_FRESH_VALIDATION.json").write_text(json.dumps({"version":"HarmonyBot V43","fresh_alpha":a,"fresh_100":m,
            "fresh_validation_pass":ok,"commercial_release_decision":"PASS_TO_FINAL_REGRESSION" if ok else "HOLD"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v43-final-decision
          path: V43_FRESH_VALIDATION.json
          retention-days: 30
