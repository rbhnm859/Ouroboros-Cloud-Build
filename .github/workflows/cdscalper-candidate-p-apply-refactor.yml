name: Apply CDScalper Candidate P MultiFX Refactor

on:
  workflow_dispatch:
  push:
    branches: [cds-eurusd-v1]
    paths:
      - 'CumulativeDeltaScalper-EURUSD-v1/tools/apply_candidate_p_multifx_refactor.py'
      - '.github/workflows/cdscalper-candidate-p-apply-refactor.yml'

permissions:
  contents: write

jobs:
  refactor-and-compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cds-eurusd-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Candidate P refactor
        shell: pwsh
        run: |
          python CumulativeDeltaScalper-EURUSD-v1/tools/apply_candidate_p_multifx_refactor.py

      - name: Structural sanity checks
        shell: pwsh
        run: |
          $p='CumulativeDeltaScalper-EURUSD-v1/src/CumulativeDeltaScalper_EURUSD_v1.cs'
          $s=Get-Content $p -Raw
          $required=@('UseNormalizedAtrFilter','MinAtrPips','MaxAtrPips','UseNormalizedSpreadFilter','MaxSpreadPips','MaxSpreadAtrRatio','IsSupportedFxSymbol','SpreadInPips','IsAbsoluteSpreadTooHigh')
          foreach($x in $required){ if(-not $s.Contains($x)){ throw "Missing required Candidate P symbol: $x" } }
          if($s.Contains('SyncDailyStatsFromHistory();')){ throw 'Hot-path History scan unexpectedly returned' }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Compile refactored cBot
        shell: pwsh
        run: |
          $project='CumulativeDeltaScalper-EURUSD-v1/CumulativeDeltaScalper_EURUSD_v1.csproj'
          dotnet restore $project
          dotnet build $project -c Release -p:AlgoName=CumulativeDeltaScalper_EURUSD_v1 -p:AlgoBuild=true -p:AlgoPublish=false -p:IncludeSource=true

      - name: Commit refactored source
        shell: bash
        run: |
          if git diff --quiet -- CumulativeDeltaScalper-EURUSD-v1/src/CumulativeDeltaScalper_EURUSD_v1.cs; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CumulativeDeltaScalper-EURUSD-v1/src/CumulativeDeltaScalper_EURUSD_v1.cs
          git commit -m 'Candidate P multi-FX normalized execution filters'
          git push origin HEAD:cds-eurusd-v1
