name: HarmonyBotPro v26 XAUUSD FxPro Live500 M1 Baseline
on:
  push:
    branches:
      - compile-harmonybot-v26-20260912
    paths:
      - '.github/workflows/backtest-harmonybot-v26-xauusd-live500-m1-baseline.yml'
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: D7
            start: '05/09/2026 00:00'
            end: '11/09/2026 23:59'
          - label: M3
            start: '12/06/2026 00:00'
            end: '11/09/2026 23:59'
          - label: M6
            start: '12/03/2026 00:00'
            end: '11/09/2026 23:59'
          - label: 1Y
            start: '12/09/2025 00:00'
            end: '11/09/2026 23:59'
          - label: 3Y
            start: '12/09/2023 00:00'
            end: '11/09/2026 23:59'
    steps:
      - uses: actions/checkout@v4
      - name: Download exact compiled v26 algo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p backtest/reports backtest/algo backtest/secure
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10297483882/zip" -o backtest/v26.zip
          unzip -oq backtest/v26.zip -d backtest/algo
          cp backtest/algo/HarmonyBotPro_v26_Mobile.algo backtest/HarmonyBotPro_v26_Mobile.algo
          echo '7457dede9159e4c0cd70a695eaa47e1574b25a73f1632002a90c498851ef24a9  backtest/HarmonyBotPro_v26_Mobile.algo' | sha256sum -c -
      - name: Pull cTrader CLI and select FxPro Live USD 1:500
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/spotware/ctrader-console:5.9.11
          printf '%s' "$CTRADER_PASSWORD" > backtest/secure/pwd
          chmod 600 backtest/secure/pwd
          docker run --rm -v "$PWD/backtest/secure:/secure" \
            -e "CTID=$CTRADER_CTID" -e 'PWD-FILE=/secure/pwd' \
            ghcr.io/spotware/ctrader-console:5.9.11 accounts --environment-variables > backtest/secure/accounts.json
          python3 - <<'PY'
          import json
          data=json.load(open('backtest/secure/accounts.json',encoding='utf-8-sig'))
          m=[x for x in data if str(x.get('Broker','')).lower()=='fxpro' and bool(x.get('Live')) and str(x.get('DepositCurrency','')).upper()=='USD' and int(x.get('Leverage',0))==500]
          if not m: raise SystemExit('No FxPro Live USD 1:500 account found')
          n=str(m[0].get('Number','')).strip()
          if not n: raise SystemExit('No account number')
          open('backtest/secure/account','w').write(n)
          print('FxPro Live USD 1:500 selected (number masked)')
          PY
          rm -f backtest/secure/accounts.json
      - name: Run M1 broker-data baseline ${{ matrix.label }}
        env:
          CTRADER_CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          chmod +x tmp/harmonybot-v26-build/run_v26_backtest_m1.sh
          tmp/harmonybot-v26-build/run_v26_backtest_m1.sh '${{ matrix.label }}' '${{ matrix.start }}' '${{ matrix.end }}'
      - name: Remove private account material
        if: always()
        run: rm -rf backtest/secure
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyBotPro-v26-XAUUSD-M15-100-${{ matrix.label }}-FxPro-Live500-M1
          path: backtest/reports/
          if-no-files-found: warn
          retention-days: 30
