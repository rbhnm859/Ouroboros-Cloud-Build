name: Diagnose cTrader Accounts for HarmonyBotPro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backtest-harmonybot-xauusd-1y-3y.yml']
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker pull ghcr.io/spotware/ctrader-console:5.9.11
      - name: Create password file
        env:
          CTRADER_PASSWORD: ${{ secrets.CTRADER_PASSWORD }}
        run: |
          mkdir -p backtest
          printf '%s' "$CTRADER_PASSWORD" > backtest/ctrader.pwd
          chmod 600 backtest/ctrader.pwd
      - name: List all linked accounts
        env:
          CTID: ${{ secrets.CTRADER_CTID }}
        run: |
          echo '=== ALL ACCOUNTS ==='
          docker run --rm -v "$PWD/backtest:/work" -e CTID -e 'PWD-FILE=/work/ctrader.pwd' ghcr.io/spotware/ctrader-console:5.9.11 accounts --environment-variables || true
          echo '=== FXPRO ACCOUNTS ==='
          docker run --rm -v "$PWD/backtest:/work" -e CTID -e 'PWD-FILE=/work/ctrader.pwd' ghcr.io/spotware/ctrader-console:5.9.11 accounts --broker=fxpro --environment-variables || true
      - if: always()
        run: rm -f backtest/ctrader.pwd
